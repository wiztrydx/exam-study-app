<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=5">
<meta name="theme-color" content="#12384f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="robots" content="noindex,nofollow,noarchive,noimageindex">
<meta name="referrer" content="no-referrer">
<title>歯科麻酔認定医試験 対策</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%2312384f'/%3E%3Cpath d='M32 13c5 0 7 3 7 8 0 4-1.6 6-1.6 10 0 7 3.6 10 3.6 15 0 3-1.7 5-3.7 5-3 0-3.4-6-5.3-6s-2.3 6-5.3 6c-2 0-3.7-2-3.7-5 0-5 3.6-8 3.6-15 0-4-1.6-6-1.6-10 0-5 2-8 7-8z' fill='%23fff'/%3E%3Ccircle cx='32' cy='9' r='0' fill='%23b3853c'/%3E%3C/svg%3E">
<style>
@property --p { syntax:'<number>'; initial-value:0; inherits:false }

:root{
  --paper:#f4f3ef; --surface:#fff; --surface2:#faf9f6; --sunken:#efeeea;
  --ink:#0f2029; --ink2:#2e4855; --muted:#6b8391;
  --hair:rgba(15,32,41,.085); --hair2:rgba(15,32,41,.05);
  --jade:#0f7a6e; --jade2:#0a5c53; --jade-soft:#e5f2ef; --jade-ink:#0a5c53;
  --navy:#12384f; --navy2:#0d2839;
  --brass:#b3853c; --brass-soft:#f9f1e1; --brass-ink:#8a6425;
  --ok:#127a52; --ok-soft:#e4f4ec; --ng:#b83a2c; --ng-soft:#fceceb;
  --warn:#9a6018; --warn-soft:#fbf0e0;
  --e1:0 1px 1px rgba(15,32,41,.035),0 2px 6px rgba(15,32,41,.05);
  --e2:0 2px 4px rgba(15,32,41,.045),0 10px 26px rgba(15,32,41,.07);
  --e3:0 10px 24px rgba(15,32,41,.10),0 28px 64px rgba(15,32,41,.13);
  --r:18px; --rs:12px; --tap:48px;
  --ff:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",system-ui,-apple-system,sans-serif;
  --fd:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
  --sp:cubic-bezier(.22,1,.36,1); --sp2:cubic-bezier(.34,1.4,.5,1);
}
html[data-theme="dark"]{
  --paper:#0a1015; --surface:#131c23; --surface2:#18232b; --sunken:#0e161c;
  --ink:#e9f0f2; --ink2:#c0d0d8; --muted:#8296a2;
  --hair:rgba(255,255,255,.085); --hair2:rgba(255,255,255,.05);
  --jade:#3ab9a5; --jade2:#6fd6c3; --jade-soft:#0f2e2a; --jade-ink:#7bdcca;
  --navy:#a8cde5; --navy2:#0e2634;
  --brass:#d0a55e; --brass-soft:#2b2416; --brass-ink:#e2bd7c;
  --ok:#48bd8e; --ok-soft:#122f28; --ng:#e8776a; --ng-soft:#301e1d;
  --warn:#d09a55; --warn-soft:#2d2314;
  --e1:0 1px 2px rgba(0,0,0,.4);
  --e2:0 2px 6px rgba(0,0,0,.4),0 12px 30px rgba(0,0,0,.34);
  --e3:0 12px 30px rgba(0,0,0,.5),0 30px 70px rgba(0,0,0,.45);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--paper)}
body{
  color:var(--ink);font-family:var(--ff);font-size:16px;line-height:1.72;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  overscroll-behavior-y:none;font-feature-settings:"palt" 1;
}
button,input,select{font:inherit;color:inherit}
button{border:none;background:none;cursor:pointer}
:focus-visible{outline:2.5px solid var(--jade);outline-offset:2px;border-radius:6px}
svg{display:block;flex:none}
::selection{background:var(--jade-soft);color:var(--jade-ink)}

/* ── layout ───────────────────────────────── */
.app{max-width:860px;margin:0 auto;padding:0 16px calc(112px + env(safe-area-inset-bottom))}
header.top{
  position:sticky;top:0;z-index:40;max-width:860px;margin:0 auto;
  padding:calc(12px + env(safe-area-inset-top)) 16px 10px;
  display:flex;align-items:center;gap:8px;
  background:linear-gradient(var(--paper) 62%,transparent);
  transition:box-shadow .3s var(--sp),background .3s;
}
header.top.stuck{
  background:color-mix(in srgb,var(--paper) 82%,transparent);
  backdrop-filter:saturate(180%) blur(16px);-webkit-backdrop-filter:saturate(180%) blur(16px);
  box-shadow:0 1px 0 var(--hair2);
}
.top h1{font-size:17px;margin:0;font-weight:800;letter-spacing:.4px;flex:1;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;
  color:var(--muted);transition:.18s var(--sp);flex:none}
.iconbtn:active{transform:scale(.9)}
.iconbtn:hover{background:var(--surface2);color:var(--ink)}
.iconbtn.solid{background:var(--surface);box-shadow:var(--e1);color:var(--ink)}

nav.tabs{
  position:fixed;left:50%;transform:translateX(-50%);z-index:60;
  bottom:calc(14px + env(safe-area-inset-bottom));
  width:min(440px,calc(100% - 28px));display:flex;padding:7px;gap:2px;
  background:color-mix(in srgb,var(--surface) 86%,transparent);
  backdrop-filter:saturate(180%) blur(22px);-webkit-backdrop-filter:saturate(180%) blur(22px);
  border:1px solid var(--hair);border-radius:22px;box-shadow:var(--e3);
}
nav.tabs button{flex:1;padding:7px 2px 5px;border-radius:16px;display:flex;flex-direction:column;
  align-items:center;gap:4px;color:var(--muted);font-size:10px;font-weight:800;letter-spacing:.4px;
  transition:.24s var(--sp);position:relative}
nav.tabs button:active{transform:scale(.93)}
nav.tabs button.on{color:var(--jade)}
nav.tabs button.on:before{content:"";position:absolute;inset:0;border-radius:16px;
  background:var(--jade-soft);z-index:-1;animation:navIn .32s var(--sp2)}
@keyframes navIn{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}

/* ── motion ───────────────────────────────── */
#view{animation:viewIn .42s var(--sp) both}
@keyframes viewIn{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
.stag>*{animation:stagIn .46s var(--sp) both;animation-delay:calc(var(--i,0)*38ms)}
@keyframes stagIn{from{opacity:0;transform:translateY(11px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ── primitives ───────────────────────────── */
.card{background:var(--surface);border:1px solid var(--hair2);border-radius:var(--r);
  box-shadow:var(--e1);padding:18px;margin:13px 0}
.card.tight{padding:14px 16px}
.card h3{margin:0 0 12px;font-size:14px;font-weight:900;letter-spacing:1px;color:var(--ink2)}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)} .small{font-size:13px;line-height:1.68}
.xs{font-size:11.5px;line-height:1.62} .center{text-align:center}
.hr{height:1px;background:var(--hair2);margin:14px 0}
.display{font-family:var(--fd);font-weight:600;letter-spacing:-.02em;font-feature-settings:"palt" 0}

.chip{display:inline-flex;align-items:center;gap:4px;background:var(--jade-soft);color:var(--jade-ink);
  border-radius:99px;padding:2.5px 10px;font-size:11px;font-weight:800;white-space:nowrap;letter-spacing:.3px}
.chip.gray{background:var(--surface2);color:var(--muted);border:1px solid var(--hair2)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.ng{background:var(--ng-soft);color:var(--ng)}
.chip.brass{background:var(--brass-soft);color:var(--brass-ink)}

.btn{border-radius:var(--rs);padding:13px 20px;font-size:15px;font-weight:800;letter-spacing:.3px;
  background:var(--surface2);color:var(--ink);transition:.2s var(--sp);min-height:var(--tap);
  display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent}
.btn:active{transform:scale(.965)}
.btn.pri{background:var(--jade);color:#fff;box-shadow:0 3px 10px color-mix(in srgb,var(--jade) 30%,transparent)}
.btn.pri:hover{background:var(--jade2)}
.btn.line{background:var(--surface);border-color:var(--hair);box-shadow:var(--e1)}
.btn.brass{background:var(--brass);color:#fff}
.btn:disabled{opacity:.36;transform:none;box-shadow:none;cursor:default}
.btn.sm{padding:9px 14px;font-size:13px;min-height:40px;border-radius:11px;gap:6px}
.btn.block{width:100%}

.tile{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);
  border:1px solid var(--hair2);border-radius:var(--r);padding:15px 16px;margin:10px 0;
  box-shadow:var(--e1);transition:.2s var(--sp)}
.tile:active{transform:scale(.985)}
.tile:hover{border-color:var(--hair);box-shadow:var(--e2)}
.tile .ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex:none;
  background:var(--jade-soft);color:var(--jade-ink)}
.tile .ic.b{background:var(--brass-soft);color:var(--brass-ink)}
.tile .ic.n{background:var(--surface2);color:var(--muted)}
.tile .tx{flex:1;min-width:0}
.tile .tx b{display:block;font-size:15.5px;font-weight:800;letter-spacing:.2px;line-height:1.45}
.tile .tx span{display:block;font-size:12.5px;color:var(--muted);line-height:1.5;margin-top:1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .arw{color:var(--muted);opacity:.5;flex:none}
.list-lbl{font-size:11px;font-weight:900;letter-spacing:2px;color:var(--muted);
  margin:26px 0 6px;padding-left:4px;text-transform:uppercase}

/* ── hero ─────────────────────────────────── */
.hero{position:relative;overflow:hidden;border-radius:24px;padding:22px 24px 20px;margin:14px 0;
  background:linear-gradient(145deg,var(--navy),#0c4d55 92%);color:#fff;box-shadow:var(--e3)}
html[data-theme="dark"] .hero{background:linear-gradient(145deg,#102c3d,#0a4048 92%)}
.hero:before{content:"";position:absolute;width:230px;height:230px;border-radius:50%;
  border:38px solid rgba(255,255,255,.055);right:-92px;top:-96px}
.hero:after{content:"";position:absolute;width:120px;height:120px;border-radius:50%;
  background:radial-gradient(circle,rgba(179,133,60,.28),transparent 68%);right:6px;bottom:-52px}
.hero>*{position:relative}
.hero .eyebrow{font-size:10px;letter-spacing:3px;font-weight:800;opacity:.62}
.hero .days{font-size:56px;line-height:1;margin:6px 0 2px;font-family:var(--fd);font-weight:600}
.hero .days small{font-size:15px;font-weight:700;opacity:.8;margin-left:6px;font-family:var(--ff)}
.hero .sub{font-size:12.5px;opacity:.78;letter-spacing:.3px}
.hero .ringwrap{position:absolute;right:22px;top:50%;transform:translateY(-50%)}

.ring{--p:0;width:80px;height:80px;border-radius:50%;display:grid;place-items:center;
  background:conic-gradient(var(--brass) calc(var(--p)*1%),rgba(255,255,255,.15) 0);
  transition:--p 1.1s var(--sp)}
.ring i{width:62px;height:62px;border-radius:50%;background:var(--navy2);display:grid;place-items:center;
  font-style:normal;font-size:16px;font-weight:900;color:#fff;letter-spacing:-.5px}
.ring.lite{background:conic-gradient(var(--jade) calc(var(--p)*1%),var(--sunken) 0)}
.ring.lite i{background:var(--surface);color:var(--jade-ink)}

/* ── main feature cards ───────────────────── */
.mains{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0 2px}
.main-card{display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:2px;
  border-radius:22px;padding:17px 16px 15px;color:#fff;position:relative;overflow:hidden;
  min-height:168px;box-shadow:var(--e2);transition:.22s var(--sp)}
.main-card:active{transform:scale(.975)}
.main-card:hover{box-shadow:var(--e3)}
.main-card:before{content:"";position:absolute;inset:0;
  background:radial-gradient(120% 80% at 88% 4%,rgba(255,255,255,.16),transparent 62%)}
.main-card.past{background:linear-gradient(158deg,#1a5273,#0e3247)}
.main-card.mock{background:linear-gradient(158deg,#0f7b6c,#0a544e)}
html[data-theme="dark"] .main-card.past{background:linear-gradient(158deg,#17435d,#0d2938)}
html[data-theme="dark"] .main-card.mock{background:linear-gradient(158deg,#0e6154,#083f3b)}
.main-card>*{position:relative}
.main-card .mc-ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;
  background:rgba(255,255,255,.15);margin-bottom:9px}
.main-card b{font-size:17px;font-weight:900;letter-spacing:.4px;line-height:1.35}
.main-card .mc-sub{font-size:11.5px;opacity:.8;line-height:1.5;margin-top:1px}
.main-card .track{width:100%;height:5px;border-radius:99px;background:rgba(255,255,255,.2);
  margin-top:auto;overflow:hidden}
.main-card .track i{display:block;height:100%;border-radius:99px;background:var(--brass);
  transition:width .9s var(--sp)}
.main-card .mc-p{font-size:10.5px;opacity:.85;margin-top:6px;font-weight:700;letter-spacing:.2px}

.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:13px 0}
.stat{background:var(--surface);border:1px solid var(--hair2);border-radius:15px;padding:13px 8px;
  text-align:center;box-shadow:var(--e1)}
.stat b{display:block;font-size:24px;font-weight:700;font-family:var(--fd);letter-spacing:-1px;color:var(--navy)}
html[data-theme="dark"] .stat b{color:var(--jade2)}
.stat span{font-size:10.5px;color:var(--muted);font-weight:700;letter-spacing:.3px}

/* ── bars ─────────────────────────────────── */
.pbar{height:6px;background:var(--sunken);border-radius:99px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--jade);border-radius:99px;transition:width .9s var(--sp)}
.bars .r{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:12.5px}
.bars .r .l{width:8.4em;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.bars .r .b{flex:1;height:14px;background:var(--sunken);border-radius:99px;overflow:hidden}
.bars .r .b i{display:block;height:100%;border-radius:99px;transition:width .9s var(--sp)}
.bars .r .v{width:5.4em;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted);
  font-size:11.5px;font-weight:800}

/* ── quiz ─────────────────────────────────── */
.qcard{background:var(--surface);border:1px solid var(--hair2);border-radius:22px;
  box-shadow:var(--e2);padding:20px 19px;margin:8px 0}
.qmeta{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.qnum{font-size:21px;font-weight:700;font-family:var(--fd);color:var(--jade-ink);letter-spacing:-.5px;margin-right:1px}
.qsub{font-size:11.5px;color:var(--muted);font-weight:700;letter-spacing:.4px;margin:7px 0 0}
.stem{font-size:17px;line-height:1.8;font-weight:600;margin:11px 0 18px;white-space:pre-wrap;
  word-break:break-word;letter-spacing:.2px}
.figbox{margin:12px 0;text-align:center}
.figbox img{max-width:100%;border:1px solid var(--hair);border-radius:12px;cursor:zoom-in;
  background:#fff;box-shadow:var(--e1)}
.opt{display:flex;gap:12px;align-items:flex-start;background:var(--surface);
  border:1.5px solid var(--hair);border-radius:15px;padding:13px 14px;margin:10px 0;
  transition:.18s var(--sp);min-height:var(--tap);width:100%;text-align:left;
  animation:stagIn .4s var(--sp) both;animation-delay:calc(var(--i,0)*32ms)}
.opt:active{transform:scale(.988)}
.opt:hover{border-color:color-mix(in srgb,var(--jade) 40%,var(--hair))}
.opt .k{width:26px;height:26px;border-radius:50%;background:var(--sunken);color:var(--muted);
  font-size:13px;font-weight:900;display:grid;place-items:center;flex:none;margin-top:1px;
  transition:.18s var(--sp)}
.opt .tx{flex:1;line-height:1.68}
.opt.sel{border-color:var(--jade);background:var(--jade-soft)}
.opt.sel .k{background:var(--jade);color:#fff;transform:scale(1.06)}
.opt.correct{border-color:var(--ok);background:var(--ok-soft);animation:reveal .42s var(--sp2) both}
.opt.correct .k{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--ng);background:var(--ng-soft)}
.opt.wrong .k{background:var(--ng);color:#fff}
.opt.missed{border-color:var(--warn);border-style:dashed;background:var(--warn-soft)}
.opt.missed .k{background:var(--warn);color:#fff}
.opt .mk{flex:none;margin-top:2px;font-weight:900;font-size:15px}
@keyframes reveal{0%{transform:scale(.99)}55%{transform:scale(1.018)}100%{transform:scale(1)}}

.verdict{display:flex;align-items:center;gap:11px;border-radius:15px;padding:13px 16px;margin:16px 0 12px;
  font-weight:900;font-size:16px;letter-spacing:.4px;animation:vIn .4s var(--sp2) both}
@keyframes vIn{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:none}}
.verdict.ok{background:var(--ok-soft);color:var(--ok)}
.verdict.ng{background:var(--ng-soft);color:var(--ng)}
.verdict.na{background:var(--warn-soft);color:var(--warn)}
.verdict .ans{margin-left:auto;font-size:13.5px;color:var(--ink2);font-weight:800;letter-spacing:.5px}
.expl{background:var(--surface2);border:1px solid var(--hair2);border-radius:15px;padding:15px 17px;
  margin:11px 0;font-size:14.5px;line-height:1.85}
.expl h4{margin:0 0 8px;font-size:11px;letter-spacing:2px;color:var(--jade-ink);font-weight:900}
.onote{display:flex;gap:10px;font-size:13.5px;padding:8px 0;border-top:1px solid var(--hair2);line-height:1.68}
.onote:first-of-type{border-top:none;padding-top:2px}
.onote b{color:var(--jade-ink);flex:none;width:1.3em;font-weight:900}
.evd{display:flex;gap:8px;font-size:11.8px;color:var(--muted);background:var(--surface2);
  border-radius:11px;padding:9px 12px;margin-top:10px;line-height:1.62;border:1px solid var(--hair2)}
.notice{background:var(--brass-soft);border-left:3px solid var(--brass);border-radius:0 10px 10px 0;
  padding:10px 14px;font-size:12.5px;margin:11px 0;line-height:1.68;color:var(--ink2)}

.qbar{position:fixed;left:50%;transform:translateX(-50%);z-index:60;
  bottom:calc(12px + env(safe-area-inset-bottom));width:min(560px,calc(100% - 24px));
  display:flex;gap:9px;align-items:center;padding:9px 11px;
  background:color-mix(in srgb,var(--surface) 88%,transparent);
  backdrop-filter:saturate(180%) blur(22px);-webkit-backdrop-filter:saturate(180%) blur(22px);
  border:1px solid var(--hair);border-radius:20px;box-shadow:var(--e3)}
.qbar .mid{flex:1;min-width:0;text-align:center;padding:4px 6px;border-radius:11px;transition:.18s var(--sp)}
.qbar .mid:active{transform:scale(.96);background:var(--surface2)}
.qbar .mid .t{font-size:11.5px;color:var(--muted);font-weight:800;font-variant-numeric:tabular-nums;
  letter-spacing:.4px;display:flex;align-items:center;justify-content:center;gap:8px}
.qbar .nb{width:40px;height:40px;border-radius:13px;background:var(--surface2);display:grid;
  place-items:center;color:var(--ink2);transition:.18s var(--sp);flex:none}
.qbar .nb:active{transform:scale(.9)}
.qbar .nb:disabled{opacity:.3}
.timer{font-variant-numeric:tabular-nums;font-weight:900}
.timer.low{color:var(--ng)}

.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:8px}
.qgrid button{border:1.5px solid var(--hair);background:var(--surface);border-radius:12px;padding:10px 0;
  font-size:13px;font-weight:800;font-variant-numeric:tabular-nums;position:relative;transition:.15s var(--sp)}
.qgrid button:active{transform:scale(.92)}
.qgrid button.done{background:var(--jade-soft);border-color:var(--jade);color:var(--jade-ink)}
.qgrid button.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.qgrid button.ng{background:var(--ng-soft);border-color:var(--ng);color:var(--ng)}
.qgrid button.ex{opacity:.4}
.qgrid button.fl:after{content:"";position:absolute;top:4px;right:4px;width:6px;height:6px;
  border-radius:50%;background:var(--brass)}

.score{font-size:66px;font-family:var(--fd);font-weight:600;letter-spacing:-3px;line-height:1;
  margin:10px 0 2px;color:var(--navy)}
html[data-theme="dark"] .score{color:var(--jade2)}
.score small{font-size:18px;font-weight:700;color:var(--muted);letter-spacing:0;font-family:var(--ff)}

/* ── markdown ─────────────────────────────── */
.md{font-size:15px;line-height:1.92;letter-spacing:.2px}
.md h1{font-size:21px;font-weight:900;margin:0 0 16px;padding-bottom:11px;
  border-bottom:2px solid var(--jade);letter-spacing:.4px}
.md h2{font-size:16.5px;font-weight:900;margin:30px 0 10px;padding-left:11px;
  border-left:4px solid var(--jade);letter-spacing:.4px}
.md h3{font-size:15px;font-weight:800;margin:22px 0 6px;color:var(--jade-ink);letter-spacing:.3px}
.md p{margin:10px 0}
.md ul,.md ol{margin:10px 0;padding-left:22px}
.md li{margin:6px 0}
.md li::marker{color:var(--jade);font-weight:800}
.md strong{font-weight:800;color:var(--navy)}
html[data-theme="dark"] .md strong{color:var(--jade2)}
.md code{background:var(--jade-soft);border-radius:6px;padding:1.5px 7px;font-size:13.5px;
  font-family:var(--ff);font-weight:800;color:var(--jade-ink);white-space:nowrap;letter-spacing:.3px}
.md blockquote{margin:14px 0;padding:12px 16px;background:var(--brass-soft);
  border-left:4px solid var(--brass);border-radius:0 11px 11px 0;font-size:14px;color:var(--ink2)}
.md blockquote p{margin:0}
.md hr{border:0;border-top:1px solid var(--hair);margin:24px 0}
.mdtable{overflow-x:auto;margin:14px 0;-webkit-overflow-scrolling:touch;border:1px solid var(--hair);
  border-radius:13px;background:var(--surface)}
.md table{border-collapse:collapse;width:100%;font-size:13px;min-width:430px}
.md th,.md td{border-bottom:1px solid var(--hair2);border-right:1px solid var(--hair2);
  padding:9px 11px;text-align:left;vertical-align:top;line-height:1.68}
.md th{background:var(--surface2);font-weight:900;white-space:nowrap;color:var(--ink2);letter-spacing:.3px}
.md tr:last-child td{border-bottom:none}
.md th:last-child,.md td:last-child{border-right:none}
.md sub{font-size:.72em;font-weight:inherit}

/* ── search ───────────────────────────────── */
.searchbox{display:flex;align-items:center;gap:11px;background:var(--surface);border-radius:16px;
  padding:0 16px;box-shadow:var(--e2);border:1px solid var(--hair2);margin:14px 0;color:var(--muted)}
.searchbox input{flex:1;border:none;outline:none;background:none;padding:15px 0;font-size:16px;color:var(--ink)}
.hit{background:var(--surface);border:1px solid var(--hair2);border-radius:14px;padding:13px 15px;
  margin:10px 0;box-shadow:var(--e1);width:100%;text-align:left;transition:.18s var(--sp)}
.hit:active{transform:scale(.985)}
.hit b.q{color:var(--jade-ink);font-weight:900;font-size:13px;letter-spacing:.4px}
mark{background:var(--brass-soft);color:var(--brass-ink);border-radius:4px;padding:0 3px;font-weight:800}

/* ── misc ─────────────────────────────────── */
/* ── bottom sheet ─────────────────────────── */
.sheet{position:fixed;inset:0;z-index:120;display:flex;align-items:flex-end;justify-content:center;
  background:rgba(6,14,19,.48);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);animation:fade .22s}
.sheet .inner{background:var(--surface);width:min(600px,100%);border-radius:26px 26px 0 0;
  padding:14px 18px calc(20px + env(safe-area-inset-bottom));max-height:80vh;overflow:auto;
  animation:sheetUp .36s var(--sp);box-shadow:var(--e3)}
@keyframes sheetUp{from{transform:translateY(34px);opacity:0}to{transform:none;opacity:1}}
.sheet .grab{width:40px;height:4px;border-radius:99px;background:var(--hair);margin:0 auto 16px}
.sheet h3{margin:0 0 4px;font-size:15px;font-weight:900;letter-spacing:.5px}
.navgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:8px;margin:14px 0 4px}
.navgrid button{border:1.5px solid var(--hair);background:var(--surface);border-radius:12px;padding:10px 0;
  font-size:13px;font-weight:800;font-variant-numeric:tabular-nums;position:relative;transition:.15s var(--sp)}
.navgrid button:active{transform:scale(.92)}
.navgrid button.a{background:var(--jade-soft);border-color:var(--jade);color:var(--jade-ink)}
.navgrid button.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.navgrid button.ng{background:var(--ng-soft);border-color:var(--ng);color:var(--ng)}
.navgrid button.cur{outline:2.5px solid var(--brass);outline-offset:1.5px}
.navgrid button.fl:after{content:"";position:absolute;top:4px;right:4px;width:6px;height:6px;
  border-radius:50%;background:var(--brass)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--muted);font-weight:700;margin-top:12px}
.legend i{width:11px;height:11px;border-radius:4px;display:inline-block;margin-right:4px;vertical-align:-1px;border:1.5px solid}
/* ── onboarding ───────────────────────────── */
.ob{background:linear-gradient(150deg,var(--navy),#0c4d55 92%);color:#fff;border-radius:20px;
  padding:18px 20px;margin:14px 0;box-shadow:var(--e2);position:relative;overflow:hidden}
.ob h4{margin:0 0 6px;font-size:15.5px;font-weight:900;letter-spacing:.4px}
.ob p{margin:0 0 12px;font-size:12.8px;opacity:.85;line-height:1.7}
.ob .obx{position:absolute;top:10px;right:10px;color:#fff;opacity:.6;width:32px;height:32px;
  display:grid;place-items:center;border-radius:50%}
.kbd{display:inline-block;background:var(--surface2);border:1px solid var(--hair);border-radius:6px;
  padding:1px 7px;font-size:12px;font-weight:800;font-family:ui-monospace,monospace;margin:0 2px}
/* ── ノート内目次 ─────────────────────────── */
.toc{display:flex;gap:7px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:2px 0;scrollbar-width:none}
.toc::-webkit-scrollbar{display:none}
.tocb{flex:none;background:var(--surface2);border:1px solid var(--hair2);border-radius:99px;
  padding:7px 14px;font-size:12.5px;font-weight:800;color:var(--ink2);white-space:nowrap;transition:.16s var(--sp)}
.tocb:active{transform:scale(.94)}
.tocb:hover{background:var(--jade-soft);color:var(--jade-ink);border-color:var(--jade)}
.lb{position:fixed;inset:0;background:rgba(6,14,19,.95);z-index:200;display:grid;place-items:center;
  padding:16px;animation:fade .25s;backdrop-filter:blur(6px)}
@keyframes fade{from{opacity:0}to{opacity:1}}
.lb img{max-width:100%;max-height:86vh;border-radius:10px;background:#fff;box-shadow:var(--e3)}
.lb .x{position:absolute;top:calc(16px + env(safe-area-inset-top));right:18px;
  background:rgba(255,255,255,.16);color:#fff;width:42px;height:42px;border-radius:50%;display:grid;place-items:center}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);
  background:var(--navy2);color:#fff;padding:12px 22px;border-radius:99px;font-size:13.5px;font-weight:700;
  z-index:150;box-shadow:var(--e3);animation:tIn .34s var(--sp2);max-width:88vw;text-align:center;letter-spacing:.3px}
html[data-theme="dark"] .toast{background:var(--surface2);border:1px solid var(--hair)}
@keyframes tIn{from{opacity:0;transform:translate(-50%,14px) scale(.95)}to{opacity:1;transform:translate(-50%,0)}}
.empty{text-align:center;padding:52px 18px;color:var(--muted)}
.empty svg{margin:0 auto 14px;opacity:.35}
label.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;
  border-bottom:1px solid var(--hair2);font-size:14.5px;font-weight:700}
label.sw:last-child{border-bottom:none}
label.sw select,label.sw input[type=date]{background:var(--surface2);border:1px solid var(--hair);
  border-radius:11px;padding:9px 12px;font-size:14px;font-weight:600}
.spark{display:flex;align-items:flex-end;gap:4px;height:78px;margin-top:8px}
.spark .d{flex:1;text-align:center}
.spark .d i{display:block;border-radius:5px 5px 3px 3px;min-height:3px;background:var(--jade);
  transition:height .8s var(--sp)}
.spark .d.z i{background:var(--sunken)}
.spark .d span{font-size:10px;color:var(--muted);margin-top:4px;display:block;font-weight:700}

@media(min-width:720px){
  .app{padding-bottom:130px}
  .stem{font-size:17.5px}
  .mains{gap:14px}
}
@media print{nav.tabs,.qbar,header.top{display:none}}
</style>

answer":["b","d"],"status":"確定","explanation":"肺血栓塞栓症の換気血流比不均衡と、肺炎に伴うシャント・拡散障害ではA-aDO₂が開大する。純粋な低換気や吸入酸素分圧低下では較差は通常大きくならない。","onotes":{},"evidence":[{"s":"教科書 第2章「低酸素血症の鑑別」","p":""}],"note":"2023年出題テーマを病態比較へ発展させた再出題候補。","diff":"標準"},{"n":5,"stem":"平均動脈圧を近似する式として適切なのはどれか（1つ選べ）","options":{"a":"収縮期圧－拡張期圧/3","b":"心拍出量÷末梢血管抵抗","c":"拡張期圧＋脈圧/3","d":"収縮期圧＋拡張期圧","e":"脈圧×心拍数"},"choose":"1","chapter":2,"topic":"循環生理","answer":["c"],"status":"確定","explanation":"通常の心拍数では拡張期が心周期の約3分の2を占めるため、平均動脈圧は拡張期圧＋（収縮期圧－拡張期圧）/3で近似できる。","onotes":{},"evidence":[{"s":"教科書 第2章「循環生理・血圧」","p":""}],"note":"計算・式の基礎問題は形を変えて繰り返されるため採用した。","diff":"基本"},{"n":6,"stem":"心電図でQT延長を認める患者に生じやすい不整脈はどれか（1つ選べ）","options":{"a":"房室結節リエントリー性頻拍","b":"torsade de pointes","c":"洞性徐脈","d":"完全右脚ブロック","e":"心房粗動"},"choose":"1","chapter":2,"topic":"心電図","answer":["b"],"status":"確定","explanation":"QT延長は心室再分極遅延を示し、多形性心室頻拍であるtorsade de pointesの基盤となる。電解質異常やQT延長薬の併用も確認する。","onotes":{},"evidence":[{"s":"不整脈ガイドライン／教科書 第2章「心電図」","p":""}],"note":"2020・2024・2025年に反復した最重要テーマを臨床リスク判断にした。","diff":"基本"},{"n":7,"stem":"幅の狭い規則正しい頻拍で、迷走神経刺激により停止した。最も考えられるのはどれか（1つ選べ）","options":{"a":"心房細動","b":"洞停止","c":"心室細動","d":"発作性上室頻拍","e":"心室頻拍"},"choose":"1","chapter":2,"topic":"心電図","answer":["d"],"status":"確定","explanation":"規則正しいnarrow QRS頻拍が迷走神経刺激で停止する所見は、房室結節を回路に含む発作性上室頻拍を示唆する。心房細動はRR間隔が不規則である。","onotes":{},"evidence":[{"s":"不整脈ガイドライン「上室頻拍」","p":""}],"note":"波形暗記から初期対応を含む症例問題への転換を予測した。","diff":"標準"},{"n":8,"stem":"全身麻酔中、呼気二酸化炭素波形の基線が吸気時にも0へ戻らなくなった。原因として最も考えられるのはどれか（1つ選べ）","options":{"a":"食道挿管","b":"回路の再呼吸","c":"肺血栓塞栓","d":"心停止","e":"回路離脱"},"choose":"1","chapter":2,"topic":"カプノグラフィ","answer":["b"],"status":"確定","explanation":"吸気相のCO₂がゼロに戻らないのは再呼吸を示し、ソーダライム消耗や一方向弁異常を疑う。食道挿管・心停止・回路離脱では波形が著減または消失する。","onotes":{},"evidence":[{"s":"教科書 第2章「カプノグラフィ」／麻酔器ガイドライン","p":""}],"note":"カプノグラフィは頻出であり、典型波形を文章化した実践問題とした。","diff":"標準"},{"n":9,"stem":"一酸化炭素中毒患者の酸素化評価について正しいのはどれか（2つ選べ）","options":{"a":"通常のSpO₂は必ず測定不能になる","b":"PaCO₂を直接反映する","c":"確定評価にはCOオキシメータを用いる","d": 4,"topic":"術前評価","answer":["c"],"status":"確定","explanation":"Mallampati分類は開口時の口腔・咽頭構造から気道確保困難の可能性を評価する。ほかはそれぞれ肝機能、心機能、血行動態、呼吸困難の分類である。","onotes":{},"evidence":[{"s":"静脈内鎮静法ガイドライン「術前評価」","p":""}],"note":"鎮静前評価を他科分類との識別にした頻出形式。","diff":"基本"},{"n":24,"stem":"ミダゾラムの作用を拮抗する薬物はどれか（1つ選べ）","options":{"a":"ナロキソン","b":"フルマゼニル","c":"スガマデクス","d":"ネオスチグミン","e":"アトロピン"},"choose":"1","chapter":4,"topic":"ミダゾラム","answer":["b"],"status":"確定","explanation":"フルマゼニルはベンゾジアゼピン受容体拮抗薬で、ミダゾラムによる鎮静・呼吸抑制を拮抗する。作用時間差による再鎮静に注意して観察を継続する。","onotes":{},"evidence":[{"s":"教科書 第4章「静脈内鎮静薬」","p":""}],"note":"鎮静薬・拮抗薬は最頻出テーマで、再鎮静注意まで含めた。","diff":"基本"},{"n":25,"stem":"歯科恐怖の強い患者への鎮静にデクスメデトミジンを選択した。薬理作用と有害事象について正しいのはどれか（2つ選べ）","options":{"a":"NMDA受容体を刺激する","b":"μオピオイド受容体を刺激する","c":"徐脈を起こしうる","d":"α₂アドレナリン受容体を刺激する","e":"GABA_A受容体を遮断する"},"choose":"2","chapter":4,"topic":"デクスメデトミジン","answer":["c","d"],"status":"確定","explanation":"デクスメデトミジンは選択性の高いα₂アドレナリン受容体作動薬で、鎮静・鎮痛補助作用を示す。徐脈と血圧変動に注意する。","onotes":{},"evidence":[{"s":"教科書 第4章「デクスメデトミジン」","p":""}],"note":"2024・2025年の鎮静薬集中出題を受け、作用機序を狙った。","diff":"標準"},{"n":26,"stem":"プロポフォールによる鎮静について正しいのはどれか（2つ選べ）","options":{"a":"気道閉塞と呼吸抑制に注意する","b":"著明な唾液分泌増加だけが問題となる","c":"悪性高熱症を必発する","d":"鎮痛作用は乏しい","e":"不可逆的な筋弛緩を起こす"},"choose":"2","chapter":4,"topic":"プロポフォール鎮静","answer":["a","d"],"status":"確定","explanation":"プロポフォールは用量依存性に意識レベルを低下させ、上気道筋緊張低下、気道閉塞、低換気・無呼吸、血圧低下を起こしうる。鎮痛作用は乏しい。","onotes":{},"evidence":[{"s":"深鎮静プラクティカルガイド／教科書 第4章","p":""}],"note":"深鎮静化と気道救済の重要性を問うガイドライン型問題。","diff":"基本"},{"n":27,"stem":"亜酸化窒素吸入鎮静法を避けるべき状態はどれか（1つ選べ）","options":{"a":"軽度歯科恐怖","b":"鼻閉のない成人","c":"処置前の軽い緊張","d":"コントロール良好な高血圧","e":"閉鎖性気胸"},"choose":"1","chapter":4,"topic":"亜酸化窒素吸入鎮静","answer":["e"],"status":"確定","explanation":"亜酸化窒素は閉鎖腔へ拡散して気体容積を増大させるため、気胸、腸閉塞、中耳閉鎖腔などでは避ける。鼻閉は吸入効率を低下させる。","onotes":{},"evidence":[{"s":"亜酸化窒素吸入鎮静法プラクティカルガイド","p":""}],"note":"新ガイドラインを直接反映し、閉鎖腔拡大という定番機序を症例化した。","diff":"標準"},{"n":28,"stem":"深鎮静中の換気低下を最も早期に検出しやすいモニタはどれか（1つ選べ）","options":{"a":"胸部エックス線","b":"体温","c":"カプノグラフィ","d":"尿量","e":"血糖"},"choose":"1","chapter":4,"topic":"鎮静中モニタリング","answer":["c"],"status":"確定","explanation":"酸素投与中はSpO₂低下が遅れることがあり、呼気CO₂波形・呼吸数を連続監視するカプノグラフィが無呼吸や低換気を早期に捉えやすい。","onotes":{},"evidence":[{"s":"深鎮静プラクティカルガイド「モニタリング」","p":""}],"note":"鎮静安全性の最新潮流として換気モニタの優先度が高い。","diff":"基本"},{"n":29,"stem":"フルマゼニルで覚醒した患者の回復室管理として適切なのはどれか（2つ選べ）","options":{"a":"再鎮静を念頭に継続観察する","b":"酸素飽和度測定を中止する","c":"ミダゾラムを追加する","d":"当日の自動車運転を禁止する","e":"直ちに単独帰宅させる"},"choose":"2","chapter":4,"topic":"鎮静の回復","answer":["a","d"],"status":"確定","explanation":"フルマゼニルの作用がミダゾラムより先に減弱すると再鎮静が起こりうる。意識、呼吸、循環を継続監視し、退室基準と付き添い・運転禁止を守る。","onotes":{},"evidence":[{"s":"静脈内鎮静法ガイドライン「回復・帰宅基準」","p":""}],"note":"拮抗後の再鎮静は安全管理で見落とされやすく、症例問題化を予測した。","diff":"標準"},{"n":30,"stem":"歯科治療中に頻呼吸、四肢しびれ、手指硬直が出現した。意識は清明でSpO₂は99%である。適切な初期対応はどれか（2つ選べ）","options":{"a":"筋弛緩薬を静注する","b":"胸骨圧迫を開始する","c":"治療を続行する","d":"落ち着かせて呼吸をゆっくり誘導する","e":"低酸素を招きうる紙袋再呼吸法は避ける"},"choose":"2","chapter":4,"topic":"過換気症候群","answer":["d","e"],"status":"確定","explanation":"過換気でPaCO₂が低下すると呼吸性アルカローシス、しびれやテタニーを来す。処置を中止し安心させ、ゆっくりした呼吸へ誘導する。紙袋法は低酸素を招くため推奨されない。","onotes":{},"evidence":[{"s":"過換気症候群ガイドライン","p":""}],"note":"新ガイドラインと従来処置の変更点を問う高予測テーマ。","diff":"標準"},{"n":31,"stem":"局所麻酔直前に顔面蒼白、冷汗、徐脈、血圧低下が出現した。初期対応として正しいのはどれか（2つ選べ）","options":{"a":"頭高位とする","b":"仰臥位で下肢挙上する","c":"腹臥位とする","d":"座位のまま処置を続ける","e":"直ちに歯科処置を中止する"},"choose":"2","chapter":4,"topic":"血管迷走神経反射","answer":["b","e"],"status":"確定","explanation":"血管迷走神経反射では処置を中止し、脳血流を確保するため仰臥位・下肢挙上とし、気道・呼吸・循環を評価して酸素投与などを行う。","onotes":{},"evidence":[{"s":"血管迷走神経反射ガイドライン","p":""}],"note":"2023年とガイドライン改訂動向から、鑑別と初期体位を優先した。","diff":"基本"},{"n":32,"stem":"静脈内鎮静後の帰宅判断に必要なのはどれか（2つ選べ）","options":{"a":"SpO₂測定値を確認しない","b":"付き添いと当日運転禁止の確認","c":"投薬直後の記憶があることだけ","d":"安定したバイタルと歩行・飲水などの回復確認","e":"患者が帰りたいという希望だけ"},"choose":"2","chapter":4,"topic":"退室基準","answer":["b","d"],"status":"確定","explanation":"帰宅は意識、呼吸、循環、運動機能、悪心・疼痛などが基準を満たすことを記録して判断する。責任ある成人の付き添いを求め、当日の運転は避ける。","onotes":{},"evidence":[{"s":"静脈内鎮静法ガイドライン「退室・帰宅基準」","p":""}],"note":"回復判定は2023年出題から継続が見込まれ、実務的な複合評価とした。","diff":"標準"},{"n":33,"stem":"待機的全身麻酔前の絶飲食について正しいのはどれか（2つ選べ）","options":{"a":"透明飲料も麻酔導入8時間前から禁止する","b":"固形食も麻酔導入2時間前までよい","c":"乳製品は透明飲料として扱う","d":"健康成人の透明飲料は一般に麻酔導入2時間前まで許容する","e":"固形物には透明飲料より長い絶食時間が必要である"},"choose":"2","chapter":5,"topic":"術前絶飲食","answer":["d","e"],"status":"確定","explanation":"健康成人の待機手術では水、果肉を含まない透明飲料は一般に麻酔導入2時間前まで許容される。固形物や乳製品はより長い絶食時間が必要である。","onotes":{},"evidence":[{"s":"教科書 第5章「術前管理・絶飲食」","p":""}],"note":"周術期安全の基本であり、具体的時間を問う出題を予測した。","diff":"基本"},{"n":34,"stem":"酸素供給圧が低下した際に亜酸化窒素供給も制限する安全機構はどれか（1つ選べ）","options":{"a":"APLバルブ","b":"気化器インターロック","c":"二酸化炭素吸収装置","d":"ピンインデックス","e":"酸素・亜酸化窒素連動装置"},"choose":"1","chapter":5,"topic":"麻酔器","answer":["e"],"status":"確定","explanation":"酸素・亜酸化窒素連動装置は酸素供給不良時に亜酸化窒素の流量を制限・停止し、低酸素混合ガスの供給を防ぐ。始業点検自体を代替するものではない。","onotes":{},"evidence":[{"s":"麻酔器ガイドライン「低酸素防止機構」","p":""}],"note":"麻酔器ガイドラインの安全機構を機能から選ばせる問題。","diff":"標準"},{"n":35,"stem":"半閉鎖式循環回路で二酸化炭素再呼吸が生じる原因はどれか（1つ選べ）","options":{"a":"静脈路確保","b":"ソーダライム消耗","c":"新鮮ガス流量増加","d":"カフ圧上昇","e":"パルスオキシメータ装着"},"choose":"1","chapter":5,"topic":"麻酔回路","answer":["b"],"status":"確定","explanation":"循環回路では呼気CO₂を吸収剤で除去して再利用する。ソーダライムが消耗するとCO₂吸収能が低下し、吸気CO₂とカプノグラム基線が上昇する。","onotes":{},"evidence":[{"s":"麻酔器ガイドライン／教科書 第5章「麻酔回路」","p":""}],"note":"モニタ波形と機器異常を統合する臨床問題として採用した。","diff":"標準"},{"n":36,"stem":"困難気道の可能性を高める所見はどれか（3つ選べ）","options":{"a":"良好な頸部伸展","b":"Mallampati IV","c":"下顎前方移動の制限","d":"十分な開口","e":"甲状オトガイ間距離の短縮"},"choose":"3","chapter":5,"topic":"気道評価","answer":["b","c","e"],"status":"確定","explanation":"短い甲状オトガイ間距離、開口制限、頸部可動制限、高いMallampati分類、下顎後退などは喉頭展開・挿管困難を示唆する。単独所見でなく総合評価する。","onotes":{},"evidence":[{"s":"気道管理ガイドライン「気道評価」","p":""}],"note":"新気道管理ガイドラインに直結し、術前の予測を問う。","diff":"基本"},{"n":37,"stem":"気管挿管前の十分な前酸素化について正しいのはどれか（2つ選べ）","options":{"a":"無呼吸中の安全時間を延長する","b":"機能的残気量内の窒素を酸素に置換する","c":"二酸化炭素産生を停止させる","d":"誤嚥を完全に防ぐ","e":"咽頭反射を消失させる"},"choose":"2","chapter":5,"topic":"酸素化戦略","answer":["a","b"],"status":"確定","explanation":"前酸素化は肺内窒素を酸素へ置換して酸素予備能を増やし、無呼吸中にSpO₂が低下するまでの安全時間を延長する。換気や誤嚥対策を不要にするものではない。","onotes":{},"evidence":[{"s":"気道管理ガイドライン「前酸素化」","p":""}],"note":"困難気道管理の中核で、目的を機序から理解させる。","diff":"標準"},{"n":38,"stem":"誤嚥リスクの高い患者に迅速導入を行う際に正しいのはどれか（2つ選べ）","options":{"a":"意識消失から気管チューブのカフ膨張までを短縮する","b":"必ず自発呼吸を残す","c":"胃内容を増加させる","d":"失敗時の代替気道計画を準備する","e":"無麻酔で挿管する"},"choose":"2","chapter":5,"topic":"迅速導入","answer":["a","d"],"status":"確定","explanation":"迅速導入は誤嚥危険のある患者で、意識消失後からカフ付き気管チューブで気道を防護するまでを短くする戦略である。十分な準備と代替気道計画が必要となる。","onotes":{},"evidence":[{"s":"教科書 第5章「麻酔導入・誤嚥予防」","p":""}],"note":"症例ベースの気道・誤嚥問題増加を見込んだ。","diff":"標準"},{"n":39,"stem":"プロポフォール投与で通常みられる変化はどれか（2つ選べ）","options":{"a":"呼吸抑制","b":"副腎皮質抑制の遷延","c":"血圧上昇","d":"血圧低下","e":"強い交感神経刺激"},"choose":"2","chapter":5,"topic":"静脈麻酔薬","answer":["a","d"],"status":"確定","explanation":"プロポフォールは血管拡張と心収縮抑制により血圧を低下させ、呼吸抑制も起こす。副腎皮質ステロイド合成抑制が問題となる代表薬はエトミデートである。","onotes":{},"evidence":[{"s":"教科書 第5章「静脈麻酔薬」","p":""}],"note":"2024・2025年に集中した静脈麻酔薬から基本的循環作用を出題。","diff":"基本"},{"n":40,"stem":"ケタミンの特徴として正しいのはどれか（3つ選べ）","options":{"a":"NMDA受容体拮抗作用をもつ","b":"鎮痛作用をもつ","c":"一般に交感神経刺激作用を示す","d":"唾液分泌を減少させる","e":"気道反射を完全に消失させる"},"choose":"3","chapter":5,"topic":"静脈麻酔薬","answer":["a","b","c"],"status":"確定","explanation":"ケタミンはNMDA受容体拮抗作用による解離性麻酔と強い鎮痛を示し、一般に交感神経刺激性をもつ。唾液分泌増加や覚醒時反応に注意する。","onotes":{},"evidence":[{"s":"教科書 第5章「ケタミン」","p":""}],"note":"薬物作用の対比は継続頻出で、受容体機序を中心にした。","diff":"標準"},{"n":41,"stem":"エトミデートの特徴として注意すべきなのはどれか（1つ選べ）","options":{"a":"悪性高熱症の誘発","b":"強力な鎮痛作用","c":"副腎皮質ステロイド合成抑制","d":"著明なヒスタミン遊離のみ","e":"不可逆的腎不全"},"choose":"1","chapter":5,"topic":"静脈麻酔薬","answer":["c"],"status":"確定","explanation":"エトミデートは循環抑制が比較的少ない一方、11β-hydroxylase阻害による副腎皮質ステロイド合成抑制が問題となる。鎮痛作用は乏しい。","onotes":{},"evidence":[{"s":"教科書 第5章「エトミデート」","p":""}],"note":"2025年の静脈麻酔薬群から、薬剤固有の有害作用を変形した。","diff":"応用"},{"n":42,"stem":"吸入麻酔薬の血液/ガス分配係数が小さい場合に期待されるのはどれか（1つ選べ）","options":{"a":"導入と覚醒が速い","b":"導入が必ず遅い","c":"MACが必ず小さい","d":"代謝率が必ず高い","e":"気化器が不要になる"},"choose":"1","chapter":5,"topic":"吸入麻酔薬","answer":["a"],"status":"確定","explanation":"血液/ガス分配係数が小さい薬は血液への溶解が少なく、肺胞分圧が速く上昇・低下するため導入と覚醒が速い。麻酔力価を示すMACとは別の概念である。","onotes":{},"evidence":[{"s":"教科書 第5章「吸入麻酔薬」","p":""}],"note":"吸入麻酔薬の定番物性を概念理解型にした。","diff":"基本"},{"n":43,"stem":"悪性高熱症の誘発薬となりうるのはどれか（2つ選べ）","options":{"a":"ミダゾラム","b":"デクスメデトミジン","c":"スキサメトニウム","d":"セボフルラン","e":"プロポフォール"},"choose":"2","chapter":5,"topic":"吸入麻酔薬","answer":["c","d"],"status":"確定","explanation":"揮発性吸入麻酔薬とスキサメトニウムは悪性高熱症の誘発薬である。疑えば誘発薬中止、高流量酸素、ダントロレン投与、冷却と全身管理を行う。","onotes":{},"evidence":[{"s":"悪性高熱症ガイドライン","p":""}],"note":"最新ガイドラインの救急対応につながる高重要度テーマ。","diff":"基本"},{"n":44,"stem":"ロクロニウムを選択的に包接して拮抗する薬物はどれか（1つ選べ）","options":{"a":"ダントロレン","b":"フルマゼニル","c":"スガマデクス","d":"ナロキソン","e":"アトロピン"},"choose":"1","chapter":5,"topic":"筋弛緩薬","answer":["c"],"status":"確定","explanation":"スガマデクスはステロイド骨格をもつロクロニウムを血中で包接し、神経筋接合部から移動させて筋弛緩を拮抗する。再クラーレ化やアナフィラキシーにも注意する。","onotes":{},"evidence":[{"s":"教科書 第5章「筋弛緩拮抗」","p":""}],"note":"筋弛緩薬は7年反復の最頻出テーマで、作用機序を問う。","diff":"基本"},{"n":45,"stem":"スキサメトニウム投与後に起こりうる有害事象はどれか（2つ選べ）","options":{"a":"低体温だけ","b":"低血糖","c":"徐脈性不整脈","d":"尿崩症","e":"高カリウム血症"},"choose":"2","chapter":5,"topic":"筋弛緩薬","answer":["c","e"],"status":"確定","explanation":"脱分極性筋弛緩薬スキサメトニウムは血清K上昇、徐脈、筋痛、悪性高熱症誘発などを起こしうる。熱傷や神経筋疾患などでは重篤な高K血症に注意する。","onotes":{},"evidence":[{"s":"教科書 第5章「脱分極性筋弛緩薬」","p":""}],"note":"筋弛緩薬の副作用を病態リスクと結びつけた。","diff":"標準"},{"n":46,"stem":"深い筋弛緩でTOF反応が得られない場合、回復評価に用いる刺激法はどれか（1つ選べ）","options":{"a":"cold pressor test","b":"post-tetanic count","c":"BIS","d":"Allen test","e":"Romberg test"},"choose":"1","chapter":5,"topic":"筋弛緩モニタリング","answer":["b"],"status":"確定","explanation":"TOFカウントが0の深い筋弛緩では、テタヌス刺激後の単収縮反応数を数えるpost-tetanic countが回復程度の推定に用いられる。","onotes":{},"evidence":[{"s":"教科書 第5章「筋弛緩モニタリング」","p":""}],"note":"反復出題されるTOFを一段深いPTC判定へ発展させた。","diff":"応用"},{"n":47,"stem":"従量式換気中に最高気道内圧だけが上昇し、プラトー圧は不変であった。考えやすい原因はどれか（1つ選べ）","options":{"a":"肺水腫によるコンプライアンス低下","b":"緊張性気胸","c":"腹腔内圧上昇","d":"ARDS","e":"気管支攣縮"},"choose":"1","chapter":5,"topic":"人工呼吸","answer":["e"],"status":"確定","explanation":"最高気道内圧とプラトー圧の差は気道抵抗を反映する。最高圧のみ上昇しプラトー圧が不変なら、気管支攣縮、分泌物、チューブ屈曲など気道抵抗増大を疑う。","onotes":{},"evidence":[{"s":"教科書 第5章「人工呼吸管理」","p":""}],"note":"人工呼吸器関連問題の反復から、圧の鑑別を問う応用問題。","diff":"応用"},{"n":48,"stem":"人工呼吸器関連肺障害を減らす換気戦略として適切なのはどれか（2つ選べ）","options":{"a":"高いプラトー圧を維持する","b":"高酸素濃度を必要最小限にする","c":"過大な一回換気量を用いる","d":"適切な低一回換気量とPEEPを用いる","e":"常にPEEPを0にする"},"choose":"2","chapter":5,"topic":"人工呼吸","answer":["b","d"],"status":"確定","explanation":"肺保護換気では予測体重に基づく低一回換気量、適切なPEEP、過度なプラトー圧の回避を組み合わせる。高酸素濃度も必要最小限とする。","onotes":{},"evidence":[{"s":"教科書 第5章「人工呼吸器関連肺障害」","p":""}],"note":"2017・2022・2024年の反復テーマを予防戦略へ変形した。","diff":"標準"},{"n":49,"stem":"気管挿管直後、チューブが気管内にあることを最も確実に連続確認できる所見はどれか（1つ選べ）","options":{"a":"胸郭挙上だけ","b":"胃泡音の欠如だけ","c":"持続する呼気CO₂波形","d":"チューブ内の曇り","e":"酸素飽和度が直後に正常"},"choose":"1","chapter":5,"topic":"挿管確認","answer":["c"],"status":"確定","explanation":"持続的なカプノグラムは肺血流がある状況で気管内留置を確認する最も信頼性の高い方法である。身体所見も併用し、波形がなければ食道挿管をまず疑う。","onotes":{},"evidence":[{"s":"気道管理ガイドライン「気管挿管の確認」","p":""}],"note":"気道ガイドラインの中核で、事故防止に直結する。","diff":"基本"},{"n":50,"stem":"抜管後に吸気性喘鳴と陥没呼吸が出現した。最も考えられるのはどれか（1つ選べ）","options":{"a":"腎不全","b":"低血糖のみ","c":"下肢深部静脈血栓","d":"上気道閉塞","e":"代謝性アルカローシス"},"choose":"1","chapter":5,"topic":"抜管","answer":["d"],"status":"確定","explanation":"吸気性喘鳴は喉頭浮腫、喉頭痙攣、舌根沈下など上気道狭窄を示す。100%酸素、気道開通操作、持続陽圧を行い、改善しなければ再挿管を準備する。","onotes":{},"evidence":[{"s":"気道管理ガイドライン「抜管後気道障害」","p":""}],"note":"抜管は気道管理の高リスク局面で、症候から即断させる。","diff":"標準"},{"n":51,"stem":"周術期低体温によって生じやすいのはどれか（2つ選べ）","options":{"a":"凝固障害と創感染","b":"酸素消費量の恒常的低下だけ","c":"麻酔薬必要量の増加だけ","d":"覚醒遅延","e":"シバリングの減少"},"choose":"2","chapter":5,"topic":"周術期体温","answer":["a","d"],"status":"確定","explanation":"低体温は血小板・凝固機能を障害し出血を増やし、創感染や心血管イベント、覚醒遅延のリスクとなる。回復期のシバリングは酸素消費を増加させる。","onotes":{},"evidence":[{"s":"教科書 第5章「周術期体温管理」","p":""}],"note":"全身麻酔管理の横断的安全テーマとして出題を予測した。","diff":"標準"},{"n":52,"stem":"術後悪心・嘔吐（PONV）の危険因子はどれか（2つ選べ）","options":{"a":"女性","b":"高齢であることだけ","c":"区域麻酔の使用","d":"男性","e":"非喫煙"},"choose":"2","chapter":5,"topic":"術後悪心嘔吐","answer":["a","e"],"status":"確定","explanation":"代表的なPONV危険因子には女性、非喫煙、PONV・動揺病歴、術後オピオイド使用がある。リスク数に応じて作用機序の異なる制吐薬を組み合わせる。","onotes":{},"evidence":[{"s":"教科書 第5章「術後悪心・嘔吐」","p":""}],"note":"術後回復の質を問う定番テーマをリスク層別化へつなげた。","diff":"基本"},{"n":53,"stem":"オピオイド節減を目的とする多角的鎮痛に含まれるのはどれか（2つ選べ）","options":{"a":"禁忌がなければNSAIDsも組み合わせる","b":"アセトアミノフェンと局所麻酔の併用","c":"オピオイド単剤の増量だけ","d":"鎮痛評価の省略","e":"呼吸抑制時の追加オピオイド"},"choose":"2","chapter":5,"topic":"術後鎮痛","answer":["a","b"],"status":"確定","explanation":"多角的鎮痛は作用機序の異なる鎮痛法を組み合わせ、鎮痛を保ちながらオピオイド量と副作用を減らす。アセトアミノフェン、NSAIDs、局所・区域麻酔などを選択する。","onotes":{},"evidence":[{"s":"教科書 第5章「術後疼痛管理」","p":""}],"note":"2023年に採点除外を伴ったテーマで、概念を明確な単一選択に再構成した。","diff":"標準"},{"n":54,"stem":"レミフェンタニルの特徴として正しいのはどれか（2つ選べ）","options":{"a":"腎排泄だけに依存する","b":"長時間投与後もcontext-sensitive half-timeが短い","c":"μ受容体作用をもたない","d":"鎮痛作用がない","e":"非特異的エステラーゼで速やかに代謝される"},"choose":"2","chapter":5,"topic":"オピオイド","answer":["b","e"],"status":"確定","explanation":"レミフェンタニルは血液・組織の非特異的エステラーゼで代謝され、長時間持続投与後もcontext-sensitive half-timeが短い。投与中止後の鎮痛を別に計画する。","onotes":{},"evidence":[{"s":"教科書 第5章「オピオイド」","p":""}],"note":"静脈麻酔薬群の頻出から、薬物動態と術後鎮痛の接続を予測した。","diff":"標準"},{"n":55,"stem":"オピオイドによる呼吸抑制を拮抗する薬物はどれか（1つ選べ）","options":{"a":"ネオスチグミン","b":"エフェドリン","c":"ナロキソン","d":"フルマゼニル","e":"スガマデクス"},"choose":"1","chapter":5,"topic":"オピオイド","answer":["c"],"status":"確定","explanation":"ナロキソンはオピオイド受容体拮抗薬で呼吸抑制を改善する。作用時間が原因オピオイドより短い場合は再呼吸抑制があり、反復投与と監視が必要である。","onotes":{},"evidence":[{"s":"教科書 第5章「オピオイド拮抗薬」","p":""}],"note":"拮抗薬対応は鎮静・全身麻酔を横断して頻出する。","diff":"基本"},{"n":56,"stem":"全身麻酔中の催眠深度評価を補助する処理脳波指標はどれか（1つ選べ）","options":{"a":"TOF","b":"PT-INR","c":"eGFR","d":"A-aDO₂","e":"BIS"},"choose":"1","chapter":5,"topic":"術中覚醒","answer":["e"],"status":"確定","explanation":"BISなどの処理脳波指標は催眠状態の補助評価に用いる。単独で意識を完全保証するものではなく、投与薬、循環反応、機器接続などと総合して判断する。","onotes":{},"evidence":[{"s":"教科書 第5章「麻酔深度モニタリング」","p":""}],"note":"モニタの適応と限界を区別する安全管理問題。","diff":"基本"},{"n":57,"stem":"大量輸血後にクエン酸負荷によって生じうる電解質異常はどれか（1つ選べ）","options":{"a":"高リン血症のみ","b":"高ナトリウム血症のみ","c":"低カルシウム血症","d":"高カルシウム血症","e":"高マグネシウム血症のみ"},"choose":"1","chapter":5,"topic":"輸液・輸血","answer":["c"],"status":"確定","explanation":"保存血中のクエン酸はイオン化カルシウムをキレートし、大量・急速輸血では低カルシウム血症と心収縮低下、低血圧を起こしうる。体温・凝固・K値も監視する。","onotes":{},"evidence":[{"s":"教科書 第5章「輸血合併症」","p":""}],"note":"輸血は合併症を機序から問う形式が多く、臨床監視項目へ発展させた。","diff":"標準"},{"n":58,"stem":"輸血開始後に急性低酸素血症と両側肺浸潤影が出現し、循環過負荷を示す所見に乏しい。疑うのはどれか（1つ選べ）","options":{"a":"TRALI","b":"鉄欠乏性貧血","c":"遅発性溶血だけ","d":"単純性失神","e":"高血糖"},"choose":"1","chapter":5,"topic":"輸血副反応","answer":["a"],"status":"確定","explanation":"輸血関連急性肺障害（TRALI）は輸血後急性に低酸素血症と非心原性肺水腫を来す。TACOとの鑑別には容量負荷、頸静脈圧、心機能などを評価する。","onotes":{},"evidence":[{"s":"教科書 第5章「輸血副反応」","p":""}],"note":"2023年出題を、TACO鑑別を含む臨床症例に変形した。","diff":"応用"},{"n":59,"stem":"全身麻酔後の覚醒遅延で最初に系統的確認すべきものはどれか（1つ選べ）","options":{"a":"視力だけ","b":"皮膚色だけで帰宅判断","c":"術者の経験年数だけ","d":"残存麻酔薬、換気、血糖、体温","e":"歯式だけ"},"choose":"1","chapter":5,"topic":"覚醒遅延","answer":["d"],"status":"確定","explanation":"覚醒遅延では麻酔薬・オピオイド・筋弛緩の残存、低換気とCO₂蓄積、低酸素、低血糖、低体温、電解質異常や神経学的障害を系統的に検索する。","onotes":{},"evidence":[{"s":"教科書 第5章「覚醒・抜管」","p":""}],"note":"複数原因を整理する総合問題として出題可能性が高い。","diff":"標準"},{"n":60,"stem":"回復室で傾眠、呼吸数6/分、縮瞳を認めた。最も疑うのはどれか（1つ選べ）","options":{"a":"過換気症候群","b":"オピオイド残存","c":"悪性高熱症","d":"甲状腺クリーゼ","e":"局所麻酔薬中毒の初期"},"choose":"1","chapter":5,"topic":"術後呼吸管理","answer":["b"],"status":"確定","explanation":"傾眠、著明な徐呼吸、縮瞳はオピオイド作用を示唆する。刺激、気道確保、換気・酸素投与を行い、必要に応じナロキソンを滴定し再抑制を監視する。","onotes":{},"evidence":[{"s":"教科書 第5章「麻酔後呼吸抑制」","p":""}],"note":"回復室での症候認識と救済を統合する実践問題。","diff":"標準"},{"n":61,"stem":"歯科治療前血圧が繰り返し190/115 mmHgで、頭痛も訴える。対応として適切なのはどれか（1つ選べ）","options":{"a":"アドレナリンを追加して血圧を下げる","b":"運動させて再測定","c":"測定値を記録しない","d":"予定処置をそのまま開始","e":"緊急性を評価し医科受診を優先"},"choose":"1","chapter":6,"topic":"高血圧","answer":["e"],"status":"確定","explanation":"著明な高血圧に症状を伴う場合は高血圧緊急症の可能性を評価し、予定歯科処置より医科的評価を優先する。安静再測定と臓器障害症状の確認が必要である。","onotes":{},"evidence":[{"s":"非心臓手術の心血管ガイドライン／教科書 第6章","p":""}],"note":"数値だけでなく症状を組み合わせた延期判断を予測した。","diff":"標準"},{"n":62,"stem":"安定狭心症患者が治療中に胸痛を訴えた。最初の対応として適切なのはどれか（1つ選べ）","options":{"a":"酸素化評価を行わない","b":"処置中止、安静、バイタル評価","c":"処置を急いで完了","d":"歩行させる","e":"局所麻酔薬を急速追加"},"choose":"1","chapter":6,"topic":"虚血性心疾患","answer":["b"],"status":"確定","explanation":"まず歯科処置を中止して安静とし、意識、気道、呼吸、循環、SpO₂を評価する。普段の発作と合致すればニトログリセリンを考慮し、遷延時は急性冠症候群として救急要請する。","onotes":{},"evidence":[{"s":"非心臓手術の心血管ガイドライン「虚血性心疾患」","p":""}],"note":"歯科診療中の胸痛アルゴリズムは実務優先度が高い。","diff":"標準"},{"n":63,"stem":"左心不全で典型的にみられるのはどれか（1つ選べ）","options":{"a":"限局した手指振戦だけ","b":"多尿だけ","c":"低血糖だけ","d":"片側難聴","e":"起坐呼吸"},"choose":"1","chapter":6,"topic":"心不全","answer":["e"],"status":"確定","explanation":"左室充満圧上昇による肺うっ血では労作時呼吸困難、起坐呼吸、夜間発作性呼吸困難、湿性ラ音などを生じる。仰臥位が苦しい患者は体位にも配慮する。","onotes":{},"evidence":[{"s":"教科書 第6章「心不全」","p":""}],"note":"心疾患管理の基本徴候を歯科診療時の体位判断へ結びつけた。","diff":"基本"},{"n":64,"stem":"重症大動脈弁狭窄症患者の周術期管理で避けたいのはどれか（1つ選べ）","options":{"a":"慎重な前負荷管理","b":"循環モニタリング","c":"急激な血圧低下","d":"洞調律の維持","e":"冠灌流圧の維持"},"choose":"1","chapter":6,"topic":"弁膜症","answer":["c"],"status":"確定","explanation":"固定性流出路狭窄では心拍出量を急に増やせず、血管拡張による低血圧は冠灌流低下と虚血を招く。洞調律、前負荷、適切な後負荷を維持する。","onotes":{},"evidence":[{"s":"非心臓手術の心血管ガイドライン「弁膜症」","p":""}],"note":"重症弁膜症の血行動態目標を問う応用候補。","diff":"応用"},{"n":65,"stem":"Vaughan Williams分類でクラスIIIに属する薬物はどれか（1つ選べ）","options":{"a":"リドカイン","b":"プロプラノロール","c":"アミオダロン","d":"ベラパミル","e":"ジゴキシン"},"choose":"1","chapter":6,"topic":"不整脈薬","answer":["c"],"status":"確定","explanation":"アミオダロンは主にKチャネル遮断により活動電位持続時間と不応期を延長するクラスIII薬である。リドカインはIb、β遮断薬はII、ベラパミルはIVに属する。","onotes":{},"evidence":[{"s":"不整脈ガイドライン／教科書 第6章","p":""}],"note":"2017・2020・2021・2024年に反復した最高得点の再利用候補を選択肢変更した。","diff":"基本"},{"n":66,"stem":"植込み型心臓デバイス患者で電気メスを使う際に重要なのはどれか（1つ選べ）","options":{"a":"長時間の連続通電を優先","b":"脈拍監視を中止","c":"機種・依存性・電磁干渉リスクを術前確認","d":"デバイス情報は不要","e":"対極板を本体直上に置く"},"choose":"1","chapter":6,"topic":"ペースメーカ","answer":["c"],"status":"確定","explanation":"ペースメーカ・ICDの種類、依存性、設定、手術部位と電気メスの電磁干渉を事前評価する。可能なら短い断続通電とし、電流経路をデバイスから離す。","onotes":{},"evidence":[{"s":"不整脈ガイドライン／教科書「心臓植込み型デバイス」","p":""}],"note":"デバイス増加と電気メスを背景にした安全管理問題。","diff":"標準"},{"n":67,"stem":"気管支喘息発作でまず用いる吸入薬はどれか（1つ選べ）","options":{"a":"短時間作用性β₂刺激薬","b":"非選択的β遮断薬","c":"ムスカリン刺激薬","d":"ACE阻害薬","e":"抗凝固薬"},"choose":"1","chapter":6,"topic":"喘息","answer":["a"],"status":"確定","explanation":"急性喘息発作では短時間作用性吸入β₂刺激薬が気管支拡張の基本となる。酸素化、呼吸仕事量、会話可能性を評価し、重症なら救急対応を行う。","onotes":{},"evidence":[{"s":"教科書 第6章「気管支喘息」","p":""}],"note":"呼吸器合併症の初期薬物を明確に問う。","diff":"基本"},{"n":68,"stem":"COPD患者の酸素投与について適切なのはどれか（1つ選べ）","options":{"a":"全例で酸素は禁忌","b":"SpO₂だけ見て呼吸数は無視","c":"鎮静薬を無制限に追加","d":"低酸素を放置する","e":"必要な酸素を投与し換気と意識も監視する"},"choose":"1","chapter":6,"topic":"COPD","answer":["e"],"status":"確定","explanation":"COPDでも低酸素血症は治療すべきであり、目標酸素化に調整しつつ呼吸数、意識、カプノグラフィや血液ガスでCO₂貯留を監視する。酸素を一律禁忌とはしない。","onotes":{},"evidence":[{"s":"教科書 第6章「慢性閉塞性肺疾患」","p":""}],"note":"『COPDに酸素禁忌』という誤解を正す実践的出題。","diff":"標準"},{"n":69,"stem":"閉塞性睡眠時無呼吸症候群患者の鎮静後に特に注意するのはどれか（1つ選べ）","options":{"a":"出血時間短縮だけ","b":"上気道閉塞とオピオイド感受性","c":"高血糖だけ","d":"局所麻酔無効だけ","e":"味覚障害だけ"},"choose":"1","chapter":6,"topic":"睡眠時無呼吸","answer":["b"],"status":"確定","explanation":"OSA患者は鎮静・オピオイドで上気道虚脱と呼吸抑制が増悪する。必要最小量、体位、換気モニタリング、CPAP使用歴、回復後の再閉塞を考慮する。","onotes":{},"evidence":[{"s":"深鎮静プラクティカルガイド／教科書 第6章","p":""}],"note":"鎮静ガイドラインと合併疾患を横断する高予測テーマ。","diff":"標準"},{"n":70,"stem":"インスリン治療中の患者が治療中に発汗、振戦、意識混濁を呈した。まず確認するのはどれか（1つ選べ）","options":{"a":"聴力","b":"歯周ポケットだけ","c":"肺活量だけ","d":"尿酸だけ","e":"血糖"},"choose":"1","chapter":6,"topic":"糖尿病","answer":["e"],"status":"確定","explanation":"発汗、振戦、動悸、意識変容は低血糖を疑う。直ちに血糖を測定し、嚥下可能なら糖質、意識障害なら静脈内ブドウ糖などで対応し再測定する。","onotes":{},"evidence":[{"s":"教科書 第6章「糖尿病患者の管理」","p":""}],"note":"高頻度合併疾患を診療中急変の認識問題にした。","diff":"基本"},{"n":71,"stem":"褐色細胞腫で過剰分泌されるのはどれか（1つ選べ）","options":{"a":"成長ホルモンだけ","b":"カテコラミン","c":"インスリン","d":"甲状腺ホルモンだけ","e":"アルドステロンだけ"},"choose":"1","chapter":6,"topic":"副腎疾患","answer":["b"],"status":"確定","explanation":"褐色細胞腫は副腎髄質などのクロム親和性細胞腫瘍で、カテコラミン過剰により発作性高血圧、頭痛、発汗、動悸を来す。刺激による発作に注意する。","onotes":{},"evidence":[{"s":"教科書 第6章「副腎疾患」","p":""}],"note":"2021・2025年でほぼ同一テーマが出たため、症候と機序を再確認する。 iff":"標準"},{"n":77,"stem":"妊娠後期患者を仰臥位にした際の低血圧を改善する体位はどれか（1つ選べ）","options":{"a":"Trendelenburg位固定","b":"腹臥位","c":"立位","d":"左傾斜位","e":"完全右側臥位のみ"},"choose":"1","chapter":6,"topic":"妊婦","answer":["d"],"status":"確定","explanation":"妊娠子宮が仰臥位で下大静脈を圧迫すると静脈還流が減少する。左傾斜・左側方偏位により大動静脈圧迫を軽減し、循環を改善する。","onotes":{},"evidence":[{"s":"教科書 第6章「妊婦の麻酔管理」","p":""}],"note":"体位に直結する定番病態を確実な得点源として採用した。","diff":"基本"},{"n":78,"stem":"高度肥満患者の全身麻酔で低酸素化が速い主因はどれか（1つ選べ）","options":{"a":"前酸素化不要","b":"機能的残気量低下と酸素消費増加","c":"機能的残気量増加","d":"酸素消費低下","e":"気道閉塞リスク低下"},"choose":"1","chapter":6,"topic":"肥満","answer":["b"],"status":"確定","explanation":"肥満では機能的残気量が低下し、仰臥位・麻酔導入で無気肺も増える一方、酸素消費量は大きい。そのため無呼吸時の酸素飽和度低下が速く、頭高位前酸素化が重要である。","onotes":{},"evidence":[{"s":"気道管理ガイドライン／教科書 第6章","p":""}],"note":"困難気道と生理的困難気道を区別する最新テーマ。","diff":"応用"},{"n":79,"stem":"脳梗塞既往患者の周術期管理で重要なのはどれか（1つ選べ）","options":{"a":"過度な過換気を常時行う","b":"抗血栓薬を無条件で中止","c":"術前評価を省略","d":"血糖を測定しない","e":"低血圧と低酸素を避ける"},"choose":"1","chapter":6,"topic":"脳血管障害","answer":["e"],"status":"確定","explanation":"脳灌流を保つため著明な低血圧、低酸素、低・高二酸化炭素を避ける。発症時期、後遺症、嚥下、抗血栓療法を評価し再発リスクと処置時期を検討する。","onotes":{},"evidence":[{"s":"非心臓手術の心血管ガイドライン／教科書 第6章","p":""}],"note":"過去6年に出た脳血管障害を周術期目標に再構成した。","diff":"標準"},{"n":80,"stem":"歯科治療中の全身けいれんが5分以上持続している。適切なのはどれか（1つ選べ）","options":{"a":"治療を続行","b":"単独帰宅させる","c":"気道・酸素化を確保し救急薬と搬送を準備","d":"口腔内へ指を入れる","e":"四肢を強く押さえ続ける"},"choose":"1","chapter":6,"topic":"てんかん","answer":["c"],"status":"確定","explanation":"5分以上のけいれんはてんかん重積として、外傷を防ぎ、気道・呼吸・循環を確保し、ベンゾジアゼピン等による治療と救急搬送を急ぐ。口に物を入れない。","onotes":{},"evidence":[{"s":"教科書 第6章「神経疾患患者」","p":""}],"note":"院内急変として行動順序を問う実践問題。","diff":"標準"},{"n":81,"stem":"上下顎骨形成術の麻酔管理で特に注意するのはどれか（1つ選べ）","options":{"a":"尿量だけ","b":"視力だけ","c":"下肢運動だけ","d":"局所麻酔薬の味だけ","e":"気道と術野の共有、出血、術後気道浮腫"},"choose":"1","chapter":7,"topic":"顎矯正手術","answer":["e"],"status":"確定","explanation":"顎矯正手術では経鼻挿管などで気道と術野を共有し、出血量評価が難しい。顎間固定、舌・咽頭浮腫、悪心嘔吐を含む抜管・術後気道計画が重要である。","onotes":{},"evidence":[{"s":"教科書 第7章「口腔外科手術の麻酔」","p":""}],"note":"出題数は少ないが口腔外科固有の統合問題として1問を配分した。","diff":"標準"},{"n":82,"stem":"乳幼児が成人より無呼吸時に低酸素化しやすい理由はどれか（1つ選べ）","options":{"a":"胸壁が硬い","b":"舌が相対的に小さい","c":"酸素消費量が大きく機能的残気量が小さい","d":"酸素消費量が小さい","e":"機能的残気量が非常に大きい"},"choose":"1","chapter":9,"topic":"小児気道","answer":["c"],"status":"確定","explanation":"乳幼児は体重当たり酸素消費量が大きい一方、機能的残気量による酸素貯蔵が小さく、無呼吸時のSpO₂低下が速い。前酸素化と迅速な換気確保が重要である。","onotes":{},"evidence":[{"s":"教科書 第9章「小児の解剖・呼吸生理」","p":""}],"note":"2019・2023・2025年の小児生理傾向から呼吸側を予測した。","diff":"標準"},{"n":83,"stem":"高齢者への鎮静薬投与で一般に適切なのはどれか（1つ選べ）","options":{"a":"少量からゆっくり滴定する","b":"若年者より急速大量投与","c":"効果部位平衡を待たず反復投与","d":"呼吸監視を省略","e":"全員に同一量を投与"},"choose":"1","chapter":10,"topic":"高齢者薬理","answer":["a"],"status":"確定","explanation":"高齢者では薬力学的感受性増加、分布容積・蛋白結合・代謝排泄の変化がある。少量から投与し、効果発現を待ってゆっくり滴定し、回復遅延も監視する。","onotes":{},"evidence":[{"s":"教科書 第10章「高齢者麻酔」","p":""}],"note":"高齢化と鎮静安全性を結ぶ原則問題として配分した。","diff":"基本"},{"n":84,"stem":"神経障害性疼痛を示唆する訴えはどれか（1つ選べ）","options":{"a":"拍動性頭痛だけ","b":"無痛性腫脹","c":"咬合時違和感だけ","d":"電撃痛とアロディニア","e":"運動時だけの鈍い筋疲労"},"choose":"1","chapter":12,"topic":"疼痛分類","answer":["d"],"status":"確定","explanation":"神経障害性疼痛では灼熱痛、電撃痛、しびれ、痛覚過敏、通常は痛くない刺激で痛むアロディニアなどを認める。神経解剖学的に妥当な分布も確認する。","onotes":{},"evidence":[{"s":"非歯原性歯痛ガイドライン／教科書 第12章","p":""}],"note":"非歯原性歯痛ガイドラインを反映した鑑別の基本。","diff":"基本"},{"n":85,"stem":"典型的三叉神経痛の特徴はどれか（1つ選べ）","options":{"a":"歯髄炎でのみ起こる","b":"数秒程度の電撃様発作痛","c":"持続する両側性鈍痛だけ","d":"必ず感覚脱失を伴う","e":"夜間だけの拍動痛"},"choose":"1","chapter":12,"topic":"三叉神経痛","answer":["b"],"status":"確定","explanation":"典型的三叉神経痛は三叉神経領域の片側性、短時間、電撃様反復痛で、軽い接触などのトリガーがある。持続性神経脱落所見があれば二次性原因を検索する。","onotes":{},"evidence":[{"s":"教科書 第12章「三叉神経痛」","p":""}],"note":"長年の頻出疾患を診断基準に近い症候で問う。","diff":"基本"},{"n":86,"stem":"典型的三叉神経痛の薬物治療の第一選択として用いられるのはどれか（1つ選べ）","options":{"a":"アモキシシリン","b":"プレドニゾロン単剤","c":"アドレナリン","d":"カルバマゼピン","e":"アセトアミノフェンだけ"},"choose":"1","chapter":12,"topic":"三叉神経痛治療","answer":["d"],"status":"確定","explanation":"典型的三叉神経痛ではカルバマゼピンが第一選択薬として用いられる。血球減少、肝障害、薬疹、低Na血症、薬物相互作用を監視する。","onotes":{},"evidence":[{"s":"教科書 第12章「三叉神経痛の治療」","p":""}],"note":"診断と治療を連続して問うペア問題を想定した。","diff":"標準"},{"n":87,"stem":"咀嚼筋由来の筋・筋膜性疼痛を示唆する所見はどれか（1つ選べ）","options":{"a":"全身麻酔でしか診断できない","b":"筋触診で患者の熟知痛が再現される","c":"歯髄電気診に必ず無反応","d":"皮疹を伴う","e":"片側顔面の電撃痛だけ"},"choose":"1","chapter":12,"topic":"筋・筋膜性疼痛","answer":["b"],"status":"確定","explanation":"筋性歯痛では原因筋の触診や負荷で患者が日常感じる熟知痛が再現され、歯に関連痛を生じうる。不可逆的歯科処置前に非歯原性疼痛を鑑別する。","onotes":{},"evidence":[{"s":"非歯原性歯痛ガイドライン「筋性歯痛」","p":""}],"note":"不要な抜髄・抜歯回避につながるガイドライン型問題。","diff":"標準"},{"n":88,"stem":"前兆のない片頭痛に典型的なのはどれか（1つ選べ）","options":{"a":"数秒の電撃痛だけ","b":"筋触診のみで再現","c":"必ず両側性で軽度","d":"悪心を伴わない","e":"拍動性で日常動作により増悪する"},"choose":"1","chapter":12,"topic":"片頭痛","answer":["e"],"status":"確定","explanation":"片頭痛は4～72時間持続し、片側性、拍動性、中等度以上、日常動作で増悪という特徴のうち複数をもち、悪心や光・音過敏を伴いうる。","onotes":{},"evidence":[{"s":"非歯原性歯痛ガイドライン「神経血管性疼痛」","p":""}],"note":"歯痛として受診しうる頭痛疾患を鑑別させる。","diff":"標準"},{"n":89,"stem":"帯状疱疹後神経痛の危険因子として知られるのはどれか（1つ選べ）","options":{"a":"急性期疼痛がないこと","b":"ワクチン接種だけ","c":"高齢","d":"若年だけ","e":"発疹が軽いこと"},"choose":"1","chapter":12,"topic":"帯状疱疹後神経痛","answer":["c"],"status":"確定","explanation":"高齢、急性期の強い疼痛、重い皮疹、眼部病変などは帯状疱疹後神経痛のリスクとなる。急性期診断と抗ウイルス治療、疼痛管理が重要である。","onotes":{},"evidence":[{"s":"教科書 第12章「帯状疱疹後神経痛」","p":""}],"note":"高齢者麻酔と横断しやすい慢性疼痛テーマ。","diff":"標準"},{"n":90,"stem":"CRPSを示唆する所見はどれか（1つ選べ）","options":{"a":"侵害刺激の程度に不釣合いな疼痛と自律神経・栄養変化","b":"単一神経領域に限局する無症候","c":"炎症所見を欠く短時間電撃痛のみ","d":"抗菌薬で必ず即時消失","e":"左右対称の無痛"},"choose":"1","chapter":12,"topic":"複合性局所疼痛症候群","answer":["a"],"status":"確定","explanation":"CRPSは誘因に不釣合いな持続痛に、感覚、血管運動、発汗・浮腫、運動・栄養変化が組み合わさる。早期の多職種評価と機能回復が重要である。","onotes":{},"evidence":[{"s":"教科書 第12章「CRPS」","p":""}],"note":"ペイン領域の総合徴候問題として難度調整に用いた。","diff":"応用"},{"n":91,"stem":"歯科治療中、全身じん麻疹、喘鳴、血圧低下が急に出現した。第一選択薬はどれか（1つ選べ）","options":{"a":"経口鎮痛薬","b":"フルマゼニル","c":"筋肉内アドレナリン","d":"抗ヒスタミン薬だけ","e":"ステロイドだけ"},"choose":"1","chapter":13,"topic":"アナフィラキシー","answer":["c"],"status":"確定","explanation":"皮膚・呼吸・循環症状を伴うアナフィラキシーでは大腿前外側への筋肉内アドレナリンが第一選択である。応援要請、酸素、気道管理、輸液を同時に進める。","onotes":{},"evidence":[{"s":"アナフィラキシーガイドライン／医科アナフィラキシーガイド","p":""}],"note":"ガイドライン更新後も最優先で問われる救急処置。","diff":"基本"},{"n":92,"stem":"局所麻酔後、酸素投与でも改善しにくいチアノーゼがあり、血液がチョコレート色であった。疑うのはどれか（1つ選べ）","options":{"a":"メトヘモグロビン血症","b":"過換気症候群","c":"単純性失神","d":"低血糖","e":"局所的血腫"},"choose":"1","chapter":13,"topic":"メトヘモグロビン血症","answer":["a"],"status":"確定","explanation":"酸化されたFe³⁺を含むメトヘモグロビンは酸素運搬に寄与せず、通常の酸素投与でチアノーゼが改善しにくい。COオキシメトリで確認し、重症ではメチレンブルーを考慮する。","onotes":{},"evidence":[{"s":"教科書 第13章「薬物性メトヘモグロビン血症」","p":""}],"note":"2024年の採点上問題化したテーマを臨床像が一意になるよう再構成した。","diff":"応用"},{"n":93,"stem":"敗血症性ショック初期にみられうる血行動態はどれか（1つ選べ）","options":{"a":"心拍出量は必ず0","b":"徐脈のみ","c":"循環血液量の絶対増加だけ","d":"末梢血管抵抗低下と心拍出量増加","e":"末梢血管抵抗上昇だけ"},"choose":"1","chapter":14,"topic":"敗血症性ショック","answer":["d"],"status":"確定","explanation":"早期の分布異常性ショックでは炎症性血管拡張により末梢血管抵抗が低下し、代償性に心拍出量が増えるwarm shockを示しうる。進行時は心機能も低下する。","onotes":{},"evidence":[{"s":"教科書 第14章「ショックの分類」","p":""}],"note":"2018・2020・2025年反復テーマを機序と血行動態で変形した。","diff":"基本"},{"n":94,"stem":"Forrester分類で肺動脈楔入圧が高く、心係数が低い病型はどれか（1つ選べ）","options":{"a":"判定不能","b":"subset I","c":"subset II","d":"subset III","e":"subset IV"},"choose":"1","chapter":14,"topic":"心原性ショック","answer":["e"],"status":"確定","explanation":"Forrester subset IVは心係数2.2 L/min/m²未満かつ肺動脈楔入圧18 mmHg超で、末梢低灌流と肺うっ血を伴うcold and wetの病型である。","onotes":{},"evidence":[{"s":"教科書 第14章「Forrester分類」","p":""}],"note":"2019・2024・2025年に繰り返す高確率テーマを閾値判断にした。","diff":"標準"},{"n":95,"stem":"心拍数120/分、収縮期血圧80 mmHgの患者のshock indexはどれか（1つ選べ）","options":{"a":"0.67","b":"1.0","c":"1.5","d":"2.0","e":"0.5"},"choose":"1","chapter":14,"topic":"ショック指数","answer":["c"],"status":"確定","explanation":"shock indexは心拍数÷収縮期血圧で求め、120÷80＝1.5である。1を超える上昇は循環血液量減少や重症ショックを示唆し、単独でなく全身所見と評価する。","onotes":{},"evidence":[{"s":"教科書 第14章「ショックの評価」","p":""}],"note":"計算問題で確実に理解を測れるため1問配置した。","diff":"基本"},{"n":96,"stem":"成人が反応なく正常な呼吸をしていない。医療従事者が脈拍を確認する時間の上限はどれか（1つ選べ）","options":{"a":"120秒","b":"5秒","c":"10秒","d":"30秒","e":"60秒"},"choose":"1","chapter":15,"topic":"BLS","answer":["c"],"status":"確定","explanation":"脈拍確認に10秒以上かけず、確実に触知できなければ胸骨圧迫を開始する。判断遅延を避け、高品質CPRとAED装着を優先する。","onotes":{},"evidence":[{"s":"JRC蘇生ガイドライン／教科書 第15章「BLS」","p":""}],"note":"BLSの時間・数値は定番で、行動遅延防止を問う。","diff":"基本"},{"n":97,"stem":"成人への高品質胸骨圧迫として適切なのはどれか（1つ選べ）","options":{"a":"40回/分、深さ1 cm","b":"200回/分、深さ8 cm","c":"換気のたびに長く中断","d":"胸壁の戻りを妨げる","e":"100～120回/分、深さ約5 cm"},"choose":"1","chapter":15,"topic":"胸骨圧迫","answer":["e"],"status":"確定","explanation":"成人胸骨圧迫は100～120回/分、深さ約5 cm（6 cmを超えない）、完全な胸壁リコイル、最小限の中断を目標とする。","onotes":{},"evidence":[{"s":"JRC蘇生ガイドライン／教科書 第15章","p":""}],"note":"蘇生の最重要数値を一意な選択肢で確認する。","diff":"基本"},{"n":98,"stem":"AEDが電気ショックを実施した直後に行うのはどれか（1つ選べ）","options":{"a":"患者を歩かせる","b":"電極を外す","c":"直ちに胸骨圧迫を再開する","d":"1分間脈拍だけを確認する","e":"血圧測定を優先する"},"choose":"1","chapter":15,"topic":"AED","answer":["c"],"status":"確定","explanation":"電気ショック直後は脈拍確認で中断せず、直ちに胸骨圧迫からCPRを約2分再開する。その後AEDの解析指示に従う。","onotes":{},"evidence":[{"s":"JRC蘇生ガイドライン「AEDアルゴリズム」","p":""}],"note":"2025年問題を表現変更し、アルゴリズムの核心を再確認する。","diff":"基本"},{"n":99,"stem":"心室細動に対する電気ショック後も心停止が続く。蘇生中に用いる血管収縮薬はどれか（1つ選べ）","options":{"a":"アドレナリン","b":"ニトログリセリン","c":"プロポフォール","d":"フルマゼニル","e":"スガマデクス"},"choose":"1","chapter":15,"topic":"ACLS","answer":["a"],"status":"確定","explanation":"ショック適応リズムでも高品質CPRと除細動を繰り返し、アルゴリズムに従ってアドレナリンを投与する。薬物投与のために胸骨圧迫を長く中断しない。","onotes":{},"evidence":[{"s":"JRC蘇生ガイドライン／教科書 第15章「二次救命処置」","p":""}],"note":"BLSだけでなく薬物を含む蘇生の流れを問う。","diff":"標準"},{"n":100,"stem":"心停止の可逆的原因『4H・4T』に含まれるのはどれか（1つ選べ）","options":{"a":"高体温だけ","b":"高アルブミン血症","c":"歯周炎だけ","d":"低酸素","e":"高血圧"},"choose":"1","chapter":15,"topic":"可逆的原因","answer":["d"],"status":"確定","explanation":"可逆的原因には低酸素、循環血液量減少、低・高カリウムなど代謝異常、低体温、緊張性気胸、心タンポナーデ、血栓症、中毒が含まれる。","onotes":{},"evidence":[{"s":"JRC蘇生ガイドライン「心停止の可逆的原因」","p":""}],"note":"症例対応を支える暗記枠組みとして最終問題に配置した。","diff":"基本"}],"excluded":[],"dup":[]},{"id":"2025","label":"2025年 第50回","short":"2025","type":"past","questions":[{"n":1,"stem":"心拍出量が増加するのはどれか.1 つ選べ.","options":{"a":"心原性ショック","b":"出血性ショック","c":"神経原性ショック","d":"敗血症性ショック","e":"心外閉塞・拘束性ショック"},"choose":"1","chapter":14,"topic":"ショックの分類","answer":["d"],"status":"確定","explanation":"敗血症性ショックは血液分布異常性ショックで、初期の warm shock では末梢血管抵抗が低下し、代償性に心拍出量が増加しうる。ほかの選択肢は原則として心拍出量を低下させる。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第14章 ショック","p":"書籍p.522-532"}],"note":""},{"n":2,"stem":"心拍数を減少させる薬物はどれか.2 つ選べ.","options":{"a":"ドパミン","b":"ドブタミン","c":"エフェドリン","d":"エスモロール","e":"フェニレフリン"},"choose":"2","chapter":2,"topic":"循環作動薬","answer":["d","e"],"status":"確定","explanation":"エスモロールは短時間作用性β1遮断薬として心拍数を直接減少させる。フェニレフリンはα1刺激による昇圧に伴い圧受容体反射性徐脈を起こす。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第2章 全身管理に必要な基本的知識","p":"書籍p.16-107"}],"note":""},{"n":3,"stem":"小児循環器系の特徴はどれか.1 つ選べ.","options":{"a":"心筋の拡張能が高い.","b":"交感神経系が優位である.","c":"圧受容体反射が亢進している.","d":"カテコラミンに対する感受性が高い.","e":"胎児型ヘモグロビンは酸素親和性が低い."},"choose":"1","chapter":9,"topic":"小児の解剖生理","answer":["d"],"status":"確定","explanation":"小児、とくに新生児・乳児は心筋の予備力や拡張能が低く、心拍出量を心拍数に依存する一方、外因性カテコラミンへの反応性は保たれ感受性が高い。胎児Hbの酸素親和性は高い。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第9章 小児の麻酔管理","p":"書籍p.419-431"}],"note":""},{"n":4,"stem":"心室細動の患者に AED による電気ショックを行ったところ，直後に正常洞調律となった．次に行うことはどれか．1 つ選べ．","options":{"a":"意識確認","b":"呼吸確認","c":"脈拍確認","d":"血圧測定","e":"胸骨圧迫"},"choose":"1","chapter":15,"topic":"BLS","answer":["e"],"status":"確定","explanation":"電気ショック後は脈拍やリズムの確認で胸骨圧迫を中断せず、ただちに胸骨圧迫からCPRを再開して約2分継続する。これは正常に見える調律が出現しても同じである。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第15章 心肺蘇生法","p":"書籍p.533-550"}],"note":""},{"n":5,"stem":"下顎智歯部付近への浸潤麻酔時,局所麻酔針が舌神経を損傷した場合に発生しうるのはどれか．2 つ選べ．","options":{"a":"軸索断裂","b":"神経幹断裂","c":"舌運動障害","d":"神経障害性疼痛","e":"局在性伝導障害"},"choose":"2","chapter":3,"topic":"局所麻酔の合併症","answer":["a","d"],"status":"確定","explanation":"注射針が舌神経を穿通すると軸索が傷害され、軸索断裂を生じうる。また損傷後には異常感覚やアロディニアを伴う神経障害性疼痛が発生しうる。舌運動は舌下神経支配である。","onotes":{},"evidence":[{"s":"歯科治療による下歯槽神経・舌神経損傷の診断と治療に関するガイドライン","p":"三叉神経損傷の基本的特徴"},{"s":"歯科麻酔学 第8版 第12章 ペインクリニック","p":"書籍p.476-477"}],"note":""},{"n":6,"stem":"メトヘモグロビン血症の特徴はどれか.2 つ選べ.","options":{"a":"メトヘモグロビンは三価鉄(Fe3+)を含む.","b":"メトヘモグロビンは二酸化炭素の運搬能が高い.","c":"メトヘモグロビンの割合が 60%で生命の危険がある．","d":"プロピトカイン 300 mg 以上を使用すると発症する危険性がある．","e":"プロピトカインの代謝産物である N‒プロピルアラニンが原因である．"},"choose":"2","chapter":3,"topic":"局所麻酔薬の毒性","answer":["a","c"],"status":"確定","explanation":"メトヘモグロビンはヘム鉄がFe2+からFe3+へ酸化されたもので酸素運搬能を失う。60%前後では重篤な低酸素症となり生命の危険がある。プロピトカインの原因代謝物はo-トルイジンで、教科書上の高リスク量は600 mg以上である。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第3章 局所麻酔","p":"書籍p.117, p.121"},{"s":"歯科麻酔学 第8版 第13章 全身的偶発症","p":"書籍p.515"}],"note":""},{"n":7,"stem":"AED による電気的除細動の適応はどれか.すべて選べ．","options":{"a":"心静止","b":"心室細動","c":"無脈性電気活動","d":"無脈性心室頻拍","e":"発作性上室性頻拍"},"choose":"all","chapter":15,"topic":"電気的除細動","answer":["b","d"],"status":"確定","explanation":"AEDのショック適応は心室細動と無脈性心室頻拍である。心静止と無脈性電気活動は非ショック適応で、CPRと薬物治療を行う。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第15章 心肺蘇生法","p":"書籍p.533-550"}],"note":""},{"n":8,"stem":"電気的除細動が 1 分間遅れると,蘇生率はどの程度低下するか．1 つ選べ．","options":{"a":"2~5%","b":"7~10%","c":"11~14%","d":"15~18%","e":"20~23%"},"choose":"1","chapter":15,"topic":"電気的除細動","answer":["b"],"status":"確定","explanation":"心室細動に対する除細動は1分遅れるごとに救命率がおよそ7-10%低下するため、早期除細動が救命の連鎖の重要要素となる。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第15章 心肺蘇生法","p":"書籍p.533-550"}],"note":""},{"n":9,"stem":"窒息による意識喪失後,ただちに行うべき処置はどれか．1 つ選べ．","options":{"a":"AED","b":"気道確保","c":"人工呼吸","d":"胸骨圧迫","e":"腹部突き上げ法"},"choose":"1","chapter":15,"topic":"気道異物・窒息","answer":["d"],"status":"確定","explanation":"重度気道異物で意識を失った成人では、ただちに胸骨圧迫からCPRを開始する。各サイクルで気道を開放した際に目視できる異物のみ除去する。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第15章 心肺蘇生法","p":"書籍p.533-550"}],"note":""},{"n":10,"stem":"低血圧を伴う局所麻酔薬中毒に対する治療として,推奨される 20％脂肪乳剤の投与量の組み合わせはどれか．1 つ選べ．","options":{"a":"初期投与 0.8 mL/kg― その後持続投与 8 mL/kg/時","b":"初期投与 1.0 mL/kg― その後持続投与 10 mL/kg/時","c":"初期投与 1.2 mL/kg― その後持続投与 12 mL/kg/時","d":"初期投与 1.5 mL/kg― その後持続投与 15 mL/kg/時","e":"初期投与 2.0 mL/kg― その後持続投与 20 mL/kg/時"},"choose":"1","chapter":3,"topic":"局所麻酔薬中毒","answer":["d"],"status":"確定","explanation":"局所麻酔薬中毒の脂肪乳剤療法は、20%脂肪乳剤1.5 mL/kgをボーラス投与し、続いて0.25 mL/kg/分、すなわち15 mL/kg/時で持続する。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第3章 局所麻酔","p":"局所麻酔薬中毒の治療"}],"note":""},{"n":11,"stem":"術後悪心・嘔吐のリスク因子はどれか.2 つ選べ.","options":{"a":"男性","b":"小児","c":"肥満","d":"喫煙者","e":"動揺病(乗り物酔い)"},"choose":"2","chapter":5,"topic":"PONV","answer":["b","e"],"status":"確定","explanation":"教科書はPONVのリスク因子として「小児や女性でその傾向が強く」「非喫煙者、PONVや動揺病（乗り物酔い）の既往や術後オピオイドの使用」を明記しており、bとeが正しい。Apfelスコアでも女性・非喫煙者・PONV/動揺病の既往・術後オピオイドが4大因子である。男性・喫煙者はむしろ低リスク側であり、肥満はかつて言われたが現在は独立したリスク因子とされず教科書にも記載がない。","onotes":{"a":"誤。リスクは女性であり男性ではない。","b":"正。教科書に小児でPONV傾向が強いと明記。","c":"誤。肥満は教科書のリスク因子に挙げられていない（独立因子とされない）。","d":"誤。非喫煙者がリスク因子で、喫煙者は低リスク。","e":"正。動揺病（乗り物酔い）の既往はリスク因子と明記。"},"evidence":[{"s":"教科書5章 術後管理（PONV）","p":"書籍p.294"}],"note":""},{"n":12,"stem":"肺塞栓症の急性発症時に認められる所見はどれか. 2 つ選べ．","options":{"a":"徐脈","b":"低呼吸","c":"PaO2 の低下","d":"PaCO2 の上昇","e":"右心室拡大"},"choose":"2","chapter":5,"topic":"肺血栓塞栓症","answer":["c","e"],"status":"確定","explanation":"急性肺塞栓では突然の呼吸困難・頻呼吸・頻脈を呈し、血液ガスではPaO2低下とPaCO2低下(頻呼吸による)、A-aDO2開大を認める(書籍p.294)。塞栓が大きいと急性右心負荷所見が出現し、心エコーでは右心室拡大・右室機能不全がみられる。よってc(PaO2低下)とe(右心室拡大)が正解。a徐脈(実際は頻脈)、b低呼吸(実際は頻呼吸)、dPaCO2上昇(実際は低下)はいずれも逆の記述で誤り。","onotes":{"a":"誤。頻脈が特徴で徐脈ではない。","b":"誤。頻呼吸が特徴で低呼吸ではない。","c":"正。PaO2低下とA-aDO2開大を認める。","d":"誤。頻呼吸によりPaCO2はむしろ低下する。","e":"正。心エコーで右心室拡大・中隔奇異性運動を認める。"},"evidence":[{"s":"教科書5章 術後管理（肺血栓塞栓症）","p":"書籍p.293-294"},{"s":"教科書5章 術後管理(肺血栓塞栓症)","p":"書籍p.294"}],"note":""},{"n":13,"stem":"虚血プレコンディショニングに関与する薬剤はどれか．1 つ選べ．","options":{"a":"笑気","b":"セボフルラン","c":"レミマゾラム","d":"プロポフォール","e":"デクスメデトミジン"},"choose":"1","chapter":5,"topic":"吸入麻酔薬の薬理","answer":["b"],"status":"確定","explanation":"薬物による虚血プレコンディショニング（心筋保護効果）はイソフルラン、セボフルラン、デスフルランなどの揮発性吸入麻酔薬やオピオイド、アデノシン、ニコランジルで示されており、教科書は「セボフルランは心筋虚血に陥っても梗塞巣をより小さくするプレコンディショニング作用を有している」と明記する。選択肢中で該当するのはセボフルランのみ。笑気（亜酸化窒素）にはこの作用はなく、静脈麻酔薬のレミマゾラム・プロポフォール・デクスメデトミジンにも確立したプレコンディショニング作用はない。","onotes":{"a":"誤。亜酸化窒素にプレコンディショニング作用はない。","b":"正。梗塞巣縮小のプレコンディショニング作用が明記されている。","c":"誤。ベンゾジアゼピン系静脈麻酔薬にこの作用はない。","d":"誤。プロポフォールにはなく、セボ/デスフルランより心臓麻酔での1年死亡率が高いと報告。","e":"誤。α2作動薬にプレコンディショニング作用は確立していない。"},"evidence":[{"s":"教科書2章 循環生理/5章 吸入麻酔","p":"書籍p.45, p.225"},{"s":"教科書2章 循環生理(薬物によるプレコンディショニング)","p":"書籍p.45"},{"s":"教科書5章 吸入麻酔","p":"書籍p.230付近"}],"note":""},{"n":14,"stem":"健康成人の安静時において,血液分配量が多い臓器はどれか．2 つ選べ．","options":{"a":"脳","b":"心臓","c":"肝臓","d":"腎臓","e":"骨格筋"},"choose":"2","chapter":2,"topic":"循環生理","answer":["c","d"],"status":"確定","explanation":"教科書の表2-I-12（健常人安静時）では心拍出量に対する血流配分は肝臓27.8%（1,500mL/分）、腎臓23.3%（1,260mL/分）、骨格筋15.6%、脳13.9%、心臓4.7%であり、本文にも「安静時では肝臓と腎臓への臓器配分が多く、どちらも心拍出量の20〜30%を占める。次に骨格筋、脳という順で約15%」と明記されている。したがって血液分配量が多い臓器は肝臓と腎臓である。","onotes":{"a":"誤。脳は13.9%（約15%）で3〜4番目。","b":"誤。心臓は4.7%と少ない（単位重量あたりは多い）。","c":"正。27.8%で最多。","d":"正。23.3%で2番目。","e":"誤。骨格筋は15.6%で肝・腎に及ばない。"},"evidence":[{"s":"教科書2章 表2-I-12 体循環での各臓器血流量","p":"書籍p.46"},{"s":"教科書2章 循環生理 表2-I-12","p":"書籍p.46"}],"note":""},{"n":15,"stem":"ミダゾラムについて正しいのはどれか.1 つ選べ.","options":{"a":"鎮痛作用を有している.","b":"排泄半減期はプロポフォールよりも長い.","c":"習慣的な飲酒はクリアランスを増加させる.","d":"GABAA 受容体のα‒βサブユニット間に結合する．","e":"Cl-が流入し細胞を脱分極させることで神経活動を抑制する．"},"choose":"1","chapter":4,"topic":"静脈内鎮静法の薬物","answer":["c"],"status":"確定","explanation":"教科書に「習慣的な飲酒はミダゾラムのクリアランスを増加させる」と明記されておりcが正しい（慢性飲酒による肝薬物代謝酵素誘導）。aは誤りで、臨床使用量では鎮痛作用は認められない。bは誤りで、表4-Ⅲ-1でミダゾラムの排泄半減期は1.7〜2.6時間、プロポフォールは4〜7時間とミダゾラムの方が短い。dは誤りで、ベンゾジアゼピン結合部位はαサブユニットとγサブユニットの間である。eは誤りで、Cl-流入は細胞を過分極（脱分極ではない）させて神経活動を抑制する。","onotes":{"a":"誤。臨床使用量の静脈内投与では鎮痛作用は認められない。","b":"誤。排泄半減期はミダゾラム1.7〜2.6時間＜プロポフォール4〜7時間。","c":"正。習慣的飲酒はクリアランスを増加させると明記。","d":"誤。ベンゾジアゼピンはα-γサブユニット間に結合する。","e":"誤。Cl-流入により過分極して抑制する。脱分極ではない。"},"evidence":[{"s":"教科書4章 静脈内鎮静法（ミダゾラム）","p":"書籍p.185-188"},{"s":"教科書4章 静脈内鎮静法(ミダゾラム薬物動態)","p":"書籍p.175"},{"s":"教科書4章 表4-III-1・図4-III-1","p":"書籍p.173"}],"note":""},{"n":16,"stem":"ミダゾラムと併用禁忌なのはどれか.1 つ選べ.","options":{"a":"モノアミン酸化酵素阻害薬","b":"カルシウム拮抗薬","c":"抗悪性腫瘍薬","d":"HIV プロテアーゼ阻害薬","e":"アゾール系抗真菌薬"},"choose":"1","chapter":4,"topic":"静脈内鎮静法の薬物","answer":["d"],"status":"確定","explanation":"ミダゾラム（ドルミカム）の併用禁忌は、HIVプロテアーゼ阻害薬（リトナビル等）、エファビレンツ、コビシスタット含有製剤、リトナビル含有製剤であり、これらのCYP3A4に対する強力な競合的阻害によりミダゾラムの血中濃度が著しく上昇し、過度の鎮静や呼吸抑制を起こすおそれがあるためである。教科書の表4-Ⅲ-2にも同内容が明記されている。MAO阻害薬・カルシウム拮抗薬・抗悪性腫瘍薬（ビノレルビン等）・アゾール系抗真菌薬はいずれも「併用注意」であり禁忌ではない。","onotes":{"a":"誤。中枢神経抑制作用増強のため併用注意。","b":"誤。CYP3A4阻害による血中濃度上昇のため併用注意。","c":"誤。ビノレルビン等は併用注意。","d":"正。HIVプロテアーゼ阻害薬は併用禁忌と明記。","e":"誤。アゾール系抗真菌薬は併用注意。"},"evidence":[{"s":"教科書4章 表4-Ⅲ-2 ミダゾラムの薬物相互作用","p":"書籍p.191"},{"s":"教科書4章 表4-III-2 ミダゾラムの薬物相互作用","p":"書籍p.178"}],"note":""},{"n":17,"stem":"レミマゾラムについて正しいのはどれか.2 つ選べ.","options":{"a":"重症筋無力症の患者にも使用できる.","b":"作用持続時間はフルマゼニルより短い.","c":"乳酸リンゲル液には完全に溶解せず沈澱する.","d":"代謝産物の鎮静作用はレミマゾラムの約 20%である．","e":"肝臓のカルボキシエステラーゼによって加水分解され代謝される．"},"choose":"2","chapter":5,"topic":"静脈麻酔薬","answer":["c","e"],"status":"確定","explanation":"レミマゾラム（アネレム）は主に肝臓のカルボキシエステラーゼ（CES1）により加水分解されてほぼ不活性の代謝物CNS7054となる（e正）。添付文書の適用上の注意に、乳酸リンゲル液には完全に溶解せず沈殿を生じるため溶解・同一ラインでの投与を避ける旨が記載されている（c正）。aは誤りで、ベンゾジアゼピン系として重症筋無力症は禁忌。dは誤りで、代謝物の活性はレミマゾラムの約1/300以下（約20〜30%はミダゾラムの代謝物α-ヒドロキシミダゾラムの値）。bはレミマゾラムの消失半減期（約40〜60分）がフルマゼニル（約50分）とほぼ同等で「短い」と確言できず、フルマゼニル拮抗後の再鎮静の報告もあるため誤とした。","onotes":{"a":"誤。重症筋無力症は禁忌（ベンゾジアゼピン系共通）。","b":"誤。消失半減期はフルマゼニルとほぼ同等で、拮抗後の再鎮静も報告されている。","c":"正。乳酸リンゲル液には完全に溶解せず沈殿（配合不適）。","d":"誤。代謝物CNS7054の活性は約1/300以下でほぼ不活性。20%はミダゾラム代謝物の数値。","e":"正。肝カルボキシエステラーゼ（CES1）で加水分解される。"},"evidence":[{"s":"アネレム添付文書・インタビューフォーム（薬理知識）","p":"-"},{"s":"悪性高熱症管理ガイドライン2025","p":"-"},{"s":"教科書4章 静脈内鎮静法(ベンゾジアゼピンと重症筋無力症)","p":"書籍p.177"}],"note":"教科書第8版・手持ちガイドラインにレミマゾラムの薬理詳細の記載がなく、添付文書ベースの判定。bとcの真偽が最も割れうる（bを正とする解釈も文献にはある）が、cは添付文書の文言そのままであり c+e を採用。"},{"n":18,"stem":"ジアゼパムについて正しいのはどれか.2 つ選べ.","options":{"a":"ミダゾラムよりも鎮静・催眠効果が強い.","b":"プロポフォールよりもクリアランスが大きい.","c":"年齢による影響を受けにくい.","d":"喫煙により代謝が亢進する.","e":"局所麻酔薬中毒のけいれんに対して用いられる."},"choose":"2","chapter":4,"topic":"静脈内鎮静法の薬物","answer":["d","e"],"status":"確定","explanation":"教科書にジアゼパムは「年齢の影響を受けやすく（高年齢で代謝が遅延）、逆に喫煙で代謝が亢進する」と明記され（d正）、抗けいれん作用の項に「てんかん発作や熱けいれんの際の第一選択薬で、局所麻酔薬中毒のけいれんに対しても用いられる」とある（e正）。aは誤りで、ミダゾラムの鎮静・催眠効果がジアゼパムの2〜3倍（ジアゼパムの方が弱い）。bは誤りで、表4-Ⅲ-1でジアゼパムのクリアランスは0.2〜0.5mL/kg/分とプロポフォール（20〜30）より著しく小さい。cは誤りで、年齢の影響を受けやすい薬物である。","onotes":{"a":"誤。ミダゾラムの方が2〜3倍強い。","b":"誤。クリアランスはジアゼパム0.2〜0.5、プロポフォール20〜30mL/kg/分。","c":"誤。年齢の影響を受けやすく高齢で代謝遅延。","d":"正。喫煙で代謝が亢進すると明記。","e":"正。局所麻酔薬中毒のけいれんに用いられると明記。"},"evidence":[{"s":"教科書4章 静脈内鎮静法（ジアゼパム）","p":"書籍p.186-189"},{"s":"教科書4章 静脈内鎮静法(ジアゼパム)","p":"書籍p.175-176"}],"note":""},{"n":19,"stem":"薬物とそれが結合する受容体の組み合わせで正しいのはどれか．2 つ選べ．","options":{"a":"ミダゾラム ― NMDA 受容体","b":"スルピリド ― ドパミン受容体","c":"ゾピクロン ― ムスカリン受容体","d":"チアミラールナトリウム ― GABAA 受容体","e":"ネオスチグミンメチル硫酸塩 ― ニコチン性アセチルコリン受容体"},"choose":"2","chapter":5,"topic":"麻酔薬と受容体","answer":["b","d"],"status":"確定","explanation":"チアミラールなどのバルビツレートはGABAA受容体に結合して作用を増強することが教科書に明記されている（d正）。スルピリドはベンザミド系のドパミンD2受容体遮断薬であり組み合わせは正しい（b正）。aは誤りで、ミダゾラムはGABAA受容体（ベンゾジアゼピン結合部位）に作用しNMDA受容体はケタミンの標的。cは誤りで、ゾピクロンは非ベンゾジアゼピン系睡眠薬だがベンゾジアゼピン受容体（GABAA受容体）に作用するとされ、ムスカリン受容体ではない。eは誤りで、ネオスチグミンは抗コリンエステラーゼ薬でありアセチルコリンエステラーゼに結合して作用する。","onotes":{"a":"誤。ミダゾラムはGABAA受容体に結合。NMDA受容体はケタミン。","b":"正。スルピリドはドパミンD2受容体遮断薬。","c":"誤。ゾピクロンはGABAA受容体のベンゾジアゼピン結合部位に作用。","d":"正。バルビツレートはGABAA受容体に結合と教科書に明記。","e":"誤。ネオスチグミンはコリンエステラーゼを阻害する薬でニコチン受容体に結合するのではない。"},"evidence":[{"s":"教科書4章 静脈内鎮静法","p":"書籍p.186-187"},{"s":"教科書4章 図4-III-1・本文","p":"書籍p.173-174"},{"s":"教科書5章 筋弛緩薬の拮抗","p":"書籍p.249"}],"note":""},{"n":20,"stem":"ドロペリドールについて正しいのはどれか.2 つ選べ．","options":{"a":"鎮痛作用を有している.","b":"末梢血管の収縮作用がある.","c":"用量依存性に QT 延長を引き起こす.","d":"2 歳以下の乳児・小児にも使用できる.","e":"2.5 mg 未満の使用で制吐作用を発揮する."},"choose":"2","chapter":5,"topic":"静脈麻酔薬","answer":["c","e"],"status":"確定","explanation":"ドロペリドールはブチロフェノン誘導体で、用量依存性にQT延長を引き起こしtorsades de pointesのリスクがある（c正、FDA警告・教科書の定型抗精神病薬の記載と合致）。制吐作用は低用量（0.625〜1.25mg、すなわち2.5mg未満）で発揮され、PONV予防に用いられる（e正）。aは誤りで、鎮痛作用はなくNLAではフェンタニルを併用する。bは誤りで、α遮断作用により末梢血管は拡張し血圧は低下する。dは誤りで、錐体外路症状が発現しやすいため2歳以下の乳・幼児には禁忌である。","onotes":{"a":"誤。鎮痛作用はない。NLAの鎮痛はフェンタニルが担う。","b":"誤。α遮断作用により血管拡張・血圧低下をきたす。","c":"正。用量依存性QT延長（torsades de pointesのリスク）。","d":"誤。2歳以下の乳・幼児は禁忌。","e":"正。0.625〜1.25mgの低用量で制吐作用を発揮する。"},"evidence":[{"s":"教科書6章 精神疾患","p":"書籍p.386"},{"s":"ドロレプタン添付文書（薬理知識）","p":"-"},{"s":"教科書5章 術後管理・9章 小児","p":"書籍p.295, p.442"}],"note":"QT延長の用量依存性と低用量制吐作用は標準的薬理知識(FDA黒枠警告・PONVガイドライン)で、教科書は制吐薬としての使用とブチロフェノン系のQT延長リスクを記載。"},{"n":21,"stem":"ケタミン塩酸塩について正しいのはどれか.1 つ選べ．","options":{"a":"筋弛緩作用がある.","b":"脳の辺縁系を抑制する.","c":"肝臓のチトクローム P450 により代謝される.","d":"投与後に一過性の徐脈が認められることがある.","e":"視床・新皮質を機能的ならびに電気生理学的に活性化する．"},"choose":"1","chapter":5,"topic":"静脈麻酔薬","answer":["c"],"status":"確定","explanation":"ケタミンは肝臓のチトクロームP450でN-脱メチル化されノルケタミンに代謝される（標準薬理学）ためcが正しい。教科書によれば、ケタミンは視床・新皮質を「抑制」し大脳辺縁系を「賦活」する解離性麻酔薬であり、bとeは抑制と賦活の対象が逆。交感神経刺激作用により血圧上昇・心拍数増加をきたすためdの一過性徐脈は特徴でなく、筋緊張はむしろ維持・亢進されるためaも誤り。","onotes":{"a":"誤。筋弛緩作用はなく、筋緊張はむしろ維持・亢進する（ケタミン麻酔ではFRC減少がない＝呼吸筋緊張維持）。","b":"誤。大脳辺縁系は抑制ではなく賦活する。","c":"正。肝チトクロームP450によりN-脱メチル化されノルケタミンへ代謝される。","d":"誤。交感神経刺激作用により心拍数増加・血圧上昇が典型。","e":"誤。視床・新皮質は活性化ではなく抑制する。"},"evidence":[{"s":"教科書4章 静脈内鎮静法","p":"書籍p.185"},{"s":"教科書10章 高齢者の全身麻酔","p":"書籍p.438"},{"s":"教科書2章 呼吸生理","p":"書籍p.20-21"}],"note":""},{"n":22,"stem":"デクスメデトミジン塩酸塩について正しいのはどれか．2 つ選べ．","options":{"a":"心拍数は増加する.","b":"呼吸数はほとんど変化しない.","c":"小児に対する安全性は確立していない.","d":"主にα1 アドレナリン受容体に作用する.","e":"ベンゾジアゼピン系薬よりもせん妄の発現が少ない．"},"choose":"2","chapter":4,"topic":"静脈内鎮静法の薬物","answer":["b","e"],"status":"確定","explanation":"デクスメデトミジンはα2アドレナリン受容体作動薬（α1に対しα2選択性1,600倍）で、交感神経抑制により心拍数は減少する（a・d誤）。呼吸抑制が少なく呼吸数はほとんど変化しない（b正）。ベンゾジアゼピンやプロポフォールはせん妄のリスク因子とされ、デクスメデトミジンはせん妄発現が少なく術後鎮静に推奨される（e正）。小児については集中治療での人工呼吸中鎮静の用法・用量が2018年に追加承認されており、「安全性は確立していない」とは全面的にはいえない（c誤とみなす）。","onotes":{"a":"誤。延髄・脊髄α2A受容体刺激により交感神経が抑制され心拍数は減少する。","b":"正。呼吸抑制が少なく、呼吸数はほとんど変化しない（教科書の記載どおり）。","c":"誤と判断。日本では2018年に小児の集中治療鎮静（人工呼吸中・離脱後）の用法用量が追加承認済み。ただし非挿管処置時鎮静では小児の安全性未確立であり、限定的には真となり得る肢。","d":"誤。主にα2受容体に作用する（α1ではない）。","e":"正。ICU鎮静試験でベンゾジアゼピンよりせん妄発現が少なく、教科書もBZ・プロポフォールをせん妄リスク因子としDEX使用を推奨。"},"evidence":[{"s":"教科書4章 静脈内鎮静法","p":"書籍p.182"},{"s":"教科書4章 静脈内鎮静法","p":"書籍p.188"}],"note":"b・c・eいずれも根拠を持ち得る問題。教科書に直接記載があるb・eを正答とし、cは小児ICU鎮静の適応追加承認（2018年）により全面的には成立しないと判断した。"},{"n":23,"stem":"フルマゼニルについて正しいのはどれか.2 つ選べ.","options":{"a":"血圧を上昇させることがある.","b":"ミダゾラムよりもクリアランスが小さい.","c":"作用発現のピークは投与後約 10 分である.","d":"原因不明の昏睡患者の診断に用いられる.","e":"生体内ではほぼ代謝されず尿中に排泄される."},"choose":"2","chapter":4,"topic":"静脈内鎮静法の薬物","answer":["a","d"],"status":"確定","explanation":"フルマゼニルは急激な覚醒に伴い血圧上昇・頭痛・興奮・嘔気を生じることがあり（a正）、ベンゾジアゼピン中毒の治療や原因不明の昏睡患者の診断に用いられる（d正）。ミダゾラム等と比較して排泄半減期は短くクリアランスは「大きい」ため再鎮静が起こる（b誤）。作用発現は速く効果のピークは投与後1〜3分（c誤）。大部分がエチルエステルの加水分解で不活性カルボン酸体に代謝され、約40%がグルクロン酸抱合を受けて尿中排泄されるため「ほぼ代謝されず」は誤り（e誤）。","onotes":{"a":"正。急激な覚醒に伴う血圧上昇・頭痛・興奮・嘔気が生じ得る。","b":"誤。ミダゾラムより排泄半減期が短くクリアランスは大きい（再鎮静の原因）。","c":"誤。作用発現は速く、1〜3分で効果がピークとなる。","d":"正。BZ中毒の治療、原因不明の昏睡患者の診断に用いられる。","e":"誤。大部分がエステル加水分解により不活性カルボン酸体へ代謝されてから尿中排泄される。"},"evidence":[{"s":"教科書4章 静脈内鎮静法（フルマゼニル）","p":"書籍p.183-184"},{"s":"教科書4章 静脈内鎮静法（フルマゼニル）","p":"書籍p.183"},{"s":"教科書4章 静脈内鎮静法","p":"書籍p.184"}],"note":""},{"n":24,"stem":"BIS 値に影響を与えない薬物はどれか.2 つ選べ.","options":{"a":"ケタミン","b":"セボフルラン","c":"亜酸化窒素","d":"イソフルラン","e":"チオペンタール"},"choose":"2","chapter":2,"topic":"脳波モニタリング","answer":["a","c"],"status":"確定","explanation":"BIS値はGABA作動性の鎮静・麻酔薬（プロポフォール、ミダゾラム、チオペンタール、イソフルラン、セボフルラン）で用量依存的に低下する。一方、教科書はBIS値が不変となる薬物としてケタミン、少量のオピオイド、亜酸化窒素、キセノン、NSAIDsを挙げている。したがってBIS値に影響を与えないのはケタミン（a）と亜酸化窒素（c）。セボフルラン・イソフルラン・チオペンタールはいずれもBIS値を低下させる。","onotes":{"a":"正。ケタミンはBIS値不変（脳波が特殊でBISは麻酔深度を反映しない）。","b":"誤。セボフルランはBIS値を低下させる。","c":"正。亜酸化窒素はBIS値不変。","d":"誤。イソフルランはBIS値を低下させる。","e":"誤。チオペンタールはBIS値を低下させる。"},"evidence":[{"s":"教科書2章 モニタリング（BISモニタ）","p":"書籍p.104"},{"s":"教科書2章 モニタリング(BIS)","p":"書籍p.104"}],"note":""},{"n":25,"stem":"プロポフォールについて正しいのはどれか.1 つ選べ．","options":{"a":"血管は収縮する.","b":"頭蓋内圧を上昇させる.","c":"GABAA 受容体のαサブユニットに結合する.","d":"8 時間投与後の context sensitive half‒time は約90 分とされる．","e":"グルクロン酸抱合あるいは硫酸抱合により分解され，尿中に排泄される．"},"choose":"1","chapter":5,"topic":"静脈麻酔薬","answer":["e"],"status":"確定","explanation":"プロポフォールは肝でグルクロン酸抱合あるいは硫酸抱合により分解され、代謝物として排泄される（添付文書上は主として尿中排泄）のでeが正しい。血圧低下の主機序は血管拡張であり血管は収縮しない（a誤）。頭蓋内圧は低下させる（b誤）。作用機序はGABAA受容体のβサブユニットへの結合であり、αサブユニットではない（c誤）。8時間投与後のcontext-sensitive half-timeは40分未満とされ約90分は誤り（d誤）。","onotes":{"a":"誤。血管拡張により血圧が低下する（前負荷・後負荷の減少）。","b":"誤。頭蓋内圧は低下させる。","c":"誤。GABAA受容体のβサブユニットに結合する（αはBZの結合に関与）。","d":"誤。8時間投与後のCSHTは40分未満。","e":"正。グルクロン酸抱合・硫酸抱合で分解され代謝物として尿中排泄（添付文書）。"},"evidence":[{"s":"教科書5章 静脈麻酔（プロポフォール）","p":"書籍p.236"},{"s":"教科書5章 静脈麻酔（プロポフォール）","p":"書籍p.237"},{"s":"教科書5章 静脈麻酔","p":"書籍p.236"}],"note":"教科書5章は代謝物の排泄先を『胆汁中』と記載するが、添付文書・標準的薬理学では主として尿中排泄とされる。a〜dが教科書記載で明確に否定されるため、正答はe。"},{"n":26,"stem":"抑制性シナプスで放出される神経伝達物質はどれか．2 つ選べ","options":{"a":"グリシン","b":"グルタミン酸","c":"サブスタンス P","d":"γ‒アミノ酪酸","e":"カルシトニン遺伝子関連ペプチド"},"choose":"2","chapter":2,"topic":"神経生理","answer":["a","d"],"status":"確定","explanation":"抑制性シナプスで放出される神経伝達物質はγ-アミノ酪酸（GABA）とグリシンであり、シナプス後膜のCl-チャネルを開口して過分極（IPSP）を起こす。グルタミン酸は代表的な興奮性伝達物質（b誤）。サブスタンスPとカルシトニン遺伝子関連ペプチド（CGRP）は一次侵害受容ニューロンから放出される興奮性の神経ペプチドで痛覚伝達に関与する（c・e誤）。2020年問68と同一趣旨の再出題である。","onotes":{"a":"正。グリシンは脊髄・脳幹の主要な抑制性伝達物質。","b":"誤。グルタミン酸は興奮性伝達物質。","c":"誤。サブスタンスPは侵害受容伝達に関与する興奮性ペプチド。","d":"正。GABAは中枢の代表的抑制性伝達物質。","e":"誤。CGRPは侵害受容・神経原性炎症に関与する興奮性ペプチド。"},"evidence":[{"s":"教科書2章 神経生理","p":"書籍p.21"},{"s":"教科書2章 神経系の生理(図2-I-7)","p":"書籍p.21"}],"note":""},{"n":27,"stem":"オピオイドの副作用で最も頻度が高いのはどれか. 1 つ選べ．","options":{"a":"便秘","b":"口渇","c":"眠気","d":"胃腸障害","e":"悪心嘔吐"},"choose":"1","chapter":12,"topic":"オピオイド","answer":["a"],"status":"確定","explanation":"教科書はオピオイドの代表的副作用として便秘・悪心嘔吐・眠気を挙げ、そのうち「便秘は最も頻度の高い副作用で、ほとんどすべての患者に発現する」と明記している。便秘を発現する血漿中濃度は鎮痛濃度より低く、耐性も生じないため、オピオイド投与中は下剤等の便秘対策が必須となる。悪心嘔吐や眠気も高頻度だが数日〜1週間程度で耐性が生じる点で便秘と異なる。よって最も頻度が高いのは便秘（a）。","onotes":{"a":"正。ほとんどすべての患者に発現し耐性が生じない最頻の副作用。","b":"誤。口渇は生じ得るが最頻ではない。","c":"誤。眠気は代表的副作用だが便秘より頻度は低く耐性が生じる。","d":"誤。胃腸障害（悪心等含む広義）でも便秘の頻度に及ばない。","e":"誤。悪心嘔吐は約30%に生じるが耐性が生じ、便秘より頻度が低い。"},"evidence":[{"s":"教科書12章 緩和医療（オピオイドの副作用）","p":"書籍p.500"},{"s":"教科書12章 緩和医療(オピオイドの副作用)","p":"書籍p.499"}],"note":""},{"n":28,"stem":"α受容体に作用するものはどれか.2 つ選べ.","options":{"a":"ケタミン","b":"ミダゾラム","c":"レミマゾラム","d":"ドロペリドール","e":"デクスメデトミジン"},"choose":"2","chapter":5,"topic":"麻酔薬と受容体","answer":["d","e"],"status":"確定","explanation":"デクスメデトミジンはα2アドレナリン受容体作動薬である（e正）。ドロペリドールはブチロフェノン系薬であり、ドパミンD2受容体遮断作用に加えてα遮断作用を有する（アドレナリン反転の原因薬物としても教科書に記載）（d正）。ケタミンはNMDA受容体の非競合的拮抗薬（a誤）、ミダゾラムとレミマゾラムはいずれもGABAA受容体のベンゾジアゼピン結合部位に作用する（b・c誤）。したがってα受容体に作用するのはdとe。","onotes":{"a":"誤。NMDA受容体非競合的拮抗薬。","b":"誤。GABAA受容体のBZ結合部位に作用。","c":"誤。GABAA受容体のBZ結合部位に作用。","d":"正。ブチロフェノン系でα遮断作用を有する（D2遮断に加えて）。","e":"正。α2受容体作動薬（α1に対し1,600倍の選択性）。"},"evidence":[{"s":"教科書3章 局所麻酔（薬物相互作用）","p":"書籍p.137"},{"s":"教科書4章 静脈内鎮静法","p":"書籍p.182"}],"note":""},{"n":29,"stem":"非特異的エステラーゼによって加水分解される薬剤はどれか．1 つ選べ．","options":{"a":"フェンタニル","b":"レミマゾラム","c":"スガマデクス","d":"プロポフォール","e":"レミフェンタニル"},"choose":"1","chapter":5,"topic":"静脈麻酔薬","answer":["e"],"status":"確定","explanation":"レミフェンタニルは血中・組織の非特異的エステラーゼにより加水分解されるため臓器機能に依存せず速やかに消失し、4時間投与後のCSHTは約4分と短い（e正）。レミマゾラムは肝臓のカルボキシルエステラーゼ（CES1）で加水分解されるもので「非特異的エステラーゼ」ではない（本年問17でも肝カルボキシエステラーゼと出題）（b誤）。フェンタニルはCYP3A4で代謝（a誤）、スガマデクスはほぼ代謝されず腎排泄（c誤）、プロポフォールはグルクロン酸・硫酸抱合で代謝される（d誤）。","onotes":{"a":"誤。フェンタニルは肝CYP3A4によりノルフェンタニルへ代謝。","b":"誤。レミマゾラムは肝カルボキシルエステラーゼ（CES1）による加水分解。","c":"誤。スガマデクスはほとんど代謝されず未変化体として腎排泄。","d":"誤。プロポフォールはグルクロン酸抱合・硫酸抱合による代謝。","e":"正。血中・組織の非特異的エステラーゼで加水分解される。"},"evidence":[{"s":"教科書5章 静脈麻酔（レミフェンタニル）","p":"書籍p.239"},{"s":"教科書5章 静脈麻酔(麻薬性鎮痛薬)","p":"書籍p.239"}],"note":""},{"n":30,"stem":"静脈内に投与される下記の薬剤のなかで,最も pHが高いのはどれか．1 つ選べ．","options":{"a":"ケタミン","b":"ミダゾラム","c":"ジアゼパム","d":"プロポフォール","e":"チオペンタール"},"choose":"1","chapter":5,"topic":"静脈麻酔薬","answer":["e"],"status":"確定","explanation":"チオペンタールは水に溶けない粉末を炭酸ナトリウム溶液で溶解したpH約10.5の強アルカリ性溶液であり、5薬剤中最もpHが高い（e正）。血管外漏出による組織障害や、酸性薬剤と混合すると沈殿を形成する点に注意が必要である。ミダゾラム（pH2.8〜3.8）とケタミン（pH3.5〜5.5）は酸性、ジアゼパムはpH6.2〜6.9、プロポフォールはpH7.0でいずれもチオペンタールより低い。","onotes":{"a":"誤。ケタミン注のpHは3.5〜5.5程度の酸性。","b":"誤。ミダゾラム注のpHは2.8〜3.8の酸性。","c":"誤。ジアゼパム注のpHは約6.2〜6.9でほぼ中性。","d":"誤。プロポフォールのpHは7.0でほぼ中性。","e":"正。pH約10.5の強アルカリ性（炭酸ナトリウムで溶解）。"},"evidence":[{"s":"教科書5章 静脈麻酔（チオペンタール）","p":"書籍p.238"},{"s":"教科書5章 静脈麻酔（プロポフォール）","p":"書籍p.236"},{"s":"教科書4章 静脈内鎮静法（ミダゾラム）","p":"書籍p.174"}],"note":""},{"n":31,"stem":"麻薬の取り扱いに関して適切なのはどれか.1 つ選べ．","options":{"a":"麻薬は向精神薬などと一緒に堅固な保管庫で施錠管理する．","b":"使用後の麻薬アンプルは,医師の承認を得た後医療廃棄物として廃棄する．","c":"溶解した麻薬を使用しなかった場合,そのまま保存して次回使用することができる．
