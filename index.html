","d":"使用残量がある場合は残量の記載とともに残量を保健所へ返納しなければならない．","e":"破損した麻薬アンプルは,麻薬管理者がすみやかに麻薬事故届により都道府県知事に届け出る．"},"choose":"1","chapter":1,"topic":"麻薬管理","answer":["e"],"status":"確定","explanation":"麻薬及び向精神薬取締法第35条により、麻薬に滅失・盗取・破損・流失等の事故が生じた場合、麻薬管理者（不在の施設では麻薬施用者）は速やかに麻薬事故届を都道府県知事に提出する義務があり、eが正しい。aは麻薬以外の医薬品（覚せい剤を除く）と区別して鍵をかけた堅固な設備内に保管する規定のため、向精神薬との同一保管は不可。bの施用残（残液）は麻薬管理者に返納し施設内で職員立会いのもと廃棄して帳簿に記載するもので、医師の承認による医療廃棄物廃棄は誤り。cの溶解済み麻薬の保存・再使用は認められない。dの保健所への返納義務は存在しない。","onotes":{"a":"誤。麻薬は向精神薬など他の医薬品（覚醒剤を除く）と区別して麻薬専用の堅固な施錠設備で保管する.","b":"誤。施用残液は麻薬管理者へ返納し、他職員立会いの下で廃棄・帳簿記載。医師の承認で廃棄する規定はない.","c":"誤。溶解した麻薬の保存・再使用は不可。残液は麻薬管理者へ返納し廃棄する.","d":"誤。使用残量は院内の麻薬管理者へ返納する。保健所へ返納する規定はない.","e":"正。麻薬事故届は麻薬管理者がすみやかに都道府県知事へ提出する（法35条）."},"evidence":[{"s":"麻薬及び向精神薬取締法 第35条（事故届）※ローカル資料に該当記載なし・法規知識","p":"-"},{"s":"麻薬及び向精神薬取締法第35条（法令知識・教科書/ガイドラインに該当記載なし）","p":"-"}],"note":"教科書には麻薬取締法の取扱い詳細の記載が見当たらず、法規知識に基づく解答（confidence medium）。"},{"n":32,"stem":"深い筋弛緩状態を判定するのに有用なのはどれか. 1 つ選べ．","options":{"a":"テタヌス刺激","b":"ダブル・バースト刺激","c":"シングル・ツイッチ刺激","d":"トレイン・オブ・フォー刺激","e":"ポスト・テタニック・カウント"},"choose":"1","chapter":2,"topic":"筋弛緩モニタリング","answer":["e"],"status":"確定","explanation":"ポスト・テタニック・カウント（PTC）は50Hzテタヌス刺激を5秒間与えた3秒後から1Hz単収縮刺激を行い、反応数で筋弛緩レベルを評価する方法である。テタヌス刺激後の増強効果（post-tetanic facilitation）により、TOF刺激に反応がみられない深い筋弛緩状態でも反応が得られるため、深い遮断の判定に有用であり、eが正しい。スガマデクスの用量設定でも深い筋弛緩は「TOF反応なし・PTCあり」と定義される。TOF・シングルツイッチ・テタヌス刺激は深い遮断では反応が消失し判定不能で、DBSは残存筋弛緩の視触診的検出に用いる（a〜d誤）。","onotes":{"a":"誤。テタヌス刺激単独は疲労減衰の検出などに用い、深い遮断では反応が消失する.","b":"誤。DBSは覚醒期の残存筋弛緩（浅い遮断）の視触診的検出に有用.","c":"誤。シングルツイッチは対照値が必要で、深い遮断では反応が消失し評価不能.","d":"誤。TOFは中等度〜浅い遮断の評価法。深い遮断ではTOF反応自体が消失する.","e":"正。TOF反応消失後の深い筋弛緩レベルはPTCの反応数で推定できる."},"evidence":[{"s":"教科書2章 モニタリング（筋弛緩）","p":"書籍p.107（PDF p.120）"},{"s":"教科書5章 筋弛緩薬（スガマデクス投与量）","p":"書籍p.250（PDF p.263）"},{"s":"教科書2章 モニタリング（筋弛緩）","p":"書籍p.107"}],"note":""},{"n":33,"stem":"体重 50 kg の成人にロクロニウム 45 mg を静脈投与した際の作用発現時間はどれか．1 つ選べ．","options":{"a":"20 秒","b":"40 秒","c":"80 秒","d":"120 秒","e":"180 秒"},"choose":"1","chapter":5,"topic":"筋弛緩薬","answer":["c"],"status":"確定","explanation":"体重50kgにロクロニウム45mgは0.9mg/kgに相当する。教科書には「0.6mg/kgを静注すると85秒で気管挿管が可能となる。0.9mg/kgの投与では作用発現時間は77秒とさらに速くなる。1.2mg/kgの静注では約1分で気管挿管可能」と記載されており、0.9mg/kgの作用発現時間77秒に最も近いc（80秒）が正解。20秒・40秒は静脈麻酔薬の効果発現に近く速すぎ（a・b誤）、120秒・180秒は0.6mg/kg未満の少量投与時ないしそれ以上に遅い値であり不適（d・e誤）。","onotes":{"a":"誤。20秒では速すぎる。筋弛緩薬の発現としてあり得ない.","b":"誤。40秒は1.2mg/kg（約60秒）よりさらに速く、0.9mg/kgでは達しない.","c":"正。0.9mg/kgの作用発現時間は77秒（教科書）で80秒が最も近い.","d":"誤。120秒は0.6mg/kg（85秒）より遅く、0.9mg/kg増量時の値として不適.","e":"誤。180秒は明らかに遅すぎる."},"evidence":[{"s":"教科書5章 筋弛緩薬（ロクロニウム）","p":"書籍p.248（PDF p.261）"},{"s":"教科書5章 筋弛緩薬（ロクロニウム）","p":"書籍p.248"}],"note":""},{"n":34,"stem":"スガマデクスナトリウム投与後に注意すべき副作用はどれか．1 つ選べ．","options":{"a":"高度徐脈","b":"眼圧上昇","c":"悪性症候群","d":"横紋筋融解症","e":"高カリウム血症"},"choose":"1","chapter":5,"topic":"筋弛緩薬","answer":["a"],"status":"確定","explanation":"スガマデクスの重大な副作用として、ショック・アナフィラキシーとともに「高度徐脈（心停止に至った例も報告）」が添付文書で警告されており、投与後は心電図・循環動態の観察が必要でaが正解。教科書にも「まれにアナフィラキシー反応を生じるとの報告がある」と記載される。眼圧上昇（b）と高カリウム血症（e）はスキサメトニウムの副作用、悪性症候群（c）は抗精神病薬（ドロペリドール等）、横紋筋融解症（d）はプロポフォール注入症候群や悪性高熱症で問題となるもので、いずれもスガマデクスとは関連しない。","onotes":{"a":"正。心停止に至るおそれのある高度徐脈が重大な副作用として知られ、投与後の心拍数監視が必要.","b":"誤。眼圧上昇はスキサメトニウムや抗コリン薬で問題となる.","c":"誤。悪性症候群は抗精神病薬などドパミン遮断薬の副作用.","d":"誤。横紋筋融解症はプロポフォール注入症候群（PRIS）等の症状.","e":"誤。高カリウム血症はスキサメトニウムの副作用."},"evidence":[{"s":"スガマデクス（ブリディオン）添付文書 重大な副作用 ※ローカル資料に該当記載なし","p":"-"},{"s":"スガマデクス添付文書（重大な副作用）＋教科書5章","p":"書籍p.250"}],"note":"教科書のスガマデクスの項はアナフィラキシーの記載のみで高度徐脈の記載はローカル資料で確認できず、添付文書知識＋消去法による（confidence medium）。"},{"n":35,"stem":"治療が必要な徐脈はどれか.2 つ選べ.","options":{"a":"呼吸性変動","b":"症候性徐脈","c":"PQ 間隔が 0.12 秒","d":"心拍数が 50 回/分未満","e":"Mobiz 2 型房室ブロック"},"choose":"2","chapter":2,"topic":"不整脈","answer":["b","e"],"status":"確定","explanation":"不整脈ガイドラインは「無症候性の徐脈に治療適応はない。有症候性ではペースメーカの植込みが第1選択」とし、症候性徐脈が治療対象である（b正）。第2度房室ブロックのうちウェンケバッハ型（Mobitz I型）は無症候なら治療不要と例示される一方、Mobitz II型はヒス束以下の障害で完全房室ブロックへ移行する危険が高く、症状の有無によらずペースメーカ適応となる（e正）。呼吸性変動（呼吸性洞性不整脈）は生理的現象（a誤）、PQ間隔0.12秒は正常範囲（0.12〜0.20秒）（c誤）、心拍数50/分未満のみでは無症候であれば治療適応はない（d誤）。","onotes":{"a":"誤。呼吸性洞性不整脈は生理的で治療不要.","b":"正。有症候性徐脈は治療対象で、ペースメーカ植込みが第1選択.","c":"誤。PQ間隔0.12秒は正常範囲内（0.12〜0.20秒）.","d":"誤。徐脈でも無症候性なら治療適応はない.","e":"正。Mobitz II型は完全房室ブロック移行リスクが高くペーシング適応."},"evidence":[{"s":"不整脈ガイドライン（徐脈性不整脈・治療の基本的な考え方）","p":"ガイドラインp.24"},{"s":"不整脈ガイドライン（同）","p":"ガイドラインp.24"},{"s":"2020年改訂版不整脈薬物治療ガイドライン（徐脈性不整脈）","p":"p.24"}],"note":""},{"n":36,"stem":"片側の気管支挿管となった場合にみられる状態として適切なのはどれか．1 つ選べ．","options":{"a":"死腔の増加","b":"シャントの増加","c":"拡散障害の発生","d":"酸素解離曲線の左方移動","e":"低酸素性肺血管収縮の抑制"},"choose":"1","chapter":5,"topic":"気管挿管の合併症","answer":["b"],"status":"確定","explanation":"片肺挿管では換気されない側の肺に肺血流が持続するため、換気血流比が0となり肺内シャントが増加して低酸素血症を来す。教科書もシャント増大が低酸素血症の原因となることを明記している。死腔は「換気があるのに血流がない部分」であり片肺挿管では増加しない（a誤）。肺胞膜の拡散障害は生じない（c誤）。酸素解離曲線の移動はpH・体温・PaCO2・2,3-DPGによるもので無関係（d誤）。低酸素性肺血管収縮（HPV）はむしろ非換気肺で誘発されシャントを軽減する方向に働くため「抑制」は誤り（e誤）。","onotes":{"a":"誤。死腔は換気があり血流がない領域。片肺挿管の病態はその逆.","b":"正。非換気側の肺血流がシャントとなり低酸素血症を生じる.","c":"誤。肺胞膜の障害はなく拡散障害は生じない.","d":"誤。酸素解離曲線の位置とは無関係.","e":"誤。HPVはむしろ非換気肺で作動しシャントを軽減する方向に働く."},"evidence":[{"s":"教科書2章 呼吸生理（シャント）","p":"書籍p.30-31（PDF p.43）"},{"s":"教科書2章 呼吸生理（シャント）","p":"書籍p.30-31"},{"s":"教科書5章 気管挿管の合併症","p":"書籍p.269"}],"note":""},{"n":37,"stem":"ROSC 後の EtCO2 の適切な維持値はどれか.1 つ選べ．","options":{"a":"25~35 mmHg","b":"35~45 mmHg","c":"45~55 mmHg","d":"55~75 mmHg","e":"95~100 mmHg"},"choose":"1","chapter":15,"topic":"心拍再開後ケア","answer":["b"],"status":"確定","explanation":"ROSC（自己心拍再開）後の呼吸管理では、低酸素血症とともに低・高二酸化炭素血症をいずれも避け、正常炭酸ガス（normocapnia、EtCO2/PaCO2 35〜45mmHg）を維持することが蘇生ガイドラインで推奨され、bが正解。過換気（a）は脳血管収縮による脳血流低下や胸腔内圧上昇による静脈還流・心拍出量低下を招き、脳の二次障害を悪化させる。高二酸化炭素血症（c、d）は脳血管拡張により頭蓋内圧を上昇させるため避ける。eは生理的にあり得ない値である。教科書もEtCO2の正常値を35〜45mmHgと明記している。","onotes":{"a":"誤。過換気による低CO2は脳血管収縮・脳血流低下を招き避けるべき.","b":"正。正常二酸化炭素分圧（35〜45mmHg）の維持が推奨される.","c":"誤。高CO2血症は脳血管拡張・頭蓋内圧上昇の点で有害.","d":"誤。著明な高CO2血症であり不適.","e":"誤。生理的にあり得ない高値."},"evidence":[{"s":"教科書2章 モニタリング（カプノグラフ）","p":"書籍p.92（PDF p.105）"},{"s":"JRC蘇生ガイドライン2020（ROSC後の管理）※知識ベース","p":"-"},{"s":"教科書2章 モニタリング（カプノグラフ）","p":"書籍p.91"}],"note":"ROSC後管理の数値目標自体は教科書に記載がなく（成書参照と記載）、EtCO2正常値の教科書記載とJRCガイドライン知識から導出（confidence medium）。"},{"n":38,"stem":"以下の呼吸器合併症のうち,チェックバルブ機構により重篤な状況に陥る可能性のあるものはどれか．1 つ選べ．","options":{"a":"気胸","b":"肺水腫","c":"舌根沈下","d":"喉頭けいれん","e":"気管支けいれん"},"choose":"1","chapter":5,"topic":"術中呼吸器合併症","answer":["a"],"status":"確定","explanation":"気胸では空気の漏出部位にチェックバルブ（一方向弁）機構が働くと、吸気のたびに胸腔内へ空気が流入する一方で排出されず、胸腔内圧が極端に上昇して緊張性気胸へ進展する（教科書）。縦隔偏位・静脈還流障害から閉塞性ショック・心停止に至る重篤な状態となるため、緊急脱気・胸腔ドレーン挿入が必要であり、aが正しい。肺水腫は毛細血管から肺胞への水分漏出（b誤）、舌根沈下は上気道閉塞（c誤）、喉頭けいれんは声門閉鎖（d誤）、気管支けいれんは下気道の攣縮性狭窄（e誤）であり、いずれもチェックバルブ機構は関与しない。","onotes":{"a":"正。破綻部が一方向弁となり緊張性気胸へ進展し重篤化しうる.","b":"誤。肺水腫は水分漏出による病態でチェックバルブ機構はない.","c":"誤。舌根沈下は上気道の閉塞でありチェックバルブ機構はない.","d":"誤。喉頭けいれんは声門閉鎖による閉塞.","e":"誤。気管支けいれんは気道平滑筋攣縮による狭窄."},"evidence":[{"s":"教科書5章 術中管理（呼吸系合併症・気胸）","p":"書籍p.283（PDF p.296）"},{"s":"教科書5章 術中合併症（気胸）","p":"書籍p.283"}],"note":""},{"n":39,"stem":"無気肺について適切なのはどれか.1 つ選べ.","options":{"a":"喫煙で増加する.","b":"BMI とは関係しない.","c":"シャント率が増加する.","d":"年齢とともに増加する.","e":"全身麻酔では発生しない."},"choose":"1","chapter":5,"topic":"無気肺","answer":["c"],"status":"確定","explanation":"教科書に「無気肺はシャントや換気血流比不均等を生じ、肺における酸素化障害の原因となる」と明記されておりcが正解。無気肺では換気のない肺胞を血流が素通りするためシャント率（Qs/Qt）が増加し低酸素血症を来す。同じ項に「全身麻酔により約90%の患者に無気肺が発生する」（e誤）、「無気肺の形成は年齢や喫煙歴には関係がなく、BMIが高いほど多くなる」とあり、a（喫煙で増加）・d（年齢とともに増加）は誤り、b（BMIと関係しない）も誤りである。最も無気肺ができやすいのは背側肺の横隔膜に接する部位で、麻酔導入開始5分以内に形成される。","onotes":{"a":"誤。無気肺の形成は喫煙歴には関係がないと教科書に明記.","b":"誤。BMIが高いほど無気肺は多くなる.","c":"正。無気肺はシャントを生じ低酸素血症の原因となる.","d":"誤。無気肺の形成は年齢には関係がない.","e":"誤。全身麻酔で約90%の患者に発生する."},"evidence":[{"s":"教科書2章 呼吸生理（無気肺）","p":"書籍p.32（PDF p.45）"},{"s":"教科書2章 呼吸生理（麻酔中の無気肺）","p":"書籍p.32"}],"note":""},{"n":40,"stem":"全身麻酔中のカプノグラムにおいて平坦な第II相がなくなる状態はどれか．1 つ選べ．","options":{"a":"肺塞栓症","b":"自発呼吸の出現","c":"気管支けいれん","d":"二酸化炭素の再呼吸","e":"サンプリングチューブのリーク"},"choose":"1","chapter":2,"topic":"カプノグラフィ","answer":["c"],"status":"確定","explanation":"気管支けいれんなどの下気道閉塞では呼出が遅延・不均一となり、カプノグラムの上行脚が延長して緩やかな右上がりのまま呼気が終わるため、平坦な肺胞プラトーが消失した「サメのひれ（shark fin）状」波形となる。教科書図2-Ⅳ-4にも「気管支けいれん：第Ⅱ相の延長」と記載され、平坦相が失われるのは気管支けいれんのみでcが正解。肺塞栓症（a）は波形の形は保たれたままプラトーの高さが急に低下、自発呼吸の出現（b）はプラトー相にノッチ（cleft）、再呼吸（d）は基線の上昇、サンプリングチューブのリーク（e）は波形全体の低小化であり、いずれも平坦相自体は残る。","onotes":{"a":"誤。肺塞栓症は肺血流減少によりプラトーを保ったままピーク値が突然低下する.","b":"誤。調節呼吸中の自発呼吸出現はプラトー相にノッチ（クレフト）を生じる.","c":"正。呼気閉塞で上行脚が延長しプラトー（平坦相）が消失するシャークフィン波形となる.","d":"誤。再呼吸では基線が上昇する（第I相が0に戻らない）.","e":"誤。リークでは波形全体の低下・歪みを生じるが、平坦相消失が特徴ではない."},"evidence":[{"s":"教科書2章 モニタリング（カプノグラム・図2-Ⅳ-4病的波形）","p":"書籍p.92-93（PDF p.105-106）"},{"s":"教科書2章 モニタリング（カプノグラムの病的波形 図2-Ⅳ-4）","p":"書籍p.92"}],"note":"教科書（第Ⅰ相:死腔、第Ⅱ相:上行脚、第Ⅲ相:プラトー、第Ⅳ相:下行脚）およびJSA気道管理ガイドラインの分類ではプラトーは第Ⅲ相であり、設問の「平坦な第Ⅱ相」はプラトーを第Ⅱ相と数える別分類に基づく表記と考えられる。いずれの分類でも「平坦相（肺胞プラトー）が消失する病態＝気管支けいれん」で解答は一意に定まる。"},{"n":41,"stem":"ベンゾジアゼピン系薬剤の禁忌症はどれか.2 つ選べ．","options":{"a":"重症筋無力症","b":"正常眼圧緑内障","c":"急性狭隅角緑内障","d":"筋萎縮性側索硬化症","e":"筋ジストロフィー症"},"choose":"2","chapter":4,"topic":"静脈内鎮静法の薬物","answer":["a","c"],"status":"確定","explanation":"教科書はベンゾジアゼピンの使用上の注意として、①弱い抗コリン作用による眼圧上昇の危険から急性狭隅角緑内障患者への使用は禁忌、②筋弛緩作用（脊髄多シナプス反射の阻害等）により重症筋無力症を悪化させるため禁忌、と明記する。添付文書上の禁忌もこの2つ。正常眼圧緑内障は禁忌でなく、ALSや筋ジストロフィーは慎重投与の対象ではあるが禁忌症としては挙げられていない。","onotes":{"a":"正。筋弛緩作用により重症筋無力症を悪化させるため禁忌（教科書p.177）","b":"誤。禁忌は急性狭隅角緑内障であり、正常眼圧緑内障は禁忌でない","c":"正。抗コリン作用による眼圧上昇の危険があり禁忌（教科書p.177）","d":"誤。ALSは添付文書・教科書の禁忌症に挙げられていない","e":"誤。筋ジストロフィーは禁忌症に挙げられていない"},"evidence":[{"s":"教科書4章 精神鎮静法（静脈内鎮静法）","p":"書籍p.177"},{"s":"教科書4章 精神鎮静法（静脈内鎮静法・ベンゾジアゼピンの使用上の注意）","p":"書籍p.177"},{"s":"教科書索引","p":"書籍p.177"}],"note":""},{"n":42,"stem":"Ramsay スコアにおける,「入眠しているが，眉間への軽い叩打または大きい聴覚刺激に反応して素早く反応する」状態はどれか．1 つ選べ．","options":{"a":"1","b":"2","c":"3","d":"4","e":"5"},"choose":"1","chapter":4,"topic":"鎮静度評価","answer":["d"],"status":"確定","explanation":"Ramsay鎮静スコアは、1＝不安・不穏、2＝協力的・静穏・見当識あり、3＝言葉による指示に反応、4＝入眠しているが眉間への軽い叩打または大きい聴覚刺激に素早く反応、5＝同刺激に緩慢に反応、6＝反応なし、である（教科書表4-Ⅲ-3）。設問の状態はスコア4に該当するため d が正解。5との違いは反応が「素早い」か「緩慢」かである。","onotes":{"a":"誤。1は不安そうでイライラ・落ち着きがない状態","b":"誤。2は協力的・静穏・見当識がある状態","c":"誤。3は言葉による指示に反応する状態","d":"正。4が「入眠しているが軽い叩打・大聴覚刺激に素早く反応」","e":"誤。5は同じ刺激に緩慢に反応する状態"},"evidence":[{"s":"教科書4章 精神鎮静法 表4-Ⅲ-3 Ramsay鎮静スコア","p":"書籍p.185-186"}],"note":""},{"n":43,"stem":"亜酸化窒素吸入鎮静法において過度の鎮静状態と判断すべき状態はどれか．2 つ選べ．","options":{"a":"閉口傾向","b":"指示に従う","c":"閉眼(眠る)","d":"瞬きの減少","e":"体動減少,緩慢"},"choose":"2","chapter":4,"topic":"吸入鎮静法","answer":["a","c"],"status":"確定","explanation":"表4-Ⅱ-1では、至適鎮静状態（通常20〜30%）の他覚的徴候は「瞬きの減少・指示に従う・自力で開口可能・体動減少，緩慢・防御反射正常」、過度の鎮静状態（通常40〜50%以上）の徴候は「眼球の変位・険しい表情・閉眼（眠る）・指示に一時的に従うか全く従わない・閉口傾向・防御反射低下・不規則な呼吸」とされる。よって過度の鎮静と判断すべきは a 閉口傾向と c 閉眼であり、b・d・e はいずれも至適鎮静の徴候である。","onotes":{"a":"正。閉口傾向は過度の鎮静状態の他覚的徴候","b":"誤。指示に従うのは至適鎮静状態の徴候","c":"正。閉眼(眠る)は過度の鎮静状態の他覚的徴候","d":"誤。瞬きの減少は至適鎮静状態の徴候","e":"誤。体動減少・緩慢は至適鎮静状態の徴候"},"evidence":[{"s":"教科書4章 精神鎮静法 表4-Ⅱ-1（亜酸化窒素吸入鎮静法の鎮静レベル）","p":"書籍p.170"},{"s":"教科書4章 精神鎮静法（表4-Ⅱ-1 亜酸化窒素吸入鎮静法における鎮静レベルと徴候）","p":"書籍p.170"}],"note":""},{"n":44,"stem":"静脈内鎮静法に用いる薬剤の代謝産物のなかで,明らかに臨床的効果があるのはどれか．2 つ選べ．","options":{"a":"ミダゾラム","b":"ジアゼパム","c":"フルマゼニル","d":"プロポフォール","e":"デクスメデトミジン"},"choose":"2","chapter":4,"topic":"静脈内鎮静法の薬物","answer":["a","b"],"status":"確定","explanation":"ミダゾラムの主代謝物α-ヒドロキシミダゾラム（1-ヒドロキシミダゾラム）は親薬物の20〜30%の臨床的効力をもち、ジアゼパムの代謝物デスメチルジアゼパムとオキサゼパムはいずれも薬理学的活性があり半減期も長く作用遷延の原因となる。一方、プロポフォールはグルクロン酸・硫酸抱合体で「代謝産物には活性がない」、デクスメデトミジンの代謝産物もα2刺激作用がないかごく弱く臨床的に問題とならない。フルマゼニルも加水分解で不活性のカルボン酸体となる。よってa・bが正解。","onotes":{"a":"正。α-ヒドロキシミダゾラムが20〜30%の臨床的効力を有する","b":"正。デスメチルジアゼパム・オキサゼパムに薬理学的活性があり半減期も長い","c":"誤。大部分が不活性のカルボン酸体に加水分解される","d":"誤。グルクロン酸・硫酸抱合体で代謝産物に活性はない","e":"誤。代謝産物のα2作用はないかごく弱く臨床的に問題とならない"},"evidence":[{"s":"教科書4章 精神鎮静法（静脈内鎮静法の薬物）","p":"書籍p.174-175"},{"s":"教科書4章（プロポフォール・デクスメデトミジン）","p":"書籍p.181-182"},{"s":"教科書4章 精神鎮静法（ミダゾラム・ジアゼパムの薬物動態）","p":"書籍p.175"}],"note":""},{"n":45,"stem":"デクスメデトミジンの呼吸系への影響として正しいのはどれか．2 つ選べ．","options":{"a":"呼吸数は増加する.","b":"上気道閉塞は生じにくい.","c":"分時換気量は維持される.","d":"自然睡眠時の呼吸状態と似ている.","e":"二酸化炭素に対する換気応答は維持される."},"choose":"2","chapter":4,"topic":"静脈内鎮静法の薬物","answer":["b","d"],"status":"確定","explanation":"教科書は「舌根沈下などの上気道閉塞が起こりにくく、呼吸抑制は少ない。分時換気量を低下させるが、二酸化炭素に対する換気応答の抑制が軽度で、自然睡眠時にみられる変化とよく似ている。呼吸数はほとんど変化しない」と記載する。よって b（上気道閉塞は生じにくい）と d（自然睡眠時の呼吸状態と似ている）が正しい。a は呼吸数ほぼ不変のため誤り、c は分時換気量が低下するため誤り、e は換気応答も軽度ながら抑制されるため「維持される」は誤り。","onotes":{"a":"誤。呼吸数はほとんど変化しない","b":"正。舌根沈下などの上気道閉塞が起こりにくいと明記","c":"誤。分時換気量は低下させる","d":"正。自然睡眠時にみられる変化とよく似ていると明記","e":"誤。CO2換気応答は軽度ながら抑制される（維持ではない）"},"evidence":[{"s":"教科書4章 精神鎮静法（デクスメデトミジン・呼吸系への影響）","p":"書籍p.182"},{"s":"教科書4章 精神鎮静法（デクスメデトミジンの呼吸系への影響）","p":"書籍p.182"}],"note":""},{"n":46,"stem":"静脈内鎮静法に使用される以下の薬剤のうち,最も排泄半減期が短いのはどれか．1 つ選べ．","options":{"a":"ミダゾラム","b":"ジアゼパム","c":"フルマゼニル","d":"プロポフォール","e":"デクスメデトミジン"},"choose":"1","chapter":4,"topic":"静脈内鎮静法の薬物","answer":["c"],"status":"確定","explanation":"表4-Ⅲ-1の排泄半減期は、フルマゼニル0.7〜1.3時間、ミダゾラム1.7〜2.6時間、デクスメデトミジン2〜3時間、プロポフォール4〜7時間、ジアゼパム20〜50時間であり、最も短いのはフルマゼニル。本文にも「ミダゾラム、ジアゼパム、フルニトラゼパムと比較して排泄半減期が短くクリアランスが大きい。作用持続時間はいずれの薬物よりも短い」とあり、拮抗後の再鎮静に注意が必要な根拠となる。よって c が正解。","onotes":{"a":"誤。1.7〜2.6時間でフルマゼニルより長い","b":"誤。20〜50時間で最も長い","c":"正。0.7〜1.3時間で5剤中最短。再鎮静の原因となる","d":"誤。4〜7時間","e":"誤。2〜3時間"},"evidence":[{"s":"教科書4章 精神鎮静法 表4-Ⅲ-1（薬物動態パラメータ）","p":"書籍p.173"}],"note":""},{"n":47,"stem":"肺血管抵抗を上昇させる鎮静薬はどれか.1 つ選べ.","options":{"a":"亜酸化窒素","b":"ジアゼパム","c":"ミダゾラム","d":"プロポフォール","e":"デクスメデトミジン"},"choose":"1","chapter":4,"topic":"吸入鎮静法","answer":["a"],"status":"確定","explanation":"教科書は「亜酸化窒素はin vitroで冠血管に直接的な影響を及ぼさないが、肺血管抵抗を上昇させるので肺高血圧症患者への使用には注意を要する」と明記する。亜酸化窒素は肺血管平滑筋への作用と軽度の交感神経刺激作用により肺血管抵抗を上昇させる唯一の選択肢である。ベンゾジアゼピン系（ジアゼパム・ミダゾラム）やプロポフォールは体血管抵抗を低下させ、デクスメデトミジンも肺血管抵抗を上昇させる薬剤ではない。","onotes":{"a":"正。肺血管抵抗を上昇させるため肺高血圧患者で注意（教科書p.166）","b":"誤。末梢血管抵抗を低下させ、肺血管抵抗上昇の作用はない","c":"誤。末梢血管抵抗低下により血圧が軽度低下する","d":"誤。血管拡張により体血管抵抗・血圧を低下させる","e":"誤。α2B刺激で一過性血圧上昇はあるが肺血管抵抗上昇薬とはされない"},"evidence":[{"s":"教科書4章 精神鎮静法（亜酸化窒素・循環系への影響）","p":"書籍p.166"},{"s":"教科書4章 精神鎮静法（亜酸化窒素の循環系への影響）","p":"書籍p.166"}],"note":""},{"n":48,"stem":"ベンゾジアゼピン系薬剤の静脈内投与直後に,身体に及ぼす影響はどれか．2 つ選べ．","options":{"a":"眼圧の低下","b":"呼吸数の減少","c":"心拍出量の増加","d":"末梢血管抵抗の低下","e":"一過性の心拍数の増加"},"choose":"2","chapter":4,"topic":"静脈内鎮静法の薬物","answer":["d","e"],"status":"確定","explanation":"ジアゼパム・ミダゾラム・フルニトラゼパム静注後、いずれも心拍数は投与直後に一過性に上昇した後減少傾向を示し、1回拍出量・心拍出量は減少、収縮期血圧は軽度低下し、その血圧低下は主に末梢血管抵抗の減少による（図4-Ⅲ-3）。よって d・e が正解。呼吸系では筋弛緩作用による1回換気量減少のため呼吸数はむしろ増加するので b は誤り。c は心拍出量が減少するため誤り。a はベンゾジアゼピンの弱い抗コリン作用により眼圧上昇の危険があるとされる（急性狭隅角緑内障禁忌の理由）ため誤り。","onotes":{"a":"誤。弱い抗コリン作用で眼圧上昇の危険がある（緑内障禁忌の根拠）","b":"誤。1回換気量が減少し、呼吸数はむしろ増加する","c":"誤。1回拍出量・心拍出量は投与後軽度減少する","d":"正。血圧低下は主に末梢血管抵抗の減少による","e":"正。投与直後に心拍数は一過性に上昇する（図4-Ⅲ-3）"},"evidence":[{"s":"教科書4章 精神鎮静法（ベンゾジアゼピンの循環・呼吸系への影響、図4-Ⅲ-3）","p":"書籍p.176-177"},{"s":"教科書4章 精神鎮静法（ベンゾジアゼピンの循環系・呼吸系への影響、図4-Ⅲ-3）","p":"書籍p.176-177"}],"note":""},{"n":49,"stem":"日本糖尿病学会 Recommendation において手術 3 日前から休薬とされている薬剤はどれか．1 つ選べ．","options":{"a":"SGLT2 阻害薬","b":"DPP‒4 阻害薬","c":"ビグアナイド薬","d":"チアゾリジン誘導体","e":"α‒グルコシダーゼ阻害薬"},"choose":"1","chapter":6,"topic":"糖尿病患者の管理","answer":["a"],"status":"確定","explanation":"日本糖尿病学会「SGLT2阻害薬の適正使用に関するRecommendation」では、SGLT2阻害薬は正常血糖糖尿病性ケトアシドーシスや脱水の危険があるため手術3日前から休薬し、食事が十分摂取できるようになってから再開するとされる。ローカル資料のACC/AHA非心臓手術ガイドラインにも「術前3〜4日前に休薬」と明記され整合する。ビグアナイド薬は乳酸アシドーシスの観点から通常術前〜当日の休薬、DPP-4阻害薬・チアゾリジン・α-GIは手術当日の休薬でよく、3日前からの休薬指定はSGLT2阻害薬のみである。","onotes":{"a":"正。JDS Recommendationで手術3日前から休薬（ケトアシドーシス予防）","b":"誤。DPP-4阻害薬は通常手術当日の休薬でよい","c":"誤。ビグアナイドは乳酸アシドーシス予防のため休薬するが3日前ルールの対象ではない","d":"誤。チアゾリジン誘導体に3日前休薬の規定はない","e":"誤。α-GIは食事をしない手術当日に休薬すればよい"},"evidence":[{"s":"非心臓手術の心血管ガイドライン（2024 ACC/AHA周術期ガイドライン）","p":"推奨表（糖尿病治療薬）"},{"s":"非心臓手術の心血管ガイドライン（ACC/AHA 2024）","p":"推奨表"},{"s":"教科書6章 代謝・内分泌疾患（糖尿病治療薬）","p":"書籍p.358"}],"note":""},{"n":50,"stem":"血液検査にて FT3 および FT4 の上昇と TSH の低下を認めた．患者にみられる症状はどれか．2 つ選べ．","options":{"a":"頻脈","b":"徐脈","c":"振戦","d":"体温低下","e":"体重増加"},"choose":"2","chapter":6,"topic":"甲状腺疾患","answer":["a","c"],"status":"確定","explanation":"FT3・FT4の上昇とTSHの低下は甲状腺機能亢進症（Basedow病等）の検査所見である（甲状腺ホルモン過剰によりネガティブフィードバックでTSHは低下）。教科書は典型的症状として体重減少、頻脈、不整脈・動悸、心不全、眼球突出、振戦、下痢などの代謝亢進症状を挙げており、頻脈(a)と振戦(c)が該当する。徐脈・体温低下・体重増加は甲状腺機能低下症の症状であり誤り。","onotes":{"a":"正。代謝亢進・交感神経刺激様作用により頻脈をきたす","b":"誤。徐脈は甲状腺機能低下症の症状","c":"正。振戦は典型的症状として明記されている","d":"誤。熱産生亢進により体温は上昇傾向。体温低下は機能低下症","e":"誤。代謝亢進により体重は減少する"},"evidence":[{"s":"教科書6章 全身管理上問題となる疾患（甲状腺機能亢進症）","p":"書籍p.361-362"},{"s":"教科書6章 代謝・内分泌疾患（甲状腺機能亢進症）","p":"書籍p.361"}],"note":""},{"n":51,"stem":"下垂体後葉から分泌されるホルモンはどれか.1 つ選べ．","options":{"a":"プロラクチン","b":"成長ホルモン","c":"抗利尿ホルモン","d":"性腺刺激ホルモン","e":"副腎皮質刺激ホルモン"},"choose":"1","chapter":2,"topic":"内分泌生理","answer":["c"],"status":"確定","explanation":"下垂体後葉からは抗利尿ホルモン（ADH＝バソプレシン）とオキシトシンが放出される。ADHは視床下部で合成され後葉に運ばれて分泌される。一方、プロラクチン・成長ホルモン・性腺刺激ホルモン（LH/FSH）・副腎皮質刺激ホルモン（ACTH）はいずれも下垂体前葉から分泌されるホルモンであり誤り。教科書にも「前葉からTSH・GH・ACTH・LH/FSH・PRL、後葉からADH」と明記されている。","onotes":{"a":"誤。プロラクチンは下垂体前葉から分泌される。","b":"誤。成長ホルモン(GH)は下垂体前葉から分泌される。","c":"正。抗利尿ホルモン(ADH)は視床下部で合成され下垂体後葉から放出される。","d":"誤。性腺刺激ホルモン(LH/FSH)は下垂体前葉から分泌される。","e":"誤。副腎皮質刺激ホルモン(ACTH)は下垂体前葉から分泌される。"},"evidence":[{"s":"教科書6章 代謝・内分泌疾患（下垂体疾患）","p":"書籍p.366"},{"s":"教科書2章 侵襲と生体反応","p":"書籍p.68"},{"s":"教科書6章 代謝・内分泌疾患","p":"書籍p.366"}],"note":""},{"n":52,"stem":"甲状腺機能亢進症患者の周術期に注意すべき状態について適切なのはどれか．1 つ選べ．","options":{"a":"体温が急激に低下しやすい.","b":"麻酔薬の使用量が減少する.","c":"頻脈性不整脈を起こしやすい.","d":"筋弛緩薬の効果が延長しやすい.","e":"甲状腺クリーゼの発症は術中に多い."},"choose":"1","chapter":6,"topic":"甲状腺疾患","answer":["c"],"status":"確定","explanation":"甲状腺機能亢進症では甲状腺ホルモン過剰により交感神経系機能が亢進し、頻脈・心房細動などの頻脈性不整脈を起こしやすく、術中もランジオロール等の短時間作用型β遮断薬で頻脈・高血圧を避ける管理が求められる（c正）。代謝亢進のため体温は上昇傾向で（a誤）、麻酔薬の使用量は一般に増加する（b誤）。筋弛緩薬効果の延長は特徴でない（重症筋無力症合併時に注意する程度、d誤）。甲状腺クリーゼは手術侵襲や術後の発熱・疼痛を契機に術後に多く発症する（e誤）。","onotes":{"a":"誤。代謝亢進により高熱・発汗など体温は上昇しやすい。","b":"誤。教科書に「一般に麻酔薬の使用量は増加する」と明記。","c":"正。頻脈・心房細動などの頻脈性不整脈を起こしやすい。","d":"誤。筋弛緩薬効果の延長は本症の特徴ではない（重症筋無力症合併時に注意）。","e":"誤。クリーゼは術後の発熱・疼痛等を契機とし術後に多い。"},"evidence":[{"s":"教科書6章 甲状腺機能亢進症","p":"書籍p.361-362"},{"s":"教科書6章 甲状腺機能亢進症（術後管理）","p":"書籍p.362"},{"s":"教科書6章 甲状腺機能亢進症","p":"書籍p.362-363"}],"note":""},{"n":53,"stem":"高浸透圧高血糖症候群について適切なのはどれか. 1 つ選べ．","options":{"a":"過呼吸を伴う.","b":"著しい脱水を伴う.","c":"若年患者に好発する.","d":"血糖値は軽度に上昇する.","e":"意識は明瞭である場合が多い."},"choose":"1","chapter":6,"topic":"糖尿病患者の管理","answer":["b"],"status":"確定","explanation":"高浸透圧高血糖症候群は主に高齢の2型糖尿病患者にみられ、著明な高血糖（600mg/dL以上）による高浸透圧性利尿で著しい脱水と血漿浸透圧上昇をきたし、意識障害・昏睡に至る病態である（b正）。ケトン体産生は乏しく著明なアシドーシスを欠くため、DKAでみられるKussmaul大呼吸（過呼吸）は伴わない（a誤）。高齢者に好発し（c誤）、血糖値は著明に上昇し（d誤）、糖尿病性昏睡の一型であり意識障害を呈することが多い（e誤）。","onotes":{"a":"誤。過呼吸(Kussmaul呼吸)は糖尿病性ケトアシドーシスの所見。","b":"正。高浸透圧性利尿により著しい脱水・循環血漿量減少を伴う。","c":"誤。高齢の患者にみられると教科書に明記。","d":"誤。血糖値は600mg/dL以上と著明に上昇する。","e":"誤。糖尿病性昏睡の一型で意識障害・昏睡に至ることがある。"},"evidence":[{"s":"教科書6章 糖尿病（糖尿病性昏睡）","p":"書籍p.357-358"},{"s":"教科書6章 糖尿病","p":"書籍p.357-358"}],"note":""},{"n":54,"stem":"アルドステロン症の症状はどれか.2 つ選べ.","options":{"a":"手足の力の入りにくさ","b":"骨粗鬆症","c":"肥満","d":"疲れやすさ","e":"乏尿"},"choose":"2","chapter":6,"topic":"副腎疾患","answer":["a","d"],"status":"確定","explanation":"原発性アルドステロン症ではアルドステロン過剰によりNa再吸収・K排泄が亢進し、高血圧と低カリウム血症を呈する。低カリウム血症により筋力低下（手足の力の入りにくさ）・易疲労感・周期性四肢麻痺が生じ、腎濃縮力低下により多飲・多尿となる。よってaとdが正解。骨粗鬆症や肥満（中心性肥満）はコルチゾール過剰によるCushing症候群の症状であり（b・c誤）、尿は乏尿ではなく多尿となる（e誤）。","onotes":{"a":"正。低K血症による筋力低下・周期性四肢麻痺が特徴。","b":"誤。骨粗鬆症はCushing症候群（コルチゾール過剰）の症状。","c":"誤。（中心性）肥満はCushing症候群の症状。","d":"正。低K血症による易疲労感・脱力がみられる。","e":"誤。腎濃縮力障害により多飲・多尿となる。"},"evidence":[{"s":"教科書6章 副腎皮質機能亢進症","p":"書籍p.366"},{"s":"教科書6章 副腎疾患（原発性アルドステロン症）","p":"書籍p.366"}],"note":""},{"n":55,"stem":"低流量麻酔について適切なのはどれか.1 つ選べ.","options":{"a":"呼気ガスが再利用される.","b":"二酸化炭素吸収剤の消耗が少ない.","c":"新鮮ガス流量 3 L/min の全身麻酔である.","d":"新鮮ガスと吸気ガスの組成は同一である.","e":"新鮮ガスの組成を変化させた場合,吸気ガスの組成もすみやかに変化する．"},"choose":"1","chapter":5,"topic":"麻酔器と回路","answer":["a"],"status":"確定","explanation":"低流量麻酔は循環式回路で新鮮ガス流量を1〜1.5（〜2）L/分程度に絞り、呼気ガスを二酸化炭素吸収装置に通して麻酔薬・酸素を再吸入（再利用）させる経済的・環境配慮型の麻酔法である（a正）。再呼吸率が高いためCO2吸収剤の消耗はむしろ多い（b誤）。3L/minは低流量の定義に合わない（c誤）。吸気ガスは新鮮ガスと呼気再循環ガスの混合であり組成は同一でなく（d誤）、流量が少ないため新鮮ガス組成を変えても吸気ガス組成の変化は緩徐である（e誤）。","onotes":{"a":"正。CO2吸収後の呼気ガス（麻酔薬含む）が再吸入・再利用される。","b":"誤。再呼吸率が高くCO2吸収剤の消耗は多い（閉鎖式では劣化が早い）。","c":"誤。低流量麻酔は一般に1〜1.5L/分程度以下。3L/minは該当しない。","d":"誤。吸気ガスは新鮮ガス＋再呼吸ガスの混合で組成は異なる。","e":"誤。低流量では回路内組成の変化は緩徐で、すみやかには反映されない。"},"evidence":[{"s":"教科書5章 麻酔器と麻酔回路（循環式回路）","p":"書籍p.258"},{"s":"教科書5章 術中管理（低流量麻酔）","p":"書籍p.282"},{"s":"教科書5章 麻酔器と麻酔回路","p":"書籍p.253-254"}],"note":""},{"n":56,"stem":"セボフルランと比較してデスフルランで高くなるのはどれか．1 つ選べ．","options":{"a":"沸点","b":"代謝率","c":"最小肺胞濃度","d":"誘発電位モニタリングへの影響","e":"血液/ガス分配係数"},"choose":"1","chapter":5,"topic":"吸入麻酔薬の薬理","answer":["c"],"status":"確定","explanation":"デスフルランのMAC（最小肺胞濃度）は約6%と揮発性麻酔薬中で最も高く、セボフルラン（約1.7〜2%）より高い（c正）。沸点はデスフルラン23.5℃（セボフルラン58.6℃）と低く専用の加温加圧気化器を要する（a誤）。生体内代謝率は0.02%とセボフルラン（3.3%）より低く（b誤）、血液/ガス分配係数も0.42とセボフルラン（約0.63）より小さい（e誤）。誘発電位への抑制は揮発性麻酔薬に共通の用量依存性でデスフルランが特に大きいわけではない（d誤）。","onotes":{"a":"誤。沸点はデスフルラン23.5℃＜セボフルラン58.6℃。","b":"誤。代謝率はデスフルラン0.02%＜セボフルラン3.3%。","c":"正。MACはデスフルラン約6%＞セボフルラン約1.7〜2%。","d":"誤。誘発電位への影響は両者ほぼ同等（用量依存性抑制）。","e":"誤。血液/ガス分配係数はデスフルラン0.42＜セボフルラン約0.63。"},"evidence":[{"s":"教科書5章 吸入麻酔（デスフルラン）","p":"書籍p.231"},{"s":"教科書5章 吸入麻酔（セボフルラン）","p":"書籍p.230"},{"s":"教科書5章 表5-Ⅳ-2 吸入麻酔薬の物理化学的性状","p":"書籍p.229"}],"note":""},{"n":57,"stem":"非脱分極性筋弛緩薬の効果を減弱させる状態はどれか．2 つ選べ．","options":{"a":"熱傷","b":"吸入麻酔剤","c":"低体温","d":"低マグネシウム血症","e":"呼吸性アシドーシス"},"choose":"2","chapter":5,"topic":"筋弛緩薬","answer":["a","d"],"status":"確定","explanation":"熱傷・脊髄損傷・多発性硬化症・Guillain-Barré症候群ではニコチン性ACh受容体のup-regulationが生じ、非脱分極性筋弛緩薬への感受性が減弱する（a正）。マグネシウムはACh放出を担うCaチャネル阻害等で非脱分極性筋弛緩薬を増強するため、低マグネシウム血症では逆に効果が減弱する（d正）。吸入麻酔薬は用量依存性に増強（b誤）、低体温は作用持続時間を延長＝増強（c誤）、呼吸性アシドーシスは作用を増強する（e誤）。","onotes":{"a":"正。nAChR up-regulationにより非脱分極性筋弛緩薬への感受性が減弱。","b":"誤。吸入麻酔薬は用量依存性に筋弛緩作用を増強する。","c":"誤。低体温では作用持続時間が延長する（増強）。","d":"正。Mgは筋弛緩を増強するため低Mg血症では効果減弱。","e":"誤。呼吸性アシドーシスでは作用が増強し回復が遷延する。"},"evidence":[{"s":"教科書5章 筋弛緩薬（作用に影響する因子）","p":"書籍p.249"},{"s":"教科書5章 筋弛緩薬（作用に影響する因子）","p":"書籍p.249-250"}],"note":""},{"n":58,"stem":"日本麻酔科学会の術前絶飲食ガイドラインにおいて推奨される小児の絶飲食時間について適切なのはどれか．1 つ選べ．","options":{"a":"母乳は 2 時間前まで","b":"母乳は 4 時間前まで","c":"人工乳は 2 時間前まで","d":"清澄水は 1 時間前まで","e":"牛乳は 4 時間前まで"},"choose":"1","chapter":5,"topic":"術前絶飲食","answer":["b"],"status":"確定","explanation":"日本麻酔科学会「術前絶飲食ガイドライン」（2012年）では、麻酔導入前の絶飲時間を清澄水2時間、母乳4時間、人工乳・牛乳6時間としており、bが正解。母乳を2時間とするaは誤り。人工乳は6時間必要でcは誤り。清澄水は2時間前までであり1時間とするdは誤り。牛乳は人工乳と同じ6時間でeも誤り。固形食については明確な絶食時間は示されていない点も特徴である。","onotes":{"a":"誤。母乳は4時間前までであり2時間は短すぎる。","b":"正。母乳は4時間前まで（新生児・乳児とも）。","c":"誤。人工乳は6時間前まで。","d":"誤。清澄水は2時間前まで。","e":"誤。牛乳は人工乳と同じく6時間前まで。"},"evidence":[{"s":"教科書5章 術前評価（日本麻酔科学会 術前絶飲食ガイドライン）","p":"書籍p.214"},{"s":"教科書9章 小児の麻酔管理","p":"書籍p.423"},{"s":"教科書5章 術前管理（表5-Ⅲ-11 術前絶飲食ガイドライン）","p":"書籍p.214"}],"note":""},{"n":59,"stem":"チオペンタールナトリウムの作用はどれか.2 つ選べ．","options":{"a":"血管の収縮","b":"心拍数の増加","c":"気道抵抗の減少","d":"脳酸素代謝率の低下","e":"二酸化炭素換気応答の促進"},"choose":"2","chapter":5,"topic":"静脈麻酔薬","answer":["b","d"],"status":"確定","explanation":"チオペンタールは中枢抑制により脳酸素消費量（脳酸素代謝率）を低下させ、脳虚血患者の脳保護目的にも使用される（d正）。血管拡張と心抑制により血圧が低下し、圧受容体反射を介した反射性頻脈で心拍数は増加する（b正、a誤）。気道抵抗はむしろ上昇させるため重症気管支喘息患者には禁忌である（c誤）。バルビツレートは用量依存性の呼吸抑制を生じ、二酸化炭素換気応答は促進ではなく抑制される（e誤）。","onotes":{"a":"誤。静脈系を中心に血管拡張をきたし血圧が低下する。","b":"正。血圧低下に対する圧受容体反射により心拍数は増加する。","c":"誤。気道抵抗を上昇させるため重症気管支喘息に禁忌。","d":"正。脳酸素消費量（脳代謝率）を用量依存性に低下させる。","e":"誤。呼吸中枢抑制によりCO2換気応答は抑制される。"},"evidence":[{"s":"教科書5章 静脈麻酔（チオペンタール、チアミラール）","p":"書籍p.238"},{"s":"教科書6章 脳血管疾患（麻酔薬の脳血流・脳代謝への影響）","p":"書籍p.347"},{"s":"教科書5章 静脈麻酔（チオペンタール）","p":"書籍p.238"}],"note":""},{"n":60,"stem":"鎮痛作用のある薬剤はどれか.2 つ選べ.","options":{"a":"ケタミン","b":"亜酸化窒素","c":"レミマゾラム","d":"プロポフォール","e":"チオペンタール"},"choose":"2","chapter":5,"topic":"麻酔薬の鎮痛作用","answer":["a","b"],"status":"確定","explanation":"ケタミンはNMDA受容体拮抗により延髄・視床の侵害入力を抑制し強い鎮痛作用をもつ静脈麻酔薬である（a正）。亜酸化窒素は麻酔作用は弱いが鎮痛作用を有し、20%濃度でモルヒネ15mg相当の鎮痛効果とされる（b正）。一方、レミマゾラム（ベンゾジアゼピン系）、プロポフォール、チオペンタール（バルビツレート）は催眠・鎮静作用のみで鎮痛作用はなく、バランス麻酔では鎮痛薬の併用が必要となる（c・d・e誤）。","onotes":{"a":"正。NMDA受容体拮抗による鎮痛作用をもつ静脈麻酔薬。","b":"正。20%でモルヒネ15mg相当の比較的強い鎮痛作用を有する。","c":"誤。ベンゾジアゼピン系で鎮痛作用はない。","d":"誤。催眠作用のみで臨床的な鎮痛作用はない。","e":"誤。バルビツレートに鎮痛作用はない（むしろ痛覚閾値低下の報告も）。"},"evidence":[{"s":"教科書5章 静脈麻酔（ケタミン）","p":"書籍p.238"},{"s":"教科書4章 精神鎮静法（亜酸化窒素）","p":"書籍p.165"},{"s":"教科書5章 吸入麻酔（亜酸化窒素）","p":"書籍p.228"}],"note":""},{"n":61,"stem":"アルチカイン塩酸塩の特徴はどれか.3 つ選べ.","options":{"a":"アミド型局所麻酔薬である.","b":"解離定数はリドカインと近似している.","c":"血中の非特異的エステラーゼで代謝される.","d":"リドカイン塩酸塩よりも麻酔効果の持続時間は短い．","e":"血管収縮薬として 8 万分の 1 のアドレナリンが添加された製剤として供給される．"},"choose":"3","chapter":3,"topic":"局所麻酔薬の薬理","answer":["a","b","c"],"status":"確定","explanation":"アルチカインはアミド型局所麻酔薬で、麻酔効力や解離定数などの基本的性質はリドカインに近い。一方、分子内のエステル結合が血中の非特異的エステラーゼで速やかに加水分解される。国内製剤のアドレナリン濃度は10万分の1である。","onotes":{},"evidence":[{"s":"セプトカイン配合注カートリッジ解説資料","p":"アルチカインの特徴、製剤比較表"}],"note":""},{"n":62,"stem":"褐色細胞腫の説明で正しいのはどれか.1 つ選べ.","options":{"a":"血圧低下を生じる.","b":"副腎皮質の腫瘍である.","c":"コルチゾールの過剰分泌がある.","d":"循環血液量が増加する.","e":"アドレナリンが過剰分泌される."},"choose":"1","chapter":6,"topic":"副腎疾患","answer":["e"],"status":"確定","explanation":"褐色細胞腫は副腎髄質などのクロム親和性細胞由来で、アドレナリンやノルアドレナリンなどのカテコラミンを過剰分泌する。持続性または発作性高血圧を生じ、循環血液量は減少傾向となる。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第6章 全身管理上問題となる疾患","p":"書籍p.314-400"}],"note":"問62と問83は同一問題"},{"n":63,"stem":"closing capacity(CC)を構成するものはどれか.2つ選べ．","options":{"a":"TV","b":"CV","c":"RV","d":"FRC","e":"TLC"},"choose":"2","chapter":2,"topic":"呼吸生理","answer":["b","c"],"status":"確定","explanation":"closing capacity（閉鎖容量）は、末梢気道が閉鎖し始めてから最大呼気位までの容積であり、closing volume（CV）と残気量（RV）の和で表される。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第2章 全身管理に必要な基本的知識","p":"書籍p.16-107"}],"note":""},{"n":64,"stem":"吸気時に吸息筋として働く主な筋肉はどれか.2 つ選べ．","options":{"a":"横隔膜","b":"腹横筋","c":"腹直筋","d":"内肋間筋","e":"外肋間筋"},"choose":"2","chapter":2,"topic":"呼吸生理","answer":["a","e"],"status":"確定","explanation":"安静吸気の主働筋は横隔膜と外肋間筋である。腹筋群と内肋間筋は主として努力呼気に働く。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第2章 全身管理に必要な基本的知識","p":"書籍p.16-107"}],"note":""},{"n":65,"stem":"酸素解離曲線を左右に移動させない因子はどれか. 1 つ選べ．","options":{"a":"pH","b":"体温","c":"酸素分圧","d":"2,3‒DPG","e":"二酸化炭素分圧"},"choose":"1","chapter":2,"topic":"呼吸生理","answer":["c"],"status":"確定","explanation":"酸素解離曲線の横軸そのものが酸素分圧であり、酸素分圧の変化は曲線上の移動を起こすが曲線自体を左右に偏位させない。pH、体温、PaCO2、2,3-DPGは偏位因子である。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第2章 全身管理に必要な基本的知識","p":"書籍p.16-107"}],"note":""},{"n":66,"stem":"肺のサーファクタントについて正しいのはどれか. 2 つ選べ．","options":{"a":"長鎖炭水化物である.","b":"成人の肺にも存在する.","c":"新生児期の肝臓で産生される.","d":"肺胞II型細胞から分泌される.","e":"肺胞の表面張力を増加させる."},"choose":"2","chapter":2,"topic":"呼吸生理","answer":["b","d"],"status":"確定","explanation":"肺サーファクタントは成人肺にも存在し、肺胞II型上皮細胞から分泌されるリン脂質主体の物質である。肺胞表面張力を低下させ、肺胞虚脱を防ぐ。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第2章 全身管理に必要な基本的知識","p":"書籍p.16-107"}],"note":""},{"n":67,"stem":"アスピリン喘息について正しい特徴はどれか.2 つ選べ．","options":{"a":"小児に多い.","b":"喘息発症にはアレルギー反応が関与している.","c":"発作時にはアドレナリンの投与が有効である.","d":"シクロオキシゲナーゼの活性阻害が発症原因となる．","e":"プロスタグランジン系物質産生によって気管支収縮が起こる．"},"choose":"2","chapter":6,"topic":"気管支喘息","answer":["c","d"],"status":"確定","explanation":"アスピリン喘息は成人に多く、IgE依存性アレルギーではなくCOX阻害により発症する。急性の気管支攣縮にはアドレナリンのβ2作用も気管支拡張に有効である。病態の中心はプロスタグランジン産生増加ではなく、気管支拡張性プロスタグランジンの低下とロイコトリエン増加である。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第6章 呼吸系疾患","p":"書籍p.315-316"}],"note":""},{"n":68,"stem":"79 歳の女性.口腔内の悪性腫瘍摘出術が施行された．術後，人工呼吸器を用いて気管挿管下の呼気終末陽圧（PEEP：Positive End Expiratory Pressure）療法による呼吸管理が行われていたが，誤って過度な呼気終末陽圧（PEEP）がかけられていた．このとき，循環動態に及ぼす不利益（デメリット）はどれか．2 つ選べ．","options":{"a":"頭蓋内圧の減少","b":"心拍出量の減少","c":"胸腔内圧の減少","d":"静脈還流量の上昇","e":"肺血管抵抗の上昇"},"choose":"2","chapter":5,"topic":"人工呼吸管理","answer":["b","e"],"status":"確定","explanation":"過度なPEEPは胸腔内圧を上昇させ、静脈還流を減少させるため心拍出量が低下する。また肺胞内圧上昇により肺血管抵抗が増加し、右心負荷が強まる。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第5章 全身麻酔","p":"書籍p.197-313"}],"note":""},{"n":69,"stem":"肺塞栓症を予防するのはどれか.すべて選べ.","options":{"a":"抗血栓薬の投与","b":"下肢の弾性包帯の着用","c":"下腿への圧迫ポンプ装備","d":"下大静脈フィルターの留置","e":"下肢の圧迫ストッキングの着用"},"choose":"all","chapter":5,"topic":"肺血栓塞栓症","answer":["a","b","c","d","e"],"status":"確定","explanation":"抗血栓薬、弾性包帯、間欠的空気圧迫、弾性ストッキングはいずれも静脈血栓塞栓症予防に用いられる。下大静脈フィルターは適応を限って肺動脈への塞栓流入を予防する。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第5章 全身麻酔","p":"書籍p.197-313"}],"note":""},{"n":70,"stem":"デクスメデトミジンについて正しいのはどれか.2つ選べ．","options":{"a":"鎮静作用を有する.","b":"投与中に上気道閉塞が起こりやすい.","c":"α2アドレナリン受容体が鎮静作用に関与している．","d":"末梢血管平滑筋は影響を受けない.","e":"呼吸抑制が大きいため気管挿管下に静脈内投与する．"},"choose":"2","chapter":4,"topic":"静脈内鎮静法の薬物","answer":["a","c"],"status":"確定","explanation":"デクスメデトミジンは中枢性α2アドレナリン受容体作動薬で鎮静・鎮痛補助作用を示す。呼吸抑制は比較的軽いが、徐脈・血圧変動には注意する。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第4章 精神鎮静法","p":"書籍p.159-196"}],"note":""},{"n":71,"stem":"鎮静薬の脳血流量への影響に関して正しいのはどれか．1 つ選べ．","options":{"a":"プロポフォールは脳血流量を増加させる.","b":"ベンゾジアゼピンは脳血流量を減少させる.","c":"デクスメデトミジンは脳血流量を維持する.","d":"オピオイドは脳血流量を増加させる.","e":"ケタミンは脳血流量を低下させる."},"choose":"1","chapter":4,"topic":"静脈内鎮静法の薬物","answer":["b"],"status":"確定","explanation":"ベンゾジアゼピンは脳代謝率を低下させ、それに伴って脳血流量を減少させる。プロポフォールも脳血流を減少させ、ケタミンは一般に増加させる。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第4章 精神鎮静法","p":"書籍p.159-196"}],"note":""},{"n":72,"stem":"レミマゾラムベシル酸塩の特徴はどれか.1 つ選べ.","options":{"a":"代謝物は活性を有する.","b":"投与時に血管痛がある.","c":"フルマゼニルによって拮抗できる.","d":"ピラゾリジン骨格を有する化合物である.","e":"血漿中のコリンエステラーゼによって分解される．"},"choose":"1","chapter":5,"topic":"静脈麻酔薬","answer":["c"],"status":"確定","explanation":"レミマゾラムは超短時間作用性ベンゾジアゼピンで、フルマゼニルにより拮抗できる。組織エステラーゼで代謝され、主代謝物の活性は著しく低い。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第5章 全身麻酔","p":"書籍p.197-313"}],"note":""},{"n":73,"stem":"プロポフォール注入症候群(PRIS)の症状はどれか．2 つ選べ．","options":{"a":"貧血","b":"高血糖","c":"脂質異常症","d":"横紋筋融解症","e":"代謝性アルカローシス"},"choose":"2","chapter":5,"topic":"静脈麻酔薬","answer":["c","d"],"status":"確定","explanation":"PRISでは代謝性アシドーシス、横紋筋融解、心不全・不整脈、腎障害、高脂血症などを生じる。したがって脂質異常症と横紋筋融解症が該当する。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第5章 全身麻酔","p":"書籍p.197-313"}],"note":""},{"n":74,"stem":"カプノメータにおいて,メインストリーム方式とサイドストリーム方式を比較した場合，メインストリーム方式の特徴はどれか．2 つ選べ．","options":{"a":"波形の歪みが大きい.","b":"低流量麻酔に適している.","c":"長時間使用時の安定性が良い.","d":"サンプリングチューブが閉塞しやすい.","e":"回路にセンサを取り付けないため,回路への荷重が少ない．"},"choose":"2","chapter":2,"topic":"カプノグラフィ","answer":["b","c"],"status":"確定","explanation":"メインストリーム方式はガスを吸引しないため低流量麻酔に適し、応答が速く波形の歪みが少ない。サンプリングチューブを用いないので閉塞の問題がなく、長時間の安定性にも優れるが、センサ重量が回路に加わる。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第2章 全身管理に必要な基本的知識","p":"書籍p.16-107"}],"note":""},{"n":75,"stem":"筋弛緩モニタにおいて,筋電図方式と加速度方式を比較した場合，加速度方式の特徴はどれか．1 つ選べ．","options":{"a":"電気的ノイズの影響を受ける.","b":"体温(筋温)の影響を受けやすい.","c":"刺激電流を低下させることができる.","d":"皮膚インピーダンスの影響を受けやすい.","e":"手術体位や体位変換による影響を受けやすい."},"choose":"1","chapter":2,"topic":"筋弛緩モニタリング","answer":["e"],"status":"確定","explanation":"加速度方式は筋収縮による運動を測定するため、母指などの自由な動きが必要であり、手術体位や体位変換、固定方法の影響を受けやすい。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第2章 全身管理に必要な基本的知識","p":"書籍p.16-107"}],"note":""},{"n":76,"stem":"TOF 刺激(四連刺激)を行いながらロクロニウム臭化物を静注したときのロクロニウム臭化物に対する筋弛緩効果の感受性について，高い順（感受性：高い＞低い）に並べてあるのはどれか．1 つ選べ．","options":{"a":"横隔膜>咽頭筋>オトガイ舌筋>母指内転筋>皺眉筋","b":"咽頭筋>オトガイ舌筋>母指内転筋>皺眉筋>横隔膜","c":"オトガイ舌筋>母指内転筋>皺眉筋>横隔膜>咽頭筋","d":"母指内転筋>皺眉筋>横隔膜>咽頭筋>オトガイ舌筋","e":"皺眉筋>横隔膜>咽頭筋>オトガイ舌筋>母指内転筋"},"choose":"1","chapter":5,"topic":"筋弛緩薬","answer":["b"],"status":"確定","explanation":"ロクロニウムへの感受性は咽頭筋が高く、オトガイ舌筋、母指内転筋、皺眉筋、横隔膜の順に低くなる。横隔膜と皺眉筋は比較的抵抗性で回復が早く、上気道の咽頭筋は残存筋弛緩の影響を受けやすい。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版","p":"書籍p.120 図2-IV-26"}],"note":""},{"n":77,"stem":"Revised Cardiac Risk Index における危険因子はどれか．1 つ選べ．","options":{"a":"虚血性心疾患の既往","b":"スタチンの使用","c":"肝機能障害の既往","d":"間質性肺炎の既往","e":"小下顎"},"choose":"1","chapter":5,"topic":"術前評価","answer":["a"],"status":"確定","explanation":"Revised Cardiac Risk Indexの危険因子には、高リスク手術、虚血性心疾患、心不全、脳血管疾患、インスリン治療、腎機能障害が含まれる。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第5章 全身麻酔","p":"書籍p.197-313"}],"note":""},{"n":78,"stem":"正しいのはどれか.すべて選べ.","options":{"a":"α受容体刺激で心拍数は増加する.","b":"迷走神経刺激で心拍数は減少する.","c":"レニン‒アンジオテンシン系は昇圧系である.","d":"心拍出量は 1 回拍出量と心拍数の積である.","e":"交感神経刺激では血圧は低下する."},"choose":"all","chapter":2,"topic":"循環生理","answer":["b","c","d"],"status":"確定","explanation":"迷走神経刺激は心拍数を減少させ、レニン-アンジオテンシン系は昇圧系として働く。心拍出量は1回拍出量と心拍数の積である。α受容体刺激は反射性徐脈を起こしうる。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第2章 全身管理に必要な基本的知識","p":"書籍p.16-107"}],"note":""},{"n":79,"stem":"Forrester 分類について正しいのはどれか.2 つ選べ．","options":{"a":"第I群が最も状態が良い.","b":"横軸は肺動脈楔入圧である.","c":"縦軸は心拍出量である.","d":"第III群は肺うっ血状態である.","e":"第IV群の治療は鎮静・鎮痛を行うことである."},"choose":"2","chapter":14,"topic":"心原性ショック","answer":["a","b"],"status":"確定","explanation":"Forrester分類は横軸に肺動脈楔入圧、縦軸に心係数をとる。第I群は肺うっ血も末梢循環不全もなく最も良好で、第III群は dry-cold、第IV群は wet-coldである。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第14章 ショック","p":"書籍p.522-532"}],"note":""},{"n":80,"stem":"血管迷走神経反射時の心電図で最も頻度が高いのはどれか．1 つ選べ．","options":{"a":"完全房室ブロック","b":"脚ブロック","c":"心室頻拍","d":"洞性徐脈","e":"洞停止"},"choose":"1","chapter":13,"topic":"血管迷走神経反射","answer":["d"],"status":"確定","explanation":"血管迷走神経反射では副交感神経緊張と交感神経抑制により徐脈・血圧低下を生じ、心電図所見としては洞性徐脈が最も多い。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第13章 歯科治療における全身的偶発症","p":"書籍p.504-521"}],"note":""},{"n":81,"stem":"4 METs に相当するのはどれか.2 つ選べ.","options":{"a":"トイレが自分でできる.","b":"掃除や食器洗いなど軽い家事ができる.","c":"2 階まで上がれ,坂も登れる.","d":"平地を 6~7 km/時程度の急ぎ足で歩ける.","e":"水泳ができる."},"choose":"2","chapter":5,"topic":"術前評価","answer":["c","d"],"status":"確定","explanation":"4 METsの目安は階段を2階まで上がる、坂を上る、平地を速足で歩くなどである。身の回りのことや軽い家事はおおむね1-3 METs、水泳は通常4 METsを超える。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第5章 全身麻酔","p":"書籍p.197-313"}],"note":""},{"n":82,"stem":"QT 延長のある患者で注意すべき不整脈はどれか.1つ選べ．","options":{"a":"洞停止","b":"Torsades de points","c":"心房細動","d":"心房粗動","e":"発作性上室性頻拍"},"choose":"1","chapter":2,"topic":"不整脈","answer":["b"],"status":"確定","explanation":"QT延長では早期後脱分極を背景に多形性心室頻拍であるTorsades de pointesを生じる危険がある。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第2章 全身管理に必要な基本的知識","p":"書籍p.16-107"}],"note":""},{"n":83,"stem":"褐色細胞腫の説明で正しいのはどれか.1 つ選べ.","options":{"a":"血圧低下を生じる.","b":"副腎皮質の腫瘍である.","c":"コルチゾールの過剰分泌がある.","d":"循環血液量が増加する.","e":"アドレナリンの過剰分泌がある."},"choose":"1","chapter":6,"topic":"副腎疾患","answer":["e"],"status":"確定","explanation":"問62と実質的に同一である。褐色細胞腫では副腎髄質由来のカテコラミン、とくにアドレナリンやノルアドレナリンの過剰分泌を認める。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第6章 全身管理上問題となる疾患","p":"書籍p.314-400"}],"note":"問62と問83は同一問題"},{"n":84,"stem":"I型糖尿病の特徴はどれか.2 つ選べ.","options":{"a":"若年に発症する.","b":"ケトアシドーシスを呈しやすい.","c":"肥満の割合が高い.","d":"糖尿病患者の 90%以上がI型である.","e":"インスリンの抵抗性が関与している."},"choose":"2","chapter":6,"topic":"糖尿病患者の管理","answer":["a","b"],"status":"確定","explanation":"1型糖尿病は自己免疫性β細胞破壊による絶対的インスリン欠乏が中心で、若年発症が多くケトアシドーシスを生じやすい。肥満・インスリン抵抗性は主に2型の特徴である。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第6章 全身管理上問題となる疾患","p":"書籍p.314-400"}],"note":""},{"n":85,"stem":"BNP について正しいのはどれか.1 つ選べ.","options":{"a":"視床下部より分泌される.","b":"左室拡張終期圧が低下すると分泌される.","c":"ナトリウム利尿作用がある.","d":"血管を収縮させる.","e":"10 pg/mL 以上で心不全を疑う."},"choose":"1","chapter":2,"topic":"循環生理","answer":["c"],"status":"確定","explanation":"BNPは主として心室筋から壁応力増大に応じて分泌され、ナトリウム利尿、利尿、血管拡張作用を示す。心不全では上昇する。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第2章 全身管理に必要な基本的知識","p":"書籍p.16-107"}],"note":""},{"n":86,"stem":"アドレナリンについて正しいのはどれか.2 つ選べ.","options":{"a":"血糖値を上昇させる.","b":"副腎皮質から放出される.","c":"気管支平滑筋を収縮させる.","d":"紫外線で容易に分解される.","e":"血液脳関門を通過しやすいため中枢神経作用が生じやすい．"},"choose":"2","chapter":3,"topic":"血管収縮薬","answer":["a","d"],"status":"確定","explanation":"アドレナリンはグリコーゲン分解などを促進して血糖を上昇させ、光、とくに紫外線で分解されやすい。副腎髄質から分泌され、β2作用で気管支を拡張し、血液脳関門は通過しにくい。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第3章 局所麻酔","p":"書籍p.108-158"}],"note":""},{"n":87,"stem":"23 歳の男性.術前合併症は特にない.全静脈麻酔（TIVA）による全身麻酔下での上下顎骨切り術の術中に，大量出血で心停止になった．応援を要請し，胸骨圧迫を開始した．その後，歯科麻酔科医が対応すべきことはどれか．すべて選べ．","options":{"a":"体温管理","b":"電気ショック","c":"頻回の人工呼吸","d":"アドレナリンの投与","e":"術者に圧迫止血を指示"},"choose":"all","chapter":15,"topic":"術中心停止","answer":["a","d","e"],"status":"確定","explanation":"大量出血による心停止では質の高いCPRとともに、低体温を防ぎ、アドレナリンを適切な間隔で投与し、術者へ圧迫止血を指示して可逆的原因である低容量血症を是正する。電気ショックはショック適応波形に限り、過剰換気は避ける。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第15章 心肺蘇生法","p":"書籍p.533-550"}],"note":""},{"n":88,"stem":"術後の無気肺について正しいのはどれか.すべて選べ．","options":{"a":"低酸素血症がみられる.","b":"呼吸数の増加がみられる.","c":"体位変換やタッピングを行う.","d":"術後の体位は患側を下にする.","e":"胸部エックス線写真で患部に不透過像がみられる．"},"choose":"all","chapter":5,"topic":"無気肺","answer":["a","b","c","e"],"status":"確定","explanation":"術後無気肺では換気血流不均衡による低酸素血症、頻呼吸、胸部X線の不透過像を認める。体位変換、深呼吸、早期離床、タッピングなどを行い、酸素化には原則として健側肺を下にする。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第5章 全身麻酔","p":"書籍p.197-313"}],"note":""},{"n":89,"stem":"65 歳の男性.TIVA にて下顎腫瘍摘出術を行い,術後に気管チューブを抜管したところ，直後に奇異呼吸（シーソー呼吸）がみられ，酸素マスク下でも経皮的動脈血酸素飽和度が 80％に低下した．血圧と脈拍数はやや上昇していた．対応として適切なのはどれか．2 つ選べ．","options":{"a":"気管切開術を行う.","b":"胸骨圧迫を開始する.","c":"アドレナリンを筋注する.","d":"スガマデクスを投与する.","e":"経鼻エアウェイを挿入する."},"choose":"2","chapter":5,"topic":"抜管後上気道閉塞","answer":["d","e"],"status":"確定","explanation":"抜管直後のシーソー呼吸と高度低酸素血症は上気道閉塞を示し、残存筋弛緩も疑う。経鼻エアウェイで気道を確保し、ロクロニウム残存が考えられる場合はスガマデクスを投与する。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第5章 全身麻酔","p":"書籍p.197-313"}],"note":""},{"n":90,"stem":"全身麻酔に伴う悪性高熱症に対して,ダントロレンナトリウム水和物（ダントリウム® 静注用 20 mg）の初回静脈内投与量で適切なのはどれか．1 つ選べ．","options":{"a":"0.1 mg/kg","b":"0.2 mg/kg","c":"0.5 mg/kg","d":"1 mg/kg","e":"5 mg/kg"},"choose":"1","chapter":5,"topic":"悪性高熱症","answer":["d"],"status":"確定","explanation":"国内のダントリウム静注用20 mgの用法では、悪性高熱症に対し初回1 mg/kgを静注し、症状を観察しながら必要に応じ追加投与する。","onotes":{},"evidence":[{"s":"悪性高熱症診療ガイドライン・ダントリウム静注用添付文書","p":"治療・用法用量"}],"note":""},{"n":91,"stem":"45 歳の男性.術前合併症は特にない.TIVA で導入し，経鼻挿管後，換気をしてもカプノメータの波形がなく，経皮的動脈血酸素飽和度が徐々に低下した．心電図は洞調律で頻脈から徐脈になり，10 分後に心停止になった．心停止になるまで血圧は上昇していた．最も考えられる心停止の原因はどれか．1つ選べ．","options":{"a":"気管挿管による血管迷走神経反射","b":"片肺挿管","c":"食道挿管による低酸素血症","d":"筋弛緩薬によるアナフィラキシー","e":"急性冠症候群"},"choose":"1","chapter":5,"topic":"気管挿管の合併症","answer":["c"],"status":"確定","explanation":"挿管後に換気してもカプノグラムが出ずSpO2が低下し、頻脈から徐脈を経て心停止した経過は食道挿管による進行性低酸素血症に典型的である。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第5章 全身麻酔","p":"書籍p.197-313"}],"note":""},{"n":92,"stem":"慢性閉塞性肺疾患(COPD)患者の麻酔管理で正しいのはどれか．1 つ選べ．","options":{"a":"気道内圧は高めに設定する.","b":"呼気終末陽圧は付与しない.","c":"亜酸化窒素の吸入が推奨される.","d":"I:E 比(吸呼気相比)は 1:1.5 程度に調節する．","e":"pH が維持できる範囲で二酸化炭素の蓄積は容認される．"},"choose":"1","chapter":6,"topic":"COPD患者の管理","answer":["e"],"status":"確定","explanation":"COPDでは低い気道内圧、長い呼気時間、air trapping回避を重視する。循環が保たれpHを許容範囲に維持できるなら、過度な換気圧を避ける目的で許容性高二酸化炭素血症を認める。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第6章 全身管理上問題となる疾患","p":"書籍p.314-400"}],"note":""},{"n":93,"stem":"脳梗塞の既往のある患者の周術期管理で正しいのはどれか．1 つ選べ．","options":{"a":"麻酔中 PaCO2 を 30 mmHg 以下に維持する.","b":"脳梗塞を有する高血圧症患者では血圧を低めに維持する．","c":"頸部郭清時の頸部の過伸展で脳梗塞を起こす可能性がある．","d":"脳梗塞の再発防止のために,術前水分制限は通常よりも長い時間を必要とする．","e":"脳梗塞を伴う高血圧症患者では脳血流の自動調節能が過敏になっている．"},"choose":"1","chapter":6,"topic":"脳血管障害患者の管理","answer":["c"],"status":"確定","explanation":"頸部郭清で頸部を過伸展すると頸動脈血流が障害され、脳梗塞再発の危険がある。過換気、過度な降圧、脱水は脳血流を低下させるため避ける。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第6章 全身管理上問題となる疾患","p":"書籍p.314-400"}],"note":""},{"n":94,"stem":"全身麻酔中の従圧式調節呼吸で設定しない項目はどれか．1 つ選べ．","options":{"a":"気道内圧","b":"1 回換気量","c":"呼気終末陽圧","d":"吸入酸素濃度","e":"吸気呼気時間比"},"choose":"1","chapter":5,"topic":"人工呼吸管理","answer":["b"],"status":"確定","explanation":"従圧式換気では吸気圧を設定し、換気量は肺コンプライアンスや気道抵抗に応じた結果として決まるため、1回換気量は直接設定しない。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第5章 全身麻酔","p":"書籍p.197-313"}],"note":""},{"n":95,"stem":"悪性高熱症について正しいのはどれか.2 つ選べ.","options":{"a":"代謝性アルカローシスを呈する.","b":"ダントロレンは 1 型リアノジン受容体に作用する．","c":"体温上昇は全身の骨格筋の持続的収縮による.","d":"全身麻酔症例 1 万例に 1~2 例の頻度で発症する．","e":"非脱分極性筋弛緩薬により,筋小胞体から細胞質内への Ca 放出機構が異常に亢進する．"},"choose":"2","chapter":5,"topic":"悪性高熱症","answer":["b","c"],"status":"確定","explanation":"悪性高熱症ではRYR1異常を介した筋小胞体からのCa2+放出亢進により骨格筋の持続的代謝亢進・収縮を生じる。ダントロレンは1型リアノジン受容体に作用してCa2+放出を抑制する。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第5章 全身麻酔","p":"書籍p.197-313"}],"note":""},{"n":96,"stem":"血液分布異常性ショックに該当するのはどれか.2つ選べ．","options":{"a":"敗血症","b":"心筋梗塞","c":"緊張性気胸","d":"広汎肺血栓塞栓症","e":"アナフィラキシーショック"},"choose":"2","chapter":14,"topic":"ショックの分類","answer":["a","e"],"status":"確定","explanation":"血液分布異常性ショックには血管拡張と透過性亢進を主体とする敗血症性ショックとアナフィラキシーショックが含まれる。心筋梗塞は心原性、緊張性気胸と広汎肺塞栓は閉塞性である。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第14章 ショック","p":"書籍p.522-532"}],"note":""},{"n":97,"stem":"アドレナリン含有局所麻酔薬を用いると血圧が低下しないのはどれか．2 つ選べ．","options":{"a":"α遮断薬","b":"フェノチアジン誘導体","c":"ブチロフェノン誘導体","d":"β1 受容体選択性遮断薬","e":"モノアミン酸化酵素(MAO)阻害薬"},"choose":"2","chapter":3,"topic":"血管収縮薬","answer":["d","e"],"status":"確定","explanation":"α遮断作用をもつ薬物ではアドレナリンのβ2血管拡張が優位となり血圧低下（アドレナリン反転）を生じうる。β1選択的遮断薬とMAO阻害薬ではこのα遮断性の血圧低下は生じない。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第3章 局所麻酔","p":"書籍p.108-158"}],"note":""},{"n":98,"stem":"全身麻酔中に発症したアナフィラキシーに対して行うべきことはどれか．すべて選べ．","options":{"a":"下肢を挙上する.","b":"100%酸素を投与する.","c":"アドレナリン 1.0 mg を静脈内投与する.","d":"輸液を最初の 5 分間で 2 mL/kg 投与する.","e":"採血し,トリプターゼとヒスタミンを測定する."},"choose":"all","chapter":14,"topic":"アナフィラキシー","answer":["a","b","e"],"status":"確定","explanation":"全身麻酔中のアナフィラキシーでは原因薬を中止し、100%酸素、下肢挙上、急速輸液、適量の静注アドレナリンを行う。診断補助として急性期にヒスタミン・トリプターゼを採血する。1 mg静注は通常の初期量として過大で、2 mL/kgの輸液も不足する。","onotes":{},"evidence":[{"s":"アナフィラキシーガイドライン・医科アナフィラキシーガイド","p":"周術期アナフィラキシーの初期治療"}],"note":""},{"n":99,"stem":"急速大量輸血による合併症でないのはどれか.1 つ選べ．","options":{"a":"低体温","b":"心不全","c":"出血傾向","d":"高カリウム血症","e":"高カルシウム血症"},"choose":"1","chapter":5,"topic":"輸血","answer":["e"],"status":"確定","explanation":"急速大量輸血では低体温、循環負荷、希釈性凝固障害、高カリウム血症、クエン酸による低カルシウム血症を生じうる。高カルシウム血症は典型的合併症ではない。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第5章 全身麻酔","p":"書籍p.197-313"}],"note":""},{"n":100,"stem":"虚血性心疾患患者の麻酔管理で正しいのはどれか.すべて選べ．","options":{"a":"頻脈を防止する.","b":"貧血は心筋酸素需給バランスを改善する.","c":"麻酔中の人工呼吸は過換気で維持する.","d":"非心臓手術には 4 METs 以上の運動耐用能が必要である．","e":"揮発性吸入麻酔薬には心筋虚血プレコンディショニング作用が期待できる．"},"choose":"all","chapter":6,"topic":"虚血性心疾患の管理","answer":["a","d","e"],"status":"確定","explanation":"虚血性心疾患では心筋酸素需要を増やす頻脈を避ける。非心臓手術の周術期評価では4 METs以上の運動耐容能が手術遂行の目安となり、揮発性吸入麻酔薬には虚血プレコンディショニング作用が期待される。貧血と過換気は酸素需給を悪化させうる。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第6章 虚血性心疾患","p":"書籍p.330-335"},{"s":"非心臓手術の心血管ガイドライン","p":"運動耐容能と周術期評価"}],"note":""}],"excluded":[],"dup":[62,83]},{"id":"2024","label":"2024年 第49回","short":"2024","type":"past","questions":[{"n":1,"stem":"亜酸化窒素吸入鎮静法の禁忌症はどれか.1 つ選べ.","options":{"a":"狭心症","b":"糖尿病","c":"高血圧症","d":"自然気胸","e":"妊娠中期"},"choose":"1","chapter":4,"topic":"亜酸化窒素吸入鎮静","answer":["d"],"status":"確定","explanation":"亜酸化窒素は血液に溶けにくく閉鎖腔へ急速に移行して容積・圧を増加させるため、自然気胸などの閉鎖腔病変では禁忌となる。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第4章 精神鎮静法","p":"書籍p.159-196"}],"note":""},{"n":2,"stem":"排泄半減期が最も短いのはどれか.1 つ選べ.","options":{"a":"ケタミン","b":"ミダゾラム","c":"ジアゼパム","d":"プロポフォール","e":"フルニトラゼパム"},"choose":"1","chapter":4,"topic":"静脈内鎮静法の薬物","answer":["d"],"status":"要確認","explanation":"提示薬のうちプロポフォールはクリアランスが大きく、排泄半減期が最も短い。なお本問は公式に採点除外とされた問題である。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第4章 精神鎮静法","p":"書籍p.159-196"}],"note":"採点除外（不適切問題） / 公式採点除外問題","excluded":1},{"n":3,"stem":"血漿タンパク結合率が最も低いのはどれか.1 つ選べ．","options":{"a":"ケタミン","b":"ミダゾラム","c":"ジアゼパム","d":"プロポフォール","e":"フルニトラゼパム"},"choose":"1","chapter":4,"topic":"静脈内鎮静法の薬物","answer":["a"],"status":"確定","explanation":"ケタミンの血漿タンパク結合率は約10-30%と低く、ミダゾラム、ジアゼパム、プロポフォールなどは高いタンパク結合率を示す。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第4章 精神鎮静法","p":"書籍p.159-196"}],"note":""},{"n":4,"stem":"α2 アドレナリン受容体作動薬はどれか.1 つ選べ.","options":{"a":"ケタミン","b":"ミダゾラム","c":"ペンタゾシン","d":"プロポフォール","e":"デクスメデトミジン"},"choose":"1","chapter":4,"topic":"静脈内鎮静法の薬物","answer":["e"],"status":"確定","explanation":"デクスメデトミジンは選択性の高いα2アドレナリン受容体作動薬で、鎮静・鎮痛補助作用を示す。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第4章 精神鎮静法","p":"書籍p.159-196"}],"note":""},{"n":5,"stem":"鎮痛作用があるのはどれか.2 つ選べ.","options":{"a":"ケタミン","b":"ミダゾラム","c":"プロポフォール","d":"フルニトラゼパム","e":"デクスメデトミジン"},"choose":"2","chapter":4,"topic":"静脈内鎮静法の薬物","answer":["a","e"],"status":"確定","explanation":"ケタミンはNMDA受容体拮抗作用による鎮痛を、デクスメデトミジンはα2受容体刺激による鎮痛補助作用を有する。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第4章 精神鎮静法","p":"書籍p.159-196"}],"note":""},{"n":6,"stem":"Richmond Agitation-Sedation Scale(RASS)で呼びかけ刺激に反応するスコアはどれか．1 つ選べ．","options":{"a":"+4","b":"+2","c":"0","d":"−2","e":"−4"},"choose":"1","chapter":4,"topic":"鎮静深度の評価","answer":["d"],"status":"確定","explanation":"RASS -2は呼びかけで短時間覚醒し、10秒未満アイコンタクトを保つ状態である。-4では身体刺激にのみ反応する。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第4章 精神鎮静法","p":"書籍p.159-196"}],"note":""},{"n":7,"stem":"免疫グロブリン E(IgE)が関与するアナフィラキシーショックの誘因はどれか．2 つ選べ．","options":{"a":"大豆","b":"日光","c":"ラテックス","d":"アルコール","e":"デキストラン"},"choose":"2","chapter":14,"topic":"アナフィラキシー","answer":["a","c"],"status":"確定","explanation":"大豆などの食物とラテックスは特異的IgEを介する即時型アレルギー・アナフィラキシーの代表的誘因である。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第14章 ショック","p":"書籍p.522-532"}],"note":""},{"n":8,"stem":"アナフィラキシー治療の際のアドレナリン筋注の用量はどれか．1 つ選べ．","options":{"a":"0.01 mg/kg","b":"0.02 mg/kg","c":"0.03 mg/kg","d":"0.04 mg/kg","e":"0.05 mg/kg"},"choose":"1","chapter":14,"topic":"アナフィラキシー","answer":["a"],"status":"確定","explanation":"アナフィラキシーに対するアドレナリン筋注量は0.01 mg/kgで、成人では通常0.3-0.5 mgを大腿外側へ投与する。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第14章 ショック","p":"書籍p.522-532"}],"note":""},{"n":9,"stem":"IV型アレルギーの発症に関与するのはどれか.2 つ選べ．","options":{"a":"肥満細胞","b":"T リンパ球","c":"好塩基球","d":"免疫グロブリン E","e":"マクロファージ"},"choose":"2","chapter":2,"topic":"アレルギー分類","answer":["b","e"],"status":"確定","explanation":"IV型アレルギーは遅延型の細胞性免疫反応で、感作Tリンパ球と活性化マクロファージが中心となる。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第2章 全身管理に必要な基本的知識","p":"書籍p.16-107"}],"note":""},{"n":10,"stem":"舌下投与やスプレー投与のニトログリセリンで胸部不快感症状が軽快しない場合に投与が検討されるのはどれか．1 つ選べ．","options":{"a":"アスピリン","b":"モルヒネ","c":"ペンタゾシン","d":"P2Y12 阻害薬","e":"モルヒネ塩酸塩"},"choose":"1","chapter":6,"topic":"虚血性心疾患","answer":["e"],"status":"要確認","explanation":"硝酸薬で改善しない急性冠症候群の胸痛ではモルヒネ塩酸塩の静注を検討する。ただしbとeが実質的に重複するため、本問は公式に採点除外となった。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第6章 全身管理上問題となる疾患","p":"書籍p.314-400"}],"note":"採点除外（不適切問題） / 選択肢bとeが実質的に同義","excluded":1},{"n":11,"stem":"低血圧を伴う徐脈の第 1 選択薬はどれか.1 つ選べ.","options":{"a":"アドレナリン","b":"ドパミン塩酸塩","c":"ノルアドレナリン","d":"アトロピン硫酸塩","e":"エフェドリン塩酸塩"},"choose":"1","chapter":15,"topic":"徐脈への対応","answer":["d"],"status":"確定","explanation":"症候性徐脈で低血圧を伴う場合、成人徐脈アルゴリズムではアトロピン硫酸塩が第一選択となる。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第15章 心肺蘇生法","p":"書籍p.533-550"}],"note":""},{"n":12,"stem":"経皮ペーシングをスタンバイしておくことが推奨される病態はどれか．1 つ選べ．","options":{"a":"洞性徐脈","b":"心房細動","c":"WPW 症候群","d":"完全左脚ブロック","e":"3 度房室ブロック"},"choose":"1","chapter":15,"topic":"徐脈への対応","answer":["e"],"status":"確定","explanation":"3度房室ブロックでは高度徐脈から循環不全へ進む危険が高く、薬物反応も不良なため経皮ペーシングを準備する。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第15章 心肺蘇生法","p":"書籍p.533-550"}],"note":""},{"n":13,"stem":"経鼻エアウェイサイズは鼻尖からどこまでの距離を参考にして決めるか．1 つ選べ．","options":{"a":"耳朶","b":"下顎角","c":"オトガイ","d":"関節突起","e":"甲状軟骨"},"choose":"1","chapter":5,"topic":"気道確保器具","answer":["a"],"status":"確定","explanation":"経鼻エアウェイの長さは鼻尖から耳朶または耳珠付近までの距離を目安に選択する。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第5章 全身麻酔","p":"書籍p.197-313"}],"note":""},{"n":14,"stem":"慢性閉塞性肺疾患(COPD)患者の全身麻酔中のカプノグラムで，第Ⅱ相の傾きが鈍化し，第Ⅲ相の値が EtCO2：60 mmHg となった．呼吸器の設定変更はどれか．2 つ選べ．","options":{"a":"呼吸数を増やす.","b":"呼気時間を延長する.","c":"I:E 比を逆転する.","d":"最大吸気圧を増やす.","e":"同期式間欠的強制換気を行う."},"choose":"2","chapter":6,"topic":"COPD","answer":["a","b"],"status":"確定","explanation":"COPDでCO2が蓄積した場合は分時換気量を確保しつつ、air trappingを避けるため呼吸数を適切に増やし、呼気時間も延長する。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第6章 全身管理上問題となる疾患","p":"書籍p.314-400"}],"note":""},{"n":15,"stem":"慢性閉塞性肺疾患(COPD)でみられるのはどれか. 1 つ選べ．","options":{"a":"残気量減少","b":"拡散能上昇","c":"A-aDO2 開大","d":"血清 KL-6 上昇","e":"fine crackles 聴取"},"choose":"1","chapter":6,"topic":"COPD","answer":["c"],"status":"確定","explanation":"COPDでは換気血流不均衡や拡散障害により肺胞-動脈血酸素分圧較差が開大する。残気量は増加する。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第6章 全身管理上問題となる疾患","p":"書籍p.314-400"}],"note":""},{"n":16,"stem":"BMI 45 の肥満患者に対して挿管下全身麻酔で管理中に，緩徐に低酸素血症が進行し，SpO2 が 94％となった．適切な処置はどれか．すべて選べ．","options":{"a":"PEEP 圧の上昇","b":"筋弛緩薬の投与","c":"吸入酸素濃度の上昇","d":"気管支拡張薬の投与","e":"肺リクルートメント手技"},"choose":"all","chapter":6,"topic":"肥満患者の管理","answer":["a","c","e"],"status":"確定","explanation":"肥満患者の緩徐な低酸素血症には、吸入酸素濃度上昇、適切なPEEP、肺リクルートメントで機能的残気量と肺胞開存を回復させる。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第6章 全身管理上問題となる疾患","p":"書籍p.314-400"}],"note":""},{"n":17,"stem":"全身麻酔終了時の筋弛緩モニターの値がポスト・テタニック・カウント（PTC）刺激による 2 回の単収縮反応（2PTC）のときのスガマデクスの投与量はどれか．1 つ選べ．","options":{"a":"0.6 mg/kg","b":"1 mg/kg","c":"2 mg/kg","d":"4 mg/kg","e":"16 mg/kg"},"choose":"1","chapter":5,"topic":"筋弛緩薬の拮抗","answer":["d"],"status":"確定","explanation":"TOF反応がなくPTC 1-2の深いロクロニウム筋弛緩では、スガマデクス4 mg/kgを投与する。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第5章 全身麻酔","p":"書籍p.197-313"}],"note":""},{"n":18,"stem":"喘息の増悪を引き起こす可能性がある薬剤はどれか．1 つ選べ．","options":{"a":"利尿薬","b":"β遮断薬","c":"Ca 遮断薬","d":"H2 遮断薬","e":"ACE 阻害薬"},"choose":"1","chapter":6,"topic":"気管支喘息","answer":["b"],"status":"確定","explanation":"β遮断薬、とくに非選択的β遮断薬はβ2受容体遮断により気管支収縮を起こし、喘息を増悪させうる。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第6章 全身管理上問題となる疾患","p":"書籍p.314-400"}],"note":""},{"n":19,"stem":"肺血栓塞栓症を疑う所見はどれか.すべて選べ.","options":{"a":"PaCO2 上昇","b":"PaCO2 低下","c":"D-ダイマー低下","d":"ETCO2 上昇","e":"ETCO2 低下"},"choose":"all","chapter":14,"topic":"肺血栓塞栓症","answer":["b","e"],"status":"確定","explanation":"肺血栓塞栓症では死腔換気増大と過換気によりPaCO2が低下し、肺血流低下により呼気終末CO2も急低下する。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第14章 ショック","p":"書籍p.522-532"}],"note":""},{"n":20,"stem":"緊張性気胸を疑う所見はどれか.1 つ選べ.","options":{"a":"皮下気腫","b":"泡沫様喀痰","c":"頸静脈の虚脱","d":"気道内圧の急激な低下","e":"徐脈を伴う急激な血圧上昇"},"choose":"1","chapter":14,"topic":"緊張性気胸","answer":["a"],"status":"確定","explanation":"緊張性気胸では胸腔内圧上昇に伴い患側呼吸音消失、気道内圧上昇、血圧低下、頸静脈怒張、皮下気腫などを認める。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第14章 ショック","p":"書籍p.522-532"}],"note":""},{"n":21,"stem":"簡易酸素マスクで酸素 8 L 投与中の患者の PaO2 が90 Torr であった．P/F ratio はどれか．1 つ選べ．","options":{"a":"11","b":"113","c":"150","d":"400","e":"720"},"choose":"1","chapter":2,"topic":"酸素化の評価","answer":["c"],"status":"確定","explanation":"簡易酸素マスク8 L/分の推定FiO2を約0.60とすると、P/F比は90/0.60=150となる。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第2章 全身管理に必要な基本的知識","p":"書籍p.16-107"}],"note":""},{"n":22,"stem":"ロピバカインについて正しいのはどれか.1 つ選べ.","options":{"a":"0.2%製剤と 0.75%製剤がある.","b":"抗不整脈薬として使用される.","c":"短時間作用性の局所麻酔薬である.","d":"成人の単回基準最高用量は 7 mg/kg である.","e":"他の局所麻酔薬に比較して中枢神経毒性が強い."},"choose":"1","chapter":3,"topic":"局所麻酔薬の薬理","answer":["a"],"status":"確定","explanation":"ロピバカインには0.2%製剤と0.75%製剤があり、長時間作用性で、ブピバカインより心毒性・中枢神経毒性が低い。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第3章 局所麻酔","p":"書籍p.108-158"}],"note":""},{"n":23,"stem":"体重 60 kg の成人にドパミン塩酸塩(イノバン注0.3％シリンジ®）を 5 μg/kg/min で投与する際の流量はどれか．1 つ選べ．","options":{"a":"3.6 mL/H","b":"6 mL/H","c":"18 mL/H","d":"60 mL/H","e":"180 mL/H"},"choose":"1","chapter":5,"topic":"薬物投与量計算","answer":["b"],"status":"確定","explanation":"必要量は5 μg/kg/分×60 kg×60分=18 mg/時。0.3%は3 mg/mLなので18/3=6 mL/時となる。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第5章 全身麻酔","p":"書籍p.197-313"}],"note":""},{"n":24,"stem":"体重 60 kg の成人にクラッシュインダクションを行う際のスキサメトニウム（40 mg/2 mL）投与量は何mL か．1 つ選べ．","options":{"a":"0.5 mL","b":"1 mL","c":"3 mL","d":"5 mL","e":"7 mL"},"choose":"1","chapter":5,"topic":"薬物投与量計算","answer":["c"],"status":"確定","explanation":"スキサメトニウムの成人迅速導入量は1 mg/kgで60 mg。製剤濃度20 mg/mLより投与量は3 mLである。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第5章 全身麻酔","p":"書籍p.197-313"}],"note":""},{"n":25,"stem":"腎障害の患者で,投与薬剤の代謝産物による作用遷延の可能性があるのはどれか．1 つ選べ．","options":{"a":"ミダゾラム","b":"レミマゾラム","c":"ロクロニウム","d":"プロポフォール","e":"レミフェンタニル"},"choose":"1","chapter":6,"topic":"腎疾患患者の管理","answer":["a"],"status":"確定","explanation":"ミダゾラムの活性代謝物1-ヒドロキシミダゾラム抱合体は腎排泄されるため、腎障害では蓄積して鎮静が遷延しうる。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第6章 全身管理上問題となる疾患","p":"書籍p.314-400"}],"note":""},{"n":26,"stem":"改変 Child-Pugh スコアについて正しいのはどれか. 1 つ選べ．","options":{"a":"腎機能障害を評価する.","b":"腹水が評価項目に含まれる.","c":"γ-GTP が評価項目に含まれる.","d":"合計 7〜9 点はクラス A に分類される.","e":"クラス C は周術期の慎重な管理が必要である."},"choose":"1","chapter":6,"topic":"肝疾患患者の管理","answer":["b"],"status":"確定","explanation":"Child-Pughスコアは脳症、腹水、ビリルビン、アルブミン、プロトロンビン時間を評価する。7-9点はクラスBである。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第6章 全身管理上問題となる疾患","p":"書籍p.314-400"}],"note":""},{"n":27,"stem":"甲状腺機能亢進症の患者で投与を避けるべき薬剤はどれか．1 つ選べ．","options":{"a":"レミマゾラム","b":"ケタミン塩酸塩","c":"ランジオロール","d":"レミフェンタニル","e":"ロクロニウム"},"choose":"1","chapter":6,"topic":"甲状腺機能亢進症","answer":["b"],"status":"確定","explanation":"ケタミンは交感神経刺激により心拍数・血圧を上昇させるため、甲状腺機能亢進症では原則として避ける。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第6章 全身管理上問題となる疾患","p":"書籍p.314-400"}],"note":""},{"n":28,"stem":"甲状腺機能亢進症患者の周術期管理について正しいのはどれか．1 つ選べ．","options":{"a":"前投薬としてのアトロピン投与は有用である.","b":"β遮断薬投与は手術 24 時間前までとする.","c":"甲状腺クリーゼを発症した場合の死亡率は高い.","d":"周術期のストレスは甲状腺刺激ホルモンの分泌を抑制する．","e":"麻酔の導入には NMDA 受容体拮抗薬のケタミンが適している．"},"choose":"1","chapter":6,"topic":"甲状腺機能亢進症","answer":["c"],"status":"確定","explanation":"甲状腺クリーゼは高熱、頻脈、意識障害、心不全などを呈し、治療しても死亡率が高い重篤な病態である。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第6章 全身管理上問題となる疾患","p":"書籍p.314-400"}],"note":""},{"n":29,"stem":"糖尿病について正しいのはどれか.1 つ選べ.","options":{"a":"手術侵襲でインスリン分泌は増加する.","b":"2 型糖尿病ではケトアシドーシスを起こしやすい．","c":"インスリンの投与により高カリウム血症になる.","d":"GLP1 受容体作動薬は胃内容物排出を遅延させる．","e":"スルホニル尿素薬は膵臓ランゲルハンス島α細胞を刺激する．"},"choose":"1","chapter":6,"topic":"糖尿病患者の管理","answer":["d"],"status":"確定","explanation":"GLP-1受容体作動薬は胃排出を遅延させるため、周術期には残胃内容と誤嚥リスクへ注意する。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第6章 全身管理上問題となる疾患","p":"書籍p.314-400"}],"note":""},{"n":30,"stem":"糖尿病による自律神経障害で起こるのはどれか.1つ選べ．","options":{"a":"頻尿","b":"便秘","c":"視力低下","d":"尿路感染症","e":"胃内容物停滞"},"choose":"1","chapter":6,"topic":"糖尿病患者の管理","answer":["e"],"status":"確定","explanation":"糖尿病性自律神経障害では胃不全麻痺により胃内容物停滞を生じ、誤嚥リスクが増加する。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第6章 全身管理上問題となる疾患","p":"書籍p.314-400"}],"note":""},{"n":31,"stem":"歯科外来の待合室で患者の体調が急変した.まず行うのはどれか．1 つ選べ．","options":{"a":"脈の触知","b":"呼吸の確認","c":"SpO2 モニタの装着","d":"意識の確認","e":"病歴の確認"},"choose":"1","chapter":15,"topic":"BLS","answer":["d"],"status":"確定","explanation":"急変時はまず反応・意識を確認し、応援要請とともに気道・呼吸・循環の評価へ進む。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第15章 心肺蘇生法","p":"書籍p.533-550"}],"note":""},{"n":32,"stem":"小学校高学年の患者への救命処置で正しいのはどれか．1 つ選べ．","options":{"a":"両手で胸骨圧迫を行う.","b":"小児用パッドを用いる.","c":"胸骨圧迫の前に AED を用意する.","d":"脈の触知には上腕動脈を用いる.","e":"1 人のとき,胸骨圧迫人工呼吸比は 15:2 で実施する．"},"choose":"1","chapter":15,"topic":"小児のBLS","answer":["a"],"status":"確定","explanation":"小学校高学年の大きな小児では胸郭の大きさに応じ両手で胸骨圧迫できる。1人法は30:2で、脈は頸動脈または大腿動脈を確認する。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第15章 心肺蘇生法","p":"書籍p.533-550"}],"note":""},{"n":33,"stem":"危険な心室性期外収縮はどれか.2 つ選べ.","options":{"a":"","b":"","c":"","d":"","e":""},"choose":"2","chapter":2,"topic":"心室性期外収縮","answer":["a","b"],"status":"確定","explanation":"aは形の異なる心室性期外収縮がみられる多形性、bは高頻度に反復する心室性期外収縮で、いずれも危険度が高い。","onotes":{},"evidence":[{"s":"2024年試験原本 問33心電図","p":"PDF p.3-4"},{"s":"歯科麻酔学 第8版 第2章 心電図","p":"循環モニタリング"}],"note":"","figs":["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAYIAAAC+CAIAAAC3V5+8AAAAIGNIUk0AAHomAACAhAAA+gAAAIDoAAB1MAAA6mAAADqYAAAXcJy6UTwAAAAGYktHRAD/AP8A/6C9p5MAAAAJcEhZcwAAGJsAABibAUl1g5QAAAAHdElNRQfqCAkGERB8kNnJAAAAJXRFWHRkYXRlOmNyZWF0ZQAyMDI2LTA4LTA5VDA0OjUyOjI5KzAwOjAwyBF7bgAAACV0RVh0ZGF0ZTptb2RpZnkAMjAyNi0wOC0wOVQwNDo1MjoxOCswMDowMJG0z4UAAAAodEVYdGRhdGU6dGltZXN0YW1wADIwMjYtMDgtMDlUMDY6MTc6MTYrMDA6MDCgMpiKAACAAElEQVR42uz9Waxm13UfiK+19t7nfMOdq27dmgeyqsgiKVGUKFIWScmWZDm2O0l30EECdOI8BIjbHSSIgTwYCPIQBAjykOQhwf8hiP8Igvw7aOSh7Y6H2LEdayApS r":5,"topic":"気管支痙攣","answer":["a"],"status":"確定","explanation":"重度の気管支攣縮では強い吸気努力と高度気道閉塞を介して陰圧性肺水腫を併発しうる。吸入麻酔薬は通常増量し、β2刺激薬を用いる。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第5章 全身麻酔","p":"書籍p.197-313"}],"note":""},{"n":38,"stem":"人工呼吸器関連肺障害の原因はどれか.1 つ選べ.","options":{"a":"PEEP の付加","b":"大きい分時換気量","c":"高い駆動圧","d":"長い吸気時間","e":"長い呼気時間"},"choose":"1","chapter":5,"topic":"人工呼吸管理","answer":["c"],"status":"確定","explanation":"人工呼吸器関連肺障害は過伸展と反復虚脱に関連し、特に高い駆動圧は肺傷害と予後悪化に結びつく。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第5章 全身麻酔","p":"書籍p.197-313"}],"note":""},{"n":39,"stem":"術後せん妄リスクについて正しいのはどれか.1 つ選べ．","options":{"a":"不眠症","b":"心房細動","c":"長期喫煙","d":"脳器質障害","e":"麻薬性鎮痛薬"},"choose":"1","chapter":5,"topic":"術後せん妄","answer":["d"],"status":"要確認","explanation":"認知症や脳血管障害などの脳器質障害は術後せん妄の強い患者側リスク因子である。本問は複数選択肢の妥当性に問題があり公式採点除外となった。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第5章 全身麻酔","p":"書籍p.197-313"}],"note":"採点除外（不適切問題） / 公式採点除外問題","excluded":1},{"n":40,"stem":"デクスメデトミジンの特徴はどれか.1 つ選べ.","options":{"a":"健忘効果はない.","b":"鎮痛作用はない.","c":"心拍数を減少させる.","d":"強い呼吸抑制作用がある.","e":"低濃度で血圧を上昇させる."},"choose":"1","chapter":4,"topic":"静脈内鎮静法の薬物","answer":["c"],"status":"確定","explanation":"デクスメデトミジンは交感神経活動を抑制し、徐脈を起こしやすい。呼吸抑制は比較的軽く、鎮痛作用も有する。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第4章 精神鎮静法","p":"書籍p.159-196"}],"note":""},{"n":41,"stem":"深鎮静を避けるべき疾患はどれか.1 つ選べ.","options":{"a":"高血圧症","b":"高脂血症","c":"知的障害","d":"扁桃肥大","e":"脳性まひ"},"choose":"1","chapter":4,"topic":"深鎮静","answer":["d"],"status":"確定","explanation":"扁桃肥大は上気道閉塞リスクを高め、深鎮静で筋緊張が低下すると急速に換気障害へ進みうるため避ける。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第4章 精神鎮静法","p":"書籍p.159-196"}],"note":""},{"n":42,"stem":"静脈内鎮静時の健忘効果について正しいのはどれか．1 つ選べ．","options":{"a":"高齢者では健忘効果は現れにくい.","b":"投与終了直後に健忘効果は消失する.","c":"鎮静薬による健忘効果は逆行性健忘である.","d":"意識レベルが患者の満足度に大きく影響する.","e":"ミダゾラムよりもプロポフォールのほうが健忘効果が強い．"},"choose":"1","chapter":4,"topic":"鎮静と健忘","answer":["d"],"status":"確定","explanation":"静脈内鎮静の患者満足度は鎮静体験や記憶の残存と強く関連する。鎮静薬による健忘は前向性で、高齢者ほど生じやすく、ミダゾラムはプロポフォールより強い。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第4章 精神鎮静法","p":"書籍p.159-196"}],"note":""},{"n":43,"stem":"デクスメデトミジンの鎮静作用に関与するのはどれか．1 つ選べ．","options":{"a":"側坐核のドパミン受容体","b":"網様体の GABAA 受容体","c":"大脳皮質の NMDA 受容体","d":"青斑核のα2 アドレナリン受容体","e":"側坐核のα1 アドレナリン受容体"},"choose":"1","chapter":4,"topic":"静脈内鎮静法の薬物","answer":["d"],"status":"確定","explanation":"デクスメデトミジンは青斑核のα2アドレナリン受容体を刺激し、ノルアドレナリン放出を抑えて自然睡眠に近い鎮静を生じる。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第4章 精神鎮静法","p":"書籍p.159-196"}],"note":""},{"n":44,"stem":"フルマゼニルを使用するに際し注意することはどれか．1 つ選べ．","options":{"a":"TOF モニターの装着","b":"初回には 2.0 mg 投与すること","c":"投与後は 30 分間監視すること","d":"パニック発作のある患者への使用","e":"静脈内にはすみやかに投与すること"},"choose":"1","chapter":4,"topic":"フルマゼニル","answer":["d"],"status":"確定","explanation":"フルマゼニルはベンゾジアゼピン作用を急速に拮抗し、不安・パニック症状を誘発しうるため、パニック発作既往例では慎重に使用する。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第4章 精神鎮静法","p":"書籍p.159-196"}],"note":""},{"n":45,"stem":"呼吸抑制の指標はどれか.すべて選べ.","options":{"a":"徐脈","b":"いびき","c":"奇異呼吸","d":"呼吸数の減少","e":"高二酸化炭素血症"},"choose":"all","chapter":4,"topic":"鎮静中の呼吸抑制","answer":["b","c","d","e"],"status":"確定","explanation":"いびき、奇異呼吸、呼吸数減少、高二酸化炭素血症はいずれも上気道閉塞または低換気を示す呼吸抑制の所見である。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第4章 精神鎮静法","p":"書籍p.159-196"}],"note":""},{"n":46,"stem":"BIS モニターについて正しいのはどれか.2 つ選べ.","options":{"a":"低体温で BIS 値が低下する.","b":"脳波データの測定値である.","c":"麻酔薬の種類により変動しない.","d":"BIS 値 80 は中等度の鎮静と判断できる.","e":"筋電図が混入すると実際値よりも低値を示す."},"choose":"2","chapter":2,"topic":"BISモニター","answer":["a","b"],"status":"確定","explanation":"BISは脳波を処理して得る指標で、低体温や脳活動低下で低値となる。筋電図混入は通常BISを偽高値にする。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第2章 全身管理に必要な基本的知識","p":"書籍p.16-107"}],"note":""},{"n":47,"stem":"カルバマゼピンの特徴はどれか.2 つ選べ.","options":{"a":"GABAA 受容体を遮断する.","b":"カルシウムチャネルを遮断する.","c":"副作用に皮疹が生じることがある.","d":"ベンゾジアゼピン薬の血中濃度を上昇させる.","e":"グレープフルーツの摂取により血中濃度が上昇する．"},"choose":"2","chapter":12,"topic":"三叉神経痛","answer":["c","e"],"status":"確定","explanation":"カルバマゼピンでは皮疹・重症薬疹に注意する。グレープフルーツはCYP3A4を阻害し、血中カルバマゼピン濃度を上昇させうる。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第12章 ペインクリニック","p":"書籍p.454-503"}],"note":""},{"n":48,"stem":"ジアゼパムについて正しいのはどれか.2 つ選べ.","options":{"a":"水溶性である.","b":"筋弛緩作用がある.","c":"逆行性健忘を生じる.","d":"痙攣の治療に有効である.","e":"代謝物には薬理学的活性がない."},"choose":"2","chapter":4,"topic":"静脈内鎮静法の薬物","answer":["b","d"],"status":"確定","explanation":"ジアゼパムは中枢性筋弛緩作用と抗けいれん作用をもつ。脂溶性で前向性健忘を生じ、活性代謝物を有する。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第4章 精神鎮静法","p":"書籍p.159-196"}],"note":""},{"n":49,"stem":"口腔内灼熱症候群(舌痛症)の特徴はどれか.2 つ選べ．","options":{"a":"食事で増悪する.","b":"30 代の女性に多い.","c":"口腔粘膜は外見上正常である.","d":"感覚検査で感覚閾値の低下を示す.","e":"灼熱感と口腔粘膜の表層に感じる痛みである."},"choose":"2","chapter":12,"topic":"舌痛症","answer":["c","e"],"status":"確定","explanation":"口腔内灼熱症候群では外見上粘膜が正常であるにもかかわらず、舌などの粘膜表層に灼熱性疼痛を訴える。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第12章 ペインクリニック","p":"書籍p.454-503"}],"note":""},{"n":50,"stem":"感覚の異常で正しいのはどれか.2 つ選べ.","options":{"a":"パレステジアでは不快感を伴う.","b":"ジセステジアでは不快感を伴わない.","c":"触覚鈍麻では刺激に対する感受性が低い.","d":"痛覚過敏では痛いと感じる刺激をさらに強く感じる．","e":"アロディニアでは痛みとして認識しない侵害刺激に対して痛みを覚える．"},"choose":"2","chapter":12,"topic":"感覚異常の用語","answer":["c","d"],"status":"確定","explanation":"触覚鈍麻は触刺激への感受性低下、痛覚過敏は通常痛い刺激をより強く痛いと感じる状態である。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第12章 ペインクリニック","p":"書籍p.454-503"}],"note":""},{"n":51,"stem":"プレガバリンについて正しいのはどれか.2 つ選べ.","options":{"a":"頓服で使用する.","b":"副作用にめまいや傾眠が含まれる.","c":"適応症に神経障害性疼痛が含まれる.","d":"ナトリウムチャネルの流入を阻害する.","e":"服用の上限はなく,痛みが消えるまで増量できる．"},"choose":"2","chapter":12,"topic":"神経障害性疼痛","answer":["b","c"],"status":"確定","explanation":"プレガバリンは神経障害性疼痛に適応があり、電位依存性Caチャネルα2δサブユニットに結合する。めまい・傾眠が代表的副作用である。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第12章 ペインクリニック","p":"書籍p.454-503"}],"note":""},{"n":52,"stem":"持続性の神経障害性疼痛はどれか.1 つ選べ.","options":{"a":"歯髄炎","b":"唾石症","c":"舌咽神経痛","d":"三叉神経痛","e":"帯状疱疹後神経痛"},"choose":"1","chapter":12,"topic":"神経障害性疼痛","answer":["e"],"status":"確定","explanation":"帯状疱疹後神経痛は病変治癒後も持続する代表的な神経障害性疼痛である。三叉・舌咽神経痛は発作性疼痛である。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第12章 ペインクリニック","p":"書籍p.454-503"}],"note":""},{"n":53,"stem":"星状神経節ブロックの禁忌はどれか.2 つ選べ.","options":{"a":"喘息","b":"開口障害","c":"抗凝固薬服用中","d":"ステロイド服用中","e":"局所麻酔薬アレルギー"},"choose":"2","chapter":12,"topic":"星状神経節ブロック","answer":["c","e"],"status":"確定","explanation":"星状神経節ブロックは頸部深部への穿刺であり、抗凝固療法中は出血リスクが高い。使用する局所麻酔薬へのアレルギーも禁忌となる。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第12章 ペインクリニック","p":"書籍p.454-503"}],"note":""},{"n":54,"stem":"筋筋膜性歯痛を誘発することがある筋はどれか.2つ選べ．","options":{"a":"咬筋","b":"頰筋","c":"側頭筋","d":"眼輪筋","e":"口輪筋"},"choose":"2","chapter":12,"topic":"筋・筋膜性歯痛","answer":["a","c"],"status":"確定","explanation":"咬筋と側頭筋のトリガーポイントは歯・顎部へ関連痛を生じ、筋・筋膜性歯痛の原因となる。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第12章 ペインクリニック","p":"書籍p.454-503"}],"note":""},{"n":55,"stem":"がん性疼痛管理におけるオピオイドの使用で正しいのはどれか．2 つ選べ．","options":{"a":"直腸投与を基本とする.","b":"患者ごとの適切な量で投与する.","c":"オピオイドは時刻を決めて規則正しく投与する.","d":"オピオイドは主にκ受容体が作動して働く.","e":"ナロキソンはモルヒネ常用患者において代用薬となる．"},"choose":"2","chapter":12,"topic":"がん性疼痛管理","answer":["b","c"],"status":"確定","explanation":"がん性疼痛のオピオイドは患者ごとに用量調整し、時刻を決めて規則正しく投与する。WHO方式では原則として経口投与を優先する。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第12章 ペインクリニック","p":"書籍p.454-503"}],"note":""},{"n":56,"stem":"closing capacity(CC)について正しいのはどれか. 1 つ選べ．","options":{"a":"喫煙者では減少する.","b":"高齢者では減少する.","c":"気道抵抗を反映する.","d":"CC が増加すると無気肺を生じやすい.","e":"機能的残気量から残気量を除いたものである."},"choose":"1","chapter":2,"topic":"呼吸生理","answer":["d"],"status":"確定","explanation":"closing capacityが機能的残気量を上回ると通常呼吸中にも末梢気道が閉鎖し、無気肺と低酸素血症を生じやすい。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第2章 全身管理に必要な基本的知識","p":"書籍p.16-107"}],"note":""},{"n":57,"stem":"解剖学的死腔について正しいのはどれか.1 つ選べ.","options":{"a":"仰臥位で増加する.","b":"約 2.0 mL/kg である.","c":"頭部後屈により減少する.","d":"全身麻酔薬により減少する.","e":"鼻腔から咽頭腔,喉頭腔,区域気管支までが含まれる．"},"choose":"1","chapter":2,"topic":"呼吸生理","answer":["b"],"status":"確定","explanation":"解剖学的死腔は成人で約2 mL/kg、標準的成人で約150 mLである。終末細気管支までの伝導気道が含まれる。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第2章 全身管理に必要な基本的知識","p":"書籍p.16-107"}],"note":""},{"n":58,"stem":"静脈血混合(シャント)を増大させるのはどれか.すべて選べ．","options":{"a":"無気肺","b":"全身麻酔","c":"高濃度酸素","d":"呼気終末陽圧","e":"低酸素性肺血管収縮"},"choose":"all","chapter":2,"topic":"呼吸生理","answer":["a","b","c"],"status":"確定","explanation":"無気肺、全身麻酔、高濃度酸素による吸収性無気肺はシャントを増加させる。PEEPと低酸素性肺血管収縮はシャントを減らす方向に働く。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第2章 全身管理に必要な基本的知識","p":"書籍p.16-107"}],"note":""},{"n":59,"stem":"肥満患者にみられるのはどれか.3 つ選べ.","options":{"a":"横隔膜の挙上","b":"呼気予備量の減少","c":"機能的残気量の増加","d":"胸郭コンプライアンスの増加","e":"換気/血流比不均衡分布の増大"},"choose":"3","chapter":6,"topic":"肥満患者の管理","answer":["a","b","e"],"status":"確定","explanation":"肥満では横隔膜挙上、呼気予備量・機能的残気量低下、胸郭コンプライアンス低下、換気血流不均衡増大を認める。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第6章 全身管理上問題となる疾患","p":"書籍p.314-400"}],"note":""},{"n":60,"stem":"意識下挿管の適応はどれか.すべて選べ.","options":{"a":"認知症患者","b":"病的肥満患者","c":"フルストマック患者","d":"気道確保困難患者","e":"重度知的能力障害患者"},"choose":"all","chapter":5,"topic":"気道確保困難","answer":["b","c","d"],"status":"確定","explanation":"病的肥満、フルストマック、予測困難気道では自発呼吸を保った意識下挿管を検討する。協力困難な認知症・重度知的障害は一般に適さない。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第5章 全身麻酔","p":"書籍p.197-313"}],"note":""},{"n":61,"stem":"covid-19 ワクチン接種後の待機手術はどの程度空けることが推奨されているか．1 つ選べ．","options":{"a":"2 日","b":"7 日","c":"14 日","d":"21 日","e":"49 日"},"choose":"1","chapter":5,"topic":"術前評価","answer":["b"],"status":"確定","explanation":"COVID-19ワクチン接種後は副反応と術後症状の混同を避けるため、待機手術まで少なくとも約7日空けることが推奨される。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第5章 全身麻酔","p":"書籍p.197-313"}],"note":""},{"n":62,"stem":"JSA 気道管理ガイドライン 2014 における麻酔前気道評価について，術前に評価すべき 12 の危険因子に含まれるのはどれか．すべて選べ．","options":{"a":"アゴひげの存在","b":"BMI 30 kg/m2以上","c":"切歯間距離 3 cm 未満","d":"頸部周囲径 40 cm 以上","e":"Upper lip bite test class III"},"choose":"all","chapter":5,"topic":"気道確保困難","answer":["a","b","c","d","e"],"status":"確定","explanation":"ひげ、BMI 30以上、切歯間距離3 cm未満、頸囲40 cm以上、upper lip bite test class IIIはいずれもJSA気道評価の危険因子に含まれる。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第5章 全身麻酔","p":"書籍p.197-313"}],"note":""},{"n":63,"stem":"経鼻カニュラ 2 L/分で投与した際の推定吸入器酸素濃度はどれか．1 つ選べ．","options":{"a":"24%","b":"28%","c":"32%","d":"36%","e":"40%"},"choose":"1","chapter":5,"topic":"酸素療法","an :"心房粗動","c":"心房細動","d":"Torsades de points","e":"発作性上室性頻拍"},"choose":"1","chapter":6,"topic":"QT延長症候群","answer":["d"],"status":"確定","explanation":"QT延長症候群では早期後脱分極を介してTorsades de pointesを生じる危険がある。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第6章 全身管理上問題となる疾患","p":"書籍p.314-400"}],"note":""},{"n":75,"stem":"左室流出路狭窄を伴う肥大型心筋症患者に対し,周術期に使用する昇圧薬で正しいのはどれか．1 つ選べ．","options":{"a":"ドパミン塩酸塩","b":"ドブタミン塩酸塩","c":"エフェドリン塩酸塩","d":"フェニレフリン塩酸塩","e":"エチレフリン塩酸塩"},"choose":"1","chapter":6,"topic":"心筋症","answer":["d"],"status":"確定","explanation":"左室流出路狭窄を伴う肥大型心筋症では収縮力・心拍数を増やさず後負荷を保つ純α1作動薬フェニレフリンが適する。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第6章 全身管理上問題となる疾患","p":"書籍p.314-400"}],"note":""},{"n":76,"stem":"Vaughan Williams の抗不整脈薬分類でクラスIII群に属するのはどれか．1 つ選べ．","options":{"a":"ベラパミル塩酸塩IV","b":"リドカイン塩酸塩Ib","c":"ジソピラミドリン酸塩Ia","d":"エスモロール塩酸塩II","e":"アミオダロン塩酸塩III"},"choose":"1","chapter":6,"topic":"抗不整脈薬","answer":["e"],"status":"確定","explanation":"アミオダロンはKチャネル遮断を主体として活動電位持続時間を延長するVaughan Williams分類III群薬である。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第6章 全身管理上問題となる疾患","p":"書籍p.314-400"}],"note":""},{"n":77,"stem":"静脈麻酔薬について正しいのはどれか.すべて選べ.","options":{"a":"ケタミンの特徴は呼吸抑制作用が強い.","b":"ミダゾラムは水溶性で注入時血管痛が少ない.","c":"デクスメデトミジンはα2 受容体作動薬である.","d":"バルビツレートはポルフィリン症患者で禁忌である．","e":"ベンゾジアゼピン系薬剤の拮抗薬にフルニトラゼパムがある．"},"choose":"all","chapter":5,"topic":"静脈麻酔薬","answer":["b","c","d"],"status":"確定","explanation":"ミダゾラムは水溶性、デクスメデトミジンはα2作動薬であり、バルビツレートは急性間欠性ポルフィリン症で禁忌となる。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第5章 全身麻酔","p":"書籍p.197-313"}],"note":""},{"n":78,"stem":"プロポフォールについて正しいのはどれか.すべて選べ．","options":{"a":"強い鎮痛作用を有する.","b":"肝臓で代謝され作用時間が長い.","c":"静脈内投与時に血管痛がある.","d":"中枢性の呼吸抑制作用がある.","e":"制吐作用が強く術後悪心嘔吐の予防に有効である．"},"choose":"all","chapter":5,"topic":"静脈麻酔薬","answer":["c","d","e"],"status":"確定","explanation":"プロポフォールは注入時血管痛、中枢性呼吸抑制を生じる一方、制吐作用を有しPONVを減らす。鎮痛作用は乏しい。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第5章 全身麻酔","p":"書籍p.197-313"}],"note":""},{"n":79,"stem":"局所麻酔薬の作用を減弱させる因子はどれか.1 つ選べ．","options":{"a":"組織の pH が低い.","b":"局所麻酔薬の pKa が低い.","c":"局所麻酔薬の脂溶性が高い.","d":"局所麻酔薬の蛋白結合能が高い.","e":"局所麻酔薬の血管拡張作用が弱い."},"choose":"1","chapter":3,"topic":"局所麻酔薬の薬理","answer":["a"],"status":"確定","explanation":"炎症などで組織pHが低下すると非イオン型局所麻酔薬の割合が減り、神経膜通過が低下して麻酔作用が減弱する。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第3章 局所麻酔","p":"書籍p.108-158"}],"note":""},{"n":80,"stem":"局所麻酔薬中毒の初期症状はどれか.1 つ選べ.","options":{"a":"興奮","b":"徐脈","c":"意識消失","d":"血圧低下","e":"チアノーゼ"},"choose":"1","chapter":3,"topic":"局所麻酔薬中毒","answer":["a"],"status":"確定","explanation":"局所麻酔薬中毒の初期は口周囲しびれ、耳鳴り、金属味、不穏・興奮などの中枢神経刺激症状として現れる。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第3章 局所麻酔","p":"書籍p.108-158"}],"note":""},{"n":81,"stem":"脳血流量を増加させるのはどれか.2 つ選べ.","options":{"a":"低血圧","b":"過換気","c":"ケタミン","d":"チアミラール","e":"セボフルラン"},"choose":"2","chapter":5,"topic":"麻酔薬と脳血流","answer":["c","e"],"status":"確定","explanation":"ケタミンは脳代謝・脳血流を増加させ、セボフルランも用量依存性に脳血管を拡張して脳血流を増やす。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第5章 全身麻酔","p":"書籍p.197-313"}],"note":""},{"n":82,"stem":"筋弛緩薬について正しいのはどれか.2 つ選べ.","options":{"a":"非脱分極性筋弛緩薬はニコチン性アセチルコリン受容体に対して拮抗的に作用する．","b":"非脱分極性筋弛緩薬はアセチルコリンエステラーゼで分解される．","c":"脱分極性筋弛緩薬は筋収縮作用がみられる.","d":"非脱分極性筋弛緩薬は副交感神経刺激作用がみられる．","e":"脱分極性筋弛緩薬はスガマデクスで拮抗できる."},"choose":"2","chapter":5,"topic":"筋弛緩薬","answer":["a","c"],"status":"確定","explanation":"非脱分極性筋弛緩薬は筋型ニコチン性ACh受容体の競合拮抗薬である。スキサメトニウムなど脱分極性薬では線維束性収縮を認める。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第5章 全身麻酔","p":"書籍p.197-313"}],"note":""},{"n":83,"stem":"筋弛緩モニターで正しいのはどれか.2 つ選べ.","options":{"a":"TOF カウント 1 の状態は弱い筋弛緩状態である．","b":"TOF カウント 0,PTC 0 の状態は強い筋弛緩状態である．","c":"TOF カウント 0,PTC 3 の状態は回復相の状態である．","d":"TOF カウント 3,PTC 3 の状態は強い筋弛緩状態である．","e":"母子内転筋で得られたモニター結果は横隔膜でも同じ結果である．"},"choose":"2","chapter":2,"topic":"筋弛緩モニター","answer":["b","c"],"status":"確定","explanation":"TOF 0かつPTC 0は強い、ほぼ完全な遮断である。PTCが出現すれば深い遮断から回復相へ入ったことを示す。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第2章 全身管理に必要な基本的知識","p":"書籍p.16-107"}],"note":""},{"n":84,"stem":"術後せん妄について正しいのはどれか.2 つ選べ.","options":{"a":"手術 1 週間後に発症することが多い.","b":"術後にゆっくりと症状が発生してくる.","c":"症状が夜間に悪化することが特徴である.","d":"80 歳以上の高齢者が危険因子の一つである.","e":"治療にはベンゾジアゼピン系薬剤を用いる."},"choose":"2","chapter":5,"topic":"術後せん妄","answer":["c","d"],"status":"確定","explanation":"術後せん妄は急性・変動性に発症し夜間悪化しやすい。高齢、とくに80歳以上は重要なリスク因子である。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第5章 全身麻酔","p":"書籍p.197-313"}],"note":""},{"n":85,"stem":"頭蓋内圧亢進により生じる反射はどれか.1 つ選べ.","options":{"a":"Aschner 反射","b":"Cushing 反射","c":"Babinski 反射","d":"Bainbridge 反射","e":"Hering-Beruer 反射"},"choose":"1","chapter":2,"topic":"頭蓋内圧亢進","answer":["b"],"status":"確定","explanation":"頭蓋内圧亢進では高血圧、徐脈、呼吸異常を伴うCushing反射を生じる。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第2章 全身管理に必要な基本的知識","p":"書籍p.16-107"}],"note":""},{"n":86,"stem":"心筋壊死を示すバイオマーカーにおいて,最も心筋特異性が高いのはどれか．1 つ選べ．","options":{"a":"AST","b":"LDH","c":"APTT","d":"トロポニン","e":"ミオグロビン"},"choose":"1","chapter":6,"topic":"虚血性心疾患","answer":["d"],"status":"確定","explanation":"心筋トロポニンI/Tは心筋特異性が高く、心筋壊死の診断に最も有用なバイオマーカーである。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第6章 全身管理上問題となる疾患","p":"書籍p.314-400"}],"note":""},{"n":87,"stem":"ブルガダ症候群について正しいのはどれか.2 つ選べ．","options":{"a":"小児に多い.","b":"男性に多い.","c":"心臓の器質的な異常を認める.","d":"右側胸部誘導で ST 低下を呈する.","e":"高リスク患者は植え込み型除細動器の適応となる．"},"choose":"2","chapter":6,"topic":"Brugada症候群","answer":["b","e"],"status":"確定","explanation":"Brugada症候群は成人男性に多いチャネル病で、器質的心疾患を伴わず右胸部誘導のST上昇を示す。高リスク例はICD適応となる。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第6章 全身管理上問題となる疾患","p":"書籍p.314-400"}],"note":""},{"n":88,"stem":"血液検査において BNP が基準値よりも高値を示す疾患はどれか．1 つ選べ．","options":{"a":"糖尿病","b":"気管支喘息","c":"高尿酸血症","d":"拡張型心筋症","e":"一過性脳虚血発作"},"choose":"1","chapter":6,"topic":"心筋症","answer":["d"],"status":"確定","explanation":"拡張型心筋症では心室壁応力と心不全が増大し、心室筋から分泌されるBNPが上昇する。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第6章 全身管理上問題となる疾患","p":"書籍p.314-400"}],"note":""},{"n":89,"stem":"閉塞隅角緑内障患者への使用が禁忌となる薬剤はどれか．2 つ選べ．","options":{"a":"ドパミン塩酸塩","b":"アトロピン硫酸塩","c":"ニトログリセリン","d":"ニカルジピン塩酸塩","e":"ランジオロール塩酸塩"},"choose":"2","chapter":6,"topic":"緑内障","answer":["b","c"],"status":"確定","explanation":"アトロピンは抗コリン作用による散瞳で房水 に対し初回1 mg/kgを静注し、症状に応じて追加する。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第5章 全身麻酔","p":"書籍p.197-313"}],"note":""},{"n":100,"stem":"19 歳の女性.術前合併症は特になかった.全身麻酔 下 で 上 下 顎 骨 切 り 術 が 施 行 さ れ， 術 後 に 気 管チューブを抜管し，回復室で経過観察していた．意識は回復しておらず，むせた直後，顎間固定している口から血液が吹き出し，経皮的酸素飽和度が 60％になった．気道確保のための適切な方法はどれか．1 つ選べ．","options":{"a":"緊急気管切開","b":"頭部後屈あご先挙上法","c":"経鼻エアウェイの挿入","d":"盲目的経鼻気管挿管","e":"気管支ファイバーによる経鼻気管挿管"},"choose":"1","chapter":7,"topic":"顎矯正手術の気道管理","answer":["a"],"status":"確定","explanation":"顎間固定中の大量口腔内出血と意識障害でSpO2 60%では経鼻挿管やファイバー視野が確保できず、緊急気管切開による確実な外科的気道確保を選ぶ。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第7章 口腔外科手術と全身麻酔","p":"書籍p.401-413"}],"note":""}],"excluded":[2,10,36,39],"dup":[]},{"id":"2023","label":"2023年 第48回","short":"2023","type":"past","questions":[{"n":1,"stem":"血管迷走神経反射について正しいのはどれか.2 つ選べ．","options":{"a":"動悸を訴える.","b":"女性より男性に多い.","c":"精神鎮静法は予防効果がある.","d":"歯科処置前に発症することはない.","e":"血圧低下にはアトロピン硫酸塩投与は効果がある．"},"choose":"2","chapter":13,"topic":"血管迷走神経反射","answer":["c","e"],"status":"確定","explanation":"精神的緊張の緩和は血管迷走神経反射の予防に有効である。徐脈を伴う血圧低下にはアトロピン静注が推奨される。","onotes":{},"evidence":[{"s":"血管迷走神経反射ガイドライン","p":"CQ1-⑥, CQ2-⑤"}],"note":""},{"n":2,"stem":"肺血栓塞栓症の所見はどれか.1 つ選べ.","options":{"a":"患側肺の過膨張","b":"患側横隔膜の低下","c":"心電図上の左軸偏位","d":"終末呼気二酸化炭素濃度の低下","e":"肺胞-動脈血酸素分圧較差の低下"},"choose":"1","chapter":5,"topic":"肺血栓塞栓症","answer":["d"],"status":"確定","explanation":"肺血栓塞栓症では肺血流が急に途絶し、換気されていても灌流されない死腔換気が増えるため、呼気終末二酸化炭素濃度が低下する。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第5章 全身麻酔","p":"書籍p.197-313"}],"note":""},{"n":3,"stem":"メトヘモグロビン血症を起こしやすい局所麻酔薬はどれか．1 つ選べ．","options":{"a":"リドカイン","b":"アルチカイン","c":"ブピバカイン","d":"プリロカイン","e":"メピバカイン"},"choose":"1","chapter":3,"topic":"メトヘモグロビン血症","answer":["d"],"status":"確定","explanation":"プリロカインの代謝物o-トルイジンはヘモグロビン鉄を2価から3価へ酸化し、メトヘモグロビン血症を起こしやすい。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第3章 局所麻酔","p":"書籍p.108-158"}],"note":""},{"n":4,"stem":"アドレナリンとの相互作用で血圧が低下する薬剤はどれか．2 つ選べ．","options":{"a":"オキシトシン","b":"ハロペリドール","c":"アミトリプチリン","d":"プロプラノロール","e":"クロルプロマジン"},"choo 体刺激により鎮静と鎮痛補助作用を示す。急速な初期負荷では末梢α2B刺激が先行し、一過性の血圧上昇を起こしうる。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第4章 精神鎮静法","p":"書籍p.159-196"}],"note":""},{"n":10,"stem":"全身麻酔導入後,DAM(気道確保困難)プロトコール上，レッドゾーンと判断された．試みるべき処置はどれか．1 つ選べ．","options":{"a":"気管挿管","b":"ECMO 導入","c":"輪状甲状間膜切開","d":"経鼻エアウェイ挿入","e":"ラリンゲアルマスク挿入"},"choose":"1","chapter":5,"topic":"気道確保困難(DAM)","answer":["c"],"status":"確定","explanation":"JSA気道管理アルゴリズムのレッドゾーンはマスクと声門上器具で酸素化を維持できない緊急領域であり、輪状甲状膜切開などの緊急前頸部気道確保へ進む。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第5章 全身麻酔","p":"書籍p.197-313"}],"note":""},{"n":11,"stem":"レミフェンタニルの特徴で正しいのはどれか.1 つ選べ．","options":{"a":"麻薬拮抗性鎮痛薬である.","b":"4 時間投与後の CSHT は約 30 分である.","c":"κ受容体に作用して鎮痛作用を発揮する.","d":"非特異的なエステラーゼにより分解される.","e":"麻酔導入時に 2〜5 μg/kg/分で持続投与する."},"choose":"1","chapter":5,"topic":"レミフェンタニル","answer":["d"],"status":"確定","explanation":"レミフェンタニルは血液・組織中の非特異的エステラーゼで急速に加水分解され、持続投与後も作用消失が速く、状況感応半減期が短い。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第5章 全身麻酔","p":"書籍p.197-313"}],"note":""},{"n":12,"stem":"甲状腺クリーゼの症状で正しいのはどれか.1 つ選べ．","options":{"a":"高熱","b":"高カリウム血症","c":"高炭酸ガス血症","d":"ミオグロビン尿","e":"呼吸性アシドーシス"},"choose":"1","chapter":6,"topic":"甲状腺疾患の管理","answer":["a"],"status":"確定","explanation":"甲状腺クリーゼは甲状腺ホルモン過剰の重篤化で、高熱、著しい頻脈、中枢神経症状、心不全、消化器症状を呈する。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第6章 全身管理上問題となる疾患","p":"書籍p.314-400"}],"note":""},{"n":13,"stem":"副腎皮質ステロイドが投与されている疾患はどれか．3 つ選べ．","options":{"a":"気管支喘息","b":"関節リウマチ","c":"重症筋無力症","d":"パーキンソン病","e":"アルドステロン症"},"choose":"3","chapter":6,"topic":"ステロイド投与患者","answer":["a","b","c"],"status":"確定","explanation":"気管支喘息、関節リウマチ、重症筋無力症はいずれも自己免疫・炎症を抑える目的で副腎皮質ステロイドが用いられる。長期内服例では副腎抑制を考慮する。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第6章 全身管理上問題となる疾患","p":"書籍p.314-400"}],"note":""},{"n":14,"stem":"睡眠時無呼吸症候群について正しいのはどれか.1つ選べ．","options":{"a":"高血圧を伴う.","b":"麻薬感受性は低い.","c":"AHI 7 以上が正常である.","d":"酸素吸入が標準的治療法である.","e":"罹患率は男性よりも女性が多い."},"choose":"1","chapter":6,"topic":"睡眠時無呼吸症候群","answer":["a"],"status":"確定","explanation":"閉塞性睡眠時無呼吸症候群では夜間の低酸素と交感神経活性化が反復し、全身性高血圧、不整脈
