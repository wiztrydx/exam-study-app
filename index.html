},"evidence":[{"s":"歯科麻酔学 第8版 第2章 全身管理に必要な基本的知識","p":"書籍p.16-107"}],"note":""},{"n":25,"stem":"エフェドリン塩酸塩の薬理作用はどれか.2 つ選べ.","options":{"a":"血管収縮","b":"気管支収縮","c":"尿道括約筋弛緩","d":"モノアミンオキシダーゼ活性化","e":"βアドレナリン受容体刺激作用"},"choose":"2","chapter":5,"topic":"昇圧薬の薬理","answer":["a","e"],"status":"確定","explanation":"エフェドリンはノルアドレナリン遊離と受容体直接刺激の両方をもつ混合型交感神経作動薬で、α作用による血管収縮とβ作用を示す。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第5章 全身麻酔","p":"書籍p.197-313"}],"note":""},{"n":26,"stem":"心室頻拍への移行や心臓突然死の可能性の高い心室性期外収縮はどれか．3 つ選べ．","options":{"a":"多形性","b":"RonT 型","c":"QRS 幅が 130 ms","d":"1 時間に 20 回の発現","e":"運動負荷テスト時の発現増加"},"choose":"3","chapter":6,"topic":"心室性期外収縮","answer":["a","b","e"],"status":"確定","explanation":"心室性期外収縮のうち、多形性、R on T型、運動負荷で増加するものは、心室性頻拍や心室細動へ移行する危険性が高い警告所見である。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第6章 全身管理上問題となる疾患","p":"書籍p.314-400"}],"note":""},{"n":27,"stem":"DAPT(Dual Antiplatelet Therapy)に使用される薬剤の組み合わせはどれか．1 つ選べ．","options":{"a":"アスピリン+P2Y12 受容体拮抗薬","b":"アスピリン+ワルファリンカリウム","c":"アスピリン+直接作用型経口抗凝固薬（DOAC）","d":"直接作用型経口抗凝固薬(DOAC)+P2Y12 受容体拮抗薬","e":"ワルファリンカリウム+ダビガトランエテキシラートメタンスルホン酸塩"},"choose":"1","chapter":6,"topic":"抗血栓療法","answer":["a"],"status":"確定","explanation":"DAPTはアスピリンとP2Y12受容体拮抗薬の併用である。アスピリンがトロンボキサンA2産生を、クロピドグレル等がADP依存性血小板活性化を抑える。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第6章 全身管理上問題となる疾患","p":"書籍p.314-400"}],"note":""},{"n":28,"stem":"脳血栓塞栓症患者において血栓溶解療法が奏功するのは発症後数時間以内である．基準となる時間はどれか．1 つ選べ．","options":{"a":"1 時間半","b":"2 時間","c":"3 時間","d":"4 時間半","e":"5 時間"},"choose":"1","chapter":6,"topic":"脳血管障害","answer":["d"],"status":"確定","explanation":"急性虚血性脳卒中のr-tPA静注血栓溶解療法は、適応基準を満たす場合に発症または最終健常確認から4.5時間以内に開始する。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第6章 全身管理上問題となる疾患","p":"書籍p.314-400"}],"note":""},{"n":29,"stem":"プロポフォールについて正しいのはどれか.2 つ選べ．","options":{"a":"陰性変力作用がある.","b":"脳代謝を低下させる.","c":"咽喉頭反射を抑制する.","d":"換気応答は維持される.","e":"中枢性鎮痛作用がある."},"choose":"2","chapter":5,"topic":"プロポフォール","answer":["b","c"],"status":"確定","explanation":"プロポフォールは脳代謝率を低下させ、鎮静深度に応じて嚥下反射や咳・気道閉鎖反射などの咽喉頭防御反射を抑制する。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版","p":"書籍p.190, p.347"}],"note":""},{"n":30,"stem":"宗教的輸血拒否に関するガイドラインで示されている 15 歳未満の患者で親権者が輸血を拒否しているが，輸血が必要と判断された際にとるべき対応はどれか．2 つ選べ．","options":{"a":"親権者の指示に従う.","b":"あくまで無輸血を貫く.","c":"両親から採血した血液を投与する.","d":"親権者の理解を得られるように努力する.","e":"同意が得られなければ児童相談所に虐待通告する．"},"choose":"2","chapter":6,"topic":"輸血拒否患者","answer":["d","e"],"status":"確定","explanation":"15歳未満で救命のため輸血が必要なのに親権者が拒否する場合、まず十分な説明で理解を得る努力をする。同意が得られず児の生命が危険なら医療ネグレクトとして児童相談所に通告する。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第6章 全身管理上問題となる疾患","p":"書籍p.314-400"}],"note":""},{"n":31,"stem":"BIS 値に影響しない麻酔薬はどれか.1 つ選べ.","options":{"a":"亜酸化窒素","b":"ミダゾラム","c":"セボフルラン","d":"チオペンタール","e":"プロポフォール"},"choose":"1","chapter":2,"topic":"BISモニター","answer":["a"],"status":"確定","explanation":"BISは催眠性静脈麻酔薬や揮発性麻酔薬で用量依存性に低下する一方、亜酸化窒素は鎮痛作用が主で、単独ではBIS値への影響が小さい。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第2章 全身管理に必要な基本的知識","p":"書籍p.16-107"}],"note":""},{"n":32,"stem":"非脱分極性筋弛緩薬について正しいのはどれか.1つ選べ．","options":{"a":"乳児は感受性が低い.","b":"低体温で作用時間は短縮する.","c":"マグネシウムは作用を減弱する.","d":"呼吸性アシドーシスで作用は減弱する.","e":"アミノグリコシド系抗菌薬は作用を増強する."},"choose":"1","chapter":5,"topic":"筋弛緩薬の作用因子","answer":["e"],"status":"確定","explanation":"アミノグリコシド系抗菌薬は神経終末からのアセチルコリン遊離を抑制し、終板の感受性にも影響するため、非脱分極性筋弛緩薬の作用を増強する。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第5章 全身麻酔","p":"書籍p.197-313"}],"note":""},{"n":33,"stem":"頸部膿瘍患者の麻酔に際して,合併しやすい病態はどれか．2 つ選べ．","options":{"a":"敗血症","b":"開口障害","c":"皮下気腫","d":"気管支痙攣","e":"誤嚥性肺炎"},"choose":"2","chapter":7,"topic":"膿瘍と麻酔管理","answer":["a","b"],"status":"確定","explanation":"頸部膿瘍は深頸筋膜間隙を介して急速に拡大し、開口障害と気道狭窄を起こしうる。重症感染では敗血症も合併するため、気道と循環の両方を評価する。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第7章 口腔外科手術と全身麻酔","p":"書籍p.401-413"}],"note":""},{"n":34,"stem":"コントロールされていない糖尿病患者の周術期に合併しやすい病態はどれか．2 つ選べ．","options":{"a":"尿崩症","b":"術後感染","c":"気管支痙攣","d":"浸透圧利尿","e":"迷走神経反射"},"choose":"2","chapter":6,"topic":"糖尿病","answer":["b","d"],"status":"確定","explanation":"高血糖は好中球機能と創傷治癒を障害し、術後感染を増やす。著明な高血糖では尿細管内のブドウ糖が水を引き込み、浸透圧利尿と脱水を生じる。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第6章 全身管理上問題となる疾患","p":"書籍p.314-400"}],"note":""},{"n":35,"stem":"I型糖尿病の特徴はどれか.2 つ選べ.","options":{"a":"若年に発症する.","b":"遺伝する傾向がある.","c":"生活習慣病の一つである.","d":"自己免疫性と特発性がある.","e":"インスリンの分泌障害と抵抗性が関与している."},"choose":"2","chapter":6,"topic":"糖尿病","answer":["a","d"],"status":"確定","explanation":"1型糖尿病は若年発症が多く、膠島β細胞が破壊されて絶対的インスリン欠乏となる。病因により自己免疫性と特発性に分類される。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第6章 全身管理上問題となる疾患","p":"書籍p.314-400"}],"note":""},{"n":36,"stem":"呼吸不全で休み休みでないと 46 m 以上歩けない患者は，Hugh-Jones の分類の何度に相当するか．1 つ選べ．","options":{"a":"1 度","b":"2 度","c":"3 度","d":"4 度","e":"5 度"},"choose":"1","chapter":6,"topic":"呼吸機能評価","answer":["d"],"status":"確定","explanation":"Hugh-Jones IV度は、平地でも健康人並みに歩けず、休み休みでなければ50 m程度以上歩けない程度の呼吸困難である。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第6章 全身管理上問題となる疾患","p":"書籍p.314-400"}],"note":""},{"n":37,"stem":"PEEP 5 cmH2O 以上の人工呼吸管理下で ARDS(成人呼吸急迫症候群）に相当する P/F 比の基準はどれか．1 つ選べ．","options":{"a":"100 以下","b":"150 以下","c":"200 以下","d":"250 以下","e":"300 以下"},"choose":"1","chapter":6,"topic":"ARDS","answer":["e"],"status":"確定","explanation":"Berlin定義ではPEEP/CPAP 5 cmH2O以下でなく5 cmH2O以上の条件下で、P/F比300以下をARDSとし、200超〜300以下を軽症とする。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第6章 全身管理上問題となる疾患","p":"書籍p.314-400"}],"note":""},{"n":38,"stem":"肺リクルートメントで起こるのはどれか.2 つ選べ.","options":{"a":"頻脈","b":"血圧低下","c":"喀痰の排泄","d":"一過性の SpO2 の低下","e":"コンプライアンスの低下"},"choose":"2","chapter":5,"topic":"人工呼吸管理","answer":["b","d"],"status":"確定","explanation":"肺リクルートメントで高い気道内圧をかけると静脈還流が一過性に減少し、血圧が低下する。心拍出量の低下や換気血流の一過性変化でSpO2が一時的に低下することもある。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第5章 全身麻酔","p":"書籍p.197-313"}],"note":""},{"n":39,"stem":"アロディニアについて正しいのはどれか.1 つ選べ.","options":{"a":"不快な異常感覚を示す.","b":"刺激に対して無反応になる.","c":"非侵害刺激でも痛みが生じる.","d":"感覚がない領域に痛みを感じる.","e":"侵害刺激に対する痛みが通常より強い."},"choose":"1","chapter":12,"topic":"感覚異常の用語","answer":["c"],"status":"確定","explanation":"アロディニアは、健常な状態では痛みを起こさない軽い触刺激や温度刺激などで痛みが誘発される感覚異常をいう。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第12章 ペインクリニック","p":"書籍p.454-503"}],"note":""},{"n":40,"stem":"呼吸と循環が安定しているが呼びかけに応えない意識消失患者で疑われるのはどれか．2 つ選べ．","options":{"a":"解離性障害","b":"過換気症候群","c":"脳血栓塞栓症","d":"迷走神経反射","e":"局所麻酔薬中毒"},"choose":"2","chapter":13,"topic":"意識消失の鑑別","answer":["a","c"],"status":"確定","explanation":"呼吸と循環が安定していても、呼びかけに反応しない場合は解離性障害のような心因性反応と、脳血栓塞栓症などの器質的中枢神経障害の両方を鑑別する。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第13章 歯科治療における全身的偶発症","p":"書籍p.504-521"}],"note":""},{"n":41,"stem":"3%プロピトカイン 5.4 mL に含まれるプロピトカインの含有量はどれか．1 つ選べ．","options":{"a":"16 mg","b":"32 mg","c":"162 mg","d":"322 mg","e":"540 mg"},"choose":"1","chapter":3,"topic":"局所麻酔薬の用量計算","answer":["c"],"status":"確定","explanation":"3%プロピトカインは30 mg/mLである。したがって5.4 mLに含まれる量は30×5.4=162 mgとなる。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第3章 局所麻酔","p":"書籍p.108-158"}],"note":""},{"n":42,"stem":"悪性高熱症で変異している受容体はどれか.1 つ選べ．","options":{"a":"ドパミン受容体","b":"リアノジン受容体","c":"グルタミン酸受容体","d":"ニコチン性アセチルコリン受容体","e":"ムスカリン性アセチルコリン受容体"},"choose":"1","chapter":5,"topic":"悪性高熱症","answer":["b"],"status":"確定","explanation":"悪性高熱症の多くは骨格筋小胞体のリアノジン受容体RYR1の変異と関連し、誘発薬による過剰なCa2+放出と高代謝を生じる。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第5章 全身麻酔","p":"書籍p.197-313"}],"note":""},{"n":43,"stem":"筋弛緩薬の感受性が最も高いのはどれか.1 つ選べ.","options":{"a":"咬筋","b":"腹筋","c":"咽頭筋","d":"声帯筋","e":"横隔膜"},"choose":"1","chapter":5,"topic":"筋弛緩薬の感受性","answer":["c"],"status":"確定","explanation":"非脱分極性筋弛緩薬に対する感受性は筋群で異なり、咽頭筋など上気道の筋は比較的感受性が高く、残存筋弛緩で気道保護機能が障害されやすい。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第5章 全身麻酔","p":"書籍p.197-313"}],"note":""},{"n":44,"stem":"一回拍出量変化(SVV;Stroke Volume Variation)について正しいのはどれか．3 つ選べ．","options":{"a":"静的指標である.","b":"人工呼吸に影響される.","c":"膠質液投与で上昇する.","d":"血管収縮薬で低下する.","e":"静脈還流量の指標である."},"choose":"3","chapter":2,"topic":"循環モニタリング","answer":["b","d","e"],"status":"確定","explanation":"SVVは陽圧換気に伴う前負荷と一回拍出量の呼吸性変動で、静脈還流と輸液反応性の動的指標である。血管収縮薬で血管容量と還流が改善するとSVVは低下しうる。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第2章 全身管理に必要な基本的知識","p":"書籍p.16-107"}],"note":""},{"n":45,"stem":"慢性心不全を伴う頻脈性心房細動に対する抗不整脈薬はどれか．1 つ選べ．","options":{"a":"ベラパミル塩酸塩","b":"リドカイン塩酸塩","c":"ジルチアゼム塩酸塩","d":"ランジオロール塩酸塩","e":"ATP(アデノシン三リン酸)製剤"},"choose":"1","chapter":6,"topic":"ランジオロール","answer":["d"],"status":"確定","explanation":"ランジオロールは超短時間作用性の高選択的β1遮断薬で、慢性心不全を伴う頻脈性心房細動の頻脈管理に、循環動態を見ながら静注する。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第6章 全身管理上問題となる疾患","p":"書籍p.314-400"}],"note":""},{"n":46,"stem":"静脈血栓塞栓症の既往のある患者で術後肺梗塞を予防するのに有効なのはどれか．2 つ選べ．","options":{"a":"安静","b":"酸素投与","c":"早期離床","d":"アスピリン内服","e":"間欠的下肢圧迫"},"choose":"2","chapter":5,"topic":"肺血栓塞栓症","answer":["c","e"],"status":"確定","explanation":"静脈血栓塞栓症の予防には、早期離床で下肢筋ポンプを回復させ、間欠的空気圧迫法で下肢静脈うっ滞を減らす。既往例では特に重要である。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第5章 全身麻酔","p":"書籍p.197-313"}],"note":""},{"n":47,"stem":"心肺停止患者の AED による波形解析後に「ショックの適応ではありません」とアナウンスがあった．そのときの心電図波形はどれか．すべて選べ．","options":{"a":"正常波形","b":"心房細動","c":"心室細動","d":"脈なし心室頻拍","e":"脈なし電気的活動"},"choose":"all","chapter":15,"topic":"除細動・AED","answer":["a","b","e"],"status":"確定","explanation":"AEDがショック適応と判定するのは心室細動と無脈性心室頻拍である。正常波形、心房細動、無脈性電気活動は非ショック適応で、心停止なら胸骨圧迫を再開する。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第15章 心肺蘇生法","p":"書籍p.533-550"}],"note":""},{"n":48,"stem":"歯科治療中にデンタルチェア上で突然発生した痙攣に対して最初に行うべき対応はどれか．1 つ選べ．","options":{"a":"SpO2 を確認する.","b":"静脈路を確保する.","c":"患者の病歴・服薬歴を確認する.","d":"ジアゼパムの筋肉内注射を行う.","e":"口腔内の挿入物をすべて除去する."},"choose":"1","chapter":13,"topic":"痙攣発作の対応","answer":["e"],"status":"確定","explanation":"歯科治療中に全身痙攣が始まったら、器具や綿球などの口腔内挿入物を速やかに除去し、損傷と誤嚥を防ぐ。無理な開口や口内への物品挿入は行わない。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第13章 歯科治療における全身的偶発症","p":"書籍p.504-521"}],"note":""},{"n":49,"stem":"うつ病と診断され内服治療を受けている患者の全身麻酔管理上問題となるリスクはどれか．2 つ選べ．","options":{"a":"貧血","b":"術後せん妄","c":"悪性高熱症","d":"QT 延長症候群","e":"アナフィラキシー"},"choose":"2","chapter":6,"topic":"精神疾患患者の管理","answer":["b","d"],"status":"確定","explanation":"うつ病自体、高齢、多剤内服は術後せん妄のリスクになる。三環系抗うつ薬や一部の向精神薬はQT間隔を延長し、心室性不整脈のリスクを増やす。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第6章 全身管理上問題となる疾患","p":"書籍p.314-400"}],"note":""},{"n":50,"stem":"頭蓋内圧を上昇させる因子はどれか.2 つ選べ.","options":{"a":"PEEP","b":"過換気","c":"頻呼吸","d":"胸腔内圧の上昇","e":"肺動脈圧の上昇"},"choose":"2","chapter":2,"topic":"頭蓋内圧","answer":["a","d"],"status":"確定","explanation":"PEEPや胸腔内圧上昇は頸静脈からの脳静脈還流を阻害し、頭蓋内血液量を増やして頭蓋内圧を上昇させうる。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第2章 全身管理に必要な基本的知識","p":"書籍p.16-107"}],"note":""},{"n":51,"stem":"運動神経刺激について正しい記載はどれか.1 つ選べ．","options":{"a":"Single twitch 刺激では連続刺激の収縮高を比べる．","b":"Train of four(TOF)では筋収縮の反応強度を測定する．","c":"Tetanus 刺激では 50 Hz 刺激後の単収縮刺激反応をみる．","d":"Post-tetanic count（PTC）では高頻度刺激後の筋の収縮高を評価する．","e":"Double-burst（DBS）刺激では 1 回目と 2 回目の刺激で減衰の程度をみる．"},"choose":"1","chapter":2,"topic":"筋弛緩モニタリング","answer":["e"],"status":"確定","explanation":"Double-burst stimulationは短い3連刺激を2群与え、第1収縮と第2収縮の減衰を触知・視認する。TOFよりも残存筋弛緩のフェードを主観的に感知しやすい。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第2章 全身管理に必要な基本的知識","p":"書籍p.16-107"}],"note":""},{"n":52,"stem":"輸血関連急性肺障害(TRALI)について正しいのはどれか．2 つ選べ．","options":{"a":"溶血性輸血副作用である.","b":"輸血後 24 時間以降に発症する.","c":"肺水腫を伴う呼吸困難を呈する.","d":"血液製剤への放射線照射が予防に有用である.","e":"生物由来製品感染等被害救済制度の対象である."},"choose":"2","chapter":5,"topic":"輸血副作用","answer":["c","e"],"status":"確定","explanation":"TRALIは輸血後6時間以内に発症する非心原性肺水腫で、急な低酸素血症と呼吸困難を呈する。輸血用血液による非溶血性副作用として生物由来製品感染等被害救済制度の対象となる。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第5章 全身麻酔","p":"書籍p.197-313"}],"note":""},{"n":53,"stem":"鎮痛作用がある薬剤はどれか.1 つ選べ.","options":{"a":"ミダゾラム","b":"ケタミン塩酸塩","c":"ドロペリドール","d":"プロポフォール","e":"チオペンタールナトリウム"},"choose":"1","chapter":5,"topic":"静脈麻酔薬の特徴","answer":["b"],"status":"確定","explanation":"ケタミンはNMDA受容体拮抗による強い鎮痛作用をもつ解離性麻酔薬である。プロポフォールやベンゾジアゼピンには実用的な鎮痛作用がない。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第5章 全身麻酔","p":"書籍p.197-313"}],"note":""},{"n":54,"stem":"甲状腺機能低下症患者の周術期管理の注意点はどれか．2 つ選べ．","options":{"a":"覚醒遅延を生じやすい.","b":"体温調節が低下している.","c":"ミダゾラムの使用は控える.","d":"筋弛緩薬に対する感受性が低い.","e":"導入時に高血圧をきたしやすい."},"choose":"2","chapter":6,"topic":"甲状腺疾患の管理","answer":["a","b"],"status":"確定","explanation":"甲状腺機能低下症では代謝と体温調節が低下し、低体温になりやすい。麻酔薬・鎮静薬に対する感受性と作用遅延から覚醒遅延も生じやすい。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第6章 全身管理上問題となる疾患","p":"書籍p.314-400"}],"note":""},{"n":55,"stem":"甲状腺機能亢進症の患者で使用を避けるべき薬剤はどれか．2 つ選べ．","options":{"a":"レミマゾラム","b":"ロクロニウム","c":"アトロピン硫酸塩","d":"アドレナリン添加リドカイン","e":"オクタプレシン添加シタネスト"},"choose":"2","chapter":6,"topic":"甲状腺疾患の管理","answer":["c","d"],"status":"確定","explanation":"甲状腺機能亢進症では交感神経刺激に過敏なため、頻脈を増悪させるアトロピンと、アドレナリン添加局所麻酔薬の使用は避けるまたは最小限とする。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第6章 全身管理上問題となる疾患","p":"書籍p.314-400"}],"note":""},{"n":56,"stem":"糖尿病治療薬で尿に糖を出すことで血糖値を下げる薬剤はどれか．1 つ選べ．","options":{"a":"DPP-4 阻害薬","b":"SGLT2 阻害薬","c":"ビグアナイド薬","d":"スルホニル尿素薬","e":"α-グルコシダーゼ阻害薬"},"choose":"1","chapter":6,"topic":"糖尿病","answer":["b"],"status":"確定","explanation":"SGLT2阻害薬は腎近位尿細管のナトリウム・グルコース共輸送体2を阻害し、ブドウ糖再吸収を抑えて尿中へ糖を排泄する。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第6章 全身管理上問題となる疾患","p":"書籍p.314-400"}],"note":""},{"n":57,"stem":"手術と禁煙について正しいのはどれか.2 つ選べ.","options":{"a":"ニコチンは気管支を拡張する.","b":"術後は禁煙支援の必要はない.","c":"術前 1〜2 週間の禁煙で喀痰排出量は減少する.","d":"両親の喫煙で子供の周術期の合併症は増加する.","e":"禁煙期間を延長するために手術を延期する必要はない．"},"choose":"2","chapter":5,"topic":"周術期禁煙","answer":["d","e"],"status":"確定","explanation":"受動喫煙は小児の気道過敏性や呼吸器合併症を増やす。短期の禁煙でも有害ではなく利益があるため、禁煙期間を延ばすことだけを目的に手術を延期する必要はない。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第5章 全身麻酔","p":"書籍p.197-313"}],"note":""},{"n":58,"stem":"肥満患者で麻酔導入時にとる体位はどれか.1 つ選べ．","options":{"a":"側臥位","b":"ランプ位","c":"ファーラー位","d":"ジャックナイフ位","e":"トレンデンブルグ位"},"choose":"1","chapter":6,"topic":"肥満患者の管理","answer":["b"],"status":"確定","explanation":"肥満患者のランプ位では上半身と頭部を挙上し、外耳道と胸骨切痕が水平になるよう調整する。予備酸素化、マスク換気、喉頭展開を改善する。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第6章 全身管理上問題となる疾患","p":"書籍p.314-400"}],"note":""},{"n":59,"stem":"PEEP(持続的呼気陽圧)による血圧低下の原因はどれか．1 つ選べ．","options":{"a":"肺動脈の収縮","b":"右室拡張能の低下","c":"静脈還流量の減少","d":"肺毛細血管の虚脱","e":"動脈血中酸素濃度の上昇"},"choose":"1","chapter":5,"topic":"人工呼吸管理","answer":["c"],"status":"確定","explanation":"PEEPで胸腔内圧が上昇すると、大静脈と右房への圧勾配が減少して静脈還流量が低下する。その結果、心拍出量が低下し血圧が下がりうる。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第5章 全身麻酔","p":"書籍p.197-313"}],"note":""},{"n":60,"stem":"リザーバーバッグ付きの BVM(バッグバルブマスク）による人工呼吸で 100％酸素を投与するために必要な酸素流量（L/min）はどれか．1 つ選べ．","options":{"a":"1","b":"2","c":"5","d":"7","e":"10"},"choose":"1","chapter":15,"topic":"バッグバルブマスク","answer":["e"],"status":"確定","explanation":"リザーバーバッグ付きBVMで100%に近い高濃度酸素を投与するには、リザーバーが十分に膨らむよう10〜15 L/分程度の高流量酸素を供給する。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第15章 心肺蘇生法","p":"書籍p.533-550"}],"note":""},{"n":61,"stem":"神経血管性歯痛の原疾患はどれか.1 つ選べ.","options":{"a":"狭心症","b":"片頭痛","c":"舌痛症","d":"精神疾患","e":"咀嚼筋筋膜痛"},"choose":"1","chapter":12,"topic":"非歯原性歯痛","answer":["b"],"status":"確定","explanation":"神経血管性歯痛は片頭痛の関連痛として歯や顔面に痛みが知覚される病態である。歯科的器質病変がないのに脈打性の痛みが反復する場合に考慮する。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第12章 ペインクリニック","p":"書籍p.454-503"}],"note":""},{"n":62,"stem":"強直間代性の全身痙攣が発生しはじめる局所麻酔薬の血漿濃度（μg/mL）はどれか．1 つ選べ．","options":{"a":"2","b":"4","c":"10","d":"20","e":"40"},"choose":"1","chapter":3,"topic":"局所麻酔薬中毒","answer":["c"],"status":"確定","explanation":"局所麻酔薬の血中濃度が上昇すると、口周囲しびれ等に続いて中枢神経興奮が進み、概ね10 μg/mL前後で強直間代性全身痙攣を生じうる。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第3章 局所麻酔","p":"書籍p.108-158"}],"note":""},{"n":63,"stem":"非脱分極性筋弛緩薬の作用を増強するのはどれか. 1 つ選べ．","options":{"a":"リン","b":"カリウム","c":"ナトリウム","d":"カルシウム","e":"マグネシウム"},"choose":"1","chapter":5,"topic":"筋弛緩薬の作用因子","answer":["e"],"status":"確定","explanation":"マグネシウムは運動神経終末からのアセチルコリン放出を抑制し、神経筋伝達を低下させるため、非脱分極性筋弛緩薬の作用を増強する。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第5章 全身麻酔","p":"書籍p.197-313"}],"note":""},{"n":64,"stem":"ランジオロール使用時に注意が必要な疾患はどれか．2 つ選べ．","options":{"a":"狭心症","b":"低血圧症","c":"気管支喘息","d":"本態性高血圧","e":"心室性期外収縮"},"choose":"2","chapter":6,"topic":"ランジオロール","answer":["b","c"],"status":"確定","explanation":"ランジオロールは超短時間作用性β1遮断薬で、徐脈と心収縮力低下により低血圧を悪化させうる。選択性は高いが、気管支喘息ではβ2遮断による気管支收縮に注意する。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第6章 全身管理上問題となる疾患","p":"書籍p.314-400"}],"note":""},{"n":65,"stem":"フルマゼニルについて正しいのはどれか.1 つ選べ.","options":{"a":"抗痙攣作用がある.","b":"GABAA 受容体に結合する.","c":"初回投与量は 0.5 mg である.","d":"ミダゾラムと比較して半減期が長い.","e":"末梢型ベンゾジアゼピン受容体に作用する."},"choose":"1","chapter":4,"topic":"フルマゼニル","answer":["b"],"status":"確定","explanation":"フルマゼニルはGABAA受容体複合体上のベンゾジアゼピン結合部位に競合的に結合し、ミダゾラム等の鎮静作用を拮抗する。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第4章 精神鎮静法","p":"書籍p.159-196"}],"note":""},{"n":66,"stem":"高齢者の術前の歯科受診(口腔ケア)による周術期合併症の予防に役立つのはどれか．2 つ選べ．","options":{"a":"AKI","b":"術後転倒","c":"創部感染","d":"誤嚥性肺炎","e":"認知機能低下"},"choose":"2","chapter":10,"topic":"周術期口腔管理","answer":["c","d"],"status":"確定","explanation":"術前口腔ケアで口腔内の病原菌と感染源を減らすと、術後創部感染と、誤嚥した口腔内細菌による誤嚥性肺炎の予防に寄与する。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第10章 高齢者の全身麻酔","p":"書籍p.432-444"}],"note":""},{"n":67,"stem":"PONV の誘因となりやすい薬剤はどれか.2 つ選べ.","options":{"a":"亜酸化窒素","b":"フェンタニル","c":"デキサメタゾン","d":"ドロペリドール","e":"プロポフォール"},"choose":"2","chapter":5,"topic":"PONV","answer":["a","b"],"status":"確定","explanation":"亜酸化窒素は閉鎖腔拡大や中枢作用を介し、オピオイドのフェンタニルは延髄化学受容体引金帯刺激などを介して、どちらもPONVのリスクを高める。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第5章 全身麻酔","p":"書籍p.197-313"}],"note":""},{"n":68,"stem":"セボフルランと比較してデスフルランの特徴として正しいのはどれか．2 つ選べ．","options":{"a":"沸点が低い.","b":"MAC が低い.","c":"気道刺激性が高い.","d":"生体内代謝率が高い.","e":"血液ガス分配係数が高い."},"choose":"2","chapter":5,"topic":"吸入麻酔薬","answer":["a","c"],"status":"確定","explanation":"デスフルランは沸点が室温に近く、専用の加温加圧式気化器が必要である。刺激臭と気道刺激性が強く、導入時に咳や嗅止を起こしやすい。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第5章 全身麻酔","p":"書籍p.197-313"}],"note":""},{"n":69,"stem":"糖尿病の合併症はどれか.3 つ選べ.","options":{"a":"腎症","b":"COPD","c":"網膜症","d":"脂質代謝異常","e":"末梢神経障害"},"choose":"3","chapter":6,"topic":"糖尿病","answer":["a","c","e"],"status":"確定","explanation":"糖尿病の三大細小血管合併症は糖尿病性腎症、糖尿病網膜症、糖尿病性末梢神経障害である。麻酔計画では臓器障害と自律神経障害も評価する。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第6章 全身管理上問題となる疾患","p":"書籍p.314-400"}],"note":""},{"n":70,"stem":"2 歳の女児.1 週間前にかぜ症状があった.鼻閉・咳嗽・咽頭発赤はあったが，発熱・嗄声・くしゃみはなかった．食欲はあるが，下痢をしている．術前の胸部エックス線・血液検査には異常はなかった．体温は 37.0℃であった．呼吸音も正常であった．乳幼児のかぜスコアは何点か．1 つ選べ．","options":{"a":"1〜2","b":"3〜4","c":"5〜6","d":"7〜8","e":"9〜10"},"choose":"1","chapter":9,"topic":"小児の上気道感染","answer":["c"],"status":"確定","explanation":"乳幼児のかぜスコアは鼻閉、咳嗽、咽頭発赤、下痢、2週間以内のかぜ既往の5項目が該当するため5点である。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第9章 小児の麻酔管理","p":"書籍p.419-431"}],"note":""},{"n":71,"stem":"終末呼気二酸化炭素濃度曲線(カプノグラム)の基線が 0 mmHg にならない原因として考えられるのはどれか．1 つ選べ．","options":{"a":"喉頭痙攣","b":"自発呼吸","c":"回路の緩み","d":"呼気再呼吸","e":"気管支痙攣"},"choose":"1","chapter":2,"topic":"カプノグラフィ","answer":["d"],"status":"確定","explanation":"カプノグラムの吸気相で基線が0 mmHgに戻らないのは、CO2を含む呼気を再呼吸している所見である。吸気弁異常、CO2吸収剤消耗、不適切な新鮮ガス流量などを確認する。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第2章 全身管理に必要な基本的知識","p":"書籍p.16-107"}],"note":""},{"n":72,"stem":"意識のない患者で生理的な呼吸であるか判断に迷う場合で最初に行うことはどれか．1 つ選べ．","options":{"a":"人工呼吸を行う.","b":"気管挿管を行う.","c":"気道確保を行う.","d":"胸骨圧迫を開始する.","e":"AED の電極パッドを貼り付ける."},"choose":"1","chapter":15,"topic":"BLS","answer":["d"],"status":"確定","explanation":"反応がなく、正常な呼吸か判断に迷う場合は心停止とみなし、ただちに胸骨圧迫を開始する。しゃくりあげる死戦期呼吸は正常呼吸ではない。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第15章 心肺蘇生法","p":"書籍p.533-550"}],"note":""},{"n":73,"stem":"三叉神経帯状疱疹後神経痛に使用される治療薬はどれか．2 つ選べ．","options":{"a":"プレガバリン","b":"アセトアミノフェン","c":"塩酸デュロキセチン","d":"ロキソプロフェンナトリウム","e":"フルルビプロフェンアキセチル"},"choose":"2","chapter":12,"topic":"帯状疱疹後神経痛","answer":["a","c"],"status":"確定","explanation":"帯状疱疹後神経痛は神経障害性疼痛であり、Caチャネルα2δリガンドのプレガバリン、SNRIのデュロキセチンが第一選択群の薬物として用いられる。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第12章 ペインクリニック","p":"書籍p.454-503"}],"note":""},{"n":74,"stem":"局所麻酔薬中毒の初期症状はどれか.2 つ選べ.","options":{"a":"多弁","b":"徐脈","c":"痙攣","d":"血圧低下","e":"口唇周囲のしびれ"},"choose":"2","chapter":3,"topic":"局所麻酔薬中毒","answer":["a","e"],"status":"確定","explanation":"局所麻酔薬中毒の初期は抑制性神経回路が先に抑制され、多弁・不穏などの興奮症状と口唇周囲のしびれ、金属味、耳鳴などが出現する。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第3章 局所麻酔","p":"書籍p.108-158"}],"note":""},{"n":75,"stem":"下顎孔伝達麻酔が奏功した際,同側で麻酔される組織はどれか．2 つ選べ．","options":{"a":"頰粘膜","b":"舌側歯肉","c":"舌後方 1/3","d":"オトガイ部皮膚","e":"臼歯部頰側歯肉"},"choose":"2","chapter":3,"topic":"伝達麻酔","answer":["b","d"],"status":"確定","explanation":"下顎孔伝達麻酔で下歯槽神経と舌神経が遮断されると、同側の下顎歯、オトガイ神経領域のオトガイ部皮膚、舌側歯肉や舌前方2/3の一般感覚が麻酔される。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第3章 局所麻酔","p":"書籍p.108-158"}],"note":""},{"n":76,"stem":"筋弛緩モニタを行う意義はどれか.3 つ選べ.","options":{"a":"筋収縮の定量化","b":"有害反射の予防","c":"意識レベルの確認","d":"残存筋弛緩薬の検出","e":"術後呼吸不全の予防"},"choose":"3","chapter":2,"topic":"筋弛緩モニタリング","answer":["a","d","e"],"status":"確定","explanation":"筋弛緩モニタは刺激に対する筋収縮を定量化し、術中の遮断深度と抜管前の残存筋弛緩を判定する。TOF比0.9以上を確認することで術後上気道閉塞や呼吸不全を予防する。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第2章 全身管理に必要な基本的知識","p":"書籍p.16-107"}],"note":""},{"n":77,"stem":"アトロピン硫酸塩の薬理作用はどれか.2 つ選べ.","options":{"a":"交感神経刺激","b":"消化管運動促進","c":"膀胱括約筋収縮","d":"瞳孔括約筋収縮","e":"気道の分泌物抑制"},"choose":"2","chapter":5,"topic":"抗コリン薬","answer":["c","e"],"status":"確定","explanation":"アトロピンはムスカリン受容体を遮断する。気道分泌を抑制し、副交感神経遮断で排尿筋を弛緩させる一方、内尿道括約筋は相対的に収縮して尿閉を起こしうる。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第5章 全身麻酔","p":"書籍p.197-313"}],"note":""},{"n":78,"stem":"運動耐容能 4 METS に相当するのはどれか.1 つ選べ．","options":{"a":"水泳ができる.","b":"服を着替える.","c":"急ぎ足で歩ける.","d":"食器洗いができる.","e":"サッカーができる."},"choose":"1","chapter":5,"topic":"心血管リスク評価","answer":["c"],"status":"確定","explanation":"4 METsは平地を時速約6 kmで早歩きする、短い障害物を駆け上がるなどの中等度活動に相当し、「急ぎ足で歩ける」が該当する。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第5章 全身麻酔","p":"書籍p.197-313"}],"note":""},{"n":79,"stem":"デクスメデトミジン塩酸塩について正しいのはどれか．2 つ選べ．","options":{"a":"筋弛緩作用がある.","b":"抗不安作用がある.","c":"心拍数を増加させる.","d":"α2アドレナリン受容体アゴニストである.","e":"二酸化炭素に対する換気応答を強く抑制する."},"choose":"2","chapter":4,"topic":"デクスメデトミジン","answer":["b","d"],"status":"確定","explanation":"デクスメデトミジンは選択的α2アドレナリン受容体作動薬で、青斑核のノルアドレナリン放出を抑えて鎮静・抗不安作用を示す。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第4章 精神鎮静法","p":"書籍p.159-196"}],"note":""},{"n":80,"stem":"半閉鎖型循環式麻酔器における呼吸バッグの位置で正しいのはどれか．1 つ選べ．","options":{"a":"Y ピースと呼気弁の間","b":"吸気弁と Y ピースの間","c":"気道内圧計と吸気弁の間","d":"呼気弁と二酸化炭素吸収装置の間","e":"二酸化炭素吸収装置と気道内圧計の間"},"choose":"1","chapter":5,"topic":"麻酔器・呼吸回路","answer":["d"],"status":"確定","explanation":"半閉鎖式循環式呼吸回路では、呼気ガスは呼気弁を通ってリザーバーバッグとAPL弁に達し、二酸化炭素吸収装置を通って再呼吸される。したがってバッグは呼気弁とCO2吸収装置の間に置かれる。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第5章 全身麻酔","p":"書籍p.197-313"}],"note":""},{"n":81,"stem":"全身麻酔中に筋弛緩薬を用いる理由はどれか.3 つ選べ．","options":{"a":"鎮静効果","b":"術野の確保","c":"体動の防止","d":"喉頭痙攣の防止","e":"循環動態の安定"},"choose":"3","chapter":5,"topic":"筋弛緩薬の使用目的","answer":["b","c","d"],"status":"確定","explanation":"全身麻酔中の筋弛緩薬は骨格筋の緊張を取り術野を確保し、体動を防ぐ。声門閉鎖筋も弛緩させるため、適応と管理の下で喉頭痙攣の解除・予防にも用いられる。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第5章 全身麻酔","p":"書籍p.197-313"}],"note":""},{"n":82,"stem":"厚生労働省が定める麻酔が困難な患者とされているのはどれか．2 つ選べ．","options":{"a":"HbA1c:7.8%","b":"PT-INR：2.2","c":"BMI:30 kg/m2","d":"Hb 値:7.0 g/dL","e":"三尖弁閉鎖不全:II度"},"choose":"2","chapter":1,"topic":"麻酔が困難な患者","answer":["b","d"],"status":"確定","explanation":"診療報酬上の「麻酔が困難な患者」には高度の凝固異常や重度貧血などが含まれる。PT-INR 2.2は出血リスクが高く、Hb 7.0 g/dLは著明な貧血で酸素運搬能が低下している。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第1章 歯科麻酔学総論","p":"書籍p.1-15"}],"note":""},{"n":83,"stem":"頸部郭清術後に起こりやすい合併症はどれか.2 つ選べ．","options":{"a":"胸管損傷","b":"食道穿孔","c":"横隔神経麻痺","d":"顔面神経麻痺","e":"三叉神経麻痺"},"choose":"2","chapter":7,"topic":"頸部郭清術","answer":["a","c"],"status":"確定","explanation":"頸部郭清では左静脈角付近の胸管を損傷して乳び漏を生じうる。深部操作で横隔神経が損傷されると同側横隔膜麻痺と換気障害が起こる。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第7章 口腔外科手術と全身麻酔","p":"書籍p.401-413"}],"note":""},{"n":84,"stem":"副腎クリーゼの症状はどれか.2 つ選べ.","options":{"a":"頻脈","b":"低血圧","c":"体温上昇","d":"心室性不整脈","e":"高カリウム血症"},"choose":"2","chapter":6,"topic":"副腎クリーゼ","answer":["b","e"],"status":"確定","explanation":"副腎クリーゼではコルチゾール欠乏で血管反応性が低下し、難治性低血圧となる。原発性副腎不全ではアルドステロンも低下し、高カリウム血症を生じる。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第6章 全身管理上問題となる疾患","p":"書籍p.314-400"}],"note":""},{"n":85,"stem":"肥満患者で術後無気肺が起こりやすい部位はどこか．1 つ選べ．","options":{"a":"腹側下肺野","b":"背側下肺野","c":"腹側上肺野","d":"背側上肺野","e":"右側上肺野"},"choose":"1","chapter":6,"topic":"肥満患者の管理","answer":["b"],"status":"確定","explanation":"肥満患者の仰臥位・全身麻酔下では横隔膜が頭側偏位し、重力依存部の背側下肺野で末梢気道閉鎖と無気肺が生じやすい。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第6章 全身管理上問題となる疾患","p":"書籍p.314-400"}],"note":""},{"n":86,"stem":"気管切開術を行う際に局所麻酔下と比較して全身麻酔下で合併しやすいのはどれか．2 つ選べ．","options":{"a":"気道熱傷","b":"食道穿孔","c":"皮下気腫","d":"顔面神経麻痺","e":"反回神経麻痺"},"choose":"2","chapter":5,"topic":"気管切開","answer":["a","c"],"status":"確定","explanation":"全身麻酔下の気管切開では高濃度酸素中に電気メスを用いると気道火災・熱傷の危険がある。陽圧換気中の切開やチューブ逸脱で空気が軟部組織に漏れ、皮下気腫も生じやすい。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第5章 全身麻酔","p":"書籍p.197-313"}],"note":""},{"n":87,"stem":"歯科外来の待合室で患者が急に倒れた.まず行うのはどれか．1 つ選べ．","options":{"a":"脈の触知","b":"呼吸の確認","c":"気道の確保","d":"意識状態の確認","e":"対光反射の確認"},"choose":"1","chapter":15,"topic":"BLS","answer":["d"],"status":"確定","explanation":"人が突然倒れた場面では、周囲の安全を確認して肩を叩き呼びかけ、まず反応・意識状態を判定する。反応がなければ応援とAEDを要請する。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第15章 心肺蘇生法","p":"書籍p.533-550"}],"note":""},{"n":88,"stem":"局所麻酔薬の麻酔効果で小さいほど作用発現が早くなるのはどれか．1 つ選べ．","options":{"a":"脂溶性","b":"組織 pH","c":"解離定数","d":"組織浸透性","e":"タンパク結合性"},"choose":"1","chapter":3,"topic":"局所麻酔薬の薬理","answer":["c"],"status":"確定","explanation":"局所麻酔薬のpKaが組織pHに近いほど、神経膜を通過できる非イオン型の割合が高くなる。したがって解離定数pKaが小さいほど作用発現が早い。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第3章 局所麻酔","p":"書籍p.108-158"}],"note":""},{"n":89,"stem":"γ-シクロデキストリン誘導体の筋弛緩作用の不活化の機序はどれか．1 つ選べ．","options":{"a":"抱合","b":"包接","c":"還元","d":"水酸化","e":"エステル化"},"choose":"1","chapter":5,"topic":"スガマデクス","answer":["b"],"status":"確定","explanation":"γ-シクロデキストリン誘導体スガマデクスは、血中のロクロニウム分子を1:1で内部空洞に包接する。自由型濃度が低下し、神経筋接合部から薬物が離れる。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第5章 全身麻酔","p":"書籍p.197-313"}],"note":""},{"n":90,"stem":"ロクロニウム臭化物による深い筋弛緩状態で,TOF刺激には反応せず PTC で単収縮がみられる状態を拮抗するのに必要なγ-シクロデキストリン誘導体の投与量（mg/kg）はどれか．1 つ選べ．","options":{"a":"0.6","b":"0.9","c":"2","d":"4","e":"16"},"choose":"1","chapter":5,"topic":"スガマデクス","answer":["d"],"status":"確定","explanation":"TOF応答がなくPTCで1〜2回以上の反応がある深いロクロニウム遮断は、スガマデクス4 mg/kgで拮抗する。緊急逆転の16 mg/kgと区別する。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第5章 全身麻酔","p":"書籍p.197-313"}],"note":""},{"n":91,"stem":"直接作用型経口抗凝固薬(DOAC)のワルファリンカリウムと比較した特徴はどれか．2 つ選べ．","options":{"a":"安価である.","b":"半減期が短い.","c":"モニターができない.","d":"食事の影響を受けやすい.","e":"頭蓋内出血の発現率が高い."},"choose":"2","chapter":6,"topic":"抗血栓療法","answer":["b","c"],"status":"確定","explanation":"DOACはワルファリンより半減期が短く、作用発現・消失が速い。PT-INRのような抗凝固作用を汎用的に定量する標準モニタリング法がない。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第6章 全身管理上問題となる疾患","p":"書籍p.314-400"}],"note":""},{"n":92,"stem":"Revised Cardiac Risk Index における危険因子はどれか．2 つ選べ．","options":{"a":"喫煙","b":"肥満","c":"腎機能障害","d":"睡眠時無呼吸症候群","e":"インスリンが必要な糖尿病"},"choose":"2","chapter":5,"topic":"心血管リスク評価","answer":["c","e"],"status":"確定","explanation":"Revised Cardiac Risk Indexの6因子にはクレアチニン2.0 mg/dL超の腎機能障害と、インスリン治療中の糖尿病が含まれる。他は高リスク手術、虚血性心疾患、心不全、脳血管疾患である。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第5章 全身麻酔","p":"書籍p.197-313"}],"note":""},{"n":93,"stem":"肺高血圧症の基準となる肺動脈収縮圧はどれか.1つ選べ．","options":{"a":"25 mmHg","b":"35 mmHg","c":"45 mmHg","d":"55 mmHg","e":"65 mmHg"},"choose":"1","chapter":6,"topic":"肺高血圧症","answer":["b"],"status":"確定","explanation":"肺高血圧症を疑う心エコー上の目安として、推定肺動脈収縮期圧35 mmHg以上が用いられる。確定診断と血行動態評価には右心カテーテル検査を用いる。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第6章 全身管理上問題となる疾患","p":"書籍p.314-400"}],"note":""},{"n":94,"stem":"歯科診療における静脈内鎮静法ガイドラインにより鎮静当日の帰宅許可の目安として示されているのはどれか．1 つ選べ．","options":{"a":"排尿がある.","b":"飲水が可能である.","c":"嘔気や嘔吐がない.","d":"人,場所,時間などを認識できる.","e":"ふらつきがなくゆっくりと歩行できる."},"choose":"1","chapter":4,"topic":"鎮静後の帰宅基準","answer":["d"],"status":"確定","explanation":"静脈内鎮静法後の帰宅許可では、バイタル安定とともに人・場所・時間の認識など基本的精神運動機能の回復を確認する。飲水と排尿は必須ではない。","onotes":{},"evidence":[{"s":"静脈内鎮静法ガイドライン","p":"CQ4-2, p.57"}],"note":""},{"n":95,"stem":"Modified Child-Pugh Score を算定するために必要な項目で正しいのはどれか．2 つ選べ．","options":{"a":"ALT","b":"APTT","c":"γ-GTP","d":"PT-INR","e":"血清アルブミン"},"choose":"2","chapter":6,"topic":"肝疾患患者の評価","answer":["d","e"],"status":"確定","explanation":"Modified Child-Pugh scoreは肝性脳症、腹水、総ビリルビン、血清アルブミン、プロトロンビン時間延長またはPT-INRの5項目で肝予備能を評価する。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第6章 全身管理上問題となる疾患","p":"書籍p.314-400"}],"note":""},{"n":96,"stem":"顎変形症手術を受ける唇口蓋裂の既往のある患者において麻酔管理上術前に調べておくべきものはどれか．1 つ選べ．","options":{"a":"髄液漏","b":"食道穿孔","c":"咽頭弁形成","d":"気管軟化症","e":"横隔神経麻痺"},"choose":"1","chapter":7,"topic":"口唇口蓋裂の麻酔","answer":["c"],"status":"確定","explanation":"口唇口蓋裂患者で咽頭弁形成術後の場合、咽頭に作成された組織弁が経鼻チューブや経鼻エアウェイで損傷されうる。術式と開存通路を術前に確認する。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第7章 口腔外科手術と全身麻酔","p":"書籍p.401-413"}],"note":""},{"n":97,"stem":"静脈麻酔薬と比較した場合の揮発性麻酔薬の特徴はどれか．1 つ選べ．","options":{"a":"高分子量である.","b":"体内で代謝されにくい.","c":"気管支収縮作用がある.","d":"鎮痛剤を多く必要とする.","e":"体重により投与量が変化する."},"choose":"1","chapter":5,"topic":"吸入麻酔薬","answer":["b"],"status":"確定","explanation":"揮発性麻酔薬は主に肺から未変化体のまま呼出され、多くは体内代謝率が低い。血液/ガス分配係数に応じて吸入濃度の調節が比較的容易である。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第5章 全身麻酔","p":"書籍p.197-313"}],"note":""},{"n":98,"stem":"レミマゾラムの特徴で正しいのはどれか.2 つ選べ.","options":{"a":"循環抑制が弱い.","b":"注入時痛がある.","c":"フルマゼニルで拮抗可能である.","d":"非特異性エステラーゼにより代謝される.","e":"消失半減期(γ相)はプロポフォールと同程度である．"},"choose":"2","chapter":5,"topic":"レミマゾラム","answer":["a","c"],"status":"確定","explanation":"レミマゾラムは超短時間作用性ベンゾジアゼピンで、プロポフォールと比べて循環抑制が小さい。GABAA受容体のベンゾジアゼピン部位に作用するためフルマゼニルで拮抗できる。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第5章 全身麻酔","p":"書籍p.197-313"}],"note":""},{"n":99,"stem":"心臓ペースメーカーの植え込みの対象となるのはどれか．2 つ選べ．","options":{"a":"洞不全症候群","b":"徐脈性心房細動","c":"ブルガダ症候群","d":"完全右脚ブロック","e":"発作性上室性頻脈"},"choose":"2","chapter":6,"topic":"ペースメーカー","answer":["a","b"],"status":"確定","explanation":"症候性の洞不全症候群と、徐脈による症状や休止を伴う心房細動は永久ペースメーカの適応となる。無症候性の単な徐脈とは区別する。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第6章 全身管理上問題となる疾患","p":"書籍p.314-400"}],"note":""},{"n":100,"stem":"肺コンプライアンスが高いのはどれか.1 つ選べ.","options":{"a":"小児","b":"肥満","c":"妊婦","d":"肺線維症","e":"慢性閉塞性肺疾患"},"choose":"1","chapter":2,"topic":"肺コンプライアンス","answer":["e"],"status":"確定","explanation":"慢性閉塞性肺疾患、とくに肺気腫では肺胞壁の弾性繊維が破壊され、肺の弾性反跳力が低下する。同じ圧変化で容量が大きく変化するため肺コンプライアンスは高い。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版 第2章 全身管理に必要な基本的知識","p":"書籍p.16-107"}],"note":""}],"excluded":[19],"dup":[]},{"id":"2022","label":"2022年 第47回","short":"2022","type":"past","questions":[{"n":1,"stem":"神経障害性の非歯原性歯痛が生じるのはどれか.1つ選べ．","options":{"a":"片頭痛","b":"筋・筋膜痛","c":"三叉神経痛","d":"慢性根尖性歯周炎","e":"オーラルジスキネジア"},"choose":"1","chapter":12,"topic":"非歯原性歯痛","answer":["c"],"status":"確定","explanation":"三叉神経痛は三叉神経領域に発作性電撃痛を生じる神経障害性の非歯原性歯痛である。慢性根尖性歯周炎は歯原性疼痛である。","onotes":{},"evidence":[{"s":"非歯原性歯痛診療ガイドライン","p":"神経障害性疼痛"}],"note":""},{"n":2,"stem":"身長 185 cm,体重 80 kg の成人のおおよその循環血液量はどれか．1 つ選べ．","options":{"a":"2 L","b":"4 L","c":"6 L","d":"8 L","e":"10 L"},"choose":"1","chapter":2,"topic":"循環生理","answer":["c"],"status":"確定","explanation":"成人の循環血液量は概ね70〜75 mL/kgで、80 kgでは約5.6〜6.0 Lとなるため6 Lが最も近い。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版","p":"循環生理"}],"note":""},{"n":3,"stem":"交感神経節後線維はどれか.1 つ選べ.","options":{"a":"Aα","b":"Aβ","c":"Aδ","d":"B","e":"C"},"choose":"1","chapter":2,"topic":"神経線維の分類","answer":["e"],"status":"確定","explanation":"交感神経節後線維は無髄のC線維である。自律神経節前線維は細い有髄のB線維に分類される。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版","p":"神経線維の分類"}],"note":""},{"n":4,"stem":"脳血流量を増加させるのはどれか.1 つ選べ.","options":{"a":"PaO2 の上昇","b":"過換気症候群","c":"ケタミン塩酸塩","d":"フェンタニルクエン酸塩","e":"デクスメデトミジン塩酸塩"},"choose":"1","chapter":2,"topic":"脳血流の調節","answer":["c"],"status":"確定","explanation":"ケタミンは脳代謝量と脳血流量を増加させうる。過換気によるPaCO2低下は脳血管を収縮させ、脳血流を減少させる。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版","p":"脳血流の調節"}],"note":""},{"n":5,"stem":"閉塞性肥大型心筋症の麻酔管理で望ましいのはどれか．1 つ選べ．","options":{"a":"カテコラミンを投与する.","b":"左室後負荷を低下させる.","c":"左室前負荷を減少させる.","d":"ベータ遮断薬を投与する.","e":"セボフルランの使用は避ける."},"choose":"1","chapter":6,"topic":"心筋症患者の管理","answer":["d"],"status":"確定","explanation":"閉塞性肥大型心筋症では頻脈、収縮力増強、前負荷・後負荷低下が流出路狭窄を悪化させる。β遮断薬で心拍数と収縮力を抑える。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版","p":"心筋症患者の管理"}],"note":""},{"n":6,"stem":"筋弛緩薬に対する感受性が最も低いのはどれか.1つ選べ．","options":{"a":"咽頭筋","b":"声帯筋","c":"横隔膜","d":"眼輪筋","e":"拇指内転筋"},"choose":"1","chapter":5,"topic":"筋弛緩薬の薬理","answer":["c"],"status":"確定","explanation":"横隔膜は非脱分極性筋弛緩薬への感受性が低く、比較的早く回復する。咽頭筋は高感受性で残存筋弛緩の影響を受けやすい。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版","p":"筋弛緩薬の薬理"}],"note":""},{"n":7,"stem":"低血糖を最も生じやすい血糖降下薬はどれか.1 つ選べ．","options":{"a":"グリニド薬","b":"DPP-4 阻害薬","c":"ビグアナイド薬","d":"スルホニル尿素薬","e":"α-グルコシダーゼ阻害薬"},"choose":"1","chapter":6,"topic":"糖尿病患者の管理","answer":["d"],"status":"確定","explanation":"スルホニル尿素薬はインスリン分泌を血糖非依存性に促すため、血糖降下薬の中でも遷延性低血糖を生じやすい。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版","p":"糖尿病患者の管理"}],"note":""},{"n":8,"stem":"悪性症候群について正しいのはどれか.2 つ選べ.","options":{"a":"予後はよい.","b":"再発する可能性がある.","c":"自律神経症状には乏しい.","d":"抗精神病薬の急な増量や減量が契機となる.","e":"モノアミンオキシダーゼ阻害薬が有効である."},"choose":"2","chapter":6,"topic":"悪性症候群","answer":["b","d"],"status":"確定","explanation":"悪性症候群は再発しうる。抗精神病薬の開始・増量だけでなく急な減量や中断も契機となり、自律神経不安定を伴う重篤な病態である。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版","p":"悪性症候群"}],"note":""},{"n":9,"stem":"ペースメーカーについて正しいのはどれか.1 つ選べ．","options":{"a":"刺激部位は心房のみである.","b":"DOO は電波干渉を受けない.","c":"作動様式の I は同期を意味する.","d":"作動モードは英文字 6 文字である.","e":"作動様式は日本独自のコードで表す."},"choose":"1","chapter":6,"topic":"ペースメーカー","answer":["b"],"status":"確定","explanation":"DOOは心房・心室を非同期に刺激する固定レート型で、電磁干渉による抑制を受けない。国際コードは通常3〜5文字で表す。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版","p":"ペースメーカー"}],"note":""},{"n":10,"stem":"改変 Child-Pugh 分類で正しいのはどれか.1 つ選べ．","options":{"a":"腎機能障害を判定する.","b":"重症度を 5 段階評価する.","c":"合計点数が低いほど重症である.","d":"血清アルブミン値は考慮されない.","e":"クラス C では手術以外の方法を検討する."},"choose":"1","chapter":6,"topic":"肝疾患患者の管理","answer":["e"],"status":"確定","explanation":"Child-Pugh分類は肝障害を5項目・3段階で評価し、Class Cが最重症である。待機手術では非手術的治療や延期を検討する。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版","p":"肝疾患患者の管理"}],"note":""},{"n":11,"stem":"局所麻酔薬について正しいのはどれか.1 つ選べ.","options":{"a":"分子量は 500 程度である.","b":"4 級アミンが効果を発揮する.","c":"運動神経が最初に伝導遮断される.","d":"神経の細胞膜のナトリウムチャネルを閉鎖する．","e":"アミド型は偽コリンエステラーゼにより加水分解される．"},"choose":"1","chapter":3,"topic":"局所麻酔薬の薬理","answer":["d"],"status":"確定","explanation":"局所麻酔薬は神経細胞膜内側から電位依存性Naチャネルを遮断し、活動電位の発生・伝導を抑制する。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版","p":"局所麻酔薬の薬理"}],"note":""},{"n":12,"stem":"吸入麻酔薬による全身麻酔導入をすみやかにする因子はどれか．1 つ選べ．","options":{"a":"酸素流量増加","b":"心拍出量増加","c":"肺胞換気量増加","d":"機能的残気量増加","e":"血液ガス分配係数高値"},"choose":"1","chapter":5,"topic":"吸入麻酔薬の薬理","answer":["c"],"status":"確定","explanation":"肺胞換気量が増えると肺胞内濃度が吸入濃度へ速く近づき、吸入麻酔薬による導入が速くなる。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版","p":"吸入麻酔薬の薬理"}],"note":""},{"n":13,"stem":"アドレナリンの併用で血圧が下降するのはどれか. 2 つ選べ．","options":{"a":"α遮断薬","b":"β遮断薬","c":"抗精神病薬","d":"MAO 阻害薬","e":"三環系抗うつ薬"},"choose":"2","chapter":3,"topic":"血管収縮薬","answer":["a","c"],"status":"確定","explanation":"α遮断薬とα遮断作用を持つ抗精神病薬では、アドレナリン併用時にβ2血管拡張作用が優位となるアドレナリン反転を生じうる。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版","p":"血管収縮薬"}],"note":""},{"n":14,"stem":"高齢者で増加するのはどれか.2 つ選べ.","options":{"a":"残気量","b":"左室壁厚","c":"基礎代謝量","d":"総体内水分量","e":"血清アルブミン"},"choose":"2","chapter":10,"topic":"高齢者の生理学的変化","answer":["a","b"],"status":"確定","explanation":"加齢では肺弾性収縮力低下により残気量が増え、長期的な後負荷増大などで左室壁厚も増える。基礎代謝量、総体水分、アルブミンは低下する。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版","p":"高齢者の生理学的変化"}],"note":""},{"n":15,"stem":"アナフィラキシーの際に上昇するのはどれか.2 つ選べ．","options":{"a":"ヒスタミン値","b":"アルブミン値","c":"アミラーゼ値","d":"クレアチニン値","e":"総トリプターゼ値"},"choose":"2","chapter":14,"topic":"アナフィラキシー","answer":["a","e"],"status":"確定","explanation":"アナフィラキシーでは肥満細胞からヒスタミンとトリプターゼが放出される。総トリプターゼは診断を補助する血液検査である。","onotes":{},"evidence":[{"s":"アナフィラキシーガイドライン","p":"診断・検査"}],"note":""},{"n":16,"stem":"過換気症候群で上昇するのはどれか.2 つ選べ.","options":{"a":"PaCO2","b":"動脈血 pH","c":"分時換気量","d":"血中カリウムイオン","e":"血中カルシウムイオン"},"choose":"2","chapter":13,"topic":"過換気症候群","answer":["b","c"],"status":"確定","explanation":"過換気では分時換気量が増えてPaCO2が低下し、呼吸性アルカローシスとなるため動脈血pHが上昇する。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版","p":"過換気症候群"}],"note":""},{"n":17,"stem":"術中乏尿の原因で考えられるのはどれか.2 つ選べ．","options":{"a":"高血糖","b":"膠質液の投与","c":"腎血流量の低下","d":"心拍出量の増加","e":"バソプレシンの分泌亢進"},"choose":"2","chapter":5,"topic":"術中乏尿","answer":["c","e"],"status":"確定","explanation":"腎血流量低下は糸球体濾過量を下げ、手術侵襲によるバソプレシン分泌亢進は水再吸収を増やすため、いずれも術中乏尿の原因となる。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版","p":"術中乏尿"}],"note":""},{"n":18,"stem":"機能的残気量について正しく記載されている式はどれか．1 つ選べ．","options":{"a":"全肺気量−肺活量","b":"肺活量−最大吸気量","c":"予備吸気量+残気量","d":"全肺気量−予備吸気量","e":"全肺気量−最大吸気量"},"choose":"1","chapter":2,"topic":"肺気量分画","answer":["e"],"status":"確定","explanation":"機能的残気量は通常呼気終末に肺内へ残る量で、予備呼気量と残気量の和、すなわち全肺気量から最大吸気量を引いた値である。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版","p":"肺気量分画"}],"note":""},{"n":19,"stem":"機能的残気量が増加するのはどれか.1 つ選べ.","options":{"a":"肥満","b":"妊婦","c":"小児","d":"肺線維症","e":"慢性閉塞性肺疾患"},"choose":"1","chapter":2,"topic":"肺気量分画","answer":["e"],"status":"確定","explanation":"COPD、とくに肺気腫ではエアトラッピングと過膨張により機能的残気量が増加する。肥満、妊娠、拘束性障害では低下する。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版","p":"肺気量分画"}],"note":""},{"n":20,"stem":"心原性ショックの原因となるのはどれか.2 つ選べ．","options":{"a":"心筋梗塞","b":"大量出血","c":"心室細動","d":"肺塞栓症","e":"収縮性心膜炎"},"choose":"2","chapter":14,"topic":"ショックの分類","answer":["a","c"],"status":"確定","explanation":"急性心筋梗塞はポンプ失調を、心室細動は有効心拍出の消失を来し、いずれも心原性ショックの原因となる。大量出血は循環血液量減少性である。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版","p":"ショックの分類"}],"note":""},{"n":21,"stem":"薬物とその作用の組み合わせで正しいのはどれか. 1 つ選べ．","options":{"a":"利尿薬前負荷軽減前負荷軽減","b":"ジルチアゼム","c":"ノルアドレナリン","d":"ジギタリス後負荷軽減心収縮力の増強と血管拡張","e":"PDEIII阻害薬心収縮力の増強と血管収縮"},"choose":"1","chapter":2,"topic":"循環作動薬","answer":["a"],"status":"確定","explanation":"利尿薬は循環血液量と静脈還流を減らし、前負荷を軽減する。PDE III阻害薬は収縮力増強と血管拡張を示す。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版","p":"循環作動薬"}],"note":""},{"n":22,"stem":"Torsades de pointes のリスクとなるのはどれか.1つ選べ．","options":{"a":"ST 上昇","b":"CRBBB","c":"short PR","d":"テント状 T 波","e":"QT 延長症候群"},"choose":"1","chapter":6,"topic":"不整脈","answer":["e"],"status":"確定","explanation":"QT延長は心室再分極の不均一性を増し、早期後脱分極を介してtorsades de pointesを誘発する代表的リスクである。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版","p":"不整脈"}],"note":""},{"n":23,"stem":"人工呼吸関連肺障害の誘因はどれか.1 つ選べ.","options":{"a":"PEEP","b":"頻呼吸","c":"長い吸気時間","d":"長い呼気時間","e":"高い駆動圧(最高気道内圧−PEEP)"},"choose":"1","chapter":5,"topic":"人工呼吸管理","answer":["e"],"status":"確定","explanation":"駆動圧は一回換気量を呼吸器系コンプライアンスで除した圧に相当し、高値は肺胞過伸展と人工呼吸関連肺障害に関連する。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版","p":"人工呼吸管理"}],"note":""},{"n":24,"stem":"従圧式人工呼吸中に起きた喘息発作によって生じる変化はどれか．1 つ選べ．","options":{"a":"EtCO2 の低下","b":"吸気時間の延長","c":"1 回換気量の減少","d":"分時換気量の増加","e":"最高気道内圧の上昇"},"choose":"1","chapter":5,"topic":"人工呼吸管理","answer":["c"],"status":"確定","explanation":"従圧式換気では設定吸気圧が一定なので、喘息発作で気道抵抗が増えると同じ圧で送り込める一回換気量が減少する。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版","p":"人工呼吸管理"}],"note":""},{"n":25,"stem":"病的肥満患者に当てはまるのはどれか.1 つ選べ.","options":{"a":"Aa-DO2 は正常である．（2は下付き）","b":"胸郭コンプライアンスは高い.","c":"機能的残気量は増加している.","d":"肺コンプライアンスは正常である.","e":"クロージングボリュームは低下している."},"choose":"1","chapter":6,"topic":"肥満患者の管理","answer":[],"status":"要確認","explanation":"病的肥満ではFRCと胸郭・呼吸器系コンプライアンスが低下し、V/Q不均衡によってA-aDO2は開大しやすい。クロージング容量も『低下』とはいえず、a〜eの全肢が誤りとなるため正答なし（除外相当）と判定する。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版","p":"肥満患者の管理"}],"note":"病的肥満ではV/Q不均衡によりA-aDO2は一般に開大し、b〜eも誤りである。公開資料に公式除外通知はないが、内容上は正答不在・除外相当。"},{"n":26,"stem":"フェリプレシンの作用について正しいのはどれか. 1 つ選べ．","options":{"a":"主に細静脈に作用する.","b":"子宮収縮作用を有しない.","c":"血管収縮作用はアドレナリンと同等である.","d":"大量投与でも冠動脈収縮と心機能抑制は生じにくい．","e":"狭心症患者にフェリプレシン含有プロピトカイン製剤カートリッジ 4 本までは安全に使用できる．"},"choose":"1","chapter":3,"topic":"血管収縮薬","answer":["a"],"status":"確定","explanation":"フェリプレシンはV1受容体を介して主に静脈側を収縮させる。子宮収縮作用と冠血管収縮作用があり、虚血性心疾患では投与量に注意する。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版","p":"血管収縮薬"}],"note":""},{"n":27,"stem":"大動脈弁狭窄症の患者の術中管理で正しいのはどれか．1 つ選べ．","options":{"a":"徐脈で維持する.","b":"頻脈は許容される.","c":"前負荷を維持する.","d":"後負荷を軽減する.","e":"フェニレフリンの使用を避ける."},"choose":"1","chapter":6,"topic":"弁膜症患者の管理","answer":["c"],"status":"確定","explanation":"重症大動脈弁狭窄では固定性流出路狭窄のため、洞調律、適正心拍数、十分な前負荷と冠灌流圧を維持する。急な後負荷低下を避ける。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版","p":"弁膜症患者の管理"}],"note":""},{"n":28,"stem":"硫酸マグネシウム水和物に関して正しいのはどれか．1 つ選べ．","options":{"a":"制吐作用がある.","b":"筋弛緩作用は有しない.","c":"ジギタリス中毒に有効である.","d":"ナトリウムチャネル遮断作用を有する.","e":"Torsades de pointes の治療に有効である."},"choose":"1","chapter":6,"topic":"不整脈","answer":["e"],"status":"確定","explanation":"硫酸マグネシウムはtorsades de pointesの第一選択薬で、血清Mg値が正常でも静注する。神経筋伝達を抑制し筋弛緩を増強しうる。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版","p":"不整脈"}],"note":""},{"n":29,"stem":"APL バルブの役割に当てはまるのはどれか.2 つ選べ．","options":{"a":"換気流量の設定","b":"最大吸気圧の設定","c":"余剰ガス排出圧の設定","d":"自発呼吸中の PEEP の設定","e":"調節呼吸中の PEEP idence":[{"s":"歯科麻酔学 第8版","p":"酸素化の生理"}],"note":""},{"n":35,"stem":"シャントと無気肺について正しいのはどれか.2 つ選べ．","options":{"a":"シャントは健康成人ではみられない.","b":"無気肺は死腔として酸素化の障害となる.","c":"シャントは自発呼吸下での全身麻酔では増加しない．","d":"肺リクルートメント手技は無気肺の予防に効果がある．","e":"仰臥位での全身麻酔中の無気肺は背側に起こりやすい．"},"choose":"2","chapter":2,"topic":"シャント・無気肺","answer":["d","e"],"status":"確定","explanation":"肺リクルートメントは虚脱肺胞を再開通させ、仰臥位全身麻酔の無気肺は重力依存部である背側肺に生じやすい。無気肺は死腔でなくシャントを作る。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版","p":"シャント・無気肺"}],"note":""},{"n":36,"stem":"ヘモグロビン酸素解離曲線が左方移動するのはどれか．1 つ選べ．","options":{"a":"pH 低下","b":"温度上昇","c":"ATP 増加","d":"2,3 DPG 増加","e":"メトヘモグロビンの増加"},"choose":"1","chapter":2,"topic":"酸素解離曲線","answer":["e"],"status":"確定","explanation":"メトヘモグロビン増加では残存する正常ヘムの酸素親和性が上がり、酸素解離曲線は左方移動する。アシドーシス、発熱、2,3-DPG増加は右方移動因子である。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版","p":"酸素解離曲線"}],"note":""},{"n":37,"stem":"低酸素換気応答曲線において換気量が急激に増加する PaO2 の値として最も適切なのはどれか．1 つ選べ．","options":{"a":"85 mmHg","b":"80 mmHg","c":"75 mmHg","d":"70 mmHg","e":"60 mmHg"},"choose":"1","chapter":2,"topic":"換気応答","answer":["e"],"status":"確定","explanation":"低酸素換気応答はPaO2が約60 mmHgを下回ると末梢化学受容器刺激により急峻に増大する。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版","p":"換気応答"}],"note":""},{"n":38,"stem":"JSA 気道管理ガイドラインの記載として正しいのはどれか．2 つ選べ．","options":{"a":"導入前の酸素吸入は 3 分間行う.","b":"輪状甲状間膜切開ではまず皮膚に横切開を行う．","c":"直視型およびビデオ喉頭鏡による挿管操作は 3回までとする．","d":"入眠後マスク換気ができない時点でイエローゾーンへ移行する．","e":"レッドゾーンに移行したら,まず輪状甲状間膜からの気道確保を試みる．"},"choose":"2","chapter":5,"topic":"困難気道管理","answer":["a","e"],"status":"確定","explanation":"JSAガイドラインは導入前に高濃度酸素を3分間吸入させる。レッドゾーンでは外科的気道確保を優先し、迅速性から輪状甲状膜経由を第一選択とする。","onotes":{},"evidence":[{"s":"JSA気道管理ガイドライン2014","p":"酸素化・挿管試行回数"}],"note":""},{"n":39,"stem":"術前診察において挿管困難を予測するための項目はどれか．すべて選べ．","options":{"a":"肥満","b":"Cormack 分類","c":"オーバーバイト","d":"Mallampati 分類","e":"甲状オトガイ間距離"},"choose":"all","chapter":5,"topic":"挿管困難の予測","answer":["a","c","d","e"],"status":"確定","explanation":"肥満、オーバーバイト、Mallampati分類、甲状オトガイ間距離は術前の挿管困難予測に使う。Cormack分類は喉頭展開後の声門視野分類である。","onotes":{},"evide c"],"status":"確定","explanation":"PRISは高用量・長時間プロポフォール投与などで生じ、代謝性アシドーシス、横紋筋融解、高K血症、不整脈、循環不全を呈する。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版","p":"静脈麻酔薬の薬理"}],"note":""},{"n":61,"stem":"非脱分極性筋弛緩薬の作用を減弱するのはどれか. 1 つ選べ．","options":{"a":"低体温","b":"デスフルラン","c":"マグネシウム","d":"アミノグリコシド系抗菌薬","e":"カルバマゼピンの長期投与"},"choose":"1","chapter":5,"topic":"筋弛緩薬の薬理","answer":["e"],"status":"確定","explanation":"カルバマゼピン長期投与では肝薬物代謝酵素誘導などにより非脱分極性筋弛緩薬への抵抗性が生じ、作用が減弱する。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版","p":"筋弛緩薬の薬理"}],"note":""},{"n":62,"stem":"閉塞性肥大型心筋症患者で昇圧に使用する薬剤はどれか．1 つ選べ．","options":{"a":"ドブタミン","b":"アトロピン","c":"アドレナリン","d":"フェニレフリン","e":"イソプレナリン"},"choose":"1","chapter":6,"topic":"心筋症患者の管理","answer":["d"],"status":"確定","explanation":"閉塞性肥大型心筋症の低血圧には、心拍数・収縮力を増やさず末梢血管抵抗を上げる純α1作動薬フェニレフリンが適する。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版","p":"心筋症患者の管理"}],"note":""},{"n":63,"stem":"悪性高熱症にあって甲状腺クリーゼにないものはどれか．1 つ選べ．","options":{"a":"発汗","b":"不整脈","c":"体温上昇","d":"アシドーシス","e":"ミオグロビン尿"},"choose":"1","chapter":5,"topic":"悪性高熱症","answer":["e"],"status":"確定","explanation":"悪性高熱症では横紋筋崩壊によりミオグロビン尿を来す。発熱、発汗、頻脈・不整脈は甲状腺クリーゼでもみられる。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版","p":"悪性高熱症"}],"note":""},{"n":64,"stem":"プロポフォールの作用で正しいのはどれか.2 つ選べ．","options":{"a":"呼吸抑制は少ない.","b":"心拍出量は増加する.","c":"妊産婦には投与しない.","d":"体血管抵抗は増加する.","e":"血栓性静脈炎を起こすことがある."},"choose":"2","chapter":5,"topic":"静脈麻酔薬の薬理","answer":["e"],"status":"要確認","explanation":"eの静脈炎・血栓性静脈炎は成立する。一方、cの妊産婦一律禁忌は2018年に添付文書から削除され、2022年の試験時点でも『有益性が危険性を上回る場合のみ投与』であったため、第2正答が存在しない除外相当問題である。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版／PMDA 2018年3月27日改訂指示","p":"プロポフォールの妊婦・産婦への投与"}],"note":"教科書ベースの出題意図はc・eと推定されるが、PMDAは2018年に『妊産婦』を禁忌から削除済みで、2022年時点ではeのみ成立する。指定2肢に対する第2正答なし・除外相当。"},{"n":65,"stem":"肝疾患に関わる血液検査値で正しいのはどれか.1つ選べ．","options":{"a":"肝硬変では血小板数が減少する.","b":"肝がんでは ALT が著しく上昇する.","c":"急性肝炎では AST の上昇は少ない.","d":"慢性肝炎では ALP が著しく上昇する.","e":"アルコール性肝炎ではγ-GTP の上昇は少ない．"},"choose":"1","chapter":6,"topic":"肝疾患患者の管理","answer":["a"],"status":"確定","explanation":"肝硬変では門脈圧亢進による脾機能亢 2,"stem":"Fallot 四徴症患者において,呼吸困難軽減のために蹲踞の姿勢を取ることにより増加するのはどれか．1 つ選べ．","options":{"a":"心収縮力","b":"左室後負荷","c":"右室流出路径","d":"大腿動脈血流","e":"右・左シャント"},"choose":"1","chapter":6,"topic":"先天性心疾患","answer":["b"],"status":"確定","explanation":"Fallot四徴症で蹲踞すると体血管抵抗、すなわち左室後負荷が増え、右左シャントが減少して肺血流と酸素化が改善する。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版","p":"先天性心疾患"}],"note":""},{"n":93,"stem":"心筋虚血を悪化させるのはどれか.2 つ選べ.","options":{"a":"徐脈","b":"シバリング","c":"前負荷の上昇","d":"拡張期圧の上昇","e":"呼吸性アルカローシス"},"choose":"2","chapter":6,"topic":"虚血性心疾患","answer":["b","e"],"status":"要確認","explanation":"シバリングは酸素消費量を増やす。呼吸性アルカローシスに伴う低CO2血症は冠血管収縮を起こし酸素供給を低下させるため、強制採用する2肢はb・e。ただし前負荷増加も心筋酸素需要を増すためcも成立し、設問不良である。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版","p":"虚血性心疾患"}],"note":"指定2肢を強制採用する場合はb・e。ただし前負荷増加も左室壁張力と心筋酸素需要を増すためcも真となり、b・c・eの3肢が成立する。"},{"n":94,"stem":"冠攣縮性狭心症について正しいのはどれか.1 つ選べ．","options":{"a":"冠動脈硬化は認められない.","b":"日本人より欧米人の発症率が高い.","c":"冠攣縮は末梢の細い冠動脈に生じる.","d":"アセチルコリン注入で冠攣縮が誘発される.","e":"無症状時の心電図には特徴的な ST 変化がみられる．"},"choose":"1","chapter":6,"topic":"虚血性心疾患","answer":["d"],"status":"確定","explanation":"冠攣縮性狭心症はアセチルコリン冠注で攣縮を誘発し診断できる。攣縮は太い心外膜冠動脈にも起こり、無症状時ECGは正常なことがある。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版","p":"虚血性心疾患"}],"note":""},{"n":95,"stem":"血管拡張物質はどれか.1 つ選べ.","options":{"a":"レニン","b":"カテコールアミン","c":"トロンボキサン AII","d":"アンギオテンシンII","e":"プロスタグランジン I2"},"choose":"1","chapter":2,"topic":"循環生理","answer":["e"],"status":"確定","explanation":"プロスタグランジンI2は血管内皮由来の強力な血管拡張・血小板凝集抑制物質である。トロンボキサンA2は反対に収縮・凝集を促す。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版","p":"循環生理"}],"note":""},{"n":96,"stem":"筋弛緩のモニタリングについて正しいのはどれか. 1 つ選べ．","options":{"a":"安全な抜管の目安は,TOF(train of four)比が 0.7 以上である．","b":"筋弛緩薬に対する感受性は,母指内転筋より呼吸筋のほうが高い．","c":"抗コリンエステラーゼ薬を投与した後はモニタリングしなくてもよい．","d":"臭化ロクロニウム使用時の回復期では,TOFの収縮高は T4 のほうが T1 より高い．","e":"筋弛緩が深いときの筋弛緩効果の判定には,PTC（post tetanic count）法を用いる．"},"choose":"1","chapter":2,"topic":"筋弛緩モニタリング","answer":["e"],"status":"確定","explanation":"深い筋弛緩ではTOF反応が得られないため、テタヌス刺激後の単収縮数をみるPTC法で遮断深度を評価する。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版","p":"筋弛緩モニタリング"}],"note":""},{"n":97,"stem":"脳梗塞の危険因子はどれか.1 つ選べ.","options":{"a":"てんかん","b":"心房細動","c":"慢性腎臓病","d":"虚血性心疾患","e":"慢性閉塞性肺疾患"},"choose":"1","chapter":6,"topic":"脳血管障害患者の管理","answer":["b"],"status":"確定","explanation":"心房細動では左房内、とくに左心耳に血栓が形成され、塞栓性脳梗塞の主要な危険因子となる。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版","p":"脳血管障害患者の管理"}],"note":""},{"n":98,"stem":"薬物とそれが結合する受容体の組み合わせで正しいのはどれか．1 つ選べ．","options":{"a":"ミダゾラムNMDA 受容体","b":"スルピリドドパミン受容体","c":"ケタミン塩酸塩GABAA 受容体","d":"デクスメデトミジン塩酸塩オピオイド受容体","e":"ネオスチグミンメチル硫酸塩ニコチン性アセチルコリン受容体"},"choose":"1","chapter":5,"topic":"麻酔薬の作用機序","answer":["b"],"status":"確定","explanation":"スルピリドは主にドパミンD2受容体を遮断する抗精神病薬である。ミダゾラムはGABAA、ケタミンはNMDA受容体に作用する。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版","p":"麻酔薬の作用機序"}],"note":""},{"n":99,"stem":"脳の加齢変化について正しいのはどれか.すべて選べ．","options":{"a":"脳代謝は減少する.","b":"脳血管の動脈硬化が進行する.","c":"起立性低血圧による失神を起こしやすい.","d":"血圧低下による脳血流の減少が生じやすい.","e":"脳血流の自己調節能は若年者より高血圧側にシフトする．"},"choose":"all","chapter":10,"topic":"高齢者の生理学的変化","answer":["a","b","c","d","e"],"status":"確定","explanation":"加齢では脳代謝・脳血流が減少し、動脈硬化と圧受容器機能低下が進む。自己調節域は高血圧側へ移り、低血圧時の脳灌流低下や失神が起こりやすい。","onotes":{},"evidence":[{"s":"歯科麻酔学 第8版","p":"高齢者の生理学的変化"}],"note":""},{"n":100,"stem":"一過性脳虚血発作(TIA)について正しいのはどれか．1 つ選べ．","options":{"a":"TIA 患者の 80%以上に脳梗塞が発症する.","b":"脳卒中がごく短時間のみ持続する兆候をいう.","c":"TIA 後の脳梗塞の多くは最初の 2 週間に起こる．","d":"神経兆候の持続時間は 5 分以内がほとんどである．","e":"3 か月以内の脳卒中発症率は HASBLED スコアで予測できる．"},"choose":"1","chapter":6,"topic":"脳血管障害患者の管理","answer":["c"],"status":"確定","explanation":"TIA後の脳梗塞リスクは発症直後ほど高く、多くは最初の48時間から2週間以内に起こる。ABCD2などで早期リスクを評価する。","onotes":{},"evidence":[{"s":"脳卒中治療ガイドライン","p":"TIA後早期リスク"}],"note":""}],"excluded":[],"dup":[]}],"notes":[{"id":"01_静脈内鎮静法","title":"01 静脈内鎮静法","md":"# 01｜静脈内鎮静法\n\n> **得点戦略**　薬剤の受容体・呼吸循環作用を横比較し、次に「鎮静深度→監視→帰宅判定」を一本の流れで解く。薬剤名だけの暗記では症例問題に弱い。\n\n## 学習目標\n\n- ミダゾラム、プロポフォール、デクスメデトミジン（DEX）の相違を説明できる。\n- 意識下鎮静と深鎮静を、反応性・気道・自発呼吸・循環から判別できる。\n- 術前絶飲食、術中監視、拮抗薬投与後、帰宅までの安全管理を順序立てられる。\n\n## 高頻度コア\n\n| 項目 | ミダゾラム | プロポフォール | DEX |\n|---|---|---|---|\n| 主作用 | GABA~A~受容体機能増強 | GABA~A~系、用量依存性催眠 | 青斑核α~2A~作動 |\n| 強み | 抗不安、前向性健忘、抗けいれん | 速い導入・覚醒、制吐 | 呼びかけで覚醒しやすい鎮静、鎮痛補助、呼吸抑制が比較的少ない |\n| 弱み | 呼吸抑制、舌根沈下、個体差 | 呼吸・循環抑制、注入時痛、鎮痛なし | 徐脈・低血圧、負荷投与時の一過性高血圧 |\n| 拮抗 | フルマゼニル | 特異的拮抗薬なし | 特異的拮抗薬なし |\n| 試験の語 | CYP3A4、再鎮静 | 脂肪乳剤、健忘、CSHT | α2作動、ノルアドレナリン放出抑制 |\n\n**鎮静は連続体**であり、予定した深度より深くなることがある。意識下鎮静では通常、言語・軽い触刺激に目的をもって応答し、自発呼吸と心血管機能が保たれる。深鎮静では反復・疼痛刺激を要し、気道介入が必要になり得る。名称ではなく患者の反応で判定する。\n\n### 実施アルゴリズム\n\n1. **術前**：既往、内服、アレルギー、気道、ASA-PS、最終飲食、帰宅同伴者を確認。\n2. **準備**：酸素・吸引・バッグマスク・気道器具・救急薬・拮抗薬を即使用可能にする。\n3. **投与**：少量を緩徐に追加し、効果部位への到達を待つ。高齢・衰弱・併用薬では減量。\n4. **監視**：意識、呼吸数、SpO~2~、血圧、心拍・心電図を継続評価。深鎮静リスクでは呼気CO~2~が換気低下の早期検出に有用。\n5. **異常時**：投与中止→刺激・気道開通→酸素→換気補助。拮抗薬は気道管理の代替ではない。\n6. **回復**：意識、歩行、循環、呼吸、疼痛・悪心、出血を再評価し、説明書と同伴者を伴って帰宅。\n\n### 絶飲食の整理\n\n| 摂取物 | 代表的な最短絶食時間 |\n|---|---:|\n| 清澄水（透明な水・果肉なし飲料など） | 2時間 |\n| 母乳 | 4時間 |\n| 人工乳・牛乳・軽食 | 6時間 |\n| 脂肪の多い食事・肉類 | 8時間以上を考慮 |\n\nこれは代表的な待機時間であり、患者背景・鎮静深度・施設基準を優先する。「鎮静だから誤嚥しない」は誤り。\n\n## 計算・判定ポイント\n\n- **再鎮静**：フルマゼニルの作用時間が原因薬より短い場合がある。覚醒した瞬間を帰宅許可にしない。\n- **SpO~2~ 90% ≒ PaO~2~ 約60 mmHg**：酸素解離曲線の肩から急峻部へ移る目安。SpO~2~低下を待たず、呼吸パターン・カプノで先に捉える。\n- **CSHT**：持続投与終了後に血中濃度が50%へ低下する時間。単回投与の消失半減期と同義ではない。\n\n## 過去問パターン（2017–2025）\n\n- 薬物横比較：2017問33–35、2018問74–77、2020問26–27・63、2021問54・57–62、2024問2–5・40–43、2025問15–17。\n- 絶飲食・実施管理：2020問28、2023問94、2024問25、2025問13。\n- 症例での呼吸抑制・不整脈：2017問79、2023問20・79、2024問77・90。\n- 肝腎機能・高齢者での作用変化：2017問23・67・70、2021問45。\n\n## ひっかけ警報\n\n- ベンゾジアゼピンの健忘は原則**前向性**。逆行性と断定しない。\n- DEXは「呼吸抑制がゼロ」ではない。併用薬・過量・気道閉塞を含め監視は必要。\n- プロポフォールに実用的な鎮痛作用はない。疼痛刺激で体動・循環反応は起こり得る。\n- フルマゼニル投与後も、てんかん・長期ベンゾジアゼピン使用では離脱／けいれんに注意。\n\n## ミニ・セルフチェック\n\n1. 呼びかけに反応せず、疼痛刺激で体動し舌根沈下がある。この状態は意識下鎮静か。→ **否。深鎮静として気道介入を準備する。**\n2. DEX中の低血圧・徐脈で最初に見直すものは。→ **投与速度・深度、循環血液量、併用薬。**\n3. フルマゼニルで覚醒直後に帰宅できるか。→ **不可。再鎮静を含む回復観察と帰宅基準の充足が必要。**\n\n## 根拠・参照先\n\n- 『歯科麻酔学 第8版』第4章（精神鎮静法）p.159–196相当：`_data/textbook/pages/p0171.txt`–`p0207.txt`\n- 『歯科診療における静脈内鎮静法ガイドライン』：`_data/guidelines/静脈内鎮静法ガイドライン.txt`\n- 『歯科診療における深鎮静プラクティカルガイド』：`_data/guidelines/歯科診療における深鎮静プラクティカルガイド.txt`\n- 全関連問題：`_data/note_refs/01_静脈内鎮静法.txt`（79問）\n\n"},{"id":"02_筋弛緩薬とモニタリング","title":"02 筋弛緩薬と筋弛緩モニタリング","md":"# 02｜筋弛緩薬と筋弛緩モニタリング\n\n> **得点戦略**　「薬の分類」「深さの測定」「拮抗・抜管」の3層に分ける。筋弛緩＝麻酔・鎮痛ではない。\n\n## 学習目標\n\n- 脱分極性／非脱分極性筋弛緩薬の機序・禁忌・作用変化を比較できる。\n- TOF count、TOF ratio、PTCを状況に応じて選び、残存筋弛緩を判定できる。\n- ロクロニウムに対するスガマデクスの拮抗と再クラーレ化リスクを説明できる。\n\n## 高頻度コア\n\n| 薬剤 | 作用 | 重要点 |\n|---|---|---|\n| スキサメトニウム | ニコチン性ACh受容体を持続脱分極 | 超短時間、線維束攣縮。高K血症、悪性高熱症、筋疾患・熱傷後・長期不動などに注意 |\n| ロクロニウム | 非脱分極性、競合拮抗 | 迅速導入に使用可能。肝胆道系排泄主体、腎障害・高齢・低体温で遷延し得る |\n| ベクロニウム | 非脱分極性、ステロイド骨格 | 肝腎機能低下で遷延に注意 |\n| スガマデクス | γ-シクロデキストリン誘導体 | 血中でロクロニウム等を包接し濃度勾配を作る。複合体は主に腎排泄 |\n\n### 神経筋モニタの地図\n\n| 状態 | 用いる指標 | 読み方 |\n|---|---|---|\n| 深い遮断、TOF反応なし | PTC | 数が増えるほど回復方向。反復測定間隔に注意 |\n| 中等度遮断 | TOF count | T1〜T4の出現数を数える |\n| 回復期 | TOF ratio = T4/T1 | 定量モニタで**0.9以上**を確認して抜管判断 |\n\n尺骨神経を刺激し母指内転筋を測るのが標準的。刺激は最大上刺激を用い、電極、皮膚温、固定、母指の自由な動きを確保する。顔面筋は挿管条件の推定には使えても、回復判定では母指内転筋と同等に扱わない。\n\n### 拮抗・抜管アルゴリズム\n\n1. 薬剤、最終投与時刻、体温、電解質・酸塩基、臓器機能を確認。\n2. **定量的**神経筋モニタで遮断深度を測る。\n3. 深度に見合った拮抗量を選択。投与後も十分な待機と再測定を行う。\n4. TOF比0.9以上に加え、換気・意識・気道防御・循環を確認して抜管。\n5. 上気道閉塞、低換気、誤嚥、筋力低下があれば残存筋弛緩を再評価。\n\n## 作用を増強・遷延させる条件\n\n- 低体温、呼吸性／代謝性アシドーシス、低K血症、低Ca血症、低Mg血症では非脱分極性遮断が増強し得る。\n- 吸入麻酔薬、アミノグリコシド、Mg製剤などは遮断を増強し得る。\n- 重症筋無力症は非脱分極性薬に高感受性。脱分極性薬への反応は単純な逆ではなく、治療薬・病態の影響も受ける。\n- 肥満患者の用量基準は薬剤ごとに異なる。「すべて実体重」は危険な丸暗記。\n\n## 過去問パターン（2017–2025）\n\n- モニタ原理・抜管値：2017問51–53、2018問53、2019問20・27、2020問60、2022問45、2024問45–47、2025問44–47。\n- ロクロニウム／スガマデクス：2017問40、2018問58・65、2019問22、2020問58–59、2021問64–66、2023問44–45。\n- 病態による作用変化：2017問39・71、2018問57、2019問49、2020問57、2024問68。\n\n## ひっかけ警報\n\n- TOF ratioは**T4/T1**。T2/T4ではない。\n- TOF count 4は十分な回復を意味しない。4発見えても比が低い残存筋弛緩がある。\n- スガマデクスはAChE阻害薬ではなく、抗コリン薬併用を原則必要としない。\n- 筋弛緩薬では気管支平滑筋収縮を解除できない。喉頭筋の収縮と気管支攣縮を混同しない。\n\n## ミニ・セルフチェック\n\n1. TOF反応0の深い遮断を評価する刺激は。→ **PTC。**\n2. 4発すべて見えるので抜管してよいか。→ **不可。定量TOF比0.9以上と臨床所見を確認。**\n3. スガマデクス投与後に筋力が再低下した。考えることは。→ **拮抗量不足、深度評価不足、薬物再分布、モニタ条件、他の筋力低下原因。**\n\n## 根拠・参照先\n\n- 『歯科麻酔学 第8版』第2章 筋弛緩モニタ p.105–107、第5章 筋弛緩薬 p.243–250相当：`p0117.txt`–`p0119.txt`, `p0255.txt`–`p0262.txt`\n- 全関連問題：`_data/note_refs/02_筋弛緩薬とモニタリング.txt`（85問）\n\n"},{"id":"03_呼吸生理と酸塩基平衡","title":"03 呼吸生理・酸素運搬・酸塩基平衡","md":"# 03｜呼吸生理・酸素運搬・酸塩基平衡\n\n> **得点戦略**　血液ガスは「pH→PaCO₂→HCO₃⁻→代償→酸素化」の順で読む。単独の数値だけで診断しない。\n\n## 学習目標\n\n- 肺胞換気、死腔、V/Q不均衡、シャント、拡散障害を区別できる。\n- 肺胞気方程式、A–aDO₂、酸素含量、酸塩基の基本計算を使える。\n- 血液ガス症例から一次性変化と代償、混合性障害を判断できる。\n\n## 必修式\n\n| 式 | 意味・試験での使い方 |\n|---|---|\n| `V~A~=(V~T~-V~D~) × f` | 肺胞換気量。PaCO₂は肺胞換気におおむね反比例 |\n| `P~AO2~=F~IO2~(P~B~-P~H2O~)-PaCO~2~/R` | 室内気・海面上で概算しA–a較差へ |\n| `A-aDO~2~=P~AO2~-PaO~2~` | 低換気だけなら比較的正常、V/Q不均衡・シャント・拡散障害で開大 |\n| `CaO~2~=1.34 × Hb × SaO~2~+0.003 × PaO~2~` | 酸素含量の主体はHb結合分。PaO₂正常でも貧血なら含量低下 |\n| `DO~2~=CO × CaO~2~ × 10` | 酸素運搬量。心拍出量と酸素含量の積 |\n\n### 血液ガス6手順\n\n1. pH：酸血症かアルカリ血症か。\n2. PaCO₂：pHと逆方向なら呼吸性要因。\n3. HCO₃⁻：pHと同方向なら代謝性要因。\n4. 予測代償の範囲内か。外れれば混合性障害を疑う。\n5. PaO₂・SpO₂・FiO₂、A–aDO₂で酸素化障害を分類。\n6. 病歴、呼吸数、循環、乳酸、電解質と統合。\n\n| 一次性障害 | pH | PaCO₂ | HCO₃⁻ | 代表例 |\n|---|---|---|---|---|\n| 呼吸性アシドーシス | ↓ | ↑ | 急性は軽度↑ | 鎮静過深、気道閉塞、低換気 |\n| 呼吸性アルカローシス | ↑ | ↓ | 急性は軽度↓ | 不安・疼痛・過換気症候群 |\n| 代謝性アシドーシス | ↓ | 代償性↓ | ↓ | 乳酸、ケトアシドーシス、腎不全 |\n| 代謝性アルカローシス | ↑ | 代償性↑ | ↑ | 嘔吐、利尿薬 |\n\n**Winterの式**（代謝性アシドーシス）：予測PaCO₂ ≒ 1.5×HCO₃⁻+8±2。実測が高ければ呼吸性アシドーシス併存、低ければ呼吸性アルカローシス併存を疑う。\n\n## 酸素解離曲線\n\n- **右方移動**：アシドーシス、PaCO₂上昇、体温上昇、2,3-DPG増加。組織への酸素放出を促す。\n- **左方移動**：逆の条件、胎児Hb、COHb。Hb親和性が上がり組織放出は低下。\n- SpO₂ 90%はPaO₂約60 mmHgの目安。以後は曲線が急峻で、わずかなPaO₂低下が大きなSpO₂低下になる。\n\n## 原因を切る比較表\n\n| 病態 | A–aDO₂ | 酸素投与反応 | 典型 |\n|---|---|---|---|\n| 純粋な肺胞低換気 | 正常〜軽度 | 良好 | 鎮静薬・中枢抑制 |\n| V/Q不均衡 | 開大 | 多くは改善 | COPD、喘息、無気肺の一部 |\n| 右左シャント | 開大 | 高濃度酸素でも改善不十分 | 高度無気肺、心内シャント |\n| 拡散障害 | 開大 | 改善 | 間質性肺疾患 |\n\n## 過去問パターン（2017–2025）\n\n- A–aDO₂・酸素化：2017問12・79、2018問31、2020問1–3、2022問1・5、2023問17、2024問20–24、2025問31–34。\n- 酸塩基・代償：2018問45、2019問1・3、2020問45、2021問1–4、2022問6、2023問14–18、2024問21。\n- 小児・高齢者の呼吸特性：2018問9、2021問67、2023問70、2025問60–63。\n\n## ひっかけ警報\n\n- PaO₂と酸素含量は別物。重度貧血ではPaO₂・SpO₂が保たれてもCaO₂は低い。\n- 過換気症候群の主変化はPaCO₂低下。紙袋再呼吸は低酸素の危険があり行わない。\n- A–aDO₂は年齢・FiO₂で変わる。固定された正常値だけで判定しない。\n- 「代償」はpHを正常方向へ動かすが、通常は過剰に反対側へはしない。\n\n## ミニ・セルフチェック\n\n1. pH 7.25、PaCO₂ 60、HCO₃⁻ 26。→ **急性呼吸性アシドーシスをまず考える。**\n2. Hb 6 g/dL、SaO₂ 100%、PaO₂ 100 mmHg。酸素運搬は正常か。→ **低い。Hb結合酸素が不足。**\n3. 鎮静後低換気でA–aDO₂が正常。主因は。→ **肺胞低換気。**\n\n## 根拠・参照先\n\n- 『歯科麻酔学 第8版』第2章 呼吸生理・酸塩基 p.24–57相当：`p0036.txt`–`p0069.txt`\n- 『過換気症候群』：`_data/guidelines/過換気症候群.txt`\n- 全関連問題：`_data/note_refs/03_呼吸生理と酸塩基平衡.txt`（116問）\n\n"},{"id":"04_局所麻酔薬","title":"04 局所麻酔薬：薬理・中毒・アレルギー","md":"# 04｜局所麻酔薬：薬理・中毒・アレルギー\n\n> **得点戦略**　構造と薬物動態を押さえたうえで、LAST（局所麻酔薬中毒）の時系列を即答できるようにする。アレルギーとの鑑別が頻出。\n\n## 学習目標\n\n- pKa、脂溶性、蛋白結合、血流が発現・力価・持続へ与える影響を説明できる。\n- エステル型／アミド型、各薬剤の代謝と毒性を比較できる。\n- LASTを早期認識し、投与中止から脂肪乳剤を含む蘇生まで組み立てられる。\n\n## 高頻度コア\n\n局所麻酔薬は細胞内側から電位依存性Na⁺チャネルへ結合し、活動電位の発生・伝導を抑える。非イオン型が膜を通過し、細胞内で生じたイオン型が主に受容部位へ作用する。\n\n| 性質 | 臨床との関係 |\n|---|---|\n| pKaが生理的pHに近い | 非イオン型の割合が増え、一般に発現が速い |\n| 脂溶性が高い | 一般に力価が高いが、毒性も考慮 |\n| 蛋白結合率が高い | 一般に作用持続が長い |\n| 組織pH低下（感染・炎症） | 非イオン型が減り、効果が弱くなりやすい |\n| 血管収縮薬併用 | 吸収を遅らせ、局所効果延長・最高血中濃度低下に寄与 |\n\n### 分類\n\n- **アミド型**：リドカイン、メピバカイン、プロピトカイン、ブピバカイン、ロピバカイン、アルチカインなど。主として肝代謝だが、アルチカインはエステル結合も持ち血中エステラーゼの寄与が大きい。\n- **エステル型**：プロカイン、テトラカイン等。血漿コリンエステラーゼで分解され、PABA関連のアレルギーが論点。\n- **特有毒性**：プロピトカインはメトヘモグロビン血症、ブピバカインは重篤な心毒性に注意。\n\n## LAST：時間軸で覚える\n\n**疑う状況**：注入中〜直後の口周囲しびれ、金属味、耳鳴、興奮、構音障害、けいれん、意識低下。循環では高血圧・頻脈から低血圧、伝導障害、心室性不整脈、心停止へ。前駆症状を欠くこともある。\n\n1. **注入を直ちに中止**し、応援要請。\n2. 100%酸素、気道確保、適切な換気。低酸素・高CO₂・アシドーシスは毒性を増悪。\n3. けいれんを速やかに制御し、循環を評価。\n4. 重症例では**20%脂肪乳剤**を早期考慮し、施設プロトコルに従う。\n5. 心停止時は蘇生を継続。ただし通常の蘇生薬を機械的に最大量投与せず、LAST対応指針を参照。\n6. 改善後も再燃・遅発性循環障害を監視。\n\n### アレルギー・VVR・LASTの鑑別\n\n| 所見 | LAST | アナフィラキシー | 血管迷走神経反射 |\n|---|---|---|---|\n| 皮膚 | 通常なし | 蕁麻疹、紅潮、血管浮腫（欠くことも） | 蒼白、冷汗 |\n| 神経 | 口周囲症状、興奮、けいれん | 不安・意識低下は二次的 | 悪心、眼前暗黒感、失神 |\n| 循環 | 不整脈・伝導障害 | 血管拡張・漏出、ショック | 徐脈、低血圧 |\n| 呼吸 | 中枢抑制 | 喉頭浮腫、喘鳴、気管支攣縮 | 一過性、仰臥位で改善しやすい |\n\n## 過去問パターン（2017–2025）\n\n- 作用機序・薬物動態：2017問41–46、2018問67–72、2020問16–20、2021問27–30、2022問37–41。\n- LAST・脂肪乳剤：2019問29–31、2021問31、2023問11–13、2024問50–55、2025問22–28。\n- アレルギー／メトHb：2020問78、2023問1、2024問36・78、2025問8–10。\n\n## ひっかけ警報\n\n- 「局所麻酔後に気分不良＝アレルギー」ではない。VVR、過換気、血管収縮薬反応、LASTを所見で鑑別。\n- 局麻薬は軸索表面のどこからでも同じように作用するのではなく、主な受容部位はNa⁺チャネル内側。\n- 炎症部で効きにくい理由を「血流だけ」で説明しない。酸性化による非イオン型減少が重要。\n\n## ミニ・セルフチェック\n\n1. 注入直後に金属味と耳鳴。最初の行動は。→ **注入中止、応援要請、酸素化・換気評価。**\n2. 感染組織で効果が弱い主因は。→ **低pHにより膜通過できる非イオン型が減る。**\n3. プロピトカイン後、PaO₂正常だがSpO₂が改善しにくくチアノーゼ。→ **メトヘモグロビン血症を疑う。**\n\n## 根拠・参照先\n\n- 『歯科麻酔学 第8版』第3章 p.108–158相当：`p0120.txt`–`p0170.txt`\n- 『局所麻酔アレルギー』：`_data/guidelines/局所麻酔アレルギー.txt`\n- 『セプトカイン』：`_data/guidelines/セプトカイン.txt`\n- 全関連問題：`_data/note_refs/04_局所麻酔薬.txt`（90問）\n\n"},{"id":"05_静脈麻酔薬","title":"05 静脈麻酔薬・全身麻酔薬","md":"# 05｜静脈麻酔薬・全身麻酔薬\n\n> **得点戦略**　各薬を「受容体／脳／呼吸／循環／鎮痛／代謝」の6軸で比較する。症例の弱点に合わない作用を除外する。\n\n## 学習目標\n\n- プロポフォール、バルビツレート、ケタミン、オピオイドの特徴を横断比較できる。\n- 分布・再分布、context-sensitive half-time（CSHT）、効果部位濃度を説明できる。\n- 患者背景から導入・維持薬の利点と危険を判断できる。\n\n## 薬剤マトリクス\n\n| 薬 | 主な機序 | 循環 | 呼吸 | 脳・その他 |\n|---|---|---|---|---|\n| プロポフォール | GABA~A~系 | 血管拡張・心抑制→血圧低下 | 用量依存性抑制、無呼吸 | CBF・CMRO₂・ICP低下、制吐、鎮痛なし、注入時痛 |\n| チオペンタール | GABA~A~系 | 血圧低下 | 抑制 | CBF・CMRO₂・ICP低下、蓄積、ポルフィリン症に注意 |\n| ケタミン | NMDA受容体拮抗 | 交感神経刺激で心拍・血圧上昇が多い | 比較的保たれるが無呼吸・喉頭痙攣は起こり得る | 解離性麻酔、強い鎮痛、唾液分泌、覚醒時反応 |\n| ミダゾラム | GABA~A~受容体機能増強 | 比較的軽いが低血圧あり | 抑制、オピオイド併用で増強 | 抗不安、健忘、抗けいれん、拮抗可能 |\n| フェンタニル | μ作動 | 徐脈、血圧低下 | 強い抑制、胸壁硬直 | 強力鎮痛、鎮静補助、悪心・掻痒 |\n| レミフェンタニル | μ作動、非特異的エステラーゼ分解 | 徐脈・低血圧 | 強い抑制 | 超短時間。持続時間にかかわらず回復が速いが術後鎮痛を残さない |\n\n### 薬物動態の核\n\n- 単回投与後の早い覚醒は、代謝だけでなく**脳から他組織への再分布**による。\n- CSHTは持続投与終了後、血中濃度が50%に下がるまでの時間。投与時間と組織蓄積で変わる。\n- 血中濃度と効果には時間差がある。追加投与を急ぐと、効果部位濃度が後から重なり過鎮静になる。\n- レミフェンタニルは血液・組織エステラーゼで分解され、肝腎機能の影響が比較的小さい。ただし代謝産物の排泄と臨床作用時間は区別する。\n\n## 症例選択の考え方\n\n| 状況 | 利点になり得る薬 | 注意 |\n|---|---|---|\n| 循環血液量低下・高度心機能低下 | ケタミンが候補 | カテコラミン枯渇例では直接心抑制が顕在化し得る |\n| 頭蓋内圧管理 | プロポフォール、バルビツレート | 血圧低下で脳灌流圧を落とさない |\n| 気管支喘息 | プロポフォール／ケタミンが候補 | どの薬でも気道管理・アレルギー評価は必要 |\n| 短時間で確実な覚醒 | プロポフォール、レミフェンタニル | 投与量、年齢、併用薬、術後鎮痛を統合 |\n\n**MAC**は50%の患者で皮膚切開への体動を抑える肺胞濃度。年齢上昇で低下する。鎮痛薬・鎮静薬・体温などで変動し、意識消失濃度そのものではない。\n\n## 過去問パターン（2017–2025）\n\n- 薬理横比較：2017問31–38、2018問74–77、2019問33–39、2020問4・36、2021問60–73、2022問42–44、2023問28–35、2024問40–44、2025問38–43。\n- 脳血流・脳代謝：2017問1・38、2020問4、2021問73、2022問4。\n- CSHT・臓器機能：2017問34・67・70、2021問45・60、2022問42、2025問41。\n\n## ひっかけ警報\n\n- プロポフォールは制吐作用があるが、鎮痛薬ではない。\n- ケタミンで「気道反射は完全に保たれる」「呼吸抑制はない」と断定しない。\n- レミフェンタニルの速い消失を腎排泄の速さで説明しない。\n- オピオイドによる胸壁硬直は単なる筋弛緩不足ではなく、換気困難の原因になる。\n\n## ミニ・セルフチェック\n\n1. プロポフォール導入直後の血圧低下の主因は。→ **血管拡張と心抑制。**\n2. レミフェンタニル終了後の弱点は。→ **鎮痛が急速に消失するため、術後鎮痛を先行して設計する。**\n3. ケタミンを重症虚血性心疾患に無条件で選べるか。→ **否。交感神経刺激による心筋酸素需要増加を考える。**\n\n## 根拠・参照先\n\n- 『歯科麻酔学 第8版』第5章 静脈麻酔 p.232–243、吸入麻酔 p.217–231相当：`p0229.txt`–`p0255.txt`\n- 全関連問題：`_data/note_refs/05_静脈麻酔薬.txt`（99問）\n\n"},{"id":"06_血管収縮薬と歯科用製剤","title":"06 血管収縮薬と歯科用局所麻酔薬製剤","md":"# 06｜血管収縮薬と歯科用局所麻酔薬製剤\n\n> **得点戦略**　濃度表記を「1カートリッジ中の量」へ変換し、受容体作用・基礎疾患・薬物相互作用をつなぐ。\n\n## 学習目標\n\n- アドレナリンとフェリプレシンの作用・注意点を比較できる。\n- ％濃度、○万分の1、カートリッジ容量から薬物量を計算できる。\n- 心血管疾患・内分泌疾患・常用薬に応じたリスク低減策を説明できる。\n\n## 併用目的\n\n血管収縮薬は局所血流を減らし、①麻酔効果の延長、②局麻薬の全身吸収と最高血中濃度の抑制、③術野の止血に寄与する。一方、循環作用と相互作用があるため「基礎疾患があれば必ず無添加」ではなく、疼痛・ストレスによる内因性カテコールアミンも含めて利益とリスクを比較する。\n\n| 項目 | アドレナリン | フェリプレシン |\n|---|---|---|\n| 主作用 | α1血管収縮、β1心刺激、β2気管支拡張等 | バソプレシン類似、主に静脈系を含む血管収縮 |\n| 長所 | 強い止血・作用延長 | 直接的なβ1刺激がない |\n| 注意 | 頻脈、血圧上昇、不整脈、心筋酸素需要増加 | 高用量で冠血管収縮、妊娠で子宮収縮への配慮 |\n| 相互作用 | 非選択的β遮断薬、三環系抗うつ薬、カテコールアミン感受性増強薬等 | 虚血性心疾患で無条件に安全ではない |\n\n## 計算を落とさない\n\n### ％濃度\n\n1% = 1 g/100 mL = **10 mg/mL**。したがって2%リドカインは20 mg/mL。\n\n- 2%リドカイン 1.8 mL：20 × 1.8 = **36 mg**\n- 3%プロピトカイン 1.8 mL：30 × 1.8 = **54 mg**\n\n### ○万分の1\n\n1:100,000 = 1 g/100,000 mL = **0.01 mg/mL = 10 µg/mL**。\n\n- 1:80,000アドレナリン：0.0125 mg/mL。1.8 mLなら **22.5 µg**\n- 1:100,000アドレナリン：0.01 mg/mL。1.8 mLなら **18 µg**\n\n> カートリッジ容量は製剤により異なる。問題文のmLを必ず使い、銘柄の記憶だけで計算しない。\n\n## 安全な投与フロー\n\n1. 病歴：狭心症発作、血圧、不整脈、甲状腺機能、褐色細胞腫、服薬を確認。\n2. 使用目的と必要最小量を決める。疼痛コントロールを不十分にしない。\n3. 吸引確認、緩徐な分割注入、患者との会話、脈拍・血圧の観察。\n4. 動悸・頭痛・胸痛・不整脈では中止し、酸素化・循環を評価。LAST、過換気、VVRも鑑別。\n5. 追加時は局麻薬と血管収縮薬の**累積量**を再計算。\n\n## 過去問パターン（2017–2025）\n\n- 受容体作用：2017問47–48、2020問21–23、2021問32–34、2023問62–64、2024問57–60。\n- 製剤・濃度計算：2018問64・68、2019問30、2022問38・40、2023問62、2024問58、2025問19–21。\n- 基礎疾患と相互作用：2019問79、2020問72、2022問65、2023問2–4、2024問1・7。\n\n## ひっかけ警報\n\n- アドレナリンのβ2作用は気管支**拡張**、α1作用は血管**収縮**。\n- フェリプレシンは「心疾患に常に安全」ではない。高用量の冠収縮を忘れない。\n- 1:100,000を100 µg/mLとしない。正しくは10 µg/mL。\n- アドレナリン反転はα遮断下でβ2血管拡張が優位となる現象。非選択的β遮断時の高血圧とは逆の機序。\n\n## ミニ・セルフチェック\n\n1. 2%リドカイン1.8 mLは。→ **36 mg。**\n2. 1:100,000アドレナリン1.8 mLは。→ **18 µg。**\n3. 非選択的β遮断薬服用者でアドレナリン後に起こり得ることは。→ **α作用が相対的に優位となる著明な血圧上昇・反射性徐脈。**\n\n## 根拠・参照先\n\n- 『歯科麻酔学 第8版』第3章 歯科用製剤・血管収縮薬 p.125–139相当：`p0137.txt`–`p0151.txt`\n- 製剤情報：`_data/guidelines/セプトカイン.txt`\n- 全関連問題：`_data/note_refs/06_血管収縮薬と歯科用製剤.txt`（76問）\n\n"},{"id":"07_循環生理と心疾患","title":"07 循環生理・虚血性心疾患・弁膜症・心不全","md":"# 07｜循環生理・虚血性心疾患・弁膜症・心不全\n\n> **得点戦略**　血圧の式と心筋酸素需給を軸に、疾患別の「保つもの／避けるもの」を整理する。\n\n## 学習目標\n\n- 心拍出量、血圧、前負荷・後負荷・収縮力の関係を説明できる。\n- 虚血性心疾患、弁膜症、心不全の術前評価と麻酔目標を比較できる。\n- 胸痛・低血圧・肺うっ血の症例を、初期対応へ結びつけられる。\n\n## 生理の骨格\n\n- `CO=HR × SV`、`MAP ≈ DBP+(SBP-DBP)/3`、`MAP ≈ CO × SVR`。\n- 冠血流、特に左冠は主に**拡張期**。頻脈は拡張時間を短縮し心筋酸素需給を悪化させる。\n- 心筋酸素需要を増やす主因は心拍数、収縮力、壁張力（前負荷・後負荷）。低酸素、貧血、低血圧は供給を減らす。\n- 脈圧はSVと動脈コンプライアンスに左右される。高齢では動脈硬化により脈圧が増えやすい。\n\n## 疾患別「保つ／避ける」\n\n| 病態 | 保つ | 避ける |\n|---|---|---|\n| 虚血性心疾患 | 酸素化、適切な拡張期圧、洞調律、鎮痛 | 頻脈、著明な高・低血圧、貧血、低酸素 |\n| 大動脈弁狭窄 | 前負荷、後負荷、洞調律、冠灌流 | 頻脈、急なSVR低下、低血圧 |\n| 大動脈弁閉鎖不全 | 過度に遅くない心拍、前方拍出 | 徐脈、著明な後負荷上昇 |\n| 僧帽弁狭窄 | 洞調律、緩徐な心拍、肺血管抵抗抑制 | 頻脈、容量過剰、低酸素・高CO₂ |\n| 心不全 | 酸素化、心拍・前負荷の適正化 | 急速輸液、心筋抑制、頻脈、後負荷過大 |\n\n### 術前評価フロー\n\n1. **活動性心疾患**：不安定狭心症、最近の症状変化、非代償性心不全、重篤不整脈、症候性重症弁膜症を確認。\n2. 手術侵襲と緊急度、機能的能力（METs）、既往（虚血、心不全、脳血管、腎、糖尿病）を統合。\n3. 検査は結果が管理を変える場合に選ぶ。ルーチンの過剰検査は目的化しない。\n4. 抗血栓薬・循環器薬は、血栓リスクと出血リスクを手技ごとに調整。自己判断で中止させない。\n\n### 胸痛が起きたら\n\n歯科処置中止→安静・応援→ABCDE、バイタル、酸素は低酸素時に適正化→12誘導ECGや救急搬送を迅速に判断。患者本人の処方ニトログリセリンの適応と血圧、PDE5阻害薬服用を確認する。症状持続、血行動態不安定、ACS疑いでは院内完結を狙わない。\n\n## 過去問パターン（2017–2025）\n\n- 循環生理・波形：2017問14–20、2018問10–16、2020問7–10、2023問21–27、2024問26–32。\n- 虚血・心不全：2017問54–58、2019問72–77、2020問65–69、2022問58–63、2024問64–67、2025問68–73。\n- 弁膜症・感染性心内膜炎：2018問61–62、2021問39–44、2023問71–76。\n\n## ひっかけ警報\n\n- 狭心症患者の血圧を一律に低く保つのは誤り。冠灌流圧も必要。\n- 心不全で前負荷を「ゼロに近づける」のも誤り。過不足のない最適点を目指す。\n- METsとASA-PSは別尺度。METsは機能的能力、ASA-PSは全身状態分類。\n- IE予防抗菌薬の対象は、すべての心雑音・すべての弁膜症ではない。最新指針の高リスク群と手技を確認。\n\n## ミニ・セルフチェック\n\n1. 頻脈が虚血を悪化させる二つの理由は。→ **酸素需要増加と拡張期短縮による冠血流低下。**\n2. 重症ASで導入後血圧低下。危険な理由は。→ **冠灌流低下と固定性流出路狭窄で拍出を増やしにくい。**\n3. 活動性心疾患が疑われる予定処置。→ **延期・専門評価を含め、まず病態を安定化。**\n\n## 根拠・参照先\n\n- 『歯科麻酔学 第8版』第2章 循環生理 p.37–50、第6章 循環系疾患 p.325–344相当：`p0049.txt`–`p0062.txt`, `p0337.txt`–`p0356.txt`\n- 『非心臓手術の心血管ガイドライン』：`_data/guidelines/非心臓手術の心血管ガイドライン.txt`\n- 全関連問題：`_data/note_refs/07_循環生理と心疾患.txt`（81問）\n\n"},{"id":"08_不整脈と心電図","title":"08 不整脈・心電図・ペースメーカ","md":"# 08｜不整脈・心電図・ペースメーカ\n\n> **得点戦略**　心電図は「rate → rhythm → P → PR → QRS → ST/T → QT」の固定手順で読む。波形名より先に、脈あり／なし・安定／不安定を判定する。\n\n## 学習目標\n\n- 系統的に12誘導・モニタ心電図を読める。\n- 頻拍・徐拍を血行動態と組み合わせて初期対応を選べる。\n- ペースメーカ／ICD患者の歯科処置で必要な確認と電磁干渉対策を説明できる。\n\n## 心電図の定規\n\n標準記録25 mm/s、10 mm/mVでは、小マス0.04秒、大マス0.20秒、縦1 mm=0.1 mV。\n\n| 項目 | 代表的正常範囲・判断 |\n|---|---|\n| 心拍数 | 300÷大マス数、または1500÷小マス数（整の場合） |\n| PR | 0.12–0.20秒 |\n| QRS | 通常0.12秒未満 |\n| QTc | 心拍補正して評価。薬剤・電解質と統合 |\n| 洞調律 | 各QRS前に一定形P、一定PR、PとQRSが1:1 |\n\n## 波形の要点\n\n| 不整脈 | 特徴 | 試験上の分岐 |\n|---|---|---|\n| 心房細動 | Pなし、RR絶対不整 | 血栓塞栓リスク、心拍数、抗凝固 |\n| 上室頻拍 | 規則的狭QRS頻拍が多い | 安定なら迷走神経手技・薬物、治療抵抗／不安定なら同期下通電を検討 |\n| 心室頻拍 | 幅広QRS頻拍 | 脈なしは除細動対象、脈あり不安定は同期下カルディオバージョン |\n| 心室細動 | 無秩序、拍出なし | CPR＋早期除細動 |\n| torsades de pointes | QT延長を背景に多形性VT | Mg、原因薬・電解質補正。無脈なら除細動 |\n| 房室ブロック | PR延長、脱落、P-QRS解離 | 高度・症候性ではペーシングを考慮 |\n\n### 急変アルゴリズム\n\n1. 患者反応、呼吸、**脈拍**を確認。モニタ波形だけで心停止と決めない。\n2. 無脈：CPR開始、VF／無脈性VTなら除細動。PEA／心静止は除細動しない。\n3. 脈あり：低血圧、意識変容、ショック、虚血性胸部不快感、急性心不全があれば不安定。\n4. 不安定頻拍：原則同期下カルディオバージョン。多形性VTや同期不能は除細動。\n5. 安定：12誘導、QRS幅・規則性、原因（低酸素、電解質、薬剤、虚血）を評価。\n\n## ペースメーカ／ICD\n\n- デバイス種、適応、依存度、最終チェック、電池、ICD治療、手術部位と電気機器を術前確認。\n- 単極電気メスは電磁干渉リスクが高い。可能なら双極を用い、短い間欠通電、電流経路をデバイスから離す。\n- 磁石反応は機種・設定で異なる。ペースメーカとICDを同じ反応と決めつけない。\n- ICD治療を一時停止する場合も、外部除細動・連続監視と術後再設定確認が必要。\n\n## 過去問パターン（2017–2025）\n\n- 波形・時間計算：2017問15–17、2018問18–22、2019問14–19、2020問11–12、2023問20–27、2024問33、2025問64–67。\n- 治療分岐：2019問16、2021問12–16、2022問74–77、2023問20、2024問91–93。\n- デバイス：2017問62、2018問66、2020問68、2022問62、2023問73、2025問72。\n\n## ひっかけ警報\n\n- VFと無脈性VTは**非同期**除細動。脈あり単形性VTは同期下通電が原則。\n- 心静止・PEAを除細動しない。質の高いCPRと可逆的原因検索。\n- モニタに直線が出ても電極脱落・感度設定を確認。ただしCPRを不必要に遅らせない。\n- 心房細動の脳卒中リスク評価と周術期出血リスク評価は別問題。\n\n## ミニ・セルフチェック\n\n1. 幅広規則的頻拍で意識低下、脈あり。→ **不安定VTとして同期下カルディオバージョンを準備。**\n2. 無秩序波形で無脈。→ **VF：CPRと早期除細動。**\n3. ICD機能を止めた処置後に必ず行うことは。→ **監視を継続し、治療機能の再開・設定確認。**\n\n## 根拠・参照先\n\n- 『歯科麻酔学 第8版』循環モニタ p.94–101、心肺蘇生 p.533–550相当：`p0106.txt`–`p0113.txt`, `p0545.txt`–`p0562.txt`\n- 『不整脈ガイドライン』：`_data/guidelines/不整脈ガイドライン.txt`\n- 全関連問題：`_data/note_refs/08_不整脈と心電図.txt`（82問）\n\n"},{"id":"09_モニタリング","title":"09 周術期モニタリング","md":"# 09｜周術期モニタリング\n\n> **得点戦略**　数値を正常／異常で終わらせず、「測定原理→偽値→患者への介入」の順に答える。\n\n## 学習目標\n\n- パルスオキシメータ、カプノグラフィ、非観血的血圧、心電図、体温の原理と限界を説明できる。\n- カプノグラム・動脈圧波形から原因を推定できる。\n- アラーム時に機器異常と患者異常を同時並行で切り分けられる。\n\n## モニタの役割分担\n\n| モニタ | 主に見るもの | 早期検出 | 代表的限界 |\n|---|---|---|---|\n| SpO₂ | 動脈血酸素飽和度 | 酸素化低下 | 酸素投与下では低換気検出が遅れる、低灌流・体動・異常Hb |\n| EtCO₂／波形 | 換気、気道、循環の一部 | 無呼吸、閉塞、回路外れ | サンプリング漏れ、口呼吸、死腔・V/QでPaCO₂と差 |\n| ECG | 電気活動・心拍 | 不整脈、虚血の手がかり | 機械的拍出を保証しない、アーチファクト |\n| NIBP | 間欠血圧 | 高・低血圧 | カフサイズ、位置、不整脈、体動 |\n| 体温 | 中枢／末梢温 | 低体温・高体温 | 測定部位で中枢温との乖離 |\n| 神経筋モニタ | 遮断深度 | 残存筋弛緩 | 電極、皮膚温、固定、測定筋 |\n\n### カプノグラムの典型\n\n- **徐々に基線へ戻らない（再呼吸）**：呼気弁不良、CO₂吸収剤枯渇、不十分な呼気時間。\n- **呼気相がサメの背**：気道抵抗増大（気管支攣縮、回路閉塞、細いチューブ）。\n- **急に0へ**：回路外れ、抜管、完全閉塞、心停止／極端な肺血流低下。患者をまず見る。\n- **EtCO₂が徐々に上昇**：低換気、CO₂産生増加、再呼吸、悪性高熱症の初期徴候など。\n- **突然低下**：肺血流低下（重度低血圧、肺塞栓）、過換気、漏れ。\n\n### SpO₂の読み方\n\n660 nmと940 nm付近の吸光差と脈波成分を利用する。COHbでは高め、MetHbでは85%付近へ寄る傾向があり得る。低灌流、マニキュア、体動、外光は精度を損なう。プレチスモグラムと脈拍の整合を見る。\n\n### 血圧カフ\n\n- カフが**小さすぎる**→高め、大きすぎる→低めに出やすい。\n- 上腕を心臓より低くすると高め、高くすると低め。\n- 観血的波形は末梢ほど収縮期圧・脈圧が増幅することがある。平均圧は比較的保たれる。\n\n## アラーム対応：患者と機器を同時に\n\n1. 患者の意識・胸郭運動・皮膚色・脈を確認。\n2. 気道開通、酸素供給、換気、循環を必要なら即介入。\n3. センサ、電極、カフ、回路、酸素源、サンプリングラインを点検。\n4. 別手段で再確認：触診、聴診、手動血圧、別部位SpO₂、血液ガス等。\n5. 原因修正後もトレンドで再評価し記録。\n\n## 過去問パターン（2017–2025）\n\n- SpO₂・異常Hb：2017問79、2019問11、2020問78、2024問36、2025問8–10。\n- カプノグラム：2017問49–50、2018問11–13、2019問9–10、2021問18–21、2022問15–18、2023問37–40、2024問17–19。\n- 血圧・体温・BIS：2018問10、2020問8・48、2021問9–11、2023問35、2025問11–12。\n\n## ひっかけ警報\n\n- 酸素投与中のSpO₂正常は換気正常を保証しない。EtCO₂・呼吸数・意識を見る。\n- EtCO₂とPaCO₂は同じではない。通常PaCO₂がやや高いが、V/Q・死腔で差が開く。\n- ECG波形があっても無脈ならPEA。電気活動と拍出を混同しない。\n- BIS単独で麻酔深度・鎮痛・覚醒を完全判定できない。薬剤や筋電図の影響も受ける。\n\n## ミニ・セルフチェック\n\n1. 酸素投与下、SpO₂ 100%だがEtCO₂が上昇し傾眠。→ **低換気を疑い気道・換気を介入。**\n2. EtCO₂が突然0。最初に行うことは。→ **患者の呼吸・脈を見て、回路外れ／抜管／閉塞も同時確認。**\n3. 肥満成人に小児カフ。→ **血圧は高めに出やすい。**\n\n## 根拠・参照先\n\n- 『歯科麻酔学 第8版』第2章 モニタリング p.90–107相当：`p0102.txt`–`p0119.txt`\n- 全関連問題：`_data/note_refs/09_モニタリング.txt`（70問）\n\n"},{"id":"10_気道管理と人工呼吸","title":"10 気道管理・気管挿管・人工呼吸","md":"# 10｜気道管理・気管挿管・人工呼吸\n\n> **得点戦略**　気道問題は「酸素化を止めない」ことが最上位。挿管の成否ではなく、換気・酸素化・救援導線で判断する。\n\n## 学習目標\n\n- 術前気道評価から困難気道戦略を立てられる。\n- 基本手技、声門上器具、気管挿管、外科的気道の位置づけを説明できる。\n- 人工呼吸設定と高気道内圧・低酸素の原因を系統的に検索できる。\n\n## 気道評価\n\n| 観察 | リスクの手がかり |\n|---|---|\n| 開口量、Mallampati | 舌・咽頭腔、器具操作空間 |\n| 甲状オトガイ距離、下顎前方移動 | 喉頭展開・下顎スペース |\n| 頸部可動域 | 口腔・咽頭・喉頭軸への影響 |\n| 歯、義歯、動揺歯 | 損傷・脱落・誤嚥 |\n| 肥満、OSA、頸部腫脹 | マスク換気・閉塞リスク |\n| 口腔顎顔面病変・既往 | 出血、解剖変形、放射線治療後 |\n\n単一所見の感度は十分でない。**マスク換気困難、声門上器具困難、挿管困難、緊急前頸部アクセス困難**を別々に予測する。\n\n## 気道確保の階段\n\n1. 頭位調整、下顎挙上、吸引、二人法マスク換気、口咽頭／鼻咽頭エアウェイ。\n2. 声門上器具で酸素化を回復。挿管の導管として使える器具もある。\n3. ビデオ喉頭鏡、ファイバースコープ等を計画的に使用。試行回数を制限し、毎回条件を改善。\n4. **挿管不能・酸素化不能（CICO）**では迷わず緊急前頸部アクセスへ移行。\n\n> 覚醒下挿管は、自発呼吸と気道緊張を保つ利益が大きいと予測される場合に検討する。鎮静しすぎて「半覚醒・無呼吸」にしない。\n\n## チューブ位置確認\n\n気管チューブ通過の目視、両側胸郭運動・聴診、深さ、酸素化に加え、**持続する呼気CO₂波形**が重要。単発のCO₂検出や胸部聴診だけで確定しない。食道挿管疑いでは抜去し換気を再確保する。\n\n## 人工呼吸の核\n\n- 一回換気量は原則**予測体重**を基準に肺保護的に設定し、プラトー圧・Driving pressureを抑える。\n- 分時換気量 = 一回換気量×呼吸数。PaCO₂は概ね肺胞換気と反比例。\n- PEEPは終末呼気虚脱を防ぎ酸素化を改善し得るが、過度では静脈還流・心拍出量低下、過膨張を招く。\n\n### 高気道内圧の切り分け\n\n| 圧 | 上昇の意味 |\n|---|---|\n| peakのみ上昇、plateau不変 | 気道抵抗：気管支攣縮、分泌物、チューブ屈曲、回路閉塞 |\n| peak・plateauとも上昇 | コンプライアンス低下：無気肺、肺水腫、気胸、腹圧上昇、片肺挿管 |\n\n**DOPES**：Displacement（位置異常）、Obstruction、Pneumothorax、Equipment、Stacking（auto-PEEP）で急変を検索。迷えば回路を外し、100%酸素で手動換気して患者側／機器側を切り分ける。\n\n## 過去問パターン（2017–2025）\n\n- 解剖・器具・挿管確認：2017問55–61、2018問23–29、2019問40–47、2021問22–26、2023問41–43。\n- DAM/CICO：2020問40–44、2022問19–23、2024問11–16、2025問49–54。\n- 人工呼吸・合併症：2017問78、2019問5–8、2020問46–50、2022問24–29、2023問38、2024問18。\n\n## ひっかけ警報\n\n- 喉頭鏡の反復は浮腫・出血を増やし、後の換気を悪化させる。回数を無制限にしない。\n- SpO₂低下を待って気道介入しない。カプノ・胸郭運動・気道音の変化が先行する。\n- 高いpeak圧をすべて肺コンプライアンス低下としない。plateauとの比較。\n- 小児のカフなしチューブを常に正解としない。適正サイズ・適正カフ圧のカフ付きを含め判断。\n\n## ミニ・セルフチェック\n\n1. 挿管後EtCO₂波形が持続せず胃泡音。→ **食道挿管を疑い抜去、酸素化再確保。**\n2. peakのみ急上昇。→ **チューブ屈曲・分泌物・気管支攣縮など抵抗増大。**\n3. 反復挿管失敗でSpO₂低下、声門上器具でも換気不能。→ **CICOとして緊急前頸部アクセス。**\n\n## 根拠・参照先\n\n- 『歯科麻酔学 第8版』第5章 気道管理 p.258–274相当：`p0270.txt`–`p0286.txt`\n- 『気道管理ガイドライン』：`_data/guidelines/気道管理ガイドライン.txt`\n- 『麻酔器ガイドライン』：`_data/guidelines/麻酔器ガイドライン.txt`\n- 全関連問題：`_data/note_refs/10_気道管理と人工呼吸.txt`（90問）\n\n"},{"id":"11_全身的偶発症と新ガイドライン","title":"11 全身的偶発症とガイドライン更新点","md":"# 11｜全身的偶発症とガイドライン更新点\n\n> **得点戦略**　偶発症は病名当てよりABCDE。血管迷走神経反射（VVR）、過換気、アナフィラキシー、悪性高熱症（MH）を発症時相・皮膚・呼吸・循環・体温で比較する。\n\n## 学習目標\n\n- 代表的偶発症を初期所見から鑑別できる。\n- 診断確定を待たず、病態に合う初期対応を開始できる。\n- ガイドラインで強調される「してはいけない対応」を説明できる。\n\n## 一目で切る鑑別表\n\n| 病態 | 誘因・時相 | 主徴 | 初期対応の核 |\n|---|---|---|---|\n| VVR | 注射・疼痛・恐怖、処置前後 | 悪心、冷汗、蒼白、徐脈、低血圧、失神 | 処置中止、仰臥位・下肢挙上、気道・酸素、監視。遷延時は原因別薬物 |\n| 過換気症候群 | 不安・疼痛 | 頻呼吸、しびれ、手足攣縮、めまい、低PaCO₂ | 安心させ呼吸を整える、酸素化確認、器質疾患除外。紙袋法は行わない |\n| アナフィラキシー | 薬剤等の曝露後急速 | 皮膚粘膜、気道、呼吸、循環、消化器の組合せ | **筋注アドレナリン**、応援・救急要請、仰臥位、酸素、輸液、反復評価 |\n| MH | 揮発性麻酔薬・スキサメトニウム等 | EtCO₂上昇、頻脈、筋強直、アシドーシス、高K。体温上昇は遅いことも | 誘発薬中止、100%O₂高流量、ダントロレン、冷却、電解質・アシドーシス管理 |\n\n## VVR\n\n予防は病歴聴取、安心できる説明、疼痛管理、仰臥位に近い体位、必要に応じた精神鎮静。発症時は転倒を防ぎ、気道・呼吸・循環を評価する。典型は徐脈・低血圧だが、全ての失神をVVRと決めつけず、心原性、低血糖、アナフィラキシー、脳血管イベントを除外する。\n\n## 過換気症候群\n\n呼吸性アルカローシスにより脳血流低下、イオン化Ca低下が生じ、めまい・しびれ・手足攣縮を来し得る。呼吸を無理に止めさせず、落ち着いた誘導で呼吸数・深さを整える。**紙袋再呼吸は低酸素性疾患を悪化させるため避ける。**\n\n## アナフィラキシー\n\n- 皮膚症状がない重症例もある。曝露後の急な低血圧・気道症状で疑う。\n- 第一選択は大腿前外側への**アドレナリン筋注**。抗ヒスタミン薬・ステロイドは補助であり、アドレナリンを遅らせない。\n- 立位・座位への急な変更は静脈還流を減らし得る。呼吸困難や妊娠など個別事情を除き仰臥位を基本に調整。\n- 反応不十分なら筋注反復、急速輸液、上級蘇生へ。静注アドレナリンは経験・厳密な監視が必要。\n\n## 悪性高熱症\n\nEtCO₂の説明困難な上昇は早期所見。麻酔器から誘発薬供給を止め、助けを呼び、ダントロレンを速やかに投与する。高K血症・不整脈、代謝性アシドーシス、横紋筋融解、腎障害を監視する。発熱を待って診断しない。カルシウム拮抗薬とダントロレンの併用は循環虚脱・高Kに注意する。\n\n## 過去問パターン（2017–2025）\n\n- VVR／過換気：2017問82–84、2018問78–80、2021問92–94、2023問1、2024問78、2025問1–4。\n- アナフィラキシー：2019問76–78、2020問75–77、2022問69–73、2024問79–83、2025問5–7。\n- MH：2019問25–26、2020問38–39、2021問74–76、2023問46–50、2024問84–86、2025問55–58。\n\n## ひっかけ警報\n\n- アナフィラキシーの第一選択を抗ヒスタミン薬・ステロイドにしない。\n- VVRの低血圧をすべてアドレナリンで処理しない。体位・気道・酸素・循環評価が先。\n- 過換気に紙袋法を使わない。\n- MHは体温上昇が最初とは限らない。EtCO₂上昇・頻脈・筋強直を見逃さない。\n\n## ミニ・セルフチェック\n\n1. 抗菌薬後、喘鳴と血圧低下、皮疹なし。→ **アナフィラキシーを疑い筋注アドレナリン。**\n2. 不安後に頻呼吸・手足攣縮、SpO₂正常。→ **過換気を考え、器質疾患を除外しつつ呼吸誘導。紙袋は不可。**\n3. セボフルラン中にEtCO₂急上昇と頻脈。→ **MHを疑い誘発薬中止、100%酸素、ダントロレン。**\n\n## 根拠・参照先\n\n- 『歯科麻酔学 第8版』第13章 p.504–521、第14章 p.522–532相当：`p0516.txt`–`p0544.txt`\n- `血管迷走神経反射.txt`、`過換気症候群.txt`、`アナフィラキシーガイドライン.txt`、`医科アナフィラキシーガイド.txt`、`悪性高熱症.txt`\n- 全関連問題：`_data/note_refs/11_全身的偶発症と新ガイドライン.txt`（50問）\n\n"},{"id":"12_ショックと心肺蘇生","title":"12 ショック分類・BLS／ALS","md":"# 12｜ショック分類・BLS／ALS\n\n> **得点戦略**　ショックは血行動態、心停止はリズムで分岐する。薬剤名より質の高いCPRと早期除細動を優先する。\n\n## 学習目標\n\n- 4分類のショックを前負荷・心拍出量・末梢血管抵抗で比較できる。\n- 成人・小児のBLSを順序立て、除細動適応を即答できる。\n- Hs & Tsから可逆的原因を検索できる。\n\n## ショックの地図\n\n| 分類 | 例 | 前負荷 | CO | SVR | 初期治療の方向 |\n|---|---|---:|---:|---:|---|\n| 循環血液量減少性 | 出血、脱水 | ↓ | ↓ | ↑ | 出血制御、輸液・輸血 |\n| 心原性 | 心筋梗塞、重症心不全 | ↑ | ↓ | ↑ | 原因治療、酸素需給最適化、過剰輸液回避 |\n| 閉塞性 | 肺塞栓、緊張性気胸、心タンポナーデ | ↑（部位差） | ↓ | ↑ | 閉塞の緊急解除 |\n| 血液分布異常性 | アナフィラキシー、敗血症、神経原性 | ↓/相対的 | 初期↑も | ↓ | 原因別薬＋輸液。アナフィラキシーはアドレナリン |\n\nショックは低血圧だけではない。皮膚、意識、尿量、毛細血管再充満、脈、乳酸、呼吸を統合し、代償期に捉える。\n\n## 成人BLS：崩さない順序\n\n1. 安全確認、反応確認、応援・救急通報・AED要請。\n2. 呼吸と脈拍を同時に10秒以内で評価（医療者）。死戦期呼吸は正常呼吸ではない。\n3. 胸骨圧迫：胸部中央、**100–120回/分、深さ約5 cm（6 cm超を避ける）**、完全な戻り、中断最小。\n4. 気道確保・換気。高度気道確保前は30:2、確保後は圧迫継続＋約10回/分換気を基本。\n5. AED装着後、VF／無脈性VTなら速やかにショック。直後に脈を長く確認せずCPR再開。\n\n## ALSのリズム分岐\n\n| リズム | 電気治療 | 薬剤の軸 |\n|---|---|---|\n| VF／無脈性VT | 除細動 | アドレナリン、難治性なら抗不整脈薬をアルゴリズムに沿って |\n| PEA／心静止 | 除細動しない | 早期アドレナリン、Hs & Ts検索 |\n\n**Hs & Ts**：Hypovolemia、Hypoxia、Hydrogen ion（acidosis）、Hypo/Hyperkalemia、Hypothermia／Tension pneumothorax、Tamponade、Toxins、Thrombosis（pulmonary/coronary）。歯科では低酸素、アナフィラキシー、局麻薬中毒、出血、気道閉塞を早く疑う。\n\n## 小児・乳児\n\n- 脈拍確認：乳児は上腕動脈、小児は頸動脈または大腿動脈が代表。\n- 深さ：胸郭前後径の約1/3（乳児約4 cm、小児約5 cmが目安）。\n- 1人法30:2、2人法15:2。乳児2人法は両母指胸郭包み込み法が推奨される。\n- 心拍数60/分未満で灌流不良があり、酸素化・換気後も改善しなければ圧迫開始を考える。\n\n## ROSC後\n\n気道・酸素化（過剰酸素も避ける）、換気、血圧、12誘導ECG、体温管理、原因治療、専門施設搬送を行う。意識回復だけで観察終了しない。\n\n## 過去問パターン（2017–2025）\n\n- ショック分類：2017問80–81、2019問74–78、2020問75–79、2022問69–73、2024問79–83。\n- BLS圧迫・換気：2017問92–96、2018問90–95、2019問91–96、2021問95–100、2022問78–83、2023問95–100。\n- リズム・除細動：2020問91–96、2023問20、2024問91–93、2025問94–100。\n\n## ひっかけ警報\n\n- 心静止とPEAはショック非適応。除細動器を使わないのではなく、リズム確認には使う。\n- 挿管のために胸骨圧迫を長く止めない。\n- AEDショック後に長い脈拍確認を挟まない。直ちに圧迫再開。\n- アナフィラキシーで心停止前の第一選択経路は筋注。心停止後は蘇生アルゴリズムへ。\n\n## ミニ・セルフチェック\n\n1. 無脈、モニタは規則的狭QRS。→ **PEA：CPR、アドレナリン、原因検索。除細動しない。**\n2. 除細動直後の行動は。→ **直ちに約2分間CPR再開。**\n3. 乳児を医療者2人で蘇生。圧迫換気比は。→ **15:2。**\n\n## 根拠・参照先\n\n- 『歯科麻酔学 第8版』第14章 p.522–532、第15章 p.533–550相当：`p0534.txt`–`p0562.txt`\n- 『医科アナフィラキシーガイド』：`_data/guidelines/医科アナフィラキシーガイド.txt`\n- 全関連問題：`_data/note_refs/12_ショックと心肺蘇生.txt`（51問）\n\n"},{"id":"13_合併疾患の管理_代謝内分泌腎肝","title":"13 合併疾患の管理：糖尿病・甲状腺・副腎・腎・肝","md":"# 13｜合併疾患の管理：糖尿病・甲状腺・副腎・腎・肝\n\n> **得点戦略**　疾患名ごとに「術前検査→継続／中止薬→起こりやすい急変→薬物動態」を一列で覚える。\n\n## 学習目標\n\n- 糖尿病、甲状腺、副腎、腎不全、肝疾患の重症度を主要検査で評価できる。\n- 絶食・手術侵襲・常用薬に伴う周術期リスクを予測できる。\n- 低血糖、甲状腺クリーゼ、副腎クリーゼ、高K血症、肝性脳症の初期対応を説明できる。\n\n## 疾患横断表\n\n| 疾患 | 術前の核 | 周術期リスク | 麻酔・薬剤の論点 |\n|---|---|---|---|\n| 糖尿病 | HbA1c、当日血糖、合併症、薬 | 低／高血糖、感染、胃排出遅延、自律神経障害 | 絶食中の薬調整、血糖監視。SGLT2阻害薬とケトアシドーシス |\n| 甲状腺機能亢進 | 症状、TSH低値、free T3/T4 | 頻脈、不整脈、クリーゼ | 未治療・コントロール不良の予定処置延期。交感刺激回避 |\n| 甲状腺機能低下 | TSH高値（原発性）、free T4低値 | 低体温、徐脈、低換気、薬剤感受性 | 重症例の粘液水腫性昏睡、鎮静薬減量 |\n| 副腎機能低下 | ステロイド歴、症状、電解質 | 低血圧、低Na、高K、低血糖 | ストレス時補充を個別判断。急変時ヒドロコルチゾン |\n| CKD／透析 | eGFR、K、Hb、容量、透析日 | 高K、体液過剰、貧血、出血傾向 | シャント側で血圧・採血を避ける。腎排泄薬・NSAIDs |\n| 肝硬変 | Child-Pugh、凝固、血小板、Alb、脳症 | 出血、低血糖、感染、腹水、脳症 | 高抽出比薬・蛋白結合・分布容積変化、肝血流低下を考慮 |\n\n## 糖尿病\n\n### 指標\n\n- HbA1c：過去およそ2–3か月。糖化アルブミン：およそ2–3週間。\n- ケトン体：アセトン、アセト酢酸、β-ヒドロキシ酪酸。\n- DKAでは代謝性アシドーシスとKussmaul呼吸。血清Kが正常／高値でも総K量は欠乏し得る。\n\n### 周術期フロー\n\n最終食事と糖尿病薬→当日血糖→低血糖症状・自律神経障害→処置時間を短く、可能なら早い時間帯→定期測定。低血糖では意識と嚥下を評価し、経口糖または静注ブドウ糖。SGLT2阻害薬は正常に近い血糖でもケトアシドーシスを起こし得るため、周術期中止時期は最新の施設基準を確認する。\n\n## 甲状腺・副腎\n\n- **甲状腺クリーゼ**：発熱、中枢神経症状、頻脈・心不全、消化器症状。支持療法、β遮断の適否、抗甲状腺薬、ヨウ素、ステロイドを専門診療と連携。\n- 甲状腺機能亢進ではケタミン、アトロピン、過量のアドレナリンなど交感刺激を増やす薬に注意。\n- **副腎クリーゼ**：説明困難な低血圧、脱水、低Na、高K、低血糖。輸液、ブドウ糖、ヒドロコルチゾンを遅らせない。\n- 長期ステロイド服用者すべてに同じ量のカバーを行うのではなく、用量・期間・投与時刻・手術侵襲・HPA軸抑制を評価する。\n\n## 腎不全・透析\n\n- 高K血症のECG：尖鋭T波→PR延長・P波消失→QRS延長→sine wave。緊急時はCa製剤で膜安定化、インスリン＋ブドウ糖等で細胞内移動、透析等で除去。\n- 腎性貧血はエリスロポエチン低下。二次性副甲状腺機能亢進、酸塩基・電解質異常を伴う。\n- 透析直後は電解質・容量が整う一方、抗凝固や低血圧を考慮。一般に透析翌日が選ばれやすいが、患者状態と施設で調整。\n- シャントのスリル・雑音を確認し、圧迫を避ける。\n\n## 肝疾患\n\nChild-Pughの代表5項目は、総ビリルビン、アルブミン、PT（INR）、腹水、肝性脳症。血小板低下、門脈圧亢進、低アルブミン、凝固因子低下が起こる。ただしPT/INR単独は複雑な止血能を完全には表さない。\n\n- 肝血流依存性の高い薬は肝血流低下でクリアランスが低下。\n- 低アルブミンでは高蛋白結合薬の遊離分画が増えることがある。\n- 腹水・浮腫では分布容積が変化。肝性脳症では中枢抑制薬へ高感受性。\n\n## 過去問パターン（2017–2025）\n\n- 糖尿病：2017問21・25、2018問42、2019問70、2020問30・33・74・83、2021問1–2、2023問55–61、2024問69–74、2025問74–78。\n- 甲状腺・副腎：2019問67–68・79、2020問71–73・84、2022問64–68、2023問2–5。\n- 腎・肝：2017問40・67–70、2018問44、2020問29・31・34、2021問45–50、2024問61–63。\n\n## ひっかけ警報\n\n- DKA治療でKを見ないままインスリンだけ投与しない。低Kを顕在化させ得る。\n- 原発性甲状腺機能亢進はTSH低下、原発性低下はTSH上昇が基本。\n- 透析シャント側での血圧測定・静脈路確保を避ける。\n- 肝硬変ではPT「時間」が延長する。凝固因子が増えるのではない。\n- レミフェンタニルの臨床作用消失は肝腎機能に比較的左右されにくいが、すべての薬が同様ではない。\n\n## ミニ・セルフチェック\n\n1. DKAで深大呼吸。酸塩基異常は。→ **代謝性アシドーシスへの呼吸性代償。**\n2. 透析患者で尖鋭T波。→ **高K血症を疑い、心筋保護・細胞内移動・体外除去を緊急検討。**\n3. 長期ステロイド患者の説明困難な低血圧。→ **副腎クリーゼを疑い、ヒドロコルチゾンと支持療法。**\n4. Child-Pugh 5項目は。→ **Bil、Alb、PT/INR、腹水、脳症。**\n\n## 根拠・参照先\n\n- 『歯科麻酔学 第8版』第6章 代謝内分泌 p.357–366、肝 p.366–371、腎 p.372–377相当：`p0369.txt`–`p0389.txt`\n- 『非心臓手術の心血管ガイドライン』の併存疾患・周術期薬物項目：`_data/guidelines/非心臓手術の心血管ガイドライン.txt`\n- 全関連問題：`_data/note_refs/13_合併疾患の管理_代謝内分泌腎肝.txt`（84問）\n\n"},{"id":"14_小児高齢者障害者の麻酔","title":"14 小児・高齢者・障害者の麻酔管理","md":"# 14｜小児・高齢者・障害者の麻酔管理\n\n> **得点戦略**　「成人を小さく／古くしただけ」と考えない。解剖・生理・薬理・意思決定・退院の5軸で比較する。\n\n## 学習目標\n\n- 小児と高齢者の呼吸循環・体液・体温・薬物動態の差を説明できる。\n- 小児の輸液・薬用量・気道を体重と年齢から計算・選択できる。\n- 障害特性に応じた術前準備、コミュニケーション、麻酔計画を立てられる。\n\n## 小児：高代謝・小予備能\n\n| 特徴 | 臨床への影響 |\n|---|---|\n| 大きな後頭、相対的大舌、頭側・前方の喉頭 | 上気道閉塞・挿管の工夫。乳児は中間位へ調整 |\n| 狭い気道 | わずかな浮腫で抵抗が大きく増える |\n| O₂消費量・CO₂産生量が体重当たり大 | 無呼吸で急速に低酸素化 |\n| FRCが小さい、呼吸筋疲労しやすい | 酸素予備能が小さい |\n| 心拍出量が心拍数依存 | 徐脈が心拍出量低下に直結しやすい |\n| 体表面積／体重比が大 | 低体温・水分喪失 |\n| 体水分率が高く腎機能未熟 | 脱水・過剰輸液・薬物排泄に注意 |\n\n### 小児の計算\n\n**維持輸液 4-2-1法（mL/kg/h）**\n\n- 最初の10 kg：4\n- 次の10 kg：2\n- 20 kg超：1\n\n例：15 kg → 10×4 + 5×2 = **50 mL/h**。これは計算上の維持量であり、現在は絶食時間、脱水、手術侵襲、糖・電解質、施設方針を反映して個別化する。\n\n薬用量はmg/kgで計算後、**最大量**と製剤濃度を確認する。体重の入力誤り、mgとmL、µgとmgの桁違いを独立にダブルチェックする。\n\n### 上気道炎（かぜ）\n\n発熱、湿性咳嗽、膿性鼻汁、喘鳴、全身状態、年齢、手術・気道操作の必要性を統合する。最近の上気道炎は喉頭痙攣・気管支攣縮・咳・低酸素リスクを上げ得るが、一律の延期日数だけでは決めない。緊急性と麻酔計画を含め判断する。\n\n## 高齢者：予備能低下と個体差\n\n| 系統 | 代表変化 | 麻酔上の意味 |\n|---|---|---|\n| 呼吸 | 胸郭コンプライアンス↓、クロージング容量↑、A–aDO₂↑ | 無気肺・低酸素、鎮静時閉塞 |\n| 循環 | 動脈硬化、拡張能↓、圧受容体反射↓ | 血圧変動、容量変化へ脆弱 |\n| 腎肝 | GFR・腎血流・肝血流低下 | 排泄・クリアランス遅延 |\n| 体組成 | 総水分・除脂肪量↓、脂肪率↑ | 水溶性薬の初期濃度↑、脂溶性薬の分布・遷延 |\n| 中枢 | 麻酔薬感受性↑、MAC低下 | 少量から緩徐投与、せん妄予防 |\n\n加齢10年でMACがおよそ低下するという出題があるが、固定率を患者ごとの投与量へ機械的に当てはめない。フレイル、認知、感覚、ポリファーマシー、栄養、生活機能を併せる。\n\n### 術後せん妄\n\n急性発症、注意障害、変動性が特徴。認知症と同義ではない。疼痛、低酸素、感染、尿閉、便秘、脱水、睡眠障害、抗コリン薬・ベンゾジアゼピン等の原因を検索。見当識支援、眼鏡・補聴器、睡眠環境、早期離床、適切な鎮痛を多面的に行う。\n\n## 障害特性別の要点\n\n| 状況 | 術前・術中の注意 |\n|---|---|\n| Down症候群 | 上気道閉塞、OSA、心疾患、頸椎不安定性、甲状腺を評価。無症候での頸椎検査適応は個別判断 |\n| 脳性麻痺 | 誤嚥・逆流、分泌、拘縮、てんかん、低体温。抗けいれん薬の継続と相互作用 |\n| 自閉スペクトラム症 | 予測可能な手順、感覚刺激低減、本人・家族から有効な対応を聴取 |\n| 知的能力障害 | 意思決定能力を個別評価し、理解可能な方法で本人へ説明。代諾だけで本人の意思を無視しない |\n| 筋ジストロフィー | スキサメトニウム回避、高K・横紋筋融解、呼吸・心筋障害、術後換気 |\n| 重症筋無力症 | 非脱分極性筋弛緩薬高感受性、呼吸筋、抗コリンエステラーゼ薬、術後クリーゼ |\n\n### 行動調整と麻酔選択\n\n「協力不能」を患者の属性にしない。過去の成功法、トリガー、コミュニケーション手段、待機環境、診療時間、脱感作、家族支援を先に最適化する。精神鎮静法／全身麻酔は、侵襲、治療量、気道、合併疾患、安全に必要な不動化、本人の負担を統合して選ぶ。\n\n## 日帰り・退院\n\n覚醒、気道・呼吸、循環、歩行／年齢相応の運動、疼痛・悪心、出血、経口摂取の必要性、排尿の必要性を手技ごとに評価。責任ある成人同伴、移動手段、緊急連絡、術後指示を確認する。スコアは判断補助であり、一項目の合格だけで帰宅させない。\n\n## 過去問パターン（2017–2025）\n\n- 小児生理・輸液・気道：2017問27–29、2018問9・46–47、2019問52–58、2020問35、2021問67–72、2022問78–83、2023問70、2024問75–77、2025問60–63。\n- 高齢者変化・薬理・せん妄：2017問22–26・75、2018問31、2020問52–56、2021問46–50、2024問8–10。\n- 障害者・神経筋疾患：2017問71–72、2019問49・51、2020問53、2022問54–57、2023問6、2025問79–86。\n\n## ひっかけ警報\n\n- 乳児の心拍出量は一回拍出量を増やしにくく、心拍数依存性が高い。\n- 小児は成人より酸素消費量が少ない、FRCが大きい、という選択肢は逆。\n- 高齢者は薬物感受性が一律低下するのではない。多くの麻酔薬は必要量が減る。\n- Down症候群＝全例環軸椎不安定と断定しないが、頸部症状・操作への配慮を忘れない。\n- 障害者本人への説明・同意能力評価を省略しない。\n\n## ミニ・セルフチェック\n\n1. 15 kg児の4-2-1維持量は。→ **50 mL/h。**\n2. 乳児の無呼吸でSpO₂が急低下しやすい理由は。→ **高い酸素消費と小さいFRC。**\n3. 高齢者のプロポフォール投与。→ **必要量低下を見込み、少量・緩徐・効果を待つ。**\n4. 筋ジストロフィーで避ける代表薬は。→ **スキサメトニウム。**\n5. せん妄の中心的特徴は。→ **急性発症、注意障害、変動性。**\n\n## 根拠・参照先\n\n- 『歯科麻酔学 第8版』小児 p.419–431、高齢者 p.432–444、障害者 p.445–453相当：`p0431.txt`–`p0465.txt`\n- 『歯科診療における静脈内鎮静法ガイドライン』、気道管理関連資料：`_data/guidelines/`\n- 全関連問題：`_data/note_refs/14_小児高齢者障害者の麻酔.txt`（149問）\n\n"}],"docs":[{"id":"trend","title":"出題傾向分析レポート","cat":"分析","md":"# 出題傾向分析レポート（2017〜2025年・全870問）\n\n## 1. 章別出題マトリクス（問題数）\n\n| 章 | '17 | '18 | '19 | '20 | '21 | '22 | '23 | '24 | '25 | 計 | 割合 |\n|---|---|---|---|---|---|---|---|---|---|---|---|\n| 第5章 全身麻酔 | 20 | 23 | 19 | 23 | 17 | 21 | 31 | 19 | 36 | **209** | 24% |\n| 第2章 基礎知識(生理・検査・モニタ) | 26 | 20 | 18 | 16 | 29 | 21 | 11 | 13 | 17 | **171** | 20% |\n| 第6章 合併疾患患者の管理 | 16 | 13 | 17 | 28 | 17 | 20 | 25 | 23 | 12 | **171** | 20% |\n| 第3章 局所麻酔 | 7 | 8 | 11 | 11 | 14 | 15 | 8 | 5 | 6 | **85** | 10% |\n| 第4章 精神鎮静法 | 3 | 6 | · | 5 | 9 | 5 | 5 | 13 | 15 | **61** | 7% |\n| 第12章 ペインクリニック | 6 | 6 | 6 | 4 | 6 | 6 | 4 | 15 | 1 | **54** | 6% |\n| 第15章 心肺蘇生法 | 1 | 5 | 3 | 3 | 4 | 1 | 5 | 4 | 6 | **32** | 4% |\n| 第10章 高齢者麻酔 | 5 | 1 | 4 | 2 | 2 | 6 | 2 | · | · | **22** | 3% |\n| 第14章 ショック | 1 | 2 | 4 | 3 | 1 | 2 | · | 5 | 4 | **22** | 3% |\n| 第9章 小児麻酔 | 4 | 3 | 4 | 2 | 1 | · | 1 | · | 1 | **16** | 2% |\n| 第13章 全身的偶発症 | · | 3 | 2 | 1 | · | 2 | 4 | 2 | 1 | **15** | 2% |\n| 第7章 口腔外科手術と麻酔 | · | · | · | 1 | · | 1 | 3 | 1 | · | **6** | 1% |\n| 第11章 障害者麻酔 | · | · | 2 | 1 | · | · | · | · | · | **3** | 0% |\n| 第1章 総論(法・倫理) | · | · | · | · | · | · |
