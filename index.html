シスの原因はどれか.2 つ選べ.\n\n## 4. ガイドライン由来出題とその発行年\n\n| ガイドライン | 由来問題数 | 発行/改訂年 | 2026注目度 |\n|---|---|---|---|\n| 悪性高熱症 | 5 | 2025改訂 | 🔥高（新版） |\n| 気道管理ガイドライン | 5 | 2014(JSA) |  |\n| 非歯原性歯痛ガイドライン | 5 | 2011/2019 |  |\n| 周術期禁煙ガイドライン | 4 | 2021 |  |\n| 過換気症候群 | 4 | **2025年6月新規** | 🔥高（新版） |\n| アナフィラキシーガイドライン | 3 | 2021(JSA 2022も) |  |\n| 非心臓手術の心血管ガイドライン | 2 | 2024(JCS) | 🔥高（新版） |\n| 静脈内鎮静法ガイドライン | 2 | 2017改訂2版 |  |\n| 局所麻酔アレルギー | 2 | 2025 | 🔥高（新版） |\n| 深鎮静プラクティカルガイド | 2 | 2017 |  |\n| 血管迷走神経反射 | 2 | 2013 |  |\n| 下歯槽神経・舌神経損傷ガイドライン | 2 | 2020 |  |\n| 麻酔器ガイドライン | 1 | 2022 |  |\n| 不整脈ガイドライン | 1 | 2020-2024(JCS) |  |\n| セプトカイン(添付文書) | 1 | 2025改訂 | 🔥高（新版） |\n| 医科アナフィラキシーガイド | 1 | 2022 |  |\n\n**🔥 2025年発行・改訂の5本（悪性高熱症/過換気症候群/局所麻酔アレルギー/セプトカイン/心血管2024）は2026年新作問題の最有力ソース。** 過去にも新ガイドライン発行直後に出題される傾向あり（例: 2021年に静脈内鎮静法GL改訂2版から記述式出題）。\n\n## 5. 2026年試験の形式予想\n\n- 多肢選択100問（2025年から記述式廃止。2026年も同形式が濃厚）\n- 予想配分: 全身麻酔 22-26問 / 基礎知識(生理・モニタ) 18-22問 / 合併疾患管理 18-22問 / 局所麻酔 9-11問 / 精神鎮静法 6-8問 / ペイン 5-7問 / CPR・ショック・偶発症 7-10問 / 小児・高齢者・障害者 4-6問\n- 再出題予想: 20-25問は過去9年の類似問題（特に「複数回出題クラスタ」）\n- 新作予想: 2025年新ガイドライン（過換気症候群・悪性高熱症・局所麻酔アレルギー）関連"},{"id":"記述式_模範解答_2022","title":"記述式 模範解答 2022","cat":"記述式","md":"# 2022年度　記述式模範解答\n\n> **使い方**　各答案は、最初に定義・結論を置き、次に機序または鑑別、最後に臨床対応を書く構成です。実際の試験では設問の枠に合わせて圧縮してください。\n\n## 問1　低酸素性肺血管収縮\n\n### 設問\n\n低酸素性肺血管収縮（HPV）の生理学的意義を説明し、HPVを抑制する麻酔薬と抑制しにくい麻酔薬を挙げよ。\n\n### 模範解答\n\n低酸素性肺血管収縮とは、肺胞気酸素分圧が低下した肺胞周囲の肺小動脈が収縮する反応である。血流を低換気・無換気領域から換気の良い領域へ再配分し、換気血流比不均衡と肺内シャントを減少させ、動脈血酸素化を維持することが生理学的意義である。\n\n揮発性吸入麻酔薬は濃度依存性にHPVを抑制する。セボフルラン、イソフルラン、デスフルランなどが該当し、高濃度では片肺換気時などの酸素化を悪化させうる。一方、プロポフォール、バルビツレート、ケタミンなどの静脈麻酔薬は臨床濃度でHPVを比較的温存する。亜酸化窒素の抑制作用は弱い。\n\n### 採点キーワード\n\n- 低酸素肺胞周囲の肺小動脈収縮\n- 血流再配分\n- 換気血流比不均衡・シャントの減少\n- 揮発性吸入麻酔薬は抑制\n- 静脈麻酔薬は比較的温存\n\n## 問2　全身麻酔後の低酸素血症\n\n### 設問\n\n全身麻酔後に低酸素血症を生じる原因を挙げ、それぞれの機序を説明せよ。\n\n### 模範解答\n\n術後低酸素血症を認めたら、まず酸素投与と気道確保を行いながらABCDEで原因を検索する。主な原因は次のとおりである。\n\n1. **上気道閉塞**：舌根沈下、咽頭浮腫、血腫、分泌物、喉頭痙攣などで換気が妨げられる。いびき、陥没呼吸、シーソー呼吸を伴う。\n2. **肺胞低換気**：残存する麻酔薬・オピオイド・鎮静薬、低体温、中枢神経障害により呼吸数または一回換気量が低下し、PaCO2が上昇して肺胞気酸素分圧が低下する。\n3. **残存筋弛緩**：咽頭筋・呼吸筋の回復不十分により気道保持、嚥下・咳反射、換気が障害され、閉塞・誤嚥・低換気を来す。\n4. **無気肺と換気血流比不均衡**：全身麻酔、仰臥位、高濃度酸素、疼痛による浅呼吸で背側肺などが虚脱し、シャントが増える。単純な酸素投与だけで改善しにくい場合がある。\n5. **気管支攣縮・分泌物・気道内異物**：気道抵抗が増加し、肺胞換気が不均一となる。喘鳴、呼気延長、カプノグラムのslope増大を認める。\n6. **肺実質・胸腔内病変**：誤嚥性肺炎、肺水腫、気胸、肺血栓塞栓症などによりシャント、拡散障害または死腔換気が増える。\n7. **酸素供給・循環の異常**：酸素供給装置の外れ・空ボンベ、低心拍出、重度貧血などでは、酸素化または組織への酸素運搬が不足する。\n\n評価ではSpO2波形の信頼性、呼吸数、胸郭運動、聴診、EtCO2、筋弛緩モニタ、動脈血ガス、胸部画像を病態に応じて用いる。原因治療として気道手技、バッグマスク換気、拮抗薬、PEEP・リクルートメント、気管支拡張薬、再挿管などを選択する。\n\n### 採点キーワード\n\n- 気道閉塞\n- 残存麻酔薬・オピオイド・筋弛緩\n- 無気肺、V/Q不均衡、シャント\n- 気管支攣縮・誤嚥・肺水腫・気胸・肺塞栓\n- 原因検索と同時に酸素化・換気を確保\n\n## 問3　局所麻酔薬中毒（LAST）\n\n### 設問\n\n局所麻酔薬中毒の原因、症状および治療を説明せよ。\n\n### 模範解答\n\n局所麻酔薬中毒（LAST）は、局所麻酔薬の血中濃度が中枢神経系・心血管系の毒性域へ上昇して生じる。原因には、誤って血管内へ注入すること、過量投与、血流の多い部位からの急速吸収、肝・腎機能低下や低心拍出による代謝・排泄遅延がある。小児、高齢者、妊婦、低蛋白血症、アシドーシスでは毒性が増強しやすい。\n\n初期には口唇・舌周囲のしびれ、金属味、耳鳴り、めまい、視覚異常、多弁、不穏、振戦が現れ、進行すると全身けいれん、意識消失、呼吸抑制・呼吸停止を来す。心血管系では高血圧・頻脈から低血圧、徐脈、伝導障害、心室性不整脈、循環停止へ進むことがある。なお全身麻酔下では初期の自覚症状が分からず、循環症状が最初の所見となりうる。\n\n治療は直ちに局所麻酔薬投与を中止し、応援要請、100%酸素投与、気道確保と適切な換気を行う。低酸素、高二酸化炭素血症、アシドーシスを避ける。けいれんには少量のベンゾジアゼピンを用いる。重症例では20%脂肪乳剤を1.5 mL/kgでボーラス投与し、続いて0.25 mL/kg/分で持続投与する。循環が回復しなければ施設手順に従いボーラス反復・持続速度増量を検討する。蘇生はLASTに合わせて修正し、アドレナリンは少量にとどめ、バソプレシン、カルシウム拮抗薬、β遮断薬および局所麻酔薬系抗不整脈薬を避ける。回復後も再燃に備えて十分な監視を続ける。\n\n### 採点キーワード\n\n- 血管内誤注入・過量・急速吸収・代謝遅延\n- 中枢神経刺激症状からけいれん・抑制へ進行\n- 低血圧・伝導障害・心室性不整脈・心停止\n- 100%酸素、換気、ベンゾジアゼピン\n- 20%脂肪乳剤 1.5 mL/kg後0.25 mL/kg/分\n\n## 問4　体性感覚の用語\n\n### 設問\n\nHypoesthesia、Hyperalgesia、Hypoalgesia、Allodynia、Dysesthesiaをそれぞれ定義せよ。\n\n### 模範解答\n\n| 用語 | 日本語 | 定義 |\n|---|---|---|\n| Hypoesthesia | 感覚鈍麻 | 特殊感覚を除く刺激に対する感受性が低下した状態。触覚などを含む一般感覚の低下を指す。 |\n| Hyperalgesia | 痛覚過敏 | 通常でも痛みを起こす刺激に対して、通常より強い痛みが生じる状態。 |\n| Hypoalgesia | 痛覚鈍麻 | 通常は痛みを起こす刺激に対する痛み反応が低下した状態。 |\n| Allodynia | アロディニア | 軽い接触など、通常は痛みを起こさない刺激によって痛みが生じる状態。 |\n| Dysesthesia | 異常感覚 | 自発性または誘発性に生じる、不快な異常感覚。痛みを伴う場合と伴わない場合がある。 |\n\nHyperalgesiaは「痛い刺激への反応増大」、Allodyniaは「痛くない刺激で痛む」という刺激の違いを明確に書き分ける。\n\n### 採点キーワード\n\n- 刺激に対する感受性低下\n- 痛み刺激への増強／低下\n- 非侵害刺激による痛み\n- 不快な異常感覚\n\n## 問5　AHA 2020 BLSの人工呼吸\n\n### 設問\n\nAHA Guidelines 2020に基づき、成人・小児・乳児の一次救命処置における人工呼吸法を説明せよ。\n\n### 模範解答\n\n人工呼吸は1回約1秒かけ、胸郭が目に見えて上がる量を送る。過換気は静脈還流と心拍出量を低下させるため避ける。\n\n**高度な気道確保前の心停止**では、成人は救助者数によらず胸骨圧迫30回に人工呼吸2回とする。小児・乳児は救助者1人なら30：2、救助者2人以上なら15：2とする。\n\n**高度な気道確保後の心停止**では胸骨圧迫を中断せず、成人は6秒に1回、すなわち毎分10回換気する。小児・乳児は2〜3秒に1回、毎分20〜30回換気する。\n\n**脈拍はあるが呼吸がない、または不十分な場合の救助呼吸**では、成人は6秒に1回、小児・乳児は2〜3秒に1回換気し、約2分ごとに脈拍を再評価する。乳児のバッグマスク換気では頭部を中間位に保ち、過伸展と胃膨満を避ける。\n\n### 採点キーワード\n\n- 1回約1秒、胸郭が上がる量\n- 成人30：2\n- 小児・乳児は1人30：2、2人15：2\n- 高度気道確保後：成人10回/分、小児・乳児20〜30回/分\n- 過換気を避ける\n\n## 根拠・参照先\n\n- 『歯科麻酔学 第8版』呼吸生理、全身麻酔、局所麻酔薬中毒、疼痛の用語\n- American Heart Association Guidelines for CPR and ECC 2020, Adult and Pediatric Basic Life Support\n- 局所麻酔薬中毒への対応に関する各種実践指針\n"},{"id":"記述式_模範解答_2023-2024","title":"記述式 模範解答 2023-2024","cat":"記述式","md":"# 日本歯科麻酔学会認定医試験　記述式模範解答\n\n> 対象：2023年（第48回）・2024年（第49回）  \n> 使い方：「結論 → 評価 → 具体策 → 再評価」の順で書き、太字の必須語を落とさない。薬物量は年齢・体重・病態・最新プロトコールに合わせる。\n\n---\n\n## 2023年 問1：レミフェンタニルとフェンタニルの使い分け\n\n### 採点の核\n\n- 共通点：いずれも強力な **μオピオイド受容体作動薬**。鎮痛、交感神経反応抑制、呼吸抑制、徐脈、筋強直を生じうる。\n- レミフェンタニル：血液・組織の **非特異的エステラーゼ** で速やかに分解。状況感応半減期が約3〜5分と短く、長時間持続しても蓄積が少ない。\n- フェンタニル：高脂溶性で組織に分布し、肝代謝。反復・大量投与で蓄積し、覚醒遅延と遅発性呼吸抑制を生じうるが、投与終了後も術後鎮痛が残る。\n\n### 模範解答\n\n術中の強い侵害に対して鎮痛深度を素早く調整したいときは、レミフェンタニルを持続静注する。非特異的エステラーゼで分解されるため肝腎機能の影響が比較的小さく、作用の発現と消失が速い。一方、投与停止後に鎮痛が急速に消失するため、術後疼痛が予測される場合は終了前からフェンタニル、アセトアミノフェン、NSAIDs、局所麻酔などによる多角的鎮痛へ移行する。\n\nフェンタニルは麻酔導入時、短時間の疼痛刺激、術後鎮痛の確保に少量を分割静注する。反復投与では脂肪・筋組織から再分布して作用が遅延するため、高齢、肥満、肝機能低下では減量する。\n\n両薬とも鎮静薬との併用で呼吸抑制と循環抑制が相乗的に強まる。心電図、血圧、SpO2、カプノグラフィを監視し、気道確保・人工呼吸とナロキソンを準備する。急速・大量投与は胸壁強直を起こしうるため避ける。抜管は十分な換気、意識、気道保護反射を確認して行い、回復室で遅発性呼吸抑制を監視する。\n\n---\n\n## 2023年 問2：器質病変のない歯痛の評価と方針\n\n### 採点の核\n\n**非歯原性歯痛を疑うが、まず歯原性病変と医科的red flagを除外する。** 不要な不可逆的歯科処置を追加しない。\n\n### 模範解答\n\n詳細な問診で発症、経過、性質（持続性・発作性・電撃様・拍動性）、持続時間、誘発・軽減因子、夜間痛、体位、食事、開口、洗顔との関係、しびれ、頭痛・悪心・羞明、既往の歯科処置と効果を確認する。痛みダイアリーと疼痛強度評価を行う。\n\n口腔内診査で視診、打診、触診、歯髄電気診・温度診、歯周ポケット、咬合診、バイトテスト、拡大鏡と透照を用いてクラックを再検討する。デンタル・パノラマX線、必要ならCBCTで歯根破折、根尖病変、骨病変を除外する。現在の拔髄歯に局所麻酔診断を行い、痛みが消失するか確認する。\n\n器質病変がなければ次を系統的に評価する。\n\n1. **筋・筋膜性歯痛**：咬筋・側頭筋の索状硬結とトリガーポイントを触診し、患者の歯痛が再現するかみる。\n2. **神経障害性疼痛**：ブラシ、ピンプリック、温冷刺激、Semmes-Weinsteinモノフィラメントで左右を比較し、感覚低下、痛覚過敏、アロディニアを調べる。\n3. **三叉神経痛**：数秒の電撃様痛、トリガーゾーン、不応期を確認。\n4. **神経血管性歯痛**：片頭痛の病歴、拍動性、日常動作で増悪、悪心、光・音過敏を確認。\n5. **上顎洞・心臓・頭蓋内病変などの関連痛**：症状が突発、進行性、神経脱落症状、胸部症状、発熱を伴うなら対応診療科へ緊急紹介する。\n\n診断が不明なまま再根管治療や抜歯を追加しない。筋・筋膜性なら疾患教育、セルフケア、温熱、ストレッチ、理学療法、スプリントを、神経障害性ならプレガバリン、SNRI等を適応・禁忌に配慮して用いる。必要に応じてペインクリニック、神経内科、脳神経外科、耳鼻科と連携し、定期的に診断と治療効果を再評価する。\n\n---\n\n## 2023年 問3：歯科治療恐怖の程度に応じた鎮静法\n\n事前に面接、行動観察、既往の歯科体験、恐怖・予期不安、発達水準、コミュニケーション、感覚過敏、治療協力性、全身疾患、気道リスクを評価する。鎮静深度は「必要な治療を安全に成立させる最も浅いレベル」とする。\n\n- **軽度**：説明、同意、Tell-Show-Do、ストップシグナル、段階的曝露、表面麻酔と無痛的局所麻酔を基本とする。軽度の不安なら低濃度亜酸化窒素吸入鎮静が適する。自発呼吸、応答、保護反射を維持する。\n- **中等度**：行動療法と亜酸化窒素で不十分なら、静脈内鎮静法を考慮する。静脈路確保が恐怖なら表面麻酔や亜酸化窒素を併用する。ミダゾラム、プロポフォール、デクスメデトミジン等を作用特性と患者リスクに合わせて少量ずつ滴定する。\n- **重度、十分な協力が得られない場合**：深鎮静は気道閉塞・呼吸抑制のリスクが高く、処置刺激で鎮静深度も変動する。反復・長時間治療、不動性が必要、深鎮静でも体動が防げないなら、気管挿管下全身麻酔を選ぶ。\n- **発達障害・自閉スペクトラム症**：個人の発達水準と感覚特性で選ぶ。視覚支援、手順の予告、同じスタッフ、低刺激環境、家族・介助者の参加を用いる。鎮静への逆説的興奮も予測する。\n\n絶飲食、付添、内服薬、気道評価を確認し、酸素、吸引、BVM、声門上器具、拮抗薬、救急薬を準備する。中等度以上では心電図、非観血的血圧、SpO2、呼吸数、カプノグラフィを監視する。帰宅はバイタル、認識、歩行・平衡、出血、疼痛、悪心を再評価し、付添人に注意書と緊急連絡先を渡す。\n\n---\n\n## 2023年 問4：失神既往と心房細動をもつ高齢者の外来管理\n\n### 術前\n\n失神の状況、前駆症状、体位、持続時間、労作との関係、外傷、家族歴を聞き、血管迷走神経反射と心原性失神を鑑別する。労作中失神、動悸・胸痛先行、器質的心疾患、突然死家族歴はred flagである。安静時12誘導心電図で心房細動の心拍数、QRS、QT、虚血所見を評価し、必要に応じHolter、心エコー、循環器内科診察を依頼する。\n\n脈拍数調節、心不全、高血圧、冠疾患、腎機能、運動耐容能を確認する。CHA2DS2-VAScと出血リスク、抗凝固薬の種類・最終内服・腎機能を確認し、埋伏智歯抜歯の出血リスクと比較する。抗凝固薬を自己判断で中止せず、施設基準と主治医の意見に従う。貸血、電解質異常、脱水、絶飲食による循環血液量減少を補正する。\n\n心原性失神が否定できない、心房細動の心拍数が不良、新たな心不全・虚血症状があるなら延期する。\n\n### 術中\n\n不安と疼痛を減らす説明、十分な局所麻酔、仰臥位または急な体位変換を避ける。静脈路を確保し、心電図、血圧、SpO2、意識・呼吸を連続監視する。酸素、BVM、AED/除細動器、吸引、アトロピン、映圧薬を準備する。アドレナリン添加局所麻酔薬は血管内誤注入を避け、少量分割投与する。\n\n血管迷走神経反射の前駆症状が出たら処置を中断し、仰臥位で下肢挙上、気道・呼吸・循環を評価、必要なら酸素と輸液を行う。徐脈を伴う低血圧にはアトロピンを投与する。頭低位は呼吸・心機能の悪化に注意する。不安が強い場合は必要最小限の鎮静を検討するが、高齢者では過鎮静と呼吸抑制を避ける。\n\n### 術後\n\n十分に止血し、血圧、心拍数・リズム、意識、歩行安定性を観察する。起立は段階的に行い再失神を防ぐ。抗凝固薬の再開時期を確認し、局所止血材、圧迫、縫合を用いる。付添人と帰宅させ、後出血、動悸、胸痛、呼吸困難、失神時の受診基準と連絡先を文書で渡す。\n\n---\n\n## 2023年 問5：静脈内鎮静法で深鎮静を避けるべき症例\n\n深鎮静では気道保護反射が抑制され、自発呼吸と気道開存の介助が必要になりうる。歯科処置は口腔を共有するため、以下では特に避ける。\n\n1. **予測困難気道・換気困難**：開口障害、小顎、巨舌、頸部後屈制限、高Mallampati、高BMI、重度OSA、上気道腔瘍・膿瘍、扁桃肥大。気道閉塞時に口腔内処置と競合する。\n2. **誤嚥リスク**：フルストマック、絶飲食不守、胃食道逆流、腸閉塞、胃排出遅延、妊娠後期、強い口腔内出血。\n3. **呼吸予備能が小さい**：重症COPD・気管支喘息、拘束性肺疾患、低酸素血症、重度肥満、神経筋疾患。\n4. **循環動態が不安定**：非代償性心不全、重篤な弁膜症、制御不良不整脈、ショック、重度肺高血圧。鎮静薬の血管拡張・心抑制を代償できない。\n5. **薬物感受性が高い、回復が遅れる**：フレイル高齢者、重度肝腎障害、向精神薬・オピオイド・中枢抑制薬併用。\n6. **深鎮静でも処置が成立しない**：重度の歯科恐怖、知的能力障害、発達障害で不動性が得られず、痛痛刺激で体動が繰り返す場合。鎮静薬の追加ではなく、気管挿管下全身麻酔を検討する。\n\n処置必要性、施設設備、救急対応能力を評価し、安全な気道管理が必要なら入院・手術室での全身麻酔へ切り替える。\n\n---\n\n## 2024年 問1：静脈内鎮静法後の帰宅許可\n\n帰宅許可は、鎮静終了からの経過時間でなく、個々の患者の回復を複数項目で判定する。\n\n1. **生命徴候**：血圧、心拍数、呼吸数、SpO2が術前値付近で安定。酸素投与なしで酸素化を維持し、気道閉塞がない。\n2. **意識・精神運動機能**：意識が術前水準に戻り、人・場所・時間を認識し、応答が明瞭。\n3. **運動・平衡機能**：自他覚的にふらつきがなく通常速度で歩行可能、または閉眼両脚直立30秒を保持。単独歩行帰宅を検討するならTimed Up & Goなど動的平衡をより厳密に評価する。\n4. **処置関連**：処置を要する術後出血、疼痛、悪心・嘔吐がない。\n5. **社会的安全**：原則として責任能力のある付添人と、付添人の運転車またはタクシーで帰宅。帰宅後も監督できる。\n\n帰宅後の飲食、服薬、出血対応、緊急連絡先を書面で渡す。当日の自動車・自転車の運転、危険作業、飲酒、重要な意思決定は禁止する。鎮静薬の種類・投与量と患者特性に応じて翌日まで注意させる。近年の基準では **飲水と排尿は帰宅許可の必須条件ではない**。必要ならmodified Aldrete scoreやPADSSを併用し、最終的に担当医が記録を残して帰宅許可する。\n\n---\n\n## 2024年 問2：換気困難予測患者の麻酔導入時気道管理\n\n最優先は **気管挿管そのものではなく、酸素化を維持すること** である。\n\n### 導入前評価と計画\n\nMallampati、開口量、upper lip bite test、甲状オトガイ距離、頸囲・BMI、髭・無歯顎、頸部可動域、OSA、放射線治療歴、腔瘍・感染を評価する。マスク換気、声門上器具換気、挿管、緊急前頸部気道確保のそれぞれの困難性を別々に予測する。絶飲食と誤嚥リスクを確認する。\n\n主計画と失敗時計画をチームで共有し、熟練者を呼ぶ。標準モニタ、静脈路、十分な吸引を準備。ビデオ喉頭鏡、気管支ファイバー、スタイレット・ブジー、第2世代声門上器具、異なる大きさのチューブ、輪状甲状膜切開キットを手元に置く。輪状甲状膜を触知し、高リスクでは事前に超音波で確認・マーキングする。\n\n### 覚醒下か全身麻酔導入か\n\nマスク/声門上器具換気困難、誤嚥高リスク、短時間無呼吸に耐えられない、緊急前頸部気道確保も困難と予測するなら **自発呼吸を残した覚醒下挿管** を選択する。表面麻酔、丁寧な説明、必要最小限の鎮静下でファイバーまたはビデオ喉頭鏡を用い、カプノグラムで気管内留置を確認してから全身麻酔に移行する。\n\n全身麻酔導入を選ぶなら、頭高位・ランプ位、100%酸素で3分間または呼気O2濃度90%以上まで予備酸素化し、鼻カニュラで無呼吸時酸素化を継続する。第一試行は最も成功可能性の高い器具と熟練者で行う。再試行は数を制限し、一回ごとに頭位、器具、操作者を変え、酸素化を再確立する。\n\n### 失敗時\n\n- マスクで酸素化できるなら、筋弛緩を最適化して挿管試行を制限し、声門上器具へ移行。状況により覚醒中止する。\n- 声門上器具で酸素化できれば、覚醒、ファイバー補助挿管、限定的な手術継続の利害を判断する。\n- マスクも声門上器具も不能で酸素化できないCICOなら、追加挿管にこだわらず、ただちに輪状甲状膜切開による緊急前頸部気道確保を行う。\n\n終了後は困難の内容、成功法、失敗法を記録し、患者に書面で告知する。抜管も再挿管困難を前提に計画する。\n\n---\n\n## 2024年 問3：慢性腎不全患者の残存筋弛緩\n\n本例ではロクロニウム50分後でなく40分後で、スガマデクス140 mgは体重71 kgに対し約2 mg/kgである。しかし、**筋弛緩深度を測定せず、自発呼吸の出現だけで拮抗成功と判断して抜管した** ことが問題である。腎不全ではロクロニウムの作用が延長・個人差が増え、スガマデクス―ロクロニウム複合体の腎排泄も遅延する。\n\n予測される主合併症は **残存筋弛緩による上気道閉塞、舌根沈下、低換気、低酸素血症、誤嚥、術後呼吸不全** である。咽頭筋と上気道拡大筋は脆弱で、握力や一回換気量が見かけ上回復しても保護反射は不十分なことがある。腎不全では麻酔薬・オピオイドの作用遅延、電解質異常、代謝性アシドーシス、体温低下も呼吸抑制を増悪させる。\n\n### 直ちに行う対処\n\n1. 人を呼び、モニタ下で気道・呼吸・循環を評価。下顎挙上、エアウェイ、100%酸素、必要ならBVMで換気。\n2. カプノグラフィと血液ガスで換気を評価。簡易な所見ではなく、母指内転筋で **定量的TOF比** を測定する。\n3. TOF比<0.9なら残存筋弛緩と診断。初回量不足の可能性、アナフィラキシー・著明な徐脈などの禁忌を確認したうえで追加拮抗を検討。ただし重度腎障害ではスガマデクスの安全性・再クラーレ化に留意し、専門的監視の下で利益・リスクを判断する。\n4. 自発呼吸を過信せず、酸素化・換気を保てない、意識不良、誤嚥リスクがあるなら早期に再挿管する。\n5. 低体温、アシドーシス、高カリウム血症、低カルシウム血症を検査・補正し、オピオイド・鎮静薬残存も鑑別する。\n\n十分な回復室観察を行い、必要に応じHCU/ICUで呼吸管理する。予防は、術中から定量筋弛緩モニタを用い、腎機能と深度に合わせて投与・拮抗し、抜管前にTOF比0.9以上と意識、換気、気道保護を確認することである。\n\n---\n\n## 2024年 問4：全身麻酔中のアナフィラキシー\n\n### 特徴と診断\n\n麻酔中は患者が症状を訴えず、覆布で皮膚所見が見えない。導入直後から数分に、予期しない急激な低血圧・循環虚脱、頻脈または徐脈、気管支痙攣、気道内圧上昇、換気困難、SpO2低下、血管浮腫、紅斑・蕁麻疹が出現する。皮膚所見がなくてもアナフィラキシーを否定できない。原因は筋弛緩薬、抗菌薬、ラテックス、クロルヘキシジン、血液製剤、鎮痛薬などを考える。\n\n大量出血、気胸、肺塞栓、心筋虚血、麻酔薬過量、誤投薬を並行鑑別するが、治療を遅らせない。\n\n### 初期対応\n\n1. 原因候補薬・ラテックスの曝露を中止し、術者に手術中断を告げ、応援と救急カートを要請。\n2. 気道を確保し、100%酸素、高流量で換気。吸入麻酔薬を中止。\n3. **アドレナリンを遅滞なく投与**。静脈路と厳密なモニタがある麻酔中は、重症度に応じ少量静注を反復して滴定。心停止・切迫する循環虚脱ならACLS用量。静脈路がない状況では大腿外側へ筋注。\n4. 仰臥位・下肢挙上。太い静脈路を追加し、加圧した加温細胞外液を急速投与。必要なら動脈ライン。\n5. 気管支痙攣に吸入β2作動薬を併用するが、アドレナリンの代用にしない。難治性ならアドレナリン持続投与、ノルアドレナリンやバソプレシン等を専門的管理下で検討。β遮断薬使用中のアドレナリン抵抗性ショックにグルカゴンを検討。\n\n抗ヒスタミン薬とステロイドは皮膚症状と遅発反応の補助であり、アドレナリンに先行させない。\n\n### 原因検索と術後\n\nアドレナリン投与前の採血のために治療を遅らせない。可能な限り発症後早期と1〜2時間後の血清トリプターゼを採血し、24時間以降の基礎値と比較する。投薬と処置の時刻、全薬剤・物品のタイムラインを記録。重症例はICU/HCUで二相性反応を監視する。後日、アレルギー専門医で皮膚テスト・特異的IgE等を行い、被疑物質と代替薬を患者に文書で告知する。\n\n---\n\n## 2024年 問5：麻酔終了後30分以上覚醒しない患者\n\n覚醒遅延は「薬物、代謝・呼吸、神経、その他」を同時に考え、**鑑別しながらABCを維持する**。\n\n### 最初の対処\n\n応援を要請し、気道開存、自発呼吸、呼吸数、一回換気量、SpO2、呼気CO2、血圧、心拍、体温、瞳孔、左右差、痙攣を評価。必要なら気管チューブを留置したまま100%酸素で換気する。血糖を直ちに測定、動脈血液ガス、電解質、Hbを検査する。\n\n### 原因と対処\n\n#### 1. 薬物性（最多）\n\n- 吸入麻酔薬が残っていないか、気化器と呼吸回路を確認。高新鮮ガス流量で100%酸素による洗い出しを行う。\n- プロポフォール、ベンゾジアゼピン、オピオイドの総量、最終投与、持続ポンプの停止、体重設定を確認。高齢、肥満、肝腎機能低下、低アルブミン血症、薬物相互作用で遅延する。\n- オピオイド過量では縮瞳、低換気をみてナロキソンを少量分割静注。再鎮静に注意。\n- ベンゾジアゼピンにフルマゼニルを分割静注。長期内服、けいれん既往、三環系抗うつ薬中毒ではけいれん・離脱を起こしうるため慎重にする。\n- 残存筋弛緩は意識遅延に見える。定量TOFを測定し、TOF比0.9以下なら適切に拮抗。\n\n#### 2. 呼吸・代謝性\n\n- 低換気による高CO2血症は脳血流を増やし意識を抑制する。気道確保と補助換気でPaCO2を正常化。\n- 低酸素血症、低血圧、大量出血を矯正し、脳灌流と酸素運搬を回復。\n- 低血糖ならブドウ糖、重度高血糖・ケトアシドーシスならプロトコールに従う。\n- 低ナトリウム、高ナトリウム、高カリウム、高カルシウム、尿毒症を検査し、急激な補正を避けて治療。\n- 低体温では薬物代謝と筋弛緩回復が遅れるため、能動的加温。甲状腺機能低下症や副腎不全も考える。\n\n#### 3. 神経性\n\n局在神経徴候、瞳孔左右差、急な高血圧、要因のない意識障害があれば、脳棗塞・脳出血・脳幹障害を疑い、ストロークチームを起動して緊急CT/CTA等を行う。非痙攣性てんかん重積は臨床所見だけで除外できないためEEGを検討。空気塞栓、脂肪塞栓、局所麻酔薬中毒も手術内容とタイムラインから考える。\n\n#### 4. その他\n\n見かけの意識消失として残存筋弛緩、locked-in状態、解離性障害を考える。ただし心因性と判断する前に器質疾患を除外する。麻酔器・輸液ポンプの誤接続、麻酔薬投与継続、薬剤取り違えをチームで再点検する。\n\n原因が判明し回復するまで抜管を急がず、低酸素・低血圧・低血糖を防ぐ。不明、回復不十分、神経病変が疑われる場合はICU/HCUで管理する。\n\n---\n\n## 記述式の最終チェック\n\n- 設問の「説明せよ」に対し、病態だけでなく評価・介入・再評価まで書いたか。\n- ABC、応援要請、モニタ、原因除去、第一選択治療の順番になっているか。\n- 「自発呼吸あり=安全」「SpO2正常=換気正常」と書いていないか。\n- アナフィラキシーでアドレナリンより抗ヒスタミン薬・ステロイドを先に書いていないか。\n- スガマデクス後は臨床徴候だけでなく、定量TOF比で確認と書いたか。\n- 帰宅基準で飲水・排尿を必須と書いていないか。\n\n## 主な根拠\n\n- 『歯科麻酔学 第8版』（全身麻酔、精神鎮静法、ペインクリニック、全身的偶発症）\n- 『歯科診療における静脈内鎮静法ガイドライン』\n- 『JSA気道管理ガイドライン』\n- 『アナフィラキシーガイドライン』\n- 『非歯原性歯痛診療ガイドライン』\n\n"},{"id":"専門医試験_2022年_問題と模範解答","title":"専門医試験 2022年 問題と模範解答","cat":"専門医","md":"# 第18回 歯科麻酔専門医試験（2022年）問題と模範解答\n\n> 原本：第18回歯科麻酔専門医試験 筆記試験（令和4年5月28日）\n>\n> 収録：症例検討2題（うち小問2問）・専門的知識5題。原本2ページを全ページ確認した。\n>\n> 本稿は公開設問を『歯科麻酔学 第8版』および本フォルダ内のガイドライン・分野別ノートに照らして作成した**学習用の模範解答**であり、学会公表の公式解答ではない。実試験では解答欄に合わせ、太字の語を残して圧縮する。\n\n---\n\n## 症例検討 問題1：口腔底蜂窩織炎の緊急手術\n\n### 原本設問\n\n下記緊急歯科手術を全身麻酔下で実施する場合、周術期管理で留意すべき点を簡潔に説明せよ。\n\n- 患者：60歳男性、身長164 cm、体重68 kg\n- 診断：下顎左側第二大臼歯の歯性感染に起因した口腔底蜂窩織炎\n- 既往歴：高血圧症に対して内服加療中、II型糖尿病に対して運動・食事療法中\n- 内服薬：カルシウム拮抗薬、アンジオテンシンII受容体拮抗薬\n- 検査結果：血圧154/98 torr、脈拍数96回/分、血糖値130 mg/dL、HbA1c 7.0％\n- 喫煙歴：40年（50本/日）であったが1年前より禁煙中\n- 身体所見：睡眠時のいびきと無呼吸を家族に指摘されることがある。開口時痛のため開口量は不明。頸部の後屈制限なし\n- 予定術式：外科的切開排膿術（口腔底、頸部外切開）\n- 予定手術時間：2時間\n- 予定出血量：少量\n\n### 模範解答\n\n本症例の中心課題は、**進行する深頸部感染による予測困難な気道閉塞**と、感染源制御を急ぐ必要性である。血圧や糖尿病だけを理由に緊急排膿を遅らせず、口腔外科・耳鼻咽喉科・麻酔科・必要に応じICUで、気道確保法と抜管条件を手術前に合意する。\n\n#### 1. 感染の広がりと全身状態の評価\n\n造影CTを可能な範囲で確認し、口腔底、顎下・舌下・咽頭周囲、傍咽頭・咽後間隙への波及、喉頭偏位、気道最狭窄部、膿瘍形成、縦隔進展を評価する。嗄声、流涎、嚥下困難、起坐呼吸、吸気性喘鳴、発語困難、舌挙上、頸部腫脹の進行は気道悪化の徴候である。仰臥位や鎮静で閉塞が増悪し得るため、患者が最も呼吸しやすい体位を保ち、監視のない前投薬・深い鎮静を避ける。\n\n体温、意識、呼吸数、SpO2、尿量、末梢循環を確認し、血算、CRP、電解質、腎・肝機能、凝固、血液ガス・乳酸、血糖を調べ、敗血症、脱水、腎障害、電解質異常を評価する。培養採取を考慮しつつ、広域抗菌薬を遅らせず、切開排膿による**感染源制御**を行う。\n\n#### 2. 気道計画\n\n開口量が疼痛のため不明であり、口腔底腫脹、男性、疑いOSASを伴うため、**挿管困難かつマスク換気困難**を想定する。通常の喉頭鏡・ビデオ喉頭鏡、軟性気管支鏡、吸引、酸素投与器具、声門上器具、輪状甲状膜切開器具を準備し、外科的気道を実施できる術者を入室または即応させる。経鼻挿管が術野上有利でも、鼻腔病変・出血傾向を確認し、経路は術者と相談する。\n\n気道が保たれ、協力が得られるなら、十分な表面麻酔と分泌抑制を行い、**自発呼吸を温存した覚醒下軟性気管支鏡挿管**を第一候補とする。鎮静は必要最小限とし、「鎮静で無呼吸になったが挿管できない」状態を避ける。著明な狭窄、仰臥位不能、軟性鏡の視野確保困難、挿管操作で完全閉塞する危険が高い場合は、局所麻酔下気管切開を先行する。全身麻酔導入を選ぶ場合も、十分な前酸素化を行い、気道を確保できる見通しが立つまで自発呼吸を失わせない戦略を検討する。反復挿管で浮腫・出血を増やさず、失敗時の移行基準をあらかじめ決める。\n\n#### 3. 併存疾患と薬剤\n\nいびき・目撃無呼吸、高血圧、男性、60歳からOSAS高リスクである。頭高位で前酸素化し、オピオイド節減の多角的鎮痛を行い、術後は持続SpO2・必要に応じEtCO2監視とCPAP/NIVを考慮する。大量喫煙歴から分泌物増加、気道過敏性、COPD・虚血性心疾患の合併を確認し、呼吸音、胸部画像、必要時血液ガスを評価する。1年間の禁煙は有利だが、既往リスクは消失していない。\n\n血圧154/98 mmHgは緊急排膿の絶対的延期理由ではない。カルシウム拮抗薬は原則継続する。ARBは導入後の遷延性低血圧に注意し、緊急例では最終服用時刻を確認して昇圧薬を準備する。頻脈・著明な高血圧を避ける一方、過度の降圧で臓器灌流を損なわない。\n\n糖尿病はHbA1c 7.0％で著明な慢性コントロール不良ではないが、感染と手術侵襲で高血糖になり得る。絶食時間、当日血糖、尿・血中ケトン、腎機能を確認し、術中から定期的に血糖を測定する。低血糖と高度高血糖の双方を避け、抗菌薬投与、創傷治癒、感染増悪にも注意する。\n\n#### 4. 術中・抜管・術後\n\n頭高位で十分に前酸素化し、気管チューブの位置を気管支鏡・カプノグラフィで確認して確実に固定する。術中は標準モニタに加え、病態に応じ観血的動脈圧を考慮する。口腔内の膿・血液・洗浄液の誤嚥を防ぎ、吸引を徹底する。循環血液量、体温、血糖、酸素化・換気を適正化し、抗菌薬、培養、ドレーン計画を術者と共有する。\n\n排膿直後でも浮腫は直ちに消失せず、手術刺激で悪化することがある。抜管前に覚醒、十分な自発換気、定量的TOF比0.9以上、咳嗽・嚥下、分泌物、口腔底・喉頭所見、カフリークを評価する。安全性に疑問があれば、**気管チューブ留置または気管切開のままICU管理**とし、翌日以降にCT・内視鏡所見を再評価して計画抜管する。抜管する場合も完全覚醒、頭高位、再挿管器具・外科的気道の即応下で行い、術後出血、再腫脹、喉頭浮腫、誤嚥、敗血症を連続監視する。\n\n### 採点キーワード\n\n- 深頸部感染、感染源制御、抗菌薬、敗血症評価\n- 造影CT、炎症波及、喉頭偏位、気道狭窄\n- 開口障害、困難マスク換気・困難挿管の予測\n- 深い前投薬を避ける、自発呼吸温存\n- 覚醒下軟性気管支鏡挿管、局所麻酔下気管切開\n- ビデオ喉頭鏡、吸引、外科的気道を含むバックアップ\n- OSAS、頭高位前酸素化、オピオイド節減、術後CPAP\n- 血糖監視、ARB服用時の低血圧、喫煙関連肺リスク\n- 抜管延期、カフリーク、内視鏡評価、ICU監視\n\n### 根拠\n\n- 『歯科麻酔学 第8版』第7章「膿瘍切開術の麻酔」p.413-415相当：炎症波及と開口距離の評価、自発呼吸を残した経鼻軟性鏡挿管、気管切開、抜管前のCT・カフリーク評価。\n- 『歯科麻酔学 第8版』第6章「睡眠時無呼吸症候群」p.323-324相当：STOP-BANG、マスク換気困難、術後上気道閉塞、CPAP継続。\n- `AI対策資料/_data/guidelines/気道管理ガイドライン.txt`：困難気道での反復操作制限、外科的気道への移行。\n- `AI対策資料/02_分野別ノート/10_気道管理と人工呼吸.md`：覚醒下挿管では自発呼吸・気道緊張を保ち、過鎮静を避ける。\n- `AI対策資料/_data/guidelines/周術期禁煙ガイドライン.txt`、`AI対策資料/02_分野別ノート/13_合併疾患の管理_代謝内分泌腎肝.md`。\n\n---\n\n## 症例検討 問題2：高度肥満、知的能力障害、自閉症、糖尿病、てんかん\n\n### 原本設問\n\n- 患者：19歳女性、身長150 cm、体重126 kg\n- 診断：多数歯う蝕、重度歯周病\n- 術式：保存的歯科治療、抜歯術\n- 予定処置時間：2時間\n- 予定出血量：少量\n- 既往歴：知的能力障害（IQ 60）を伴う自閉症スペクトラム障害、II型糖尿病、てんかん\n- 生活歴：15歳時より親元を離れ入所施設で共同生活。施設ではほとんどの時間を座位での作業に費やす\n- 歯科診療上の状況：開口可能だが口腔内に触れることへの拒否が強く、全身麻酔管理下の治療依頼\n- 術前診察：父親と施設職員が来院\n- 常用薬：イーケプラ錠（レベチラセタム）、スーグラ（イプラグリフロジン、SGLT2阻害薬）\n- 術前検査：HbA1c 6.9％、ALT 78 U/L、AST 50 U/L、ケトン体陰性、尿糖3＋、尿潜血2＋。呼吸機能検査は実施不可能\n- 胸部X線：両側横隔膜挙上\n- 心電図：異常なし\n- 血圧134/80 torr、心拍数90回/分（整）、SpO2 95％\n\n本症例について、\n\n1. BMI（Body Mass Index）を算出せよ。\n2. 全身麻酔を行う際の周術期管理で留意すべき点を簡潔に説明せよ。\n\n### 模範解答\n\n#### 1. BMI\n\n**BMI = 126 kg ÷ (1.50 m)² = 56.0 kg/m²**\n\nしたがって**BMI 56.0 kg/m²**であり、WHO分類ではclass III、日本の基準ではBMI 35以上の**高度肥満**に該当する。標準体重の目安（BMI 22）は約49.5 kgである。\n\n#### 2. 周術期管理\n\n本症例では、高度肥満による急速な低酸素化・困難気道、OSAS/肥満低換気症候群、SGLT2阻害薬関連正常血糖ケトアシドーシス、てんかん、意思決定支援、静脈血栓塞栓症が主要リスクである。\n\n**意思決定と行動調整：** 19歳の成人であり、IQだけで判断せず、治療・麻酔の内容、利益・危険、代替法を理解・比較し意思表示できるか個別に評価する。平易な言葉・絵・見通し提示を使い、本人の同意またはアセントを最大限得る。意思決定能力が不十分な場合は、法的に適切な代諾者を確認する。父親が同行したことだけで自動的に代諾権があるとは限らない。施設職員から普段の意思表示、感覚過敏、パニック誘因、鎮静歴、発作歴を聴取し、馴染みの支援者同伴、待機時間短縮、静かな環境を整える。前投薬を用いる場合も、肥満・OSASを想定して監視下で少量ずつ投与し、無監視の深鎮静を避ける。\n\n**肥満と呼吸・気道：** いびき、無呼吸、日中傾眠、頸囲、Mallampati、甲状オトガイ距離、頸部可動性を可能な範囲で評価する。SpO2 95％、横隔膜挙上は、FRC低下、無気肺、拘束性障害、OSAS/肥満低換気症候群を疑わせるため、血液ガスまたは血清HCO3−、胸部所見を追加評価する。手術台の耐荷重、幅、移乗方法、適切な長さの血圧カフ、超音波下静脈路を準備する。\n\n導入は**ramped position（外耳道と胸骨上縁を水平）かつ頭高位**とし、十分な前酸素化、必要に応じCPAP/PEEPを用いる。二人法マスク換気、ビデオ喉頭鏡、軟性鏡、声門上器具、外科的気道器具を準備する。気道評価が不十分で困難が強く疑われる場合は覚醒下挿管も検討する。無呼吸後はFRC低下により急速にSpO2が低下するため、挿管試行を長引かせない。\n\n人工呼吸は一回換気量を実体重126 kgではなく**理想体重を基準に約6-8 mL/kg**で設定し、適切なPEEP、必要に応じリクルートメントを用い、プラトー圧・駆動圧、EtCO2、酸素化を監視する。高い気道内圧だけで換気量を稼がない。オピオイド節減、局所麻酔、アセトアミノフェンなどの多角的鎮痛を行う。ロクロニウムなどは薬剤ごとに理想体重・除脂肪体重・実体重のどれを用いるかが異なるため、実体重による一律投与をしない。\n\n**糖尿病・SGLT2阻害薬：** HbA1c 6.9％は慢性管理不良を強く示さないが、SGLT2阻害薬では血糖が著増しなくてもケトアシドーシスを起こし得る。予定手術ではスーグラを現在の糖尿病・施設プロトコルに従って術前中止し、一般に少なくとも3日前からの中止を検討する。最終服用、食事摂取、脱水、感染を確認し、当日血糖だけでなく血中βヒドロキシ酪酸、電解質、HCO3−、アニオンギャップ、pHを必要に応じ評価する。悪心、腹痛、頻呼吸、原因不明の代謝性アシドーシスがあれば正常血糖でもケトアシドーシスとして治療し、予定手術を延期する。術中・術後も血糖と酸塩基を監視し、十分な補液、必要時インスリンとブドウ糖を用いる。尿糖3＋は薬理作用で生じ得るため、それだけで糖尿病悪化と判定しない。\n\n**てんかん：** 発作型、最終発作、誘因、服薬遵守、血中濃度測定の要否を確認する。レベチラセタムは原則継続し、絶食中も少量の水で内服、内服不能なら静注製剤への置換を検討する。低酸素、低血糖、電解質異常、睡眠不足、発熱、服薬中断を避け、けいれん時に備えて酸素、吸引、ベンゾジアゼピンを準備する。\n\n**肝・腎・血栓・体位：** ALT・AST上昇は肥満関連脂肪性肝疾患を疑うが、薬剤性・ウイルス性も含め、ビリルビン、アルブミン、PT-INR、血小板を確認する。尿潜血2＋は月経混入、尿路感染、結石、腎疾患などを再検し、クレアチニン・eGFRを確認する。高度肥満と日常的な不動でVTEリスクが高いため、早期離床、弾性ストッキング・間欠的空気圧迫、手術・出血リスクに応じ薬物予防を検討する。圧迫・神経障害、横紋筋融解を防ぐため、十分なパッド、体位固定、皮膚・圧点保護を行う。\n\n**覚醒・術後：** 定量的TOF比0.9以上、十分な覚醒、自発換気、気道防御反射を確認し、頭高位で抜管する。再挿管器具を直ちに使える状態にする。PACUでは持続SpO2、可能なら換気監視を行い、普段CPAPを使用していれば早期再開する。低酸素、無気肺、上気道閉塞、オピオイド感受性、PONV、興奮・自己抜去を監視し、日帰りに固定せず必要なら一泊または高依存度病床で観察する。\n\n### 採点キーワード\n\n- BMI 56.0 kg/m²、高度肥満\n- 成人の意思決定能力評価、本人への説明・アセント、適切な代諾\n- ramped position、頭高位、前酸素化、CPAP/PEEP\n- 困難マスク換気・困難挿管、ビデオ喉頭鏡、覚醒下挿管\n- FRC低下、急速な低酸素化、理想体重基準の一回換気量\n- SGLT2阻害薬中止、正常血糖ケトアシドーシス、ケトン・アニオンギャップ\n- 尿糖はSGLT2阻害作用で陽性になり得る\n- レベチラセタム継続、発作誘因回避\n- 脂肪肝・腎評価、VTE予防、体位・圧迫障害予防\n- 定量TOF比0.9以上、完全覚醒・頭高位抜管、術後CPAPと持続監視\n\n### 根拠\n\n- 『歯科麻酔学 第8版』第6章「肥満患者」p.392-405相当：ramped position、困難気道器具、体重指標別薬物投与、FRC・胸郭コンプライアンス低下、PEEP、術後肺合併症・VTE。\n- 『歯科麻酔学 第8版』第2章 p.91-92相当：BMI 35以上で麻酔リスクが増大、SGLT2阻害薬による尿糖。\n- 『歯科麻酔学 第8版』第6章「糖尿病」p.357-360相当：DKA、周術期血糖・ケトン・酸塩基評価。\n- 『歯科麻酔学 第8版』第6章「睡眠時無呼吸症候群」p.323-324相当。\n- `AI対策資料/02_分野別ノート/13_合併疾患の管理_代謝内分泌腎肝.md`、`AI対策資料/02_分野別ノート/10_気道管理と人工呼吸.md`。\n\n---\n\n## 専門的知識 問題1：レミマゾラム\n\n### 原本設問\n\nレミマゾラムの ①薬理学的特徴、②薬物動態、③基本的投与方法について説明せよ。\n\n### 模範解答\n\n#### ① 薬理学的特徴\n\nレミマゾラムは**超短時間作用性ベンゾジアゼピン系静脈麻酔薬**である。GABAA受容体のベンゾジアゼピン結合部位へ結合し、GABAによるCl−流入を増強して神経細胞を過分極させ、用量依存性に鎮静・催眠、健忘、抗不安、抗けいれん、筋弛緩作用を示す。臨床的鎮痛作用はないため、手術刺激にはオピオイド・局所麻酔などを併用する。\n\nプロポフォールに比べ循環抑制・注入時痛が少ない傾向があるが、低血圧、徐脈、呼吸抑制・無呼吸は起こり得る。ベンゾジアゼピン拮抗薬**フルマゼニル**で拮抗できるが、拮抗後も再鎮静・呼吸抑制を監視する。重症筋無力症では筋弛緩作用のため禁忌・重大な注意対象となり、他の中枢抑制薬との相加作用にも注意する。\n\n#### ② 薬物動態\n\n主に肝臓の**カルボキシルエステラーゼ1（CES1）**でエステル結合が加水分解され、活性が未変化体の約1/300以下のほぼ不活性な代謝物CNS7054となる。CYP依存性が小さく、クリアランスが比較的大きいため、投与速度変更に対する調節性と投与中止後の速やかな覚醒が特徴である。一方、レミフェンタニルのような「血中・組織の非特異的エステラーゼ代謝」と同一ではなく、主に肝CES1である点を区別する。代謝物は主として腎排泄される。高齢者、重症患者、肝機能障害では作用増強・覚醒遅延を考え、投与速度を減量・滴定する。\n\n#### ③ 基本的投与方法\n\n全身麻酔導入では、成人に通常**12 mg/kg/時**で持続静注し、意識消失まで投与する。全身状態に応じ、より緩徐な**6 mg/kg/時**で導入する。麻酔維持は通常**1 mg/kg/時**で開始し、臨床徴候やBIS等を参考におおむね0.1 mg/kg/時単位で調節し、上限2 mg/kg/時の範囲で滴定する。高齢者・循環予備力低下例では低い速度から慎重に用いる。鎮痛薬・筋弛緩薬を必要に応じ併用し、酸素化、換気、血圧、心電図を連続監視する。\n\n製剤は指定の溶解液・濃度で調製し、乳酸リンゲル液では溶解不良・沈殿の可能性があるため、添付文書に従い生理食塩液で溶解し、配合変化に注意する。投与法・上限は最新版添付文書を優先する。\n\n### 採点キーワード\n\n- 超短時間作用性ベンゾジアゼピン、GABAA受容体\n- 鎮静・催眠・健忘、鎮痛作用なし\n- フルマゼニルで拮抗、再鎮静監視\n- 循環抑制が比較的少ないが呼吸・循環抑制は起こる\n- 肝カルボキシルエステラーゼ1（CES1）\n- ほぼ不活性代謝物CNS7054、活性約1/300以下\n- 導入12 mg/kg/時（緩徐導入6 mg/kg/時）\n- 維持1 mg/kg/時を個別滴定、上限2 mg/kg/時\n- 生理食塩液で溶解、乳酸リンゲルとの配合注意\n\n### 根拠\n\n- 『歯科麻酔学 第8版』第4章 p.173-188相当：ベンゾジアゼピンのGABAA作用、健忘・鎮静、鎮痛作用を欠くこと、フルマゼニル。\n- `AI対策資料/03_回答集/answers_2023.json` 問98：超短時間作用性、循環抑制、フルマゼニル。\n- `AI対策資料/03_回答集/answers_2025.json` 問17・問41：CES1、CNS7054、配合変化、レミフェンタニルとの代謝経路の相違。\n- アネレム添付文書・インタビューフォームに基づく用法用量。実使用時は最新版を確認する。\n\n---\n\n## 専門的知識 問題2：5-HT3受容体拮抗型制吐薬\n\n### 原本設問\n\n5-HT3受容体拮抗型制吐薬について説明せよ。\n\n### 模範解答\n\n5-HT3受容体拮抗薬は、セロトニン作動性の**イオンチャネル型5-HT3受容体**を選択的に遮断する制吐薬である。手術・抗がん薬などで消化管粘膜の腸クロム親和性細胞から放出されたセロトニンは、消化管迷走神経求心路の5-HT3受容体を刺激し、孤束核・嘔吐中枢へ入力する。また延髄最後野の化学受容器引金帯にも5-HT3受容体がある。本薬は末梢の迷走神経求心路と中枢の受容体を遮断し、悪心・嘔吐を抑制する。\n\n代表薬は**オンダンセトロン、グラニセトロン、ラモセトロン、パロノセトロン**で、抗がん薬誘発性悪心・嘔吐および術後悪心・嘔吐（PONV）の予防・治療に用いる。PONVリスクは女性、非喫煙、PONV/動揺病既往、術後オピオイドなどを評価し、高リスクではデキサメタゾン、ドロペリドール等の**作用点の異なる制吐薬と多剤併用**する。揮発性麻酔薬・オピオイドを減らし、十分な補液・鎮痛など原因対策も行う。\n\n錐体外路症状や強い鎮静が比較的少ないのが利点である。主な副作用は頭痛、便秘、めまい、肝酵素上昇で、薬剤により**QT延長**・徐脈・重篤な不整脈に注意する。先天性QT延長、低K・低Mg血症、他のQT延長薬併用では特に慎重に用いる。セロトニン作動薬併用時のセロトニン症候群にも留意する。投与量・適応年齢・投与時期は薬剤と最新版添付文書に従う。\n\n### 採点キーワード\n\n- イオンチャネル型5-HT3受容体の選択的遮断\n- 消化管腸クロム親和性細胞、迷走神経求心路\n- 最後野・化学受容器引金帯、孤束核・嘔吐中枢\n- オンダンセトロン、グラニセトロン、ラモセトロン、パロノセトロン\n- PONV・抗がん薬誘発性悪心嘔吐\n- 高リスクで作用点の異なる制吐薬を併用\n- 頭痛、便秘、QT延長、電解質異常に注意\n\n### 根拠\n\n- 『歯科麻酔学 第8版』第5章「術後悪心・嘔吐」p.307-308相当：PONV発生率、女性・非喫煙・既往・オピオイド等のリスク、予防の重要性。\n- 『歯科麻酔学 第8版』小児麻酔 p.430-431相当：PONV予防薬としてオンダンセトロンを記載。\n- `AI対策資料/_data/guidelines/不整脈ガイドライン.txt`：制吐薬を含むQT延長薬の評価。\n\n---\n\n## 専門的知識 問題3：筋弛緩モニタで用いる刺激\n\n### 原本設問\n\n筋弛緩モニタで用いる刺激（①四連刺激（TOF）、②テタヌス刺激、③post-tetanic count、④double-burst刺激）について説明せよ。\n\n### 模範解答\n\n#### ① 四連刺激（train-of-four：TOF）\n\n最大上刺激を**2 Hz、0.5秒間隔で4回**連続して加え、1-4回目の反応をT1-T4とする。TOF countは出現した反応数、TOF ratioは**T4/T1**である。非脱分極性遮断では反応がT1からT4へ減衰するfadeが生じ、回復期の定量評価に用いる。脱分極性遮断phase Iでは4反応が同程度に低下し、TOF比は1に近い。対照値を必要とせず臨床で頻用する。抜管前は定量モニタでTOF比**0.9以上**を確認し、意識、換気、嚥下・咳嗽も併せて判断する。\n\n#### ② テタヌス刺激\n\n通常**50 Hz（50-100 Hz）の高頻度刺激を5秒間**加え、持続収縮とfadeを観察する。非脱分極性遮断では収縮が次第に減衰する。刺激後は神経終末からのアセチルコリン動員によりpost-tetanic facilitation（PTF）が生じ、後続の単収縮が一時的に増強される。疼痛が強いため覚醒患者には用いず、反復すると評価自体へ影響するので間隔を置く。\n\n#### ③ Post-tetanic count（PTC）\n\nTOF反応がない深い遮断で用いる。**50 Hzのテタヌス刺激を5秒間**加え、約3秒後から**1 Hzの単収縮刺激**を行い、出現する反応数を数える。PTCが0なら非常に深い遮断、反応数が増えるほどTOF反応再出現が近い。テタヌス後増強を利用するため、頻回測定せず、深いロクロニウム遮断の評価や拮抗薬投与量判断に用いる。\n\n#### ④ Double-burst stimulation（DBS）\n\n短い**50 Hzのバースト刺激を約750 ms間隔で2回**与え、2回目と1回目の収縮を比較する。DBS3,2、DBS3,3などがあり、2回目の収縮低下は非脱分極性筋弛緩薬の残存を示す。TOFのfadeより触診・視診で感知しやすいが、主観評価であり、抜管判断には定量的TOF比を優先する。\n\n### 採点キーワード\n\n- TOF：2 Hz、0.5秒間隔4回、T1-T4、TOF比T4/T1\n- 非脱分極性遮断のfade、抜管前TOF比0.9以上\n- テタヌス：50 Hz・5秒、fade、post-tetanic facilitation\n- テタヌス刺激は疼痛、覚醒下で避ける\n- PTC：TOF 0の深い遮断、3秒後から1 Hz単収縮、反応数\n- DBS：50 Hzバースト2群、750 ms間隔、残存遮断の視触診\n\n### 根拠\n\n- 『歯科麻酔学 第8版』第2章「筋弛緩モニタリング」p.119-120相当：TOF、テタヌス、PTC、DBSの刺激条件と解釈。\n- `AI対策資料/02_分野別ノート/02_筋弛緩薬とモニタリング.md`：遮断深度に応じたTOF count・PTC・TOF ratioの使い分け、抜管前0.9以上。\n\n---\n\n## 専門的知識 問題4：心室性期外収縮に対するリドカイン\n\n### 原本設問\n\n心室性期外収縮の治療でリドカイン塩酸塩を使用する根拠として、①洞結節・心房、②房室結節、③プルキンエ線維、④心室筋それぞれに対する電気生理学的影響と、⑤心筋細胞への作用について説明せよ。\n\n### 模範解答\n\nリドカインはVaughan Williams分類**Ib群**の抗不整脈薬で、電位依存性Na+チャネルを遮断する。開口・不活化状態のチャネルへ結合しやすいuse-dependent blockを示し、正常心房・洞結節への影響が小さい一方、脱分極している虚血心筋・心室性異所性興奮を選択的に抑えるため、心室性期外収縮・心室性不整脈に用いられる。\n\n1. **洞結節・心房：** 洞結節の自動能と心房筋の電気活動には大きな影響を与えない。洞結節のphase 0は主にCa2+電流であり、Na+チャネル遮断の影響が比較的小さい。\n2. **房室結節：** 伝導時間を延長する。過量ではPR延長、徐脈・房室伝導障害を起こし得る。\n3. **プルキンエ線維：** 自動能を低下させ、不応期を延長し、伝導時間を延長し、刺激閾値を上昇させる。異所性自動能とリエントリー成立を抑制する。\n4. **心室筋：** 自動能と興奮性を低下させ、伝導時間を延長する。特に虚血・脱分極心筋でNa+チャネル遮断が強く現れ、心室性異所性興奮を抑制する。\n5. **心筋細胞への作用：** 細胞内側から電位依存性Na+チャネルを遮断し、phase 0の急速脱分極の立ち上がりと活動電位伝導を抑える。Purkinje・心室筋の異常自動能、撃発活動、リエントリーを抑制する。また心筋細胞へのCa2+流入とそれに続く筋小胞体からのCa2+放出を抑制し、濃度上昇時には陰性変力作用を示す。過量ではQRS幅延長、伝導抑制、低血圧、心筋抑制を生じ得るため、心電図・血圧を監視する。\n\n### 採点キーワード\n\n- Ib群、電位依存性Na+チャネル遮断、use-dependent\n- 洞結節・心房：大きな影響なし\n- 房室結節：伝導時間延長\n- Purkinje：自動能低下、不応期延長、伝導延長、刺激閾値上昇\n- 心室筋：自動能・興奮性低下、伝導時間延長\n- 虚血・脱分極心筋への選択性、異所性興奮・リエントリー抑制\n- Ca2+流入抑制、陰性変力作用、過量時QRS延長\n\n### 根拠\n\n- 『歯科麻酔学 第8版』第3章 p.133-134相当、表3-III-4「局所麻酔薬の心臓への影響」：洞結節・心房、房室結節、Purkinje線維、心室筋への影響を列記。\n- 同章：心筋細胞へのCa2+流入抑制、陰性変力作用、リドカインを心室性不整脈治療に用いる根拠。\n- `AI対策資料/_data/guidelines/不整脈ガイドライン.txt`：心室性不整脈治療と抗不整脈薬の位置づけ。\n\n---\n\n## 専門的知識 問題5：特発性（典型的）三叉神経痛の治療\n\n### 原本設問\n\n特発性（典型的）三叉神経痛の治療法について説明せよ。\n\n### 模範解答\n\n治療前に、片側三叉神経領域の数秒から2分程度の電撃様反復痛、洗顔・会話・咀嚼等による誘発、トリガーゾーン、不応期という典型像を確認する。感覚低下、両側性、若年発症、持続痛、聴覚・他脳神経症状があれば二次性を疑う。典型例でも小脳橋角部を含むMRI/MRAで神経血管圧迫を確認し、腫瘍、多発性硬化症、血管奇形等を除外する。\n\n第一選択は**カルバマゼピン**で、通常少量（例：100 mg/日程度）から開始し、効果と副作用をみて200-800 mg/日程度へ漸増する。オキシカルバゼピンも有効である。眠気、めまい、ふらつき、複視、低Na血症、肝障害、白血球・血小板減少、重症薬疹、薬物相互作用に注意し、血算、肝機能、Naを定期監視する。効果不十分または忍容性不良では、ラモトリギン、バクロフェン等を単独または併用する。\n\n薬物抵抗性、重大な副作用、長期服薬を望まない場合は外科・介入治療を検討する。MRIで責任血管による神経根圧迫があり全身状態が許せば、**微小血管減圧術（MVD）**は原因血管を神経根から離し、長期寛解が最も期待できる。一方、開頭術の出血、髄液漏、感染、聴力障害、小脳・脳神経障害などを説明する。\n\n高齢・併存疾患などで開頭が不適なら、経皮的三叉神経節治療として高周波熱凝固、バルーン圧迫、グリセロール注入、または定位放射線治療（ガンマナイフ）を選択する。これらは顔面感覚低下、角膜知覚低下、咀嚼筋力低下、しびれ・異常感覚、麻酔性疼痛、再発を生じ得る。末梢枝・三叉神経節ブロックは診断・一時的除痛や他治療困難例で考慮するが、神経破壊では感覚障害を十分説明する。治療は年齢、全身状態、責任血管、希望、再発・合併症のバランスで選ぶ。\n\n### 採点キーワード\n\n- 典型像の確認、MRI/MRAで二次性原因除外・神経血管圧迫評価\n- 第一選択カルバマゼピン、少量開始・漸増\n- 血算、肝機能、Na、薬疹・眠気・ふらつき\n- 第二選択ラモトリギン、バクロフェン\n- 微小血管減圧術、責任血管と三叉神経根の分離\n- 高周波熱凝固、バルーン圧迫、グリセロール注入\n- ガンマナイフ、神経ブロック\n- 顔面感覚低下、角膜障害、麻酔性疼痛、再発の説明\n\n### 根拠\n\n- 『歯科麻酔学 第8版』第12章「三叉神経痛」p.468-470相当：カルバマゼピン200-800 mg/日、ラモトリギン・バクロフェン、MVD、神経ブロック、高周波熱凝固、バルーン圧迫、グリセロール、ガンマナイフ。\n- `AI対策資料/04_予想問題/mock_2026.json` 三叉神経痛・治療：典型症状、第一選択、検査・副作用監視。\n\n---\n\n## 2022年答案の要点一覧\n\n| 区分 | 問題 | 最初に書く結論 |\n|---|---|---|\n| 症例1 | 口腔底蜂窩織炎 | 自発呼吸を温存した覚醒下気道確保または気管切開、抜管延期を含む計画 |\n| 症例2-1 | BMI | 56.0 kg/m²、高度肥満 |\n| 症例2-2 | 高度肥満等 | ramped position、SGLT2中止と正常血糖DKA、抗てんかん薬継続 |\n| 専門1 | レミマゾラム | GABAA・CES1・フルマゼニル・導入12/維持1 mg/kg/時 |\n| 専門2 | 5-HT3拮抗薬 | 消化管迷走神経と最後野の5-HT3を遮断しPONVを抑制 |\n| 専門3 | 筋弛緩刺激 | TOF 2 Hz×4、テタヌス50 Hz、深い遮断はPTC、DBSは視触診 |\n| 専門4 | リドカイン | Ib群Na+チャネル遮断でPurkinje・心室の異所性興奮を抑制 |\n| 専門5 | 三叉神経痛 | 第一選択カルバマゼピン、抵抗例はMVDまたは経皮・放射線治療 |\n"},{"id":"専門医試験_2025年_問題と模範解答","title":"専門医試験 2025年 問題と模範解答","cat":"専門医","md":"# 第21回 歯科麻酔専門医試験（2025年）問題と模範解答\n\n> 原本：第21回歯科麻酔専門医試験（令和7年5月31日）\n>\n> 収録：症例検討2題（症例1は小問3問）・専門的知識5題（図表1点）。原本3ページを全ページ確認した。\n>\n> 本稿は公開設問を『歯科麻酔学 第8版』および本フォルダ内のガイドライン・分野別ノートに照らして作成した**学習用の模範解答**であり、学会公表の公式解答ではない。実試験では、各段落の冒頭と太字の語を残して答案欄へ圧縮する。\n\n---\n\n## 症例検討 問題1：小児抜管直後の換気不能\n\n### 原本設問\n\n- 患者：7歳、男児、身長115 cm、体重22 kg\n- 診断：多数歯う蝕\n- 予定術式：保存的歯科治療\n- 予定手術時間：2時間\n- 既往歴：注意欠陥・多動性障害\n- 常用薬：メチルフェニデート\n- 経過：局所麻酔下での治療は困難であったため、全身麻酔下での治療を予定した。2週間前に鼻閉、咳の風邪症状があったが、現在は落ち着いている。緩徐導入を行い、ロクロニウムで筋弛緩を得たのち気管挿管し、セボフルランで維持した。治療終了後、セボフルランを中止し、スガマデクスを投与した。呼気終末セボフルラン濃度が0.6％となり体動が出現したため抜管したが、直後に奇異呼吸となり、SpO2が低下した。マスク換気を試みたが胸郭が挙上しなかった。\n\n以下の項目に沿って記載せよ。\n\n1. 考えられる原因\n2. 予防の方法\n3. その後の対応\n\n### 模範解答\n\n#### 1. 考えられる原因\n\n最も考えられるのは、**完全喉頭痙攣**である。抜管直後の奇異呼吸、SpO2低下、マスク陽圧換気を行っても胸郭が挙上しないという所見は、声帯が強く閉鎖し換気が通らない完全閉塞に合う。小児、2週間以内の上気道感染、歯科処置による唾液・血液・水、気管挿管、吸入麻酔、浅い麻酔深度での抜管が危険因子である。呼気終末セボフルラン0.6％で体動が出現した時点は、十分な深麻酔でも十分な覚醒でもない**興奮期・浅麻酔**であり、分泌物や抜管刺激が喉頭反射を誘発したと考える。\n\n同時に、舌根沈下・咽頭軟部組織閉塞、残存筋弛緩、気管支痙攣、分泌物・血液・異物による気道閉塞、誤嚥、抜管後クループを鑑別する。上気道閉塞ではエアウェイ・下顎挙上で改善しやすく、気管支痙攣では胸郭は動くが呼気延長・喘鳴・気道内圧上昇を示す。残存筋弛緩は定量TOFで確認するが、スガマデクス投与後でも投与量不足や未監視なら否定できない。\n\n#### 2. 予防の方法\n\n術前に鼻汁の性状、湿性咳嗽、発熱、喘鳴、呼吸音、食欲・活気を再評価し、「現在は落ち着いた」という情報だけで低リスクとしない。小児では上気道感染後の気道過敏性が数週間残る。発熱、膿性鼻汁、湿性咳嗽、喘鳴、下気道所見、全身状態不良があれば予定処置を延期する。症状消失後の待機期間は一律でなく、緊急度、気道器具、患児因子と合わせて判断するが、本例は待機可能な歯科処置なので延期を積極的に検討する。\n\n経験ある麻酔科医が管理し、前酸素化、適切なサイズの気管チューブ、愛護的挿管、十分な麻酔深度を保つ。唾液・血液・洗浄液を除去し、口腔内パックを確実に回収する。抜管前に定量的TOF比0.9以上、十分な自発換気、体温、意識、気道防御反射を確認する。抜管は、深麻酔下抜管を選ぶなら刺激に反応しない十分な深度で、覚醒抜管を選ぶなら開眼、指示反応、規則的換気、強い咳嗽・嚥下がある**完全覚醒**で行い、中間の浅麻酔期を避ける。本例のような最近の上気道感染と口腔内分泌物を伴う症例では、十分に吸引して完全覚醒抜管する戦略が妥当である。抜管時の予防的CPAP、適切な局所麻酔・非オピオイド鎮痛、症例に応じリドカインまたは少量プロポフォールを検討する。\n\nメチルフェニデートの休薬・継続は、循環、行動、服薬時刻を確認し施設方針で決めるが、本合併症の主因は浅麻酔抜管と気道過敏性である。覚醒時興奮と疼痛を分けて評価する。\n\n#### 3. その後の対応\n\n1. 直ちに応援を要請し、手術刺激を中止する。100％酸素、高流量、新鮮ガスを投与する。\n2. 頭頸部を適正化し、口腔内の血液・分泌物・異物を素早く吸引する。両手で密着させたマスク、強い下顎挙上（必要に応じLarson maneuver）、経口/経鼻エアウェイを用い、**CPAP 10-20 cmH2O**程度を加える。胃内送気・肺損傷を避け、閉鎖声門へむやみに強圧をかけ続けない。\n3. 改善しない、またはSpO2低下・徐脈が進む場合、静注路があればプロポフォールを少量（例0.5-0.8 mg/kg程度）投与して麻酔を深くする。換気不能が持続すれば**スキサメトニウム**を静注（例0.5-1 mg/kg、再挿管が必要なら1 mg/kg前後）し、小児では徐脈予防にアトロピン0.02 mg/kgを考慮する。静注路がなければ施設手順に従い筋注投与も選択する。\n4. 声門が開いたら100％酸素で換気し、必要なら直ちに再挿管する。徐脈・心停止なら質の高い胸骨圧迫と小児蘇生を開始する。換気・挿管とも不可能なら、声門上器具、最終的に緊急外科的気道を含むcannot intubate, cannot oxygenate対応へ移行する。\n5. 回復後も、強い吸気努力による**陰圧性肺水腫**、誤嚥、低酸素性障害、再発を監視する。湿性ラ音、泡沫状痰、酸素化不良があれば再挿管・PEEPを含む呼吸管理を行い、十分なPACU/ICU観察を行う。\n\n### 採点キーワード\n\n- 完全喉頭痙攣\n- 小児、2週間以内の上気道感染、歯科の血液・分泌物\n- 浅麻酔・興奮期抜管、深麻酔でも完全覚醒でもない\n- かぜスコア、発熱・湿性咳嗽・喘鳴なら延期\n- 吸引、口腔内パック回収、定量TOF比0.9以上\n- 完全覚醒抜管または十分な深麻酔抜管、中間を避ける\n- 100％酸素、下顎挙上、CPAP、Larson maneuver\n- プロポフォールで深麻酔、スキサメトニウム、再挿管\n- 低酸素性徐脈への蘇生、陰圧性肺水腫の監視\n\n### 根拠\n\n- 『歯科麻酔学 第8版』小児麻酔 p.430-431相当：抜管後上気道閉塞・喉頭痙攣、浅麻酔抜管、100％酸素陽圧換気、改善しなければスキサメトニウム。\n- 『歯科麻酔学 第8版』第6章「上気道感染症」p.314-315相当：かぜスコア、感染後2-5週間の気道反応性、延期判断。\n- 『歯科麻酔学 第8版』術前評価 p.218-219相当：2週間以内の上気道感染で喉頭痙攣・気管支痙攣・低酸素が増加、延期期間は個別判断。\n- `AI対策資料/02_分野別ノート/02_筋弛緩薬とモニタリング.md`：抜管前定量TOF比0.9以上。\n\n---\n\n## 症例検討 問題2：大動脈弁狭窄症を伴う高齢者の癌手術\n\n### 原本設問\n\n- 患者：78歳、女性、身長151 cm、体重45 kg\n- 診断：下顎歯肉癌\n- 予定術式：下顎骨辺縁切除術\n- 予定手術時間：3時間\n- 既往歴：高血圧症にカルシウム拮抗薬、高脂血症にスタチン製剤を内服。II型糖尿病は食事療法で経過観察。変形性膝関節症にアセトアミノフェンとロキソプロフェンを頓用。普段は杖歩行。胸部症状や失神の経験なし\n- 検査結果：血圧148/86 mmHg、脈拍数72回/分、SpO2 95％。空腹時血糖134 mg/dL、HbA1c 7.2％、その他異常なし\n- 標準12誘導心電図：I誘導とV5、V6に平低T\n- 心エコー：大動脈弁狭窄、大動脈弁口面積1.1 cm²、左室-大動脈間平均圧較差35 mmHg、最大血流速度3.8 m/秒、左室駆出率51％\n- 循環器内科医：原疾患の治療を優先させ、その後に大動脈弁治療適応を再評価したいとのコメント\n- 身体所見：入浴や着替えは自立。長距離歩行や階段昇降は膝の負担で不能。認知機能障害なし、理解力良好\n\n大動脈弁狭窄症の病態を説明し、上記患者の評価と、手術を全身麻酔下で実施する場合の麻酔管理計画を記せ。\n\n### 模範解答\n\n#### 1. 病態\n\n大動脈弁狭窄症（AS）は、加齢性石灰化、先天性二尖弁、リウマチ性変化等で弁尖の開放が制限され、左室流出路に**固定性狭窄**を生じる病態である。左室は狭窄を越えて拍出するため高い収縮期圧を必要とし、慢性圧負荷から**求心性左室肥大**を来す。肥大心はコンプライアンスが低下して拡張障害となり、左室拡張終期圧が上昇し、左室充満の心房収縮依存性が大きくなる。このため洞調律喪失、特に心房細動で急激に心拍出量が低下する。\n\n肥大と高い壁応力で心筋酸素需要は増える一方、左室拡張期圧上昇、頻脈による拡張期短縮、低い大動脈拡張期圧は冠灌流を低下させ、冠動脈狭窄がなくても心内膜下虚血を生じる。弁口が固定されるため、麻酔薬による血管拡張や出血で血圧が下がっても一回拍出量を十分増やせず、**低血圧→冠灌流低下→虚血・収縮力低下→さらに低血圧**の悪循環となる。進行すると労作性呼吸困難・心不全、狭心症、失神の三徴、突然死を生じる。\n\n#### 2. 本患者の評価\n\n弁口面積1.1 cm²、平均圧較差35 mmHg、最大流速3.8 m/秒はいずれも典型的には**中等度ASの上限、重症に近い値**である。重症基準の目安である弁口面積1.0 cm²以下、平均圧較差40 mmHg以上、最大流速4.0 m/秒以上にはわずかに達しない。LVEF 51％は保たれているが低正常域である。明らかな狭心症、失神、心不全症状はない一方、膝関節症で運動負荷が制限され、症状を誘発する活動をしていないため「無症候」と断定できず、機能的能力は不明である。I、V5、V6の平低Tは左室肥大strainまたは虚血の可能性がある。\n\n手術は3時間の下顎癌手術で時間依存性があり、出血予定は大きくない。循環器内科が癌治療先行を支持し、現時点で症候性重症ASを示す所見がなければ、予防的AVR/TAVIのために一律延期するより、**多職種でリスクを共有し厳密な循環管理下に手術を進める**判断が妥当である。\n\n術前に、呼吸困難、起坐呼吸、夜間発作性呼吸困難、胸痛、失神・前失神、動悸、浮腫を再聴取し、心雑音、肺ラ音、頸静脈、浮腫を診察する。心エコーの実施時期と画像品質、左室肥大・拡張機能、他弁疾患、肺高血圧を確認する。血算、電解質、腎機能、血糖、必要に応じBNP/NT-proBNPと術前トロポニンを確認する。運動能力が膝で評価不能でも、負荷検査は結果が癌手術の延期・冠治療など管理を変える場合に限る。外科・循環器・麻酔科で、術後監視場所、緊急時対応、本人への説明を共有する。\n\nカルシウム拮抗薬は種類、心拍・血圧を確認して原則継続し、スタチンも継続する。血糖は定期測定する。ロキソプロフェンは腎機能・出血・消化管リスクを踏まえ、周術期鎮痛はアセトアミノフェンや局所麻酔を組み合わせる。\n\n#### 3. 全身麻酔管理計画\n\n循環目標は、**洞調律、適正な心拍数、前負荷、体血管抵抗、心収縮力、冠灌流圧を維持**することである。頻脈は拡張期短縮と酸素需要増大を、著明な徐脈は固定された一回拍出量のもとで心拍出量低下を招くため、概ね60-80回/分を目安に急変を避ける。脱水・出血による前負荷低下を避ける一方、拡張障害があるため過剰輸液による肺水腫にも注意する。\n\n標準モニタに加え、**麻酔導入前に観血的動脈圧ライン**を確保し、少なくとも太い末梢静脈路を確保する。中心静脈路や経食道心エコーは、末梢アクセス、循環不安定、手術侵襲、施設能力に応じ選択し、ルーチンとはしない。フェニレフリンまたはノルアドレナリンを直ちに投与できるよう準備し、除細動・ペーシングへのアクセスを確保する。\n\n頭高位で前酸素化し、十分なオピオイド等で喉頭展開時の頻脈・高血圧を抑えながら、循環抑制の少ない薬剤を少量ずつ滴定する。エトミデート、または低用量プロポフォール等を患者状態に応じ選択し、急速な深麻酔・血管拡張を避ける。導入時の低血圧は待たずにα作動性昇圧薬で治療し、必要に応じ小量輸液を併用する。気管挿管刺激、浅麻酔、疼痛、低酸素・高二酸化炭素血症、低体温、貧血を避ける。\n\n維持は揮発性麻酔薬または静脈麻酔薬を低濃度から調節し、心筋抑制とSVR低下を避ける。陽圧換気と過剰PEEPは静脈還流を減らすため、酸素化を保つ最小限にする。血圧は少なくとも術前値から20％を超えて下げないことを目安にし、拡張期圧を維持する。新規心房細動は心拍出量を急低下させるため、原因を補正し、血行動態不安定なら速やかな同期下カルディオバージョンを考慮する。ST-T変化、低血圧、頻脈があれば心筋虚血として冠灌流・酸素需給を是正する。\n\n覚醒・抜管時も頻脈、高血圧、低酸素を避け、十分な鎮痛、制吐、筋弛緩回復を確認する。術後は連続心電図・SpO2・頻回血圧測定を行える病床で、低血圧、心不全、心房細動、心筋虚血を監視する。症状・手術リスクに応じ術後トロポニン・心電図を測定する。離床・輸液は慎重に行い、癌治療後に循環器内科でASを再評価する。\n\n### 採点キーワード\n\n- 固定性左室流出路狭窄、圧負荷、求心性左室肥大\n- 拡張障害、左室充満の心房収縮依存、洞調律維持\n- 心筋酸素需要増大、冠灌流低下、心内膜下虚血\n- 弁口面積1.1、平均圧較差35、Vmax 3.8は中等度上限・重症近傍\n- 無症候の評価は運動制限で不確実、LVEF 51％、平低T\n- 癌手術の時間依存性、循環器・外科・麻酔科の共同判断\n- 前負荷・SVR・収縮力・冠灌流圧維持、頻脈・著明な徐脈を避ける\n- 導入前A-line、昇圧薬準備、滴定導入\n- 低血圧をフェニレフリン/ノルアドレナリンで迅速治療\n- 新規心房細動・虚血・心不全の術後監視\n\n### 根拠\n\n- 『歯科麻酔学 第8版』第6章「大動脈弁狭窄症」p.340-341相当：重症度、求心性肥大、冠灌流、心房収縮依存、狭心症・失神・心不全、麻酔目標。\n- `AI対策資料/02_分野別ノート/07_循環生理と心疾患.md`：ASでは前負荷・後負荷・洞調律・冠灌流を保ち、頻脈・急なSVR低下・低血圧を避ける。\n- `AI対策資料/_data/guidelines/非心臓手術の心血管ガイドライン.txt`：手術緊急度、活動性心疾患、機能的能力、検査が管理を変えるかによる術前評価。\n\n---\n\n## 専門的知識 問題1：ヒトの酸塩基平衡の緩衝系\n\n### 原本設問\n\nヒトにおける酸塩基平衡の緩衝系について説明せよ。\n\n### 模範解答\n\n緩衝系とは、弱酸とその共役塩基がH+と可逆的に結合し、酸または塩基が加わった直後のpH変化を小さくする仕組みである。主要な緩衝系は**重炭酸、ヘモグロビン、蛋白、リン酸**である。化学的緩衝は秒単位で働き、その後に肺のCO2調節、腎のHCO3−・H+調節が加わる。\n\n1. **重炭酸緩衝系：**\n   **CO₂ + H₂O ⇄ H₂CO₃ ⇄ H⁺ + HCO₃⁻**\n\n   Henderson-Hasselbalch式は、**pH = 6.1 + log₁₀（[HCO₃⁻] ÷（0.03 × PaCO₂））**である。強酸のH+をHCO3−が受け、H2CO3を経てCO2と水になり、CO2を肺から排泄できる。HCO3−は腎で再吸収・新生・排泄できるため、pKa 6.1が生理的pHから離れていても、細胞外液の主要な**開放型緩衝系**として強力である。\n2. **ヘモグロビン緩衝系：** 赤血球内Hb、とくに脱酸素HbがH+を受容する。組織でCO2から生じたH+をHbが緩衝し、HCO3−はCl− shiftで血漿へ移る。肺で酸素化されるとH+を放出し、HCO3−と反応してCO2となり呼出される。血液中の重要な非重炭酸緩衝系である。\n3. **蛋白緩衝系：** 蛋白のアミノ基、カルボキシ基、特にヒスチジンのイミダゾール基がH+を受け渡す。細胞内蛋白が主要で、血漿ではアルブミンも緩衝に寄与する。\n4. **リン酸緩衝系：**\n   **HPO₄²⁻ + H⁺ ⇄ H₂PO₄⁻**\n\n   細胞外濃度は低いが、細胞内と腎尿細管内で重要である。腎ではH+を滴定酸としてH2PO4−の形で排泄し、新たなHCO3−生成に寄与する。\n5. **骨緩衝：** 慢性の酸負荷では骨の炭酸塩・リン酸塩もH+を緩衝するが、持続すると骨脱灰の一因となる。\n\n肺は数分以内にPaCO2を、腎は数時間から数日でHCO3−再吸収、新生、NH4+・滴定酸排泄を調節する。これらは厳密には「緩衝」後の代償・補正だが、重炭酸系を閉じずに保つため不可欠である。\n\n### 採点キーワード\n\n- 弱酸・共役塩基、H+と可逆結合\n- 重炭酸、ヘモグロビン、蛋白、リン酸\n- Henderson-Hasselbalch式\n- 重炭酸系は肺CO2排泄と腎HCO3−調節を伴う開放系\n- 脱酸素Hb、Cl− shift\n- 細胞内蛋白・ヒスチジン、腎尿細管のリン酸\n- 化学的緩衝は即時、肺は分、腎は時間-日\n\n### 根拠\n\n- 『歯科麻酔学 第8版』第2章「酸塩基平衡」p.68-70相当：Henderson-Hasselbalch式、重炭酸・Hb・蛋白・リン酸緩衝系、肺・腎による代償。\n- `AI対策資料/02_分野別ノート/03_呼吸生理と酸塩基平衡.md`：酸塩基異常の判定と呼吸・代謝性代償。\n\n---\n\n## 専門的知識 問題2：呼吸の末梢・中枢化学受容器\n\n### 原本設問\n\n呼吸の化学的調節に関して、末梢と中枢の化学受容器について、それぞれ説明せよ。\n\n### 模範解答\n\n#### 末梢化学受容器\n\n末梢化学受容器は、左右の総頸動脈分岐部の**頸動脈小体**と大動脈弓の**大動脈小体**である。頸動脈小体からの求心路は舌咽神経、大動脈小体は迷走神経を通り、延髄呼吸中枢へ伝わる。PaO2低下、PaCO2上昇、動脈血H+上昇を直接感知し、迅速に換気を増加させる。特にPaO2低下を感知するのは末梢受容器のみで、PaO2が約60 mmHg以下になると換気応答が急増する。酸素含量ではなく**酸素分圧**に反応するため、貧血や一酸化炭素中毒ではPaO2が保たれていれば刺激が弱い。代謝性アシドーシスのH+にも直接反応する。頸動脈小体が主体で、大動脈小体の寄与は小さい。急性CO2換気応答の約20-30％を担う。\n\n低酸素でglomus細胞のO2感受性K+チャネルが抑制され、膜脱分極、Ca2+流入、神経伝達物質放出が起こり、求心神経発火が増える。反応が速いため、急な低酸素・アシドーシスの防御に重要である。\n\n#### 中枢化学受容器\n\n中枢化学受容器は延髄腹外側表面近傍などに分布し、主に**PaCO2上昇に伴う脳脊髄液pH低下**を感知する。CO2は血液脳関門を容易に通過し、髄液内で炭酸脱水酵素によりH2CO3、H+、HCO3−となる。血中H+とHCO3−は血液脳関門を通過しにくいため、中枢受容器はPaCO2そのものではなく、実質的には髄液・脳間質のH+増加に反応する。PaO2低下は直接検知しない。急性CO2換気応答の約70-80％を担う。\n\n末梢より反応開始はやや遅いが、持続的なCO2調節の中心である。慢性高CO2血症では腎で増加したHCO3−が髄液にも移行してpHが補正され、中枢CO2応答が鈍化し、低酸素性換気刺激への依存が相対的に増える。オピオイド、鎮静薬、吸入麻酔薬は中枢のCO2換気応答を抑制する。\n\n### 採点キーワード\n\n- 頸動脈小体・舌咽神経、大動脈小体・迷走神経\n- 末梢はPaO2、PaCO2、H+、迅速反応\n- PaO2 60 mmHg以下で換気急増、酸素含量ではなく分圧\n- 代謝性アシドーシスは末梢が直接感知\n- 中枢は延髄腹外側、CO2が血液脳関門通過\n- 髄液H+増加を感知、低酸素を直接感知しない\n- CO2応答：末梢20-30％、中枢70-80％\n- 慢性高CO2で髄液HCO3−が増え応答鈍化\n\n### 根拠\n\n- 『歯科麻酔学 第8版』第2章「呼吸の化学的調節」p.48-49相当：頸動脈小体・大動脈小体、神経経路、PaO2/PaCO2/pH、60 mmHg閾値、20-30％・70-80％。\n- `AI対策資料/02_分野別ノート/03_呼吸生理と酸塩基平衡.md`。\n\n---\n\n## 専門的知識 問題3：局所麻酔薬中毒の治療\n\n### 原本設問\n\n局所麻酔薬中毒の治療法を説明せよ。\n\n### 模範解答\n\n局所麻酔薬中毒（LAST）を疑ったら、確定診断を待たず、**局所麻酔薬投与中止、酸素化・換気、けいれん制御、脂肪乳剤、修正蘇生**を並行する。\n\n1. **直ちに中止・応援要請：** 注入を止め、救急カート・20％脂肪乳剤を要請し、時刻、薬剤、濃度、推定投与量を確認する。中毒初期の口周囲しびれ、金属味、耳鳴り、不穏、構音障害、けいれんから、低血圧、伝導障害、心室性不整脈、心停止への進行を連続評価する。全身麻酔中は自覚症状を欠き、循環虚脱が初発し得る。\n2. **気道・呼吸：** 100％酸素を投与し、気道確保とバッグマスク換気、必要なら気管挿管を行う。低酸素、高CO2、アシドーシスは局所麻酔薬の心・中枢毒性を増悪するため、正常換気を維持する。過換気しすぎも避ける。\n3. **けいれん：** 少量のベンゾジアゼピンを第一選択とする。プロポフォールは循環が保たれている場合に少量を考慮できるが、循環抑制がある重症LASTでは大量投与を避ける。スキサメトニウム等は筋収縮を止めても脳内発作を治療しないので、換気確保の補助と位置づける。\n4. **20％脂肪乳剤：** 重い神経症状または循環症状があれば早期に投与する。目安として1.5 mL/kgを2-3分でボーラスし、続いて0.25 mL/kg/分で持続する。循環不安定が続けばボーラスを反復し、持続速度増量を検討する。総量は施設プロトコル（一般に最初の30分で約12 mL/kgを超えない）に従う。改善後も再燃を考え持続・監視する。\n5. **循環蘇生：** 質の高い胸骨圧迫を行う。アドレナリンは必要なら通常の心停止量より少量から用い、1回量1 µg/kg未満を目安に過量を避ける。バソプレシン、Ca拮抗薬、β遮断薬、およびリドカイン・プロカインアミド等の局所麻酔薬系抗不整脈薬を避ける。心室性不整脈にはアミオダロンを考慮する。難治性循環虚脱では長時間蘇生、人工心肺・VA-ECMOを早期に相談する。\n6. **回復後：** 循環症状後は少なくとも4-6時間、心停止・重症例はICUでより長く、神経症状のみでも再発を監視する。原因薬、総量、注入部位、患者要因を記録し、今後の局所麻酔計画へ反映する。\n\n予防として、体重・併存疾患に応じ最大量を計算し、最低有効量を分割注入し、各分割前に吸引し、患者と会話しながら心電図・血圧・SpO2を監視する。ただし陰性吸引は血管内注入を完全には否定しない。\n\n### 採点キーワード\n\n- 局所麻酔薬投与を直ちに中止、応援・救急カート\n- 100％酸素、気道確保、正常換気、低酸素・高CO2・アシドーシス回避\n- けいれんにベンゾジアゼピン\n- 20％脂肪乳剤1.5 mL/kgボーラス、0.25 mL/kg/分持続\n- 胸骨圧迫、少量アドレナリン、アミオダロン\n- バソプレシン、Ca拮抗薬、β遮断薬、局所麻酔薬系抗不整脈薬を避ける\n- 難治例でECMO、回復後の再燃監視\n\n### 根拠\n\n- 『歯科麻酔学 第8版』第3章「局所麻酔薬中毒」p.132-134相当：初期中枢刺激、けいれん、呼吸循環抑制、アシドーシスで毒性増悪、心電気生理作用。\n- `AI対策資料/03_回答集/記述式_模範解答_2022.md` 問3：LASTの原因・症状・20％脂肪乳剤を含む治療。\n- `AI対策資料/02_分野別ノート/04_局所麻酔薬.md`：LAST対応の時間軸、脂肪乳剤、再燃監視。\n- `AI対策資料/03_回答集/answers_2025.json` 問22：20％脂肪乳剤投与量。\n\n---\n\n## 専門的知識 問題4：正常動脈圧波形\n\n### 原本設問\n\n正常な動脈圧波形を示す。①-⑤について何を反映あるいは示しているのか簡潔に記載せよ。\n\n1. 立ち上がりの傾き\n2. ノッチ部\n3. 圧波形と点線で囲まれた部分\n4. 点線部の長さ\n5. 傾き\n\n[[SPECIALIST_2025_ARTERIAL_WAVEFORM]]\n\n### 模範解答\n\n1. **立ち上がりの傾き：** 左室から大動脈への血液駆出速度、すなわち左室収縮性・最大dP/dtを反映する。急峻なら収縮性・駆出が大きく、鈍い立ち上がりは低収縮、流出路狭窄、過度のダンピング等でみられる。\n2. **ノッチ部：** 大動脈弁閉鎖に伴う重複切痕（dicrotic notch）で、左室駆出の終了、収縮期終末・拡張期開始を示す。末梢測定では反射波・回路特性で形が変わる。\n3. **圧波形と点線で囲まれた部分：** 拡張末期圧を基準にした収縮期圧波形の面積で、左室の**一回拍出量**を反映する。実際のpulse contour法では動脈コンプライアンス・抵抗、測定部位で補正してSVを推定する。\n4. **点線部の長さ：** 収縮期圧と拡張期圧の差、すなわち**脈圧**を示す。脈圧は主に一回拍出量と動脈コンプライアンスで決まり、同じSVでも高齢者の硬い動脈では大きくなる。\n5. **下降脚の傾き：** 拡張期の末梢への血液run-offを示し、主に**末梢血管抵抗と動脈コンプライアンス**（Windkessel時定数）を反映する。急峻な下降は低SVR・低コンプライアンス、緩徐な下降は高SVR・高コンプライアンス方向を示す。\n\n波形解釈では、カテーテル先端位置、気泡、血栓、延長管、オーバーダンピング・アンダーダンピング、末梢での脈圧増幅を除外する。波形の高さだけを心機能と同一視しない。\n\n### 採点キーワード\n\n- ① 左室収縮性、駆出速度、dP/dt\n- ② 大動脈弁閉鎖、収縮期終了・拡張期開始、dicrotic notch\n- ③ 収縮期面積、一回拍出量\n- ④ 脈圧＝収縮期圧−拡張期圧、一回拍出量と動脈コンプライアンス\n- ⑤ 末梢血管抵抗と動脈コンプライアンス、拡張期run-off\n- ダンピング、測定部位、反射波の影響\n\n### 根拠\n\n- 『歯科麻酔学 第8版』第2章「動脈圧波形分析」p.112-113相当：一拍ごとの動脈圧波形から一回拍出量を推定、呼吸性変動。\n- 『歯科麻酔学 第8版』p.84相当：末梢動脈圧は駆出波と反射波の合成で、末梢ほど収縮期圧・脈圧が増幅。\n- `AI対策資料/02_分野別ノート/07_循環生理と心疾患.md`：脈圧はSVと動脈コンプライアンスに依存。\n- `AI対策資料/02_分野別ノート/09_モニタリング.md`：観血的波形の末梢増幅と平均圧。\n\n---\n\n## 専門的知識 問題5：プレコンディショニング作用と麻酔薬\n\n### 原本設問\n\nプレコンディショニング作用について、またそれと麻酔薬との関係について簡潔に説明せよ。\n\n### 模範解答\n\n**虚血プレコンディショニング**とは、致死的でない短時間の心筋虚血・再灌流を先行させると心筋が虚血耐性を獲得し、その後の長時間虚血・再灌流による梗塞範囲、心機能障害、不整脈が軽減する現象である。先行虚血直後から約1-2時間持続するearly phaseと、約24-48時間後に再出現するlate phaseがある。\n\n短時間虚血によりアデノシン、オピオイド、ブラジキニン等が放出され、G蛋白共役受容体、protein kinase C、PI3K-Akt等の細胞内シグナルを介してミトコンドリアKATPチャネル、NO、少量の活性酸素種などが関与する。最終的にミトコンドリア透過性遷移孔の開口、Ca2+過負荷、ATP枯渇、細胞死を抑え、再灌流障害を軽減する。\n\n**麻酔薬によるプレコンディショニング（anesthetic preconditioning）**として、イソフルラン、セボフルラン、デスフルラン等の揮発性吸入麻酔薬は、先行虚血に似た細胞内シグナルを活性化し、虚血再灌流モデルで心筋梗塞範囲を縮小する。特に本教科書はイソフルラン・セボフルランを記載する。オピオイド、アデノシン、ニコランジル、カテコラミンにも関連する心筋保護作用が報告されている。\n\n亜酸化窒素やレミマゾラム、プロポフォール、デクスメデトミジンに、揮発性麻酔薬と同等に確立したプレコンディショニング作用があるとはいえない。プロポフォールは抗酸化作用を持つ一方、少量の活性酸素種を介する揮発性麻酔薬のシグナルを弱める可能性があり、実験条件で結果が異なる。臨床では揮発性麻酔薬の心筋保護が期待できても、血行動態、手術、患者背景の影響が大きく、虚血予防・冠灌流維持・酸素需給管理の代わりにはならない。\n\nなお、虚血後の再灌流初期に短い虚血を加える**ポストコンディショニング**、遠隔組織に虚血を与えるremote ischemic conditioningは関連概念だが、プレコンディショニングとは時相・方法が異なる。\n\n### 採点キーワード\n\n- 短時間の非致死的虚血で後続長時間虚血への耐性獲得\n- 梗塞範囲・再灌流障害の軽減\n- early phase 直後-1/2時間、late phase 24-48時間\n- アデノシン、オピオイド、PKC、ミトコンドリアKATPチャネル\n- Ca2+過負荷、ATP低下、ミトコンドリア障害の抑制\n- イソフルラン、セボフルラン、デスフルラン\n- 揮発性麻酔薬によるanesthetic preconditioning\n- 臨床的心筋保護は期待できるが標準的虚血予防の代替ではない\n\n### 根拠\n\n- 『歯科麻酔学 第8版』第2章「虚血プレコンディショニング」p.57-58相当：定義、early/late phase、ATP低下抑制、揮発性麻酔薬・オピオイド・アデノシン・ニコランジル。\n- `AI対策資料/03_回答集/answers_2025.json` 問12：選択肢中セボフルランが虚血プレコンディショニング作用を有する。\n- `AI対策資料/03_回答集/answers_2025.json` 問100：揮発性吸入麻酔薬に心筋虚血プレコンディショニング作用が期待できる。\n\n---\n\n## 2025年答案の要点一覧\n\n| 区分 | 問題 | 最初に書く結論 |\n|---|---|---|\n| 症例1 | 抜管直後換気不能 | 最近の上気道感染と浅麻酔抜管による完全喉頭痙攣 |\n| 症例2 | AS合併癌手術 | 中等度上限・重症近傍AS。洞調律、前負荷、SVR、冠灌流を維持しA-line下に滴定導入 |\n| 専門1 | 緩衝系 | 重炭酸、Hb、蛋白、リン酸。肺CO2・腎HCO3−が開放系を維持 |\n| 専門2 | 化学受容器 | 末梢はPaO2/CO2/H+、中枢は髄液H+によるCO2応答 |\n| 専門3 | LAST | 投与中止、100％O2、けいれん制御、20％脂肪乳剤、修正蘇生 |\n| 専門4 | 動脈圧波形 | ①収縮性 ②弁閉鎖 ③SV ④脈圧 ⑤SVR・コンプライアンス |\n| 専門5 | プレコンディショニング | 短時間虚血で虚血耐性。セボ等の揮発性麻酔薬が模倣 |\n"}]}</script>

/* ── markdown ────────────────────────────── */
function md2html(src){
  const lines = String(src).replace(/\r/g,'').split('\n');
  let out=[], i=0, hn=0;
  const inline = t => esc(t)
    .replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
    .replace(/~([A-Za-z0-9+\-]+)~/g,'<sub>$1</sub>')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  while(i<lines.length){
    const L=lines[i];
    if(/^\s*$/.test(L)){ i++; continue; }
    let m;
    if(m=L.match(/^(#{1,4})\s+(.*)$/)){ const h=Math.min(m[1].length,4);
      const id = h===2 ? ` id="h${hn++}"` : '';
      out.push(`<h${h}${id}>${inline(m[2])}</h${h}>`); i++; continue; }
    if(/^\s*(---|\*\*\*|___)\s*$/.test(L)){ out.push('<hr>'); i++; continue; }
    if(/^\s*\|/.test(L)){
      const rows=[]; while(i<lines.length && /^\s*\|/.test(lines[i])){ rows.push(lines[i]); i++; }
      const cells=r=>r.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
      let head=null, body=rows;
      if(rows[1] && /^[\s|:\-]+$/.test(rows[1])){ head=cells(rows[0]); body=rows.slice(2); }
      out.push('<div class="mdtable"><table>'
        + (head?'<thead><tr>'+head.map(c=>`<th>${inline(c)}</th>`).join('')+'</tr></thead>':'')
        + '<tbody>'+body.map(r=>'<tr>'+cells(r).map(c=>`<td>${inline(c)}</td>`).join('')+'</tr>').join('')
        + '</tbody></table></div>');
      continue;
    }
    if(/^\s*>/.test(L)){ const b=[]; while(i<lines.length && /^\s*>/.test(lines[i])){ b.push(lines[i].replace(/^\s*>\s?/,'')); i++; }
      out.push('<blockquote>'+b.map(x=>`<p>${inline(x)}</p>`).join('')+'</blockquote>'); continue; }
    if(/^\s*[-*]\s+/.test(L)){ const b=[]; while(i<lines.length && /^\s*[-*]\s+/.test(lines[i])){ b.push(lines[i].replace(/^\s*[-*]\s+/,'')); i++; }
      out.push('<ul>'+b.map(x=>`<li>${inline(x)}</li>`).join('')+'</ul>'); continue; }
    if(/^\s*\d+\.\s+/.test(L)){ const b=[]; while(i<lines.length && /^\s*\d+\.\s+/.test(lines[i])){ b.push(lines[i].replace(/^\s*\d+\.\s+/,'')); i++; }
      out.push('<ol>'+b.map(x=>`<li>${inline(x)}</li>`).join('')+'</ol>'); continue; }
    const p=[]; while(i<lines.length && !/^\s*$/.test(lines[i]) && !/^\s*(#{1,4}\s|\||>|[-*]\s|\d+\.\s|---)/.test(lines[i])){ p.push(lines[i]); i++; }
    out.push(`<p>${inline(p.join(' '))}</p>`);
  }
  return out.join('');
}

/* ── session ─────────────────────────────── */
let Q=null, timerH=null;
function startSet(sid, mode){
  const s=SETS[sid];
  begin(s.questions.map(q=>sid+':'+q.n), s.label, mode, mode==='exam'?(s.time||120)*60:0, sid);
}
function browseSet(sid){
  const s=SETS[sid], ids=s.questions.map(q=>sid+':'+q.n);
  Q={ids, idx:0, ans:{}, chk:{}, mode:'browse', title:s.label+' 解説', t0:Date.now(), limit:0, setId:sid};
  ids.forEach(id=>{ Q.chk[id]=1; Q.ans[id]=(QDB[id].answer||[]).slice(); });
  go('quiz');
}
function startIds(json,title,mode){ const ids=JSON.parse(json); if(!ids.length) return toast('該当問題がありません'); begin(shuffle(ids),title,mode,0); }
function startReview(){
  const ids=reviewQ();
  if(!ids.length) return toast('復習キューは空です。よくできました');
  begin(ids.sort((a,b)=>(S.q[a].box-S.q[b].box)||(S.q[a].ts-S.q[b].ts)),'弱点復習','study',0);
}
function startFlagged(){
  const ids=Object.keys(S.q).filter(id=>S.q[id].f && QDB[id]);
  if(!ids.length) return toast('フラグを付けた問題はありません');
  begin(ids,'フラグ付き','study',0);
}
function startDrill(n){
  const fresh=shuffle(ALLQ.filter(id=>!(S.q[id]||{}).a));
  const weak=shuffle(Object.keys(S.q).filter(id=>QDB[id]&&S.q[id].box<2&&S.q[id].a>0));
  const ids=[], seen=new Set();
  for(const pool of [weak.slice(0,Math.ceil(n*.4)), fresh, shuffle(ALLQ)]){
    for(const id of pool){ if(ids.length>=n) break; if(!seen.has(id)){ seen.add(id); ids.push(id); } }
    if(ids.length>=n) break;
  }
  begin(shuffle(ids), `ドリル${ids.length}問`, 'study', 0);
}
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function begin(ids,title,mode,limit,setId){
  Q={ids, idx:0, ans:{}, chk:{}, mode, title, t0:Date.now(), limit, setId:setId||''};
  persistActive(); go('quiz');
}
function persistActive(){
  if(!Q||Q.mode==='browse'){ S.active=null; save(); return; }
  S.active={ids:Q.ids, idx:Q.idx, ans:Q.ans, chk:Q.chk, mode:Q.mode, title:Q.title, t0:Q.t0, limit:Q.limit, setId:Q.setId};
  save();
}
function resume(){ if(!S.active) return; Q=Object.assign({},S.active); go('quiz'); }
function homeOf(){ return Q&&Q.setId ? (Q.setId==='mock2026'?'mock':'past') : 'home'; }

/* ── quiz ────────────────────────────────── */
function vQuiz(){
  if(!Q) return go('home');
  clearInterval(timerH);
  const id=Q.ids[Q.idx], q=QDB[id];
  if(!q) return go('home');
  const picked=Q.ans[id]||[], checked=!!Q.chk[id], st=qs(id), rev=Q.mode==='browse';
  topbar(Q.title, {back: Q.fromResult?'backToResult()':'quitQuiz()', noSearch:true, noSet:true,
    right:`<button class="iconbtn" onclick="toggleFlag('${id}')" aria-label="フラグ"
      style="color:${st.f?'var(--brass)':'var(--muted)'}">${st.f?IC.flagOn:IC.flag}</button>`});
  V().innerHTML = `<div class="qcard">
    <div class="qmeta">
      <span class="qnum">問${q.n}</span>
      <span class="chip brass">${CHOOSE[q.choose]||''}</span>
      ${q.excluded?'<span class="chip warn">採点除外</span>':''}
      ${checked&&!(q.answer||[]).length?'<span class="chip warn">正答なし</span>':
        checked&&q.status==='要確認'?'<span class="chip warn">要確認</span>':''}
    </div>
    <div class="qsub">${esc(SETS[q._set].label)}${(Q.mode!=='exam'||checked)
      ? '　·　'+esc(chShort(q.chapter))+(q.topic?'　·　'+esc(q.topic):'') : ''}</div>
    <div class="stem">${esc(q.stem)}</div>
    ${(q.figs||[]).map((f,i)=>`<div class="figbox"><img src="${f}" alt="設問の図" onclick="lightbox('${q._set}',${q.n},${i})"></div>`).join('')}
    <div class="opts">${KEYS.map((k,i)=>{
      const on=picked.includes(k); let cls=on?'sel':'', mk='';
      if(checked){ const cor=(q.answer||[]).includes(k);
        cls = cor&&on?'correct' : cor&&!on?'missed' : !cor&&on?'wrong' : '';
        mk  = cor&&on?ic('check',19) : cor&&!on?'△' : !cor&&on?ic('x',18) : ''; }
      return `<button class="opt ${cls}" style="--i:${i}" onclick="pick('${k}')" ${checked?'disabled':''}>
        <span class="k">${k}</span><span class="tx">${esc(q.options[k]||'（図を参照）')}</span>
        ${mk?`<span class="mk">${mk}</span>`:''}</button>`;}).join('')}</div>
    ${checked?explHtml(q,picked):''}
  </div>`;
  const total=Q.ids.length, ansd=Q.ids.filter(i=>(Q.ans[i]||[]).length).length;
  const showCheck = Q.mode==='study' && !checked;
  let bar=document.getElementById('qbar'); if(bar) bar.remove();
  bar=document.createElement('div'); bar.className='qbar'; bar.id='qbar';
  bar.innerHTML = `
    <button class="nb" onclick="mv(-1)" ${Q.idx===0?'disabled':''} aria-label="前の問題">${IC.back}</button>
    <button class="mid" onclick="openNav()" aria-label="問題一覧を開く"><div class="t"><span>${Q.idx+1} / ${total}</span>
      ${total>1?`<span>${Q.mode==='exam'?`解答済 ${ansd}`:'一覧'}</span>`:''}
      ${Q.limit?`<span class="timer" id="tmr"></span>`:''}</div>
      <div class="pbar" style="margin-top:6px"><i style="width:${100*(Q.idx+1)/total}%"></i></div></button>
    ${showCheck?`<button class="btn sm pri" onclick="check()" ${picked.length?'':'disabled'}>答え合わせ</button>`
      : Q.idx<total-1?`<button class="btn sm ${rev?'line':'pri'}" onclick="mv(1)">次へ</button>`
      : `<button class="btn sm brass" onclick="finish()">${Q.fromResult?'結果へ':rev?'閉じる':'採点する'}</button>`}
    ${showCheck && Q.idx<total-1?`<button class="nb" onclick="mv(1)" aria-label="次の問題">${IC.next}</button>`:''}`;
  document.body.appendChild(bar);
  if(Q.limit) tick();
  bindSwipe();
}
function explHtml(q,picked){
  const noAns=!(q.answer||[]).length, ok=setEq(picked,q.answer||[]);
  const ev=(q.evidence||[]).map(e=>esc([e.s,e.p].filter(Boolean).join(' '))).filter(Boolean);
  return `
  ${noAns?`<div class="verdict na">— 正答なし<span class="ans">採点対象外</span></div>`
    :`<div class="verdict ${ok?'ok':'ng'}">${ok?ic('check',21):ic('x',20)}${ok?'正解':'不正解'}
       <span class="ans">正答 ${(q.answer||[]).join('・')}</span></div>`}
  ${noAns?`<div class="notice">全選択肢が成立しない、または複数解釈が可能な設問と判定しました。この問題は成績に算入しません。</div>`
    : q.status==='要確認'?`<div class="notice">この問題はAIでも根拠を確定できませんでした。成書での確認を推奨します。</div>`:''}
  ${q.note?`<div class="notice">${esc(q.note)}</div>`:''}
  ${q.explanation?`<div class="expl"><h4>解説</h4>${esc(q.explanation)}</div>`:''}
  ${Object.keys(q.onotes||{}).length?`<div class="expl"><h4>選択肢の検討</h4>
    ${KEYS.filter(k=>q.onotes[k]).map(k=>`<div class="onote"><b>${k}</b><span>${esc(q.onotes[k])}</span></div>`).join('')}</div>`:''}
  ${ev.length?`<div class="evd">${ic('book2',15)}<span>${ev.join(' ／ ')}</span></div>`:''}`;
}
/* 問題一覧シート（100問通しでの回遊に必須） */
function sheet(html){
  const d=document.createElement('div'); d.className='sheet'; d.id='sheet';
  d.innerHTML=`<div class="inner" onclick="event.stopPropagation()"><div class="grab"></div>${html}</div>`;
  d.onclick=closeSheet; document.body.appendChild(d);
  return d;
}
function closeSheet(){ const s=document.getElementById('sheet'); if(s) s.remove(); }
function openNav(){
  if(!Q || Q.ids.length<2) return;
  const un=Q.ids.filter(id=>!(Q.ans[id]||[]).length).length;
  const graded=Q.ids.some(id=>Q.chk[id]);
  const cells = Q.ids.map((id,i)=>{
    const q=QDB[id], a=(Q.ans[id]||[]).length, ck=Q.chk[id];
    let cls = ck ? (unscored(q) ? '' : setEq(Q.ans[id]||[],q.answer||[]) ? 'ok' : 'ng') : (a?'a':'');
    return `<button class="${cls} ${i===Q.idx?'cur':''} ${qs(id).f?'fl':''}"
      onclick="jumpTo(${i})">${q.n}</button>`;
  }).join('');
  sheet(`<h3>問題一覧</h3>
    <div class="xs muted">${Q.ids.length}問中 ${Q.ids.length-un}問に解答済${un?`・未解答 ${un}問`:'（すべて解答済）'}</div>
    <div class="navgrid">${cells}</div>
    <div class="legend">
      <span><i style="background:var(--jade-soft);border-color:var(--jade)"></i>解答済</span>
      ${graded?`<span><i style="background:var(--ok-soft);border-color:var(--ok)"></i>正解</span>
        <span><i style="background:var(--ng-soft);border-color:var(--ng)"></i>不正解</span>`:''}
      <span><i style="background:var(--brass);border-color:var(--brass)"></i>フラグ</span>
    </div>
    ${un&&Q.mode!=='browse'?`<button class="btn sm block line" style="margin-top:14px"
      onclick="closeSheet();jumpFirstUnanswered()">最初の未解答（問${QDB[Q.ids.find(id=>!(Q.ans[id]||[]).length)].n}）へ</button>`:''}
    <button class="btn sm block" style="margin-top:8px" onclick="closeSheet()">閉じる</button>`);
}
function jumpTo(i){ closeSheet(); Q.idx=i; persistActive(); vQuiz(); }
function jumpFirstUnanswered(){
  const i=Q.ids.findIndex(id=>!(Q.ans[id]||[]).length);
  if(i>-1) jumpTo(i); else toast('未解答はありません');
}
function pick(k){
  const id=Q.ids[Q.idx], q=QDB[id];
  if(Q.chk[id]) return;
  const n=need(q.choose); let a=Q.ans[id]||[];
  if(a.includes(k)) a=a.filter(x=>x!==k);
  else if(n===1) a=[k];
  else if(n && a.length>=n) a=a.slice(1).concat(k);
  else a=a.concat(k);
  Q.ans[id]=a; buzz(8); persistActive(); vQuiz();
}
function check(){
  const id=Q.ids[Q.idx];
  Q.chk[id]=1; grade(id); persistActive(); vQuiz();
  buzz(setEq(Q.ans[id]||[],QDB[id].answer||[])?14:[10,40,10]);
  const el=document.querySelector('.verdict'); if(el) el.scrollIntoView({behavior:'smooth',block:'center'});
}
function grade(id){
  const q=QDB[id], r=qs(id), t=today();
  S.daily[t]=(S.daily[t]||0)+1;
  if(unscored(q)){ r.ts=Date.now(); save(); return; }
  r.a++; r.ts=Date.now();
  if(setEq(Q.ans[id]||[], q.answer||[])){ r.c++; r.box=Math.min(3,r.box+1); } else r.box=0;
  save();
}
function mv(d){ const n=Q.idx+d; if(n<0||n>=Q.ids.length) return; Q.idx=n; persistActive(); vQuiz(); }
function toggleFlag(id){ const r=qs(id); r.f=r.f?0:1; save(); vQuiz(); toast(r.f?'フラグを付けました':'フラグを外しました'); }
function killBar(){ clearInterval(timerH); const b=document.getElementById('qbar'); if(b) b.remove(); }
function quitQuiz(){
  if(Q && Q.mode!=='browse' && Q.ids.some(i=>(Q.ans[i]||[]).length)){ persistActive(); toast('進捗を保存しました'); }
  else { S.active=null; save(); }
  const back=homeOf(); killBar(); Q=null; go(back);
}
function backToResult(){ killBar(); go('result'); }
function finish(force){
  if(Q.fromResult){ killBar(); return go('result'); }
  if(Q.mode==='browse'){ killBar(); const b=homeOf(); Q=null; return go(b); }
  const un=Q.ids.filter(id=>!(Q.ans[id]||[]).length).length;
  if(un && !force){          // 未解答があるまま採点しようとしたら確認
    return sheet(`<h3>未解答が ${un}問 あります</h3>
      <div class="small muted" style="margin-bottom:14px">このまま採点すると未解答は不正解として集計されます。</div>
      <button class="btn block line" onclick="closeSheet();jumpFirstUnanswered()">未解答へ戻る</button>
      <button class="btn block brass" style="margin-top:9px" onclick="closeSheet();finish(1)">このまま採点する</button>`);
  }
  killBar();
  Q.ids.forEach(id=>{ if(!Q.chk[id]){ Q.chk[id]=1; grade(id); } });
  const scored=Q.ids.filter(id=>!unscored(QDB[id]));
  const ok=scored.filter(id=>setEq(Q.ans[id]||[],QDB[id].answer||[])).length;
  S.sessions.push({title:Q.title, score:ok, total:scored.length, ts:Date.now(), sec:Math.round((Date.now()-Q.t0)/1000)});
  if(S.sessions.length>60) S.sessions=S.sessions.slice(-60);
  S.active=null; save(); go('result');
}
function tick(){
  const upd=()=>{
    const e=document.getElementById('tmr'); if(!e) return;
    const left=Q.limit-Math.floor((Date.now()-Q.t0)/1000);
    e.textContent = left>=0 ? fmtT(left) : '超過 '+fmtT(-left);
    e.className='timer'+(left<300?' low':'');
    if(left===0){ toast('制限時間になりました'); buzz([30,60,30]); }
  };
  upd(); timerH=setInterval(upd,1000);
}

/* ── result ──────────────────────────────── */
function vResult(){
  if(!Q) return go('home');
  const scored=Q.ids.filter(id=>!unscored(QDB[id]));
  const okIds=scored.filter(id=>setEq(Q.ans[id]||[],QDB[id].answer||[]));

  const by={}; scored.forEach(id=>{ const c=QDB[id].chapter||0; by[c]=by[c]||{n:0,ok:0}; by[c].n++; if(okIds.includes(id)) by[c].ok++; });
  topbar('結果', {back:`go('${homeOf()}')`, noSearch:true, noSet:true});

  <div class="card center">

    <div style="font-size:20px;font-weight:900;color:${p>=60?'var(--ok)':'var(--ng)'};letter-spacing:.5px">${p}%</div>
    <div class="pbar" style="margin:14px 0 10px"><i style="width:${p}%;background:${p>=60?'var(--ok)':p>=45?'var(--warn)':'var(--ng)'}"></i></div>
    <div class="small muted">${p>=60?'合格ライン目安（6割）クリア':'合格ライン目安は6割。弱点復習で詰めましょう'}　・　所要 ${fmtT(sec)}${(()=>{const u=Q.ids.filter(id=>!(Q.ans[id]||[]).length).length;return u?`　・　未解答 ${u}問`:'';})()}</div>
  </div>
  <div class="card"><h3>分野別の正答率</h3><div class="bars">
    ${Object.entries(by).sort((a,b)=>b[1].n-a[1].n).map(([c,v])=>{const q=pct(v.ok,v.n);
      return `<div class="r"><span class="l">${esc(chShort(c))}</span>
        <span class="b"><i style="width:${q}%;background:${q>=70?'var(--ok)':q>=50?'var(--warn)':'var(--ng)'}"></i></span>
        <span class="v">${v.ok}/${v.n}</span></div>`;}).join('')}</div></div>
  <div class="card"><h3>問題一覧（タップで解説）</h3><div class="qgrid">
    ${Q.ids.map((id,i)=>{const q=QDB[id], ok=unscored(q)?null:setEq(Q.ans[id]||[],q.answer||[]);
      return `<button class="${ok===null?'ex':ok?'ok':'ng'} ${qs(id).f?'fl':''}" onclick="reviewAt(${i})">${q.n}</button>`;}).join('')}
  </div></div>
  <div class="row" style="gap:10px;margin:18px 0">
    <button class="btn line grow" onclick="go('${homeOf()}')">一覧へ戻る</button>
    <button class="btn pri grow" onclick="retryWrong()">間違いだけ再挑戦</button>
  </div>`;
  const el=document.querySelector('.score span'); if(el) countUp(el, okIds.length, 900);
}
function reviewAt(i){ Q.mode='browse'; Q.fromResult=1; Q.idx=i; Q.ids.forEach(id=>Q.chk[id]=1); go('quiz'); }
function retryWrong(){
  const ids=Q.ids.filter(id=>!unscored(QDB[id]) && !setEq(Q.ans[id]||[],QDB[id].answer||[]));
  if(!ids.length) return toast('全問正解です');
  begin(ids, Q.title+'（誤答のみ）', 'study', 0, Q.setId);
}

/* ── notes ───────────────────────────────── */
function vNotes(){
  topbar('ノート・資料');
  const cats={}; D.docs.forEach(d=>{ (cats[d.cat]=cats[d.cat]||[]).push(d); });
  const icon={'記述式':IC.pen,'専門医':IC.cap,'分析':IC.chart};
  V().innerHTML = `<div class="stag">
  <div class="list-lbl">高頻度14分野ノート</div>
  ${D.notes.map(n=>`<button class="tile" onclick="go('note',{id:'${n.id}'})">
    <span class="ic">${IC.book2}</span><span class="tx"><b>${esc(n.title)}</b>
    <span>${esc(n.md.replace(/[#>*|`\-]/g,' ').replace(/\s+/g,' ').slice(0,50))}…</span></span>
    <span class="arw">${IC.chev}</span></button>`).join('')}
  ${Object.entries(cats).map(([cat,ds])=>`<div class="list-lbl">${esc(cat)}</div>`
    + ds.map(d=>`<button class="tile" onclick="go('doc',{id:'${d.id}'})">
        <span class="ic n">${icon[cat]||IC.doc}</span><span class="tx"><b>${esc(d.title)}</b>
        <span>${d.md.length.toLocaleString()}字</span></span><span class="arw">${IC.chev}</span></button>`).join('')).join('')}
  </div>`;
  stagger('.stag>*');
}
function vNote(){
  const n=D.notes.find(x=>x.id===route.id); if(!n) return go('notes');
  topbar(n.title, {back:"go('notes')", noSet:true});
  const words=n.title.split(/[・（(]/)[0].slice(3).split('・').filter(w=>w.length>2);
  const rel=ALLQ.filter(id=>{const q=QDB[id], t=(q.topic||'')+(q.stem||''); return words.some(w=>t.includes(w));}).slice(0,8);
  const heads = (n.md.match(/^##\s+(.+)$/gm)||[]).map(h=>h.replace(/^##\s+/,''));
  V().innerHTML = `
  ${heads.length>2?`<div class="card tight"><div class="toc">
    ${heads.map((h,i)=>`<button class="tocb" onclick="jumpH(${i})">${esc(h)}</button>`).join('')}
  </div></div>`:''}
  <div class="card"><div class="md">${md2html(n.md)}</div></div>
  ${rel.length?`<div class="card"><h3>この分野の過去問から</h3>
    ${rel.map(id=>`<button class="hit" onclick="jumpQ('${id}')">
      <b class="q">${esc(SETS[QDB[id]._set].short)} 問${QDB[id].n}</b>
      <div class="small" style="margin-top:2px">${esc(QDB[id].stem.slice(0,64))}…</div></button>`).join('')}
    <button class="btn sm block pri" style="margin-top:10px"
      onclick='startIds(${JSON.stringify(JSON.stringify(rel))},${JSON.stringify(n.title)},"study")'>この${rel.length}問を解く</button>
  </div>`:''}`;
}
function vDoc(){
  const d=D.docs.find(x=>x.id===route.id); if(!d) return go('notes');
  topbar(d.title, {back: d.id==='trend'?"go('stats')":"go('notes')", noSet:true});
  V().innerHTML = `<div class="card"><div class="md">${md2html(d.md)}</div></div>`;
}
function jumpQ(id){ begin([id],'問題','study',0); }
function jumpH(i){
  const el=document.getElementById('h'+i); if(!el) return;
  window.scrollTo({top: el.getBoundingClientRect().top + window.scrollY - 76, behavior:'smooth'});
}

/* ── stats ───────────────────────────────── */
function vStats(){
  topbar('分析');
  const o=overall();
  const m={}; ALLQ.forEach(id=>{ const c=QDB[id].chapter||0; m[c]=m[c]||{n:0,seen:0,ok:0}; m[c].n++;
    const r=S.q[id]; if(r&&r.a){ m[c].seen++; if(r.box>=1) m[c].ok++; } });
  const ses=S.sessions.slice(-12);
  const days=[...Array(14)].map((_,i)=>{ const d=new Date(); d.setDate(d.getDate()-13+i);
    const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    return {k, n:S.daily[k]||0, d:d.getDate()}; });
  const mx=Math.max(1,...days.map(d=>d.n));
  V().innerHTML = `
  <div class="stats3">
    <div class="stat"><b data-n="${o.seen}">0</b><span>着手 / ${o.total}問</span></div>
    <div class="stat"><b data-n="${pct(o.ok,o.seen)}" data-sfx="%">0</b><span>定着率</span></div>
    <div class="stat"><b data-n="${reviewQ().length}">0</b><span>復習キュー</span></div>
  </div>
  <div class="card"><h3>この2週間の学習量</h3><div class="spark">
    ${days.map(d=>`<div class="d ${d.n?'':'z'}" title="${d.k}: ${d.n}問">
      <i style="height:${Math.round(58*d.n/mx)||3}px"></i><span>${d.d}</span></div>`).join('')}
  </div></div>
  <div class="card"><h3>分野別の到達度</h3>
    <div class="xs muted" style="margin:-6px 0 12px">バー＝定着率（2回連続正解で定着）／数値＝定着・着手・全問数</div>
    <div class="bars">${Object.entries(m).sort((a,b)=>b[1].n-a[1].n).map(([c,v])=>{const q=pct(v.ok,v.seen||1);
      return `<div class="r"><span class="l">${esc(chShort(c))}</span>
        <span class="b"><i style="width:${v.seen?q:0}%;background:${!v.seen?'var(--sunken)':q>=70?'var(--ok)':q>=50?'var(--warn)':'var(--ng)'}"></i></span>
        <span class="v">${v.ok}/${v.seen}・${v.n}</span></div>`;}).join('')}</div>
    <button class="btn sm block line" style="margin-top:12px" onclick="go('chapters')">分野別に演習する</button></div>
  ${ses.length?`<div class="card"><h3>受験履歴</h3>
    ${ses.slice().reverse().map(s=>`<div class="row small" style="padding:9px 0;border-bottom:1px solid var(--hair2)">
      <span class="grow"><b>${esc(s.title)}</b><br><span class="xs muted">${new Date(s.ts).toLocaleString('ja-JP',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}</span></span>
      <span class="chip ${pct(s.score,s.total)>=60?'ok':'ng'}">${s.score}/${s.total}・${pct(s.score,s.total)}%</span></div>`).join('')}
    </div>`:`<div class="empty">${ic('chart',46)}
      まだ受験履歴がありません<br>
      <button class="btn pri sm" style="margin-top:14px" onclick="go('past')">過去問を解く</button></div>`}
  <div class="card"><h3>出題傾向（過去9年 870問）</h3>
    <div class="small muted">教材PDFと同じ分析結果です。予想問題の分野配分もこれに基づいています。</div>
    <button class="btn sm block line" style="margin-top:12px" onclick="go('doc',{id:'trend'})">分析レポートを読む</button></div>`;
  document.querySelectorAll('.stat b[data-n]').forEach(el=>countUp(el, +el.dataset.n));
}

/* ── search ──────────────────────────────── */
let sq='';
function vSearch(){
  topbar('検索', {back:"go('home')", noSearch:true, noSet:true});
  V().innerHTML = `<div class="searchbox">${IC.search}
    <input id="sin" placeholder="薬剤名・用語・症状で検索" value="${esc(sq)}" autocomplete="off" enterkeyhint="search">
    ${sq?`<button class="iconbtn" onclick="sq='';vSearch()">${IC.x}</button>`:''}</div><div id="sres"></div>`;
  const inp=document.getElementById('sin');
  inp.oninput=e=>{ sq=e.target.value; doSearch(); };
  if(!/Mobi|Android|iPhone/.test(navigator.userAgent)) inp.focus();
  doSearch();
}
function doSearch(){
  const el=document.getElementById('sres'); if(!el) return;
  const t=sq.trim();
  if(t.length<2){ el.innerHTML=`<div class="empty">${ic('search',46)}2文字以上で検索します</div>`; return; }
  const esc_=t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  const rx=new RegExp(esc_,'i');
  const hl=s=>esc(s).replace(new RegExp(esc_,'gi'),m=>`<mark>${m}</mark>`);
  const qh=[];
  for(const id of ALLQ){ const q=QDB[id];
    if(rx.test(q.stem+' '+KEYS.map(k=>q.options[k]||'').join(' ')+' '+(q.explanation||'')+' '+(q.topic||''))){
      qh.push(id); if(qh.length>=40) break; } }
  const nh=[];
  [...D.notes,...D.docs].forEach(n=>{ const i=n.md.search(rx);
    if(i>-1) nh.push({n, x:n.md.slice(Math.max(0,i-40), i+90).replace(/[#|>*`]/g,'')}); });
  el.innerHTML = `
    ${nh.length?`<div class="list-lbl">ノート・資料 ${nh.length}件</div>`
      + nh.map(h=>`<button class="hit" onclick="go('${D.notes.includes(h.n)?'note':'doc'}',{id:'${h.n.id}'})">
        <b class="q">${esc(h.n.title)}</b><div class="small muted" style="margin-top:2px">…${hl(h.x)}…</div></button>`).join(''):''}
    ${qh.length?`<div class="list-lbl">問題 ${qh.length}件${qh.length>=40?'（上位40件）':''}</div>
      <button class="btn sm block pri" style="margin-bottom:10px"
        onclick='startIds(${JSON.stringify(JSON.stringify(qh))},"検索：${esc(sq)}","study")'>この${qh.length}問をまとめて解く</button>`
      + qh.map(id=>{const q=QDB[id];return `<button class="hit" onclick="jumpQ('${id}')">
        <b class="q">${esc(SETS[q._set].short)} 問${q.n}</b> <span class="chip gray">${esc(chShort(q.chapter))}</span>
        <div class="small" style="margin-top:4px">${hl(q.stem.slice(0,90))}</div></button>`}).join(''):''}
    ${!qh.length&&!nh.length?`<div class="empty">${ic('search',46)}該当なし</div>`:''}`;
}

/* ── settings ────────────────────────────── */

  topbar('設定', {back:"go('home')", noSearch:true, noSet:true});
  const o=overall();
  V().innerHTML = `
  <div class="card"><h3>表示</h3>
    <label class="sw">テーマ<select onchange="setTheme(this.value)">
      ${[['auto','自動（端末に合わせる）'],['light','ライト'],['dark','ダーク']]
        .map(([v,l])=>`<option value="${v}" ${S.settings.theme===v?'selected':''}>${l}</option>`).join('')}
    </select></label>
    <label class="sw">試験日<input type="date" value="${esc(S.settings.examDate)}"
      onchange="S.settings.examDate=this.value;flush();toast('試験日を更新しました')"></label>
  </div>
  <div class="card"><h3>学習データ</h3>
    <div class="small muted">この端末のブラウザにのみ保存されます（サーバー送信なし）。</div>
    <div class="stats3" style="margin:14px 0 4px">
      <div class="stat"><b>${o.seen}</b><span>着手した問題</span></div>
      <div class="stat"><b>${S.sessions.length}</b><span>受験回数</span></div>
      <div class="stat"><b>${Object.keys(S.daily).length}</b><span>学習した日数</span></div>
    </div>
    <div class="row" style="gap:10px;margin-top:14px">
      <button class="btn sm line grow" onclick="exportData()">バックアップ保存</button>
      <button class="btn sm line grow" onclick="importData()">復元</button>
    </div>
    <button class="btn sm block" style="margin-top:10px;color:var(--ng)" onclick="resetData()">学習データを消去</button>
  </div>
  <div class="card"><h3>操作のヒント</h3>
    <div class="small">問題画面では下部バーの<b>「◯/◯」をタップ</b>すると問題一覧が開き、任意の問題へジャンプできます。左右スワイプでも移動できます。</div>
    <div class="hr"></div>
    <div class="small">パソコンのキーボード：<span class="kbd">A</span>〜<span class="kbd">E</span> 選択　<span class="kbd">Enter</span> 答え合わせ／次へ　<span class="kbd">←</span><span class="kbd">→</span> 移動　<span class="kbd">L</span> 問題一覧　<span class="kbd">F</span> フラグ　<span class="kbd">/</span> 検索</div>
  </div>
  <div class="card"><h3>収録内容</h3>
    <div class="small">${D.sets.map(s=>`・${esc(s.label)}　${s.questions.length}問`).join('<br>')}<br>
      ・高頻度14分野ノート　${D.notes.length}本<br>・記述式模範解答／専門医試験／傾向分析　${D.docs.length}本</div>
    <div class="hr"></div>
    <div class="xs muted">解答・解説は『歯科麻酔学 第8版』および公開ガイドラインを照合してAIが導出した非公式資料です。公式解答は公表されていません。臨床判断では最新の添付文書・施設プロトコル・学会最新版を優先してください。<br>ビルド ${esc(D.built)}</div>
  </div>`;
}
function setTheme(v){ S.settings.theme=v; flush(); applyTheme(); render(); }
function applyTheme(){
  const t=S.settings.theme;
  const dark = t==='dark' || (t==='auto' && matchMedia('(prefers-color-scheme:dark)').matches);
  document.documentElement.dataset.theme = dark?'dark':'light';
  const mt=document.querySelector('meta[name=theme-color]');
  if(mt) mt.content = dark?'#0a1015':'#12384f';
}
function exportData(){
  const b=new Blob([JSON.stringify(S)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(b);
  a.download='歯科麻酔_学習データ_'+today()+'.json'; a.click(); toast('バックアップを保存しました');
}
function importData(){
  const i=document.createElement('input'); i.type='file'; i.accept='.json';
  i.onchange=e=>{ const f=e.target.files[0]; if(!f) return; const r=new FileReader();
    r.onload=()=>{ try{ const o=JSON.parse(r.result); if(o.v!==2) throw 0;
      S=Object.assign({},DEF,o); flush(); applyTheme(); go('home'); toast('復元しました'); }
      catch(err){ toast('読み込めませんでした'); } };
    r.readAsText(f); };
  i.click();
}
function resetData(){
  if(!confirm('学習履歴・成績・フラグをすべて消去します。よろしいですか？')) return;
  S=JSON.parse(JSON.stringify(DEF)); flush(); applyTheme(); go('home'); toast('消去しました');
}

/* ── interactions ────────────────────────── */
function lightbox(setId,n,i){
  const src=(QDB[setId+':'+n].figs||[])[i]; if(!src) return;
  const d=document.createElement('div'); d.className='lb';
  d.innerHTML=`<button class="x">${IC.x}</button><img src="${src}" alt="設問の図">`;
  d.onclick=()=>d.remove(); document.body.appendChild(d);
}
function bindScroll(){
  const t=document.getElementById('top');
  const f=()=>t.classList.toggle('stuck', window.scrollY>8);
  window.onscroll=f; f();
}
let sx=0, sy=0;
function bindSwipe(){
  const v=V();
  v.ontouchstart=e=>{ sx=e.touches[0].clientX; sy=e.touches[0].clientY; };
  v.ontouchend=e=>{
    if(!Q) return;
    const dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy;
    if(Math.abs(dx)>64 && Math.abs(dx)>Math.abs(dy)*1.8) mv(dx<0?1:-1);
  };
}
document.addEventListener('keydown', e=>{
  if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT') return;
  if(document.getElementById('sheet')){ if(e.key==='Escape') closeSheet(); return; }
  if(document.querySelector('.lb')){ if(e.key==='Escape') document.querySelector('.lb').remove(); return; }
  if(route.name==='quiz' && Q){
    const k=e.key.toLowerCase();
    if(KEYS.includes(k)){ pick(k); e.preventDefault(); return; }
    if(e.key==='ArrowRight'){ mv(1); return; }
    if(e.key==='ArrowLeft'){ mv(-1); return; }
    if(e.key==='Enter'){
      const id=Q.ids[Q.idx];
      if(Q.mode==='study' && !Q.chk[id] && (Q.ans[id]||[]).length) check();
      else if(Q.idx<Q.ids.length-1) mv(1); else finish();
      e.preventDefault(); return;
    }
    if(k==='f'){ toggleFlag(Q.ids[Q.idx]); return; }
    if(k==='l'||e.key===' '){ openNav(); e.preventDefault(); return; }
    if(e.key==='Escape'){ Q.fromResult?backToResult():quitQuiz(); return; }
    return;
  }
  if(e.key==='/'){ go('search'); e.preventDefault(); }
});
matchMedia('(prefers-color-scheme:dark)').addEventListener('change',()=>{ if(S.settings.theme==='auto') applyTheme(); });
window.addEventListener('beforeunload', ()=>{ if(saveT) flush(); });
document.addEventListener('visibilitychange', ()=>{ if(document.hidden && saveT) flush(); });

applyTheme();
render();
</script>
